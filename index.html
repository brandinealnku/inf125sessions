<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INF 125 · Live Learning OS</title>
<style>
:root{--gold:#ffc800;--black:#070707;--panel:#121212;--panel2:#1a1a1a;--line:#343434;--text:#fff;--muted:#b6b6b6;--good:#d7ff8f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--black);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.topline{height:8px;background:var(--gold)}
.shell{max-width:1180px;margin:auto;padding:28px}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 28px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
h1{font-size:clamp(38px,7vw,78px);line-height:.96;letter-spacing:-.04em;margin:14px 0 18px;max-width:1000px}h2{font-size:clamp(26px,4vw,46px);line-height:1.03;margin:12px 0}h3{font-size:21px;margin:4px 0 8px}.lead{font-size:clamp(18px,2.3vw,27px);line-height:1.35;color:#dedede;max-width:920px}.muted{color:var(--muted)}.gold{color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin:20px 0}.heroPanel{border:2px solid var(--gold);background:#0d0d0d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:110px}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:24px 0}.flow .card{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;min-height:120px}.arrow{display:none}
.choice{width:100%;text-align:left;background:var(--panel);color:#fff;border:2px solid var(--line);border-radius:16px;padding:18px;font-weight:800;min-height:74px}.choice:hover,.choice.selected{border-color:var(--gold);color:var(--gold);background:#171300}.choice:disabled{cursor:default;opacity:.9}
.primary,.secondary,.danger{border-radius:13px;padding:13px 18px;font-weight:900}.primary{background:var(--gold);color:#000;border:0}.secondary{background:#202020;color:#fff;border:1px solid #555}.danger{background:#281111;color:#fff;border:1px solid #713333}.primary:disabled{opacity:.4;cursor:not-allowed}
textarea,input[type=text]{width:100%;border:1px solid #555;background:#111;color:#fff;border-radius:13px;padding:14px;margin-top:10px}textarea{min-height:120px;resize:vertical}.join{max-width:620px;margin:7vh auto}.join input{font-size:21px;padding:17px}.join .primary{width:100%;font-size:19px;margin-top:12px}
.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:30px;flex-wrap:wrap}.navGroup{display:flex;gap:9px;flex-wrap:wrap}.progress{color:var(--muted);font-size:13px}.barRow{margin:14px 0}.barLabel{display:flex;justify-content:space-between;gap:12px;font-weight:800}.bar{height:28px;background:#242424;border-radius:8px;overflow:hidden;margin-top:7px}.bar span{height:100%;display:block;background:var(--gold);min-width:0}.countBig{font-size:64px;font-weight:950;color:var(--gold);letter-spacing:-.05em}.response{border-left:4px solid var(--gold);padding:10px 14px;margin:10px 0;background:#101010;border-radius:0 10px 10px 0}.response small{color:var(--muted)}
.instructorOnly{display:none}.instructor .instructorOnly{display:block}.studentOnly{display:block}.instructor .studentOnly{display:none}.console{position:sticky;bottom:0;background:rgba(7,7,7,.96);border-top:1px solid #333;padding:14px 0;margin-top:28px;backdrop-filter:blur(10px)}.consoleInner{max-width:1180px;margin:auto;padding:0 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.consoleStats{display:flex;gap:10px;flex-wrap:wrap}.tiny{font-size:12px;color:var(--muted)}.waiting{text-align:center;padding:9vh 0}.waiting .pulse{font-size:80px}.scenario{border-left:6px solid var(--gold)}
@media(max-width:780px){.shell{padding:20px}.flow{grid-template-columns:1fr}.flow .card{min-height:72px}.consoleInner{padding:0 20px}.nav button{flex:1}.countBig{font-size:52px}}
</style>
</head>
<body>
<div class="topline"></div>
<div id="app"></div>
<script>
const SESSION='Session 2';
const SESSION_TITLE='How AI Works';
const hasAppsScript=typeof google!=='undefined'&&google.script&&google.script.run;
const deviceId=localStorage.inf125Device||(localStorage.inf125Device=(crypto.randomUUID?crypto.randomUUID():'dev-'+Math.random().toString(36).slice(2)));
let name=localStorage.inf125Name||'';
let instructor=new URLSearchParams(location.search).get('instructor')==='1';
let state={step:0,resultsVisible:false,status:'waiting'};
let localState=JSON.parse(localStorage.inf125Session2State||'{"step":0,"resultsVisible":false,"status":"waiting"}');
let answers=JSON.parse(localStorage.inf125Session2Answers||'{}');
let participantCount=0;
let refreshTimer=null;

const steps=[
 {type:'welcome',label:'OPEN',title:'30 people. One experiment.',lead:'Today you will not just hear how AI works. You will build, test, challenge, and revise a model of it.'},
 {type:'prompt',label:'THINK',key:'needs',title:'What would an AI need to know before you trusted this answer?',lead:'You ask an AI system: “Should I drop my calculus course?” Name one piece of information the system would need.',placeholder:'One thing the AI would need to know is…'},
 {type:'teach',label:'TEACH',title:'AI systems are easier to reason about when we separate the parts.',lead:'For today, use this five-part lens.',flow:['DATA','MODEL / TOOL','OUTPUT','HUMAN INTERPRETATION','DECISION / ACTION']},
 {type:'challenge',label:'DO',key:'flowbuild',title:'Build the system.',lead:'In your own words, describe what belongs in each part of the calculus-advice system.',fields:[['data','DATA: What information goes in?'],['model','MODEL / TOOL: What processes or generates the recommendation?'],['output','OUTPUT: What comes back?'],['human','HUMAN INTERPRETATION: What must a person consider?'],['decision','DECISION / ACTION: What happens next?']]},
 {type:'vote',label:'PREDICT',key:'drop1',title:'Should the AI recommend dropping the course?',lead:'Known information: GPA 2.8 · Calculus grade D · Major: Computer Science',choices:['Recommend DROP','Recommend STAY','Not enough information']},
 {type:'reveal',label:'REVEAL',key:'drop1',title:'The class has committed. Now look at the system, not just the answer.',lead:'What assumptions might be hiding behind these recommendations?',choices:['Recommend DROP','Recommend STAY','Not enough information']},
 {type:'vote',label:'UPDATE',key:'drop2',title:'New information. Does your recommendation change?',lead:'Calculus is a prerequisite for three courses the student planned to take next semester.',choices:['Recommend DROP','Recommend STAY','Still not enough information']},
 {type:'compare',label:'DISCUSS',keys:['drop1','drop2'],title:'The AI problem changed when the information changed.',lead:'The question stayed almost identical. The available context did not. What does that tell us about data, models, and human judgment?'},
 {type:'scenario',label:'DO',key:'failure',title:'Where can this system fail?',lead:'Choose the point you think creates the greatest risk in this advising example.',choices:['DATA: missing or biased information','MODEL / TOOL: bad assumptions or patterns','OUTPUT: misleading recommendation','HUMAN INTERPRETATION: over-trust or misunderstanding','DECISION / ACTION: consequences are poorly considered']},
 {type:'prompt',label:'THINK',key:'responsibility',title:'What is still the human’s job?',lead:'Complete the sentence in one strong thought.',placeholder:'Even with AI support, a human still needs to…'},
 {type:'exit',label:'EXIT',key:'exit',title:'What changed in your thinking today?',lead:'Write one thing you understand differently now about how AI systems work.',placeholder:'Before today I thought… Now I think…'},
 {type:'finish',label:'DONE',title:'AI can support a decision. It does not remove responsibility.',lead:'DATA → MODEL / TOOL → OUTPUT → HUMAN INTERPRETATION → DECISION / ACTION'}
];

function save(){localStorage.inf125Session2Answers=JSON.stringify(answers);localStorage.inf125Name=name}
function current(){return steps[Math.max(0,Math.min(steps.length-1,state.step||0))]}
function api(fn,args,ok){if(!hasAppsScript){if(ok)ok(null);return}const runner=google.script.run.withFailureHandler(err=>console.error(fn,err)).withSuccessHandler(ok||(()=>{}));runner[fn](...(args||[]))}
function submit(key,response){answers[key]=response;save();if(hasAppsScript)api('submitResponse',[{session:SESSION,device:deviceId,name:name||'Anonymous',question:key,response:response}]);render()}
function join(){const el=document.getElementById('joinName');const v=(el?.value||'').trim();if(!v)return;name=v.slice(0,40);save();if(hasAppsScript)api('joinSession',[{session:SESSION,device:deviceId,name}],()=>pollState());else{state=localState;render()}}
function setState(patch){const next={session:SESSION,step:patch.step??state.step,resultsVisible:patch.resultsVisible??state.resultsVisible,status:patch.status??state.status};if(hasAppsScript)api('setSessionState',[next,s=>{if(s){state=s;render();refreshData()}}]);else{localState=next;state=next;localStorage.inf125Session2State=JSON.stringify(localState);render()}}
function next(){setState({step:Math.min(steps.length-1,state.step+1),resultsVisible:false,status:'live'})}
function prev(){setState({step:Math.max(0,state.step-1),resultsVisible:false})}
function toggleResults(){setState({resultsVisible:!state.resultsVisible})}
function startClass(){setState({step:0,status:'live',resultsVisible:false})}
function resetClass(){if(!confirm('Reset Session 2 responses and return everyone to the waiting screen?'))return;if(hasAppsScript)api('resetSession',[SESSION,()=>{state={step:0,resultsVisible:false,status:'waiting'};render();refreshData()}]);else{localStorage.removeItem('inf125Session2Answers');localStorage.removeItem('inf125Session2State');answers={};localState={step:0,resultsVisible:false,status:'waiting'};state=localState;render()}}

function shell(inner){const mode=instructor?'INSTRUCTOR':'STUDENT';return `<main class="shell"><div class="eyebrow">INF 125 · ${SESSION_TITLE} · ${mode}</div><div class="status"><span class="pill"><span class="dot"></span>${hasAppsScript?'LIVE CLASSROOM':'BROWSER PREVIEW'}</span><span class="pill">${SESSION}</span>${name&&!instructor?`<span class="pill">${esc(name)}</span>`:''}</div>${inner}</main>${instructor?consoleBar():''}`}
function consoleBar(){return `<div class="console"><div class="consoleInner"><div class="consoleStats"><span class="pill"><b>${participantCount}</b> joined</span><span class="pill">Step ${state.step+1}/${steps.length}</span><span class="pill">${state.resultsVisible?'Results visible':'Results hidden'}</span></div><div class="navGroup"><button class="secondary" onclick="prev()">← Back</button><button class="secondary" onclick="toggleResults()">${state.resultsVisible?'Hide results':'Reveal results'}</button><button class="primary" onclick="next()">Next →</button><button class="danger" onclick="resetClass()">Reset</button></div></div></div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function choiceGrid(s,key=s.key){return `<div class="grid">${s.choices.map(c=>`<button class="choice ${answers[key]===c?'selected':''}" onclick='submit(${JSON.stringify(key)},${JSON.stringify(c)})'>${esc(c)}</button>`).join('')}</div>`}
function textPrompt(s){return `<div class="panel heroPanel"><textarea id="text-${esc(s.key)}" placeholder="${esc(s.placeholder||'Type your response…')}">${esc(answers[s.key]||'')}</textarea><div class="nav"><span class="tiny">Your response is saved to this session.</span><button class="primary" onclick="submit(${JSON.stringify(s.key)},document.getElementById(${JSON.stringify('text-'+s.key)}).value.trim())">Submit response</button></div></div>${answers[s.key]?'<p class="gold"><b>✓ Submitted</b></p>':''}`}
function challenge(s){return `<div class="grid">${s.fields.map(([k,label])=>`<div class="card"><label class="eyebrow">${esc(label)}</label><textarea id="f-${k}" style="min-height:95px">${esc((answers[s.key]||{})[k]||'')}</textarea></div>`).join('')}</div><button class="primary" onclick="submitChallenge()">Save my model</button>${answers[s.key]?'<p class="gold"><b>✓ Model saved</b></p>':''}`}
function submitChallenge(){const out={};current().fields.forEach(([k])=>out[k]=document.getElementById('f-'+k).value.trim());submit(current().key,out)}
function bars(result,choices){const total=Object.values(result||{}).reduce((a,b)=>a+Number(b||0),0);return `<div class="panel"><div class="countBig">${total}</div><div class="muted">class responses</div>${choices.map(c=>{const n=Number((result||{})[c]||0),p=total?Math.round(n/total*100):0;return `<div class="barRow"><div class="barLabel"><span>${esc(c)}</span><span>${n} · ${p}%</span></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`}
function renderResultsArea(key,choices){return `<div id="results-${esc(key)}">${state.resultsVisible?'<div class="panel"><span class="muted">Loading class results…</span></div>':'<div class="panel"><h3>Results are hidden.</h3><p class="muted">Commit to your own answer before seeing the class.</p></div>'}</div>`}
function renderResponsesArea(key){return `<div id="textresults-${esc(key)}"><div class="panel"><span class="muted">Loading responses…</span></div></div>`}

function renderStep(){const s=current();let body=`<div class="eyebrow">${esc(s.label)}</div><h1>${esc(s.title)}</h1>${s.lead?`<p class="lead">${esc(s.lead)}</p>`:''}`;
 if(s.type==='welcome')body+=`<div class="panel heroPanel"><h2 class="gold">Your screen is part of the classroom today.</h2><p class="lead">When the instructor advances the session, this page will move with the room.</p></div>`;
 if(s.type==='prompt'){body+=instructor?renderResponsesArea(s.key):textPrompt(s)}
 if(s.type==='teach')body+=`<div class="flow">${s.flow.map(x=>`<div class="card">${esc(x)}</div>`).join('')}</div><div class="panel"><h2>Ask five questions:</h2><p class="lead">What information went in? What processed it? What came out? How did a person interpret it? What decision followed?</p></div>`;
 if(s.type==='challenge')body+=instructor?`<div class="panel"><h2>Students are building the five-part system on their own screens.</h2><p class="lead">Circulate. Look for places where students confuse the model/tool with the output or skip the human interpretation step.</p></div>`:challenge(s);
 if(s.type==='vote'||s.type==='scenario'){body+=instructor?renderResultsArea(s.key,s.choices):choiceGrid(s)}
 if(s.type==='reveal'){body+=renderResultsArea(s.key,s.choices);body+=`<div class="panel scenario"><h2>Discuss:</h2><p class="lead">What information are we assuming the system has? What consequences are missing from this recommendation?</p></div>`}
 if(s.type==='compare'){body+=`<div class="grid"><div><h3>Before new context</h3><div id="results-${s.keys[0]}"><div class="panel muted">Loading…</div></div></div><div><h3>After new context</h3><div id="results-${s.keys[1]}"><div class="panel muted">Loading…</div></div></div></div><div class="panel heroPanel"><h2 class="gold">The model did not become “more intelligent.” The information available to the decision changed.</h2></div>`}
 if(s.type==='exit'){body+=instructor?renderResponsesArea(s.key):textPrompt(s)}
 if(s.type==='finish')body+=`<div class="flow">${['DATA','MODEL / TOOL','OUTPUT','HUMAN INTERPRETATION','DECISION / ACTION'].map(x=>`<div class="card">${x}</div>`).join('')}</div><div class="panel heroPanel"><h2 class="gold">Your job is not merely to use AI. Your job is to understand enough of the system to question it.</h2></div>`;
 return shell(body)}

function render(){document.body.classList.toggle('instructor',instructor);const app=document.getElementById('app');if(!instructor&&!name){app.innerHTML=shell(`<section class="join"><div class="eyebrow">JOIN LIVE CLASS</div><h1>INF 125</h1><p class="lead">Enter your first name or a classroom nickname.</p><input id="joinName" type="text" maxlength="40" autocomplete="off" placeholder="Your name or nickname" onkeydown="if(event.key==='Enter')join()"><button class="primary" onclick="join()">Join class →</button><p class="tiny">Use the same browser during class so your responses update instead of duplicating.</p></section>`);return}
 if(state.status==='waiting'&&!instructor){app.innerHTML=shell(`<div class="waiting"><div class="pulse">●</div><h1>You're in.</h1><p class="lead">${participantCount||'The class'} ${participantCount===1?'person is':'people are'} connected. This screen will change when class begins.</p></div>`);return}
 if(state.status==='waiting'&&instructor){app.innerHTML=shell(`<h1>Classroom ready.</h1><p class="lead">Project this view, have students join the same Web App URL, then start when the room is connected.</p><div class="panel heroPanel"><div class="countBig">${participantCount}</div><h2>students connected</h2><button class="primary" onclick="startClass()">Start Session 2 →</button></div>`);return}
 app.innerHTML=renderStep();setTimeout(refreshData,100)}

function pollState(){if(hasAppsScript){api('getSessionState',[SESSION,s=>{if(!s)return;const changed=s.step!==state.step||s.resultsVisible!==state.resultsVisible||s.status!==state.status;state=s;if(changed)render();refreshData()}])}else{state=localState;render()}}
function refreshData(){if(!hasAppsScript)return;api('getParticipantCount',[SESSION,n=>{participantCount=Number(n||0);const el=document.querySelector('.consoleStats .pill b');if(el)el.textContent=participantCount;if(state.status==='waiting')render()}]);const s=current();
 if((s.type==='vote'||s.type==='scenario'||s.type==='reveal')&&(instructor||state.resultsVisible)){api('getResults',[SESSION,s.key,r=>{const el=document.getElementById('results-'+s.key);if(el)el.innerHTML=bars(r,s.choices)}])}
 if(s.type==='compare'){const choices1=steps.find(x=>x.key===s.keys[0])?.choices||[];const choices2=steps.find(x=>x.key===s.keys[1])?.choices||[];api('getResults',[SESSION,s.keys[0],r=>{const el=document.getElementById('results-'+s.keys[0]);if(el)el.innerHTML=bars(r,choices1)}]);api('getResults',[SESSION,s.keys[1],r=>{const el=document.getElementById('results-'+s.keys[1]);if(el)el.innerHTML=bars(r,choices2)}])}
 if(instructor&&(s.type==='prompt'||s.type==='exit')){api('getTextResponses',[SESSION,s.key,rows=>{const el=document.getElementById('textresults-'+s.key);if(!el)return;el.innerHTML=`<div class="panel"><div class="countBig">${rows.length}</div><div class="muted">responses</div>${rows.slice(-12).map(r=>`<div class="response">${esc(r.text)}<br><small>${esc(r.name)}</small></div>`).join('')||'<p class="muted">Waiting for responses…</p>'}</div>`}])}}

render();
if(hasAppsScript){api('getSessionState',[SESSION,s=>{if(s)state=s;render();refreshData()}]);refreshTimer=setInterval(pollState,2200)}else{state=localState;render()}
</script>
</body>
</html>
