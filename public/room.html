<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:#0d0d0c;color:#f5f2e9;overflow:hidden}.room{height:100svh;padding:7vh 7vw;display:flex;flex-direction:column;justify-content:center}.label{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#d8aa3d;font-weight:850;margin-bottom:24px}.headline{font-family:Georgia,serif;font-size:clamp(64px,9vw,145px);line-height:.88;letter-spacing:-.055em;font-weight:500;margin:0;max-width:1450px}.sub{font-size:clamp(22px,2.4vw,40px);line-height:1.35;color:#c8c3b8;max-width:1200px;margin-top:30px}.commitNum,.shiftNum{font-family:Georgia,serif;font-size:clamp(150px,25vw,350px);line-height:.7}.grid{display:grid;gap:16px;margin-top:30px}.row{display:grid;grid-template-columns:minmax(240px,1fr) 3fr auto;gap:22px;align-items:center}.track{height:12px;background:#292823;border-radius:99px}.fill{height:100%;background:#d8aa3d;border-radius:99px}.pct{font-family:Georgia,serif;font-size:42px}.teach{border-left:5px solid #d8aa3d;padding-left:30px;margin-top:40px}.teach strong{font-family:Georgia,serif;font-size:clamp(42px,5vw,78px);font-weight:500}.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:38px}.example{border-top:2px solid #d8aa3d;padding-top:16px;font-size:clamp(20px,2vw,30px);line-height:1.35}.revealCard{font-family:Georgia,serif;font-size:clamp(44px,6vw,92px);line-height:1.05;border-left:5px solid #d8aa3d;padding-left:28px;margin-top:30px}.dots{display:flex;flex-wrap:wrap;gap:10px;margin-top:35px}.dot{width:18px;height:18px;border-radius:50%;background:#44423d}.dot.moved{background:#d8aa3d}.fade{animation:enter .4s ease both}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style></head><body><main class="room" id="room"></main><script src="/shared-v08.js"></script><script>const C=Classroom;let structural='';function s(){return C.current()}function commit(){let p=C.participation();room.innerHTML=`<section class="fade"><div class="label">Commit</div><div class="commitNum" id="commitCount">${p.count}</div><div class="sub"><span id="activeCount">of ${p.active}</span> committed. Think first. The room stays hidden.</div></section>`}function reveal(){let x=s(),out=C.aggregate(x.key),total=Math.max(1,C.answers(x.key).length);room.innerHTML=`<section class="fade"><div class="label">Reveal</div><h1 class="headline">${C.esc(x.title)}</h1><div class="grid">${(x.choices||[]).map(c=>{let n=out[c]||0,p=Math.round(n/total*100);return`<div class="row"><b>${C.esc(c)}</b><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="pct">${p}%</div></div>`}).join('')}</div>${x.teachReveal?`<div class="teach"><strong>${C.esc(x.teachReveal.headline)}</strong><div class="sub">${C.esc(x.teachReveal.explanation)}</div></div>`:''}</section>`}function shift(){let m=C.changedMinds();room.innerHTML=`<section class="fade"><div class="label">Shift</div><div class="shiftNum">${m.changed}</div><div class="sub">people changed their minds.</div><div class="dots">${Array.from({length:m.eligible},(_,i)=>`<i class="dot ${i<m.changed?'moved':''}"></i>`).join('')}</div><div class="sub">The algorithm didn't change. The information did.</div></section>`}function defaultMoment(){let x=s();if(x.label==='97% MATCH'){room.innerHTML=`<section class="fade"><div class="label">Challenge</div><h1 class="headline">97%</h1><div class="sub">MATCH</div>${C.snapshot.state.resultsVisible&&x.teachReveal?`<div class="teach"><strong>${C.esc(x.teachReveal.headline)}</strong><div class="sub">${C.esc(x.teachReveal.explanation)}</div></div>`:''}</section>`;return}if(x.type==='teach'){room.innerHTML=`<section class="fade"><div class="label">Teach</div><h1 class="headline">${C.esc(x.title)}</h1><div class="examples">${(x.flow||x.examples||[]).map(e=>`<div class="example">${C.esc(e)}</div>`).join('')}</div></section>`;return}if(x.type==='sequence'){room.innerHTML=`<section class="fade"><div class="label">Plot twist</div><h1 class="headline">${C.esc(x.title)}</h1><div class="revealCard">${C.esc((x.reveals||[])[0]?.text||x.lead)}</div><div class="sub">${C.esc((x.reveals||[])[0]?.question||'')}</div></section>`;return}room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label||'Now')}</div><h1 class="headline">${C.esc(x.title)}</h1><div class="sub">${C.esc(x.lead||'')}</div></section>`}function primitive(){let x=s(),m=C.snapshot.state.roomMoment?.type;if(m==='shift'||x.type==='compare')return'shift';if(C.snapshot.state.resultsVisible&&x.choices)return'reveal';if(x.key&&!C.snapshot.state.resultsVisible&&(x.type==='vote'||x.type==='select'||x.type==='prompt'))return'commit';return'default'}function render(){let p=primitive();p==='commit'?commit():p==='reveal'?reveal():p==='shift'?shift():defaultMoment()}function key(){let st=C.snapshot.state;return[st.step,st.resultsVisible,st.locked,st.roomMoment?.type||''].join('|')}function live(){if(primitive()==='commit'){let p=C.participation();if(commitCount)commitCount.textContent=p.count;if(activeCount)activeCount.textContent='of '+p.active}}async function poll(force=false){await C.refresh();let k=key();if(force||k!==structural){structural=k;render()}else live()}(async()=>{await C.loadSession();await poll(true);setInterval(()=>poll(),1200)})();</script></body></html>
