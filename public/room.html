<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:#0d0d0c;color:#f5f2e9;overflow:hidden}.room{height:100svh;padding:5.5vh 6.5vw;display:flex;flex-direction:column;justify-content:center}.label{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#d8aa3d;font-weight:850;margin-bottom:18px}.headline{font-family:Georgia,serif;font-size:clamp(52px,7.3vw,118px);line-height:.91;letter-spacing:-.052em;font-weight:500;margin:0;max-width:1450px}.instruction{font-size:clamp(22px,2.4vw,36px);line-height:1.35;color:#ddd8cd;max-width:1250px;margin-top:24px;border-left:4px solid #d8aa3d;padding-left:22px}.status{font-size:clamp(16px,1.5vw,24px);color:#969188;margin-top:20px}.grid{display:grid;gap:12px;margin-top:24px}.row{display:grid;grid-template-columns:minmax(210px,1.2fr) 3fr auto;gap:18px;align-items:center}.track{height:12px;background:#292823;border-radius:99px}.fill{height:100%;background:#d8aa3d;border-radius:99px}.pct{font-family:Georgia,serif;font-size:34px;min-width:110px;text-align:right}.count{font-size:14px;color:#aaa59a;margin-left:8px}.teach{border-left:5px solid #d8aa3d;padding-left:26px;margin-top:28px}.teach strong{font-family:Georgia,serif;font-size:clamp(34px,4vw,62px);font-weight:500}.teach div{font-size:clamp(18px,1.8vw,27px);color:#c8c3b8;margin-top:9px}.commitNum,.shiftNum{font-family:Georgia,serif;font-size:clamp(130px,20vw,300px);line-height:.72}.aidGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:26px;max-width:1450px}.aidCard{min-height:132px;border:1px solid #36342f;background:#141411;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.aidCard:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#d8aa3d;opacity:.8}.aidCard b{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#d8aa3d}.aidCard span{font-family:Georgia,serif;font-size:clamp(20px,2vw,31px);line-height:1.15;margin-top:16px}.aidPrompt{font-size:clamp(20px,2vw,30px);color:#bdb8ad;margin-top:18px}.focus{font-size:clamp(18px,1.6vw,24px);margin-top:22px;color:#f2dfae}.contrastGrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}.contrastCard{border:1px solid #3a3831;border-radius:16px;padding:24px;background:#141411}.contrastCard b{display:block;color:#d8aa3d;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}.contrastCard p{font-family:Georgia,serif;font-size:clamp(25px,2.6vw,42px);line-height:1.08;margin:0}.callback{display:grid;grid-template-columns:1fr auto 1fr;gap:26px;align-items:center;margin-top:32px}.callbackSide{border:1px solid #34322d;border-radius:16px;padding:22px}.callbackSide b{color:#d8aa3d;font-size:11px;letter-spacing:.14em}.callbackSide strong{display:block;font-family:Georgia,serif;font-size:clamp(34px,4vw,64px);margin-top:10px}.arrow{font-size:44px;color:#d8aa3d}.fade{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:760px){.contrastGrid,.callback{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.row{grid-template-columns:1fr auto}.track{grid-column:1/-1}}</style></head><body><main class="room" id="room"></main><script src="/shared-v08.js"></script><script src="/learning-aids-v084.js"></script><script>const C=Classroom,room=document.getElementById('room');let structural='';function s(){return C.current()}function aid(){return(window.LearningAids||{})[C.snapshot.state.step]||null}function instruction(x){return x.roomInstruction||x.studentTask||x.lead||''}function showAid(){let a=aid(),x=s();if(!a)return defaultMoment();room.innerHTML=`<section class="fade"><div class="label">Learning aid · ${C.esc(x.label||'Now')}</div><h1 class="headline">${C.esc(a.title)}</h1><div class="aidPrompt">${C.esc(a.prompt||'')}</div><div class="aidGrid">${(a.items||[]).map(i=>`<div class="aidCard"><b>${C.esc(i[0])}</b><span>${C.esc(i[1])}</span></div>`).join('')}</div>${a.focus?`<div class="focus">LAND IT → ${C.esc(a.focus)}</div>`:''}</section>`}function commit(){let x=s(),p=C.participation();room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label)} · Commit</div><h1 class="headline">${C.esc(x.title)}</h1><div class="instruction">${C.esc(instruction(x)||'Think first. Commit your answer before discussing it.')}</div><div class="status"><span id="commitCount">${p.count}</span> of <span id="activeCount">${p.active}</span> committed · Results stay hidden until Reveal.</div></section>`}function reveal(){let x=s(),out=C.aggregate(x.key),meta=C.aggregateMeta(x.key),total=Math.max(1,meta.respondents);room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label)} · Reveal</div><h1 class="headline">${C.esc(x.title)}</h1><div class="grid">${(x.choices||[]).map(c=>{let n=out[c]||0,p=Math.round(n/total*100);return`<div class="row"><b>${C.esc(c)}</b><div class="track"><div class="fill" style="width:${Math.min(100,p)}%"></div></div><div class="pct">${p}%<span class="count">${n}</span></div></div>`}).join('')}</div><div class="status">${meta.multi?'Each respondent could select multiple choices. Percent = share of respondents who selected each option.':meta.respondents+' responses.'}</div>${x.teachReveal?`<div class="teach"><strong>${C.esc(x.teachReveal.headline)}</strong><div>${C.esc(x.teachReveal.explanation)}</div></div>`:''}</section>`}function shift(){let x=s(),m=C.changedMinds();room.innerHTML=`<section class="fade"><div class="label">Shift</div><div class="shiftNum">${m.changed}</div><div class="instruction">people changed their minds after new context arrived.</div><div class="status">${C.esc(x.hero||"The algorithm didn't change. The information did.")}</div></section>`}function contrast(){let x=s(),responses=(C.snapshot.answers||[]).filter(a=>a.key===x.key&&typeof a.response==='string'&&a.response.trim()).slice(-2);let a=responses[0]?.response||'Listen for one line of reasoning.',b=responses[1]?.response||'Then surface a different interpretation.';room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label)} · Contrast</div><h1 class="headline">Same evidence. Different reasoning.</h1><div class="contrastGrid"><div class="contrastCard"><b>Reasoning A</b><p>${C.esc(a)}</p></div><div class="contrastCard"><b>Reasoning B</b><p>${C.esc(b)}</p></div></div></section>`}function callback(){let x=s(),open=C.aggregate(x.callbackKey),close=C.aggregate(x.key),openTotal=Math.max(1,Object.values(open).reduce((a,b)=>a+b,0)),closeTotal=Math.max(1,Object.values(close).reduce((a,b)=>a+b,0));let op=Object.entries(open).sort((a,b)=>b[1]-a[1])[0]||['Opening',0],cl=Object.entries(close).sort((a,b)=>b[1]-a[1])[0]||['Now',0];room.innerHTML=`<section class="fade"><div class="label">Callback</div><h1 class="headline">Would you make the same bet now?</h1><div class="callback"><div class="callbackSide"><b>OPENING</b><strong>${Math.round(op[1]/openTotal*100)}%</strong><div>${C.esc(op[0])}</div></div><div class="arrow">→</div><div class="callbackSide"><b>NOW</b><strong>${Math.round(cl[1]/closeTotal*100)}%</strong><div>${C.esc(cl[0])}</div></div></div><div class="status">Same answer is okay. Better reasoning is the goal.</div></section>`}function defaultMoment(){let x=s();if(x.label==='97% MATCH'){room.innerHTML=`<section class="fade"><div class="label">Challenge</div><h1 class="headline">97%</h1><div class="instruction">MATCH · ${C.esc(instruction(x)||'Would you follow the recommendation?')}</div>${C.snapshot.state.resultsVisible&&x.teachReveal?`<div class="teach"><strong>${C.esc(x.teachReveal.headline)}</strong><div>${C.esc(x.teachReveal.explanation)}</div></div>`:''}</section>`;return}room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label||'Now')}</div><h1 class="headline">${C.esc(x.title)}</h1><div class="instruction">${C.esc(instruction(x)||'Follow your instructor for this moment.')}</div>${aid()?'<div class="status">Your instructor can open a visual example for this moment.</div>':''}</section>`}function primitive(){let x=s(),m=C.snapshot.state.roomMoment?.type;if(m==='aid')return'aid';if(m==='contrast')return'contrast';if(m==='callback'||x.interaction==='callback'&&C.snapshot.state.resultsVisible)return'callback';if(m==='shift'||x.type==='compare')return'shift';if(C.snapshot.state.resultsVisible&&x.choices)return'reveal';if(x.key&&!C.snapshot.state.resultsVisible&&(x.type==='vote'||x.type==='select'||x.type==='prompt'))return'commit';return'default'}function render(){let p=primitive();p==='aid'?showAid():p==='commit'?commit():p==='reveal'?reveal():p==='shift'?shift():p==='contrast'?contrast():p==='callback'?callback():defaultMoment()}function key(){let st=C.snapshot.state;return[st.step,st.resultsVisible,st.locked,st.roomMoment?.type||'',(C.snapshot.answers||[]).length].join('|')}function live(){if(primitive()==='commit'){let p=C.participation(),a=document.getElementById('commitCount'),b=document.getElementById('activeCount');if(a)a.textContent=p.count;if(b)b.textContent=p.active}}async function poll(force=false){await C.refresh();let k=key();if(force||k!==structural){structural=k;render()}else live()}(async()=>{await C.loadSession();await poll(true);setInterval(()=>poll(),1200)})();</script></body></html>
