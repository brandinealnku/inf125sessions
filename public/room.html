<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:#080807;color:#f6f1e7;overflow:hidden}.room{height:100svh;position:relative;display:grid;place-items:center}.stage{width:100%;height:100%;padding:5vh 6vw;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#d8aa3d;font-weight:900;margin-bottom:18px}.headline{font-family:Georgia,serif;font-size:clamp(58px,8vw,132px);line-height:.88;letter-spacing:-.06em;font-weight:500;margin:0;max-width:1450px}.sub{font-size:clamp(22px,2.2vw,36px);line-height:1.32;color:#d9d4c9;max-width:1200px;margin-top:24px}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.media.contain{object-fit:contain;background:#080807}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#080807e8 0%,#080807a0 45%,#08080720 75%)}.overlay{position:relative;z-index:2;max-width:900px}.overlay h1{font-family:Georgia,serif;font-size:clamp(58px,8vw,128px);line-height:.88;letter-spacing:-.055em;margin:0}.overlay p{font-size:clamp(21px,2vw,34px);color:#e8e0d3}.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}.pane{border:1px solid #39362f;border-radius:22px;padding:28px;background:#11110e;min-height:250px}.pane b{font-size:12px;letter-spacing:.16em;color:#d8aa3d}.pane strong{display:block;font-family:Georgia,serif;font-size:clamp(34px,4vw,64px);line-height:1;margin-top:20px}.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px}.node{border:1px solid #3a372f;background:#12120f;border-radius:16px;padding:22px 24px;font-family:Georgia,serif;font-size:clamp(22px,2vw,33px);animation:rise .45s ease both}.arrow{font-size:28px;color:#d8aa3d}.profile{position:relative;width:min(1100px,90vw);height:min(650px,72vh);margin-top:10px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;display:grid;place-items:center;border:2px solid #d8aa3d;background:#11110e;font-family:Georgia,serif;font-size:46px;box-shadow:0 0 80px #d8aa3d20}.chip{position:absolute;border:1px solid #3b3830;background:#151512;border-radius:999px;padding:12px 18px;font-size:18px;animation:pop .45s ease both}.sequence{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}.seq{border:1px solid #3a372f;border-radius:20px;padding:26px;background:#12120f;min-height:220px;display:flex;align-items:flex-end;font-family:Georgia,serif;font-size:clamp(28px,3vw,48px);animation:rise .5s ease both}.grid{display:grid;gap:15px;margin-top:28px;max-width:1450px}.row{display:grid;grid-template-columns:minmax(250px,1.3fr) 3fr auto;gap:18px;align-items:center;font-size:19px}.track{height:15px;background:#25241f;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8d6b1d,#e0b64d);border-radius:99px;animation:grow .65s cubic-bezier(.2,.8,.2,1)}.pct{font-family:Georgia,serif;font-size:38px;min-width:105px;text-align:right}.count{font:14px system-ui;color:#aaa59a}.giant{font-family:Georgia,serif;font-size:clamp(170px,30vw,460px);line-height:.62;letter-spacing:-.08em}.giantSub{font-size:clamp(28px,3vw,50px);letter-spacing:.18em;color:#d8aa3d;margin-top:30px}.shift{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:end}.shiftNum{font-family:Georgia,serif;font-size:clamp(150px,24vw,360px);line-height:.68}.shiftWords{font-family:Georgia,serif;font-size:clamp(38px,4.4vw,74px);line-height:.92}.hiddenMedia{display:grid;place-items:center;height:100%;font-family:Georgia,serif;font-size:clamp(44px,5vw,80px);color:#807b71;text-align:center;padding:10vw}.status{font-size:clamp(16px,1.4vw,22px);color:#969188;margin-top:22px}@keyframes grow{from{width:0!important}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}@media(max-width:760px){.split,.sequence{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.track{grid-column:1/-1}.shift{grid-template-columns:1fr}.profile{height:70vh}.chip{font-size:14px}}</style></head><body><main class="room" id="room"></main><script src="/shared-v08.js"></script><script src="/visual-canvas-v091.js"></script><script>const C=Classroom,room=document.getElementById('room');let structural='';function s(){return C.current()}function p(){return(window.VisualCanvas||{})[C.snapshot.state.step]||{}}function visual(){let x=s(),q=p();return{type:x.visualType||q.type||'statement',url:x.mediaUrl||'',fit:x.mediaFit||'cover',overlay:x.mediaOverlay||q.overlay||x.title||'',reveal:x.mediaReveal||'immediate',preset:q}}function mediaReady(v){return v.reveal!=='on-reveal'||C.snapshot.state.resultsVisible||C.snapshot.state.roomMoment?.type==='media'}function media(v){if(!mediaReady(v))return`<div class="hiddenMedia">Visual held for Reveal.</div>`;let tag=v.type==='video'?`<video class="media ${v.fit==='contain'?'contain':''}" src="${C.esc(v.url)}" autoplay muted loop playsinline></video>`:`<img class="media ${v.fit==='contain'?'contain':''}" src="${C.esc(v.url)}" alt="Classroom visual">`;return`<section class="stage">${tag}<div class="veil"></div><div class="overlay"><div class="kicker">${C.esc(s().label||'Visual')}</div><h1>${C.esc(v.overlay)}</h1><p>${C.esc(s().roomInstruction||s().lead||'')}</p></div></section>`}function statement(v){let q=v.preset;room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><h1 class="headline">${C.esc(v.overlay||s().title)}</h1>${q.accent?`<div class="sub">${C.esc(q.accent)}</div>`:''}</section>`}function split(v){let q=v.preset,l=q.left||['A','One interpretation'],r=q.right||['B','Another interpretation'];room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><h1 class="headline">${C.esc(v.overlay||s().title)}</h1><div class="split"><div class="pane"><b>${C.esc(l[0])}</b><strong>${C.esc(l[1])}</strong></div><div class="pane"><b>${C.esc(r[0])}</b><strong>${C.esc(r[1])}</strong></div></div></section>`}function flow(v){let q=v.preset,nodes=q.nodes||[];room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><h1 class="headline">${C.esc(v.overlay||s().title)}</h1><div class="flow">${nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node" style="animation-delay:${i*.08}s">${C.esc(n)}</div>`).join('')}</div></section>`}function profile(v){let q=v.preset,n=q.nodes||[],pos=[[8,12],[66,8],[77,34],[72,70],[7,67],[2,38],[34,4],[36,82]];room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><div class="profile"><div class="center">${C.esc(q.center||'MAYA')}</div>${n.map((x,i)=>`<div class="chip" style="left:${pos[i%pos.length][0]}%;top:${pos[i%pos.length][1]}%;animation-delay:${i*.07}s">${C.esc(x)}</div>`).join('')}</div></section>`}function sequence(v){let q=v.preset;room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><h1 class="headline">${C.esc(v.overlay||s().title)}</h1><div class="sequence">${(q.cards||[]).map((x,i)=>`<div class="seq" style="animation-delay:${i*.18}s">${C.esc(x)}</div>`).join('')}</div></section>`}function results(){let x=s(),out=C.aggregate(x.key),meta=C.aggregateMeta(x.key),total=Math.max(1,meta.respondents);room.innerHTML=`<section class="stage"><div class="kicker">THE ROOM ANSWERED</div><h1 class="headline">${C.esc(x.title)}</h1><div class="grid">${(x.choices||[]).map(c=>{let n=out[c]||0,p=Math.round(n/total*100);return`<div class="row"><b>${C.esc(c)}</b><div class="track"><div class="fill" style="width:${Math.min(100,p)}%"></div></div><div class="pct">${p}% <span class="count">${n}</span></div></div>`}).join('')}</div></section>`}function shift(){let m=C.changedMinds();room.innerHTML=`<section class="stage"><div class="kicker">THE ROOM MOVED</div><div class="shift"><div class="shiftNum">${m.changed}</div><div class="shiftWords">people changed<br>their minds.</div></div><div class="sub">Better context changed the decision.</div></section>`}function confidence(){room.innerHTML=`<section class="stage"><div class="kicker">VIKING FEED SAYS</div><div class="giant">97%</div><div class="giantSub">MATCH</div></section>`}function commit(){let x=s(),n=C.participation().count;room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(x.label)} · COMMIT</div><h1 class="headline">${C.esc(x.title)}</h1><div class="sub">${C.esc(x.roomInstruction||x.studentTask||x.lead||'Make your call.')}</div><div class="status"><span id="commitCount">${n}</span> committed · results stay hidden.</div></section>`}function render(){let x=s(),v=visual(),forced=C.snapshot.state.roomMoment?.type==='media';if(v.url&&(forced||v.type==='gif'||v.type==='image'||v.type==='video'))return room.innerHTML=media(v);if(C.snapshot.state.resultsVisible&&x.choices)return results();if(x.type==='compare'||v.type==='shift')return shift();if(v.type==='confidence')return confidence();if(x.key&&!C.snapshot.state.resultsVisible&&(x.type==='vote'||x.type==='select'||x.type==='prompt')&&!forced)return commit();if(v.type==='split')return split(v);if(v.type==='flow')return flow(v);if(v.type==='profile')return profile(v);if(v.type==='sequence')return sequence(v);if(v.type==='live-results')return results();if(v.type==='none')return room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(x.label)}</div><h1 class="headline">${C.esc(x.title)}</h1></section>`;return statement(v)}function key(){let st=C.snapshot.state,ed=C.snapshot.sessionEdits?.[st.step]?.updatedAt||0;return[st.step,st.resultsVisible,st.locked,st.roomMoment?.type||'',Object.keys(C.snapshot.answers||{}).map(k=>Object.keys(C.snapshot.answers[k]||{}).length).join(','),ed].join('|')}async function poll(force=false){await C.refresh();let k=key();if(force||k!==structural){structural=k;render()}else{let a=document.getElementById('commitCount');if(a)a.textContent=C.participation().count}}(async()=>{await C.loadSession();await poll(true);setInterval(()=>poll(),850)})();</script></body></html>
