<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0c"><title>Room</title><link rel="stylesheet" href="/shared-v08.css"><style>
html,body{background:var(--room);color:var(--room-text);overflow:hidden}.room{height:100svh;padding:7vh 7vw;display:flex;flex-direction:column;justify-content:center}.label{font-size:clamp(11px,1vw,16px);letter-spacing:.2em;text-transform:uppercase;color:#d8aa3d;font-weight:850;margin-bottom:24px}.headline{font-family:Georgia,"Times New Roman",serif;font-size:clamp(66px,9.2vw,150px);line-height:.87;letter-spacing:-.055em;font-weight:500;max-width:1450px;margin:0}.sub{font-size:clamp(24px,2.5vw,42px);line-height:1.35;color:#c8c3b8;max-width:1200px;margin-top:32px}.commitNum{font-family:Georgia,"Times New Roman",serif;font-size:clamp(150px,25vw,360px);line-height:.68;letter-spacing:-.06em}.commitLabel{font-size:clamp(30px,4vw,66px);margin-top:30px}.choiceGrid{display:grid;gap:18px;margin-top:34px;max-width:1450px}.choiceRow{display:grid;grid-template-columns:minmax(220px,1fr) 3fr auto;gap:24px;align-items:center}.choiceName{font-size:clamp(20px,2vw,34px);font-weight:750}.track{height:12px;background:#272621;border-radius:99px;overflow:hidden}.fill{height:100%;background:#d8aa3d;border-radius:99px;transform-origin:left;transition:width .7s cubic-bezier(.2,.8,.2,1)}.pct{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,3vw,52px);min-width:90px;text-align:right}.contrast{display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}.quote{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,4.5vw,76px);line-height:1.08;letter-spacing:-.035em}.versus{text-align:center;color:#77736b;font-size:14px;letter-spacing:.2em;margin:20px}.shiftNum{font-family:Georgia,"Times New Roman",serif;font-size:clamp(150px,23vw,340px);line-height:.7;letter-spacing:-.06em}.dots{display:flex;flex-wrap:wrap;gap:11px;max-width:900px;margin-top:38px}.dot{width:18px;height:18px;border-radius:50%;background:#44423d}.dot.moved{background:#d8aa3d;box-shadow:0 0 24px rgba(216,170,61,.28)}.callbackQ{font-family:Georgia,"Times New Roman",serif;font-size:clamp(52px,7.5vw,120px);line-height:.94;letter-spacing:-.045em;max-width:1400px}.split{display:flex;gap:22px;align-items:flex-end;margin-top:45px;max-width:1200px}.splitSide{flex:1;border-top:5px solid #d8aa3d;padding-top:15px}.splitSide strong{font-family:Georgia,"Times New Roman",serif;font-size:clamp(54px,6vw,100px);display:block}.splitSide span{font-size:clamp(18px,2vw,30px);color:#c8c3b8}.fade{animation:enter .45s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.offline{color:#d99b9b;font-size:22px}@media(max-width:800px){.room{padding:6vh 6vw}.choiceRow{grid-template-columns:1fr auto}.track{grid-column:1/-1}.contrast{grid-template-columns:1fr}.versus{margin:0;text-align:left}.split{flex-direction:column;align-items:stretch}.dots{gap:8px}.dot{width:14px;height:14px}}
</style></head><body><main class="room" id="room" aria-live="polite"></main><script src="/shared-v08.js"></script><script>
const C=Classroom;let structural='';function step(){return C.current()}function currentRows(){const s=step();return s.key?C.answers(s.key):[]}function commit(){const p=C.participation();room.innerHTML=`<section class="fade"><div class="label">Commit</div><div class="commitNum" id="commitCount">${p.count}</div><div class="commitLabel"><span id="activeCount">of ${p.active}</span> committed</div><div class="sub">Think first. The room stays hidden until everyone has a chance to decide.</div></section>`}
function reveal(){const s=step(),out=C.aggregate(s.key),total=Math.max(1,C.answers(s.key).length);room.innerHTML=`<section class="fade"><div class="label">Reveal</div><h1 class="headline">${C.esc(s.title)}</h1><div class="choiceGrid">${(s.choices||[]).map(c=>{const n=out[c]||0,p=Math.round(n/total*100);return`<div class="choiceRow"><div class="choiceName">${C.esc(c)}</div><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="pct">${p}%</div></div>`}).join('')}</div></section>`}
function contrast(){let rows=currentRows().filter(r=>typeof r.response==='string'&&r.response.trim());if(C.snapshot.state.spotlight){const chosen=C.snapshot.state.spotlight.response;rows=[{response:chosen},...rows.filter(r=>r.response!==chosen)]}const a=rows[0]?.response||'Waiting for a response from the room.',b=rows.find(r=>r.response!==a)?.response||'Choose another response to create a contrast.';room.innerHTML=`<section class="fade"><div class="label">Contrast</div><h1 class="headline" style="font-size:clamp(52px,6vw,96px)">Same room.<br>Different reasoning.</h1><div class="contrast"><div class="quote">“${C.esc(a)}”</div><div class="versus">VERSUS</div><div class="quote">“${C.esc(b)}”</div></div></section>`}
function shift(){const m=C.changedMinds(),dots=Array.from({length:m.eligible},(_,i)=>`<span class="dot ${i<m.changed?'moved':''}"></span>`).join('');room.innerHTML=`<section class="fade"><div class="label">Shift</div><div class="shiftNum">${m.changed}</div><div class="commitLabel">people changed their minds.</div><div class="dots" aria-label="${m.changed} of ${m.eligible} changed">${dots}</div><div class="sub">The algorithm didn’t change. The information did.</div></section>`}
function callback(){const rows=C.answers('predict_me_open'),out={};rows.forEach(r=>{if(typeof r.response==='string')out[r.response]=(out[r.response]||0)+1});const total=Math.max(1,rows.length),choices=C.session.steps.find(x=>x.key==='predict_me_open')?.choices||Object.keys(out);room.innerHTML=`<section class="fade"><div class="label">Callback</div><div class="callbackQ">Remember your first answer?</div><div class="split">${choices.slice(0,2).map(c=>`<div class="splitSide"><strong>${Math.round((out[c]||0)/total*100)}%</strong><span>${C.esc(c)}</span></div>`).join('')}</div><div class="sub">Would you answer differently now?</div></section>`}
function defaultMoment(){const s=step();room.innerHTML=`<section class="fade"><div class="label">${C.esc(s.label||'Now')}</div><h1 class="headline">${C.esc(s.title)}</h1>${s.lead?`<div class="sub">${C.esc(s.lead)}</div>`:''}</section>`}
function primitive(){const s=step(),moment=C.snapshot.state.roomMoment?.type;if(moment==='callback')return'callback';if(moment==='shift'||s.type==='compare')return'shift';if(moment==='contrast'||C.snapshot.state.spotlight)return'contrast';if(C.snapshot.state.resultsVisible&&s.choices)return'reveal';if(moment==='commit'||(s.key&&!C.snapshot.state.resultsVisible&&(s.type==='vote'||s.type==='prompt'||s.type==='build')))return'commit';return'default'}
function render(){const p=primitive();if(p==='commit')commit();else if(p==='reveal')reveal();else if(p==='contrast')contrast();else if(p==='shift')shift();else if(p==='callback')callback();else defaultMoment()}
function key(){const st=C.snapshot.state;return[st.step,st.resultsVisible,st.locked,st.roomMoment?.type||'',st.spotlight?.response||''].join('|')}
function live(){if(primitive()==='commit'){const p=C.participation();const n=document.getElementById('commitCount'),a=document.getElementById('activeCount');if(n)n.textContent=p.count;if(a)a.textContent='of '+p.active}}
async function poll(force=false){try{await C.refresh();const k=key();if(force||k!==structural){structural=k;render()}else live()}catch(e){room.innerHTML='<div class="offline">Room display reconnecting…</div>'}}
(async()=>{try{await C.loadSession();await poll(true);setInterval(()=>poll(false),1200)}catch(e){room.innerHTML='<div class="offline">Room display could not load.</div>'}})();
</script></body></html>
