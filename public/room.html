<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:#0d0d0c;color:#f5f2e9;overflow:hidden}.room{height:100svh;padding:6vh 7vw;display:flex;flex-direction:column;justify-content:center}.label{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#d8aa3d;font-weight:850;margin-bottom:20px}.headline{font-family:Georgia,serif;font-size:clamp(58px,8vw,130px);line-height:.9;letter-spacing:-.055em;font-weight:500;margin:0;max-width:1450px}.instruction{font-size:clamp(24px,2.8vw,42px);line-height:1.35;color:#ddd8cd;max-width:1250px;margin-top:28px;border-left:4px solid #d8aa3d;padding-left:24px}.status{font-size:clamp(18px,1.7vw,28px);color:#969188;margin-top:24px}.commitNum,.shiftNum{font-family:Georgia,serif;font-size:clamp(140px,22vw,320px);line-height:.72}.grid{display:grid;gap:14px;margin-top:26px}.row{display:grid;grid-template-columns:minmax(220px,1fr) 3fr auto;gap:20px;align-items:center}.track{height:12px;background:#292823;border-radius:99px}.fill{height:100%;background:#d8aa3d;border-radius:99px}.pct{font-family:Georgia,serif;font-size:38px}.teach{border-left:5px solid #d8aa3d;padding-left:28px;margin-top:32px}.teach strong{font-family:Georgia,serif;font-size:clamp(38px,4.5vw,68px);font-weight:500}.teach div{font-size:clamp(19px,2vw,30px);color:#c8c3b8;margin-top:10px}.examples{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:34px}.example{border-top:2px solid #d8aa3d;padding-top:14px;font-size:clamp(16px,1.5vw,24px);line-height:1.3}.fade{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style></head><body><main class="room" id="room"></main><script src="/shared-v08.js"></script><script>const C=Classroom,room=document.getElementById('room');let structural='';function s(){return C.current()}function instruction(x){return x.roomInstruction||x.studentTask||x.lead||''}function commit(){let x=s(),p=C.participation();room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label)} · Commit</div><h1 class="headline">${C.esc(x.title)}</h1><div class="instruction">${C.esc(instruction(x)||'Think first. Commit your answer before discussing it.')}</div><div class="status"><span id="commitCount">${p.count}</span> of <span id="activeCount">${p.active}</span> committed · Results stay hidden until Reveal.</div></section>`}function reveal(){let x=s(),out=C.aggregate(x.key),total=Math.max(1,C.answers(x.key).length);room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label)} · Reveal</div><h1 class="headline">${C.esc(x.title)}</h1><div class="grid">${(x.choices||[]).map(c=>{let n=out[c]||0,p=Math.round(n/total*100);return`<div class="row"><b>${C.esc(c)}</b><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="pct">${p}%</div></div>`}).join('')}</div>${x.teachReveal?`<div class="teach"><strong>${C.esc(x.teachReveal.headline)}</strong><div>${C.esc(x.teachReveal.explanation)}</div></div>`:''}</section>`}function shift(){let x=s(),m=C.changedMinds();room.innerHTML=`<section class="fade"><div class="label">Shift</div><div class="shiftNum">${m.changed}</div><div class="instruction">people changed their minds after new context arrived.</div><div class="status">${C.esc(x.hero||"The algorithm didn't change. The information did.")}</div></section>`}function defaultMoment(){let x=s();if(x.label==='97% MATCH'){room.innerHTML=`<section class="fade"><div class="label">Challenge</div><h1 class="headline">97%</h1><div class="instruction">MATCH · ${C.esc(instruction(x)||'Would you follow the recommendation?')}</div>${C.snapshot.state.resultsVisible&&x.teachReveal?`<div class="teach"><strong>${C.esc(x.teachReveal.headline)}</strong><div>${C.esc(x.teachReveal.explanation)}</div></div>`:''}</section>`;return}if(x.type==='teach'){room.innerHTML=`<section class="fade"><div class="label">Phones down · Teach</div><h1 class="headline">${C.esc(x.title)}</h1><div class="instruction">${C.esc(instruction(x)||'Look up. Follow the system from data to decision.')}</div><div class="examples">${(x.flow||[]).map(e=>`<div class="example">${C.esc(e)}</div>`).join('')}</div></section>`;return}if(x.type==='sequence'){room.innerHTML=`<section class="fade"><div class="label">Plot twist · Watch</div><h1 class="headline">${C.esc(x.title)}</h1><div class="instruction">${C.esc(instruction(x)||'Do not vote yet. Notice when your thinking changes.')}</div><div class="status">Your instructor will reveal the new context one piece at a time.</div></section>`;return}room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label||'Now')}</div><h1 class="headline">${C.esc(x.title)}</h1><div class="instruction">${C.esc(instruction(x)||'Follow your instructor for this moment.')}</div></section>`}function primitive(){let x=s(),m=C.snapshot.state.roomMoment?.type;if(m==='shift'||x.type==='compare')return'shift';if(C.snapshot.state.resultsVisible&&x.choices)return'reveal';if(x.key&&!C.snapshot.state.resultsVisible&&(x.type==='vote'||x.type==='select'||x.type==='prompt'))return'commit';return'default'}function render(){let p=primitive();p==='commit'?commit():p==='reveal'?reveal():p==='shift'?shift():defaultMoment()}function key(){let st=C.snapshot.state;return[st.step,st.resultsVisible,st.locked,st.roomMoment?.type||''].join('|')}function live(){if(primitive()==='commit'){let p=C.participation(),a=document.getElementById('commitCount'),b=document.getElementById('activeCount');if(a)a.textContent=p.count;if(b)b.textContent=p.active}}async function poll(force=false){await C.refresh();let k=key();if(force||k!==structural){structural=k;render()}else live()}(async()=>{await C.loadSession();await poll(true);setInterval(()=>poll(),1200)})();</script></body></html>
