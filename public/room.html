<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:#090908;color:#f5f2e9;overflow:hidden}.room{height:100svh;padding:5vh 6vw;display:flex;flex-direction:column;justify-content:center;position:relative}.room:after{content:'';position:absolute;width:52vw;height:52vw;border-radius:50%;background:radial-gradient(circle,#d8aa3d14,transparent 68%);right:-20vw;top:-25vw;pointer-events:none}.label{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#d8aa3d;font-weight:900;margin-bottom:18px}.headline{font-family:Georgia,serif;font-size:clamp(58px,8vw,132px);line-height:.88;letter-spacing:-.06em;font-weight:500;margin:0;max-width:1500px}.instruction{font-size:clamp(22px,2.2vw,35px);line-height:1.32;color:#d9d4c9;max-width:1200px;margin-top:25px}.status{font-size:clamp(16px,1.4vw,22px);color:#969188;margin-top:22px}.grid{display:grid;gap:15px;margin-top:30px;max-width:1450px}.row{display:grid;grid-template-columns:minmax(250px,1.3fr) 3fr auto;gap:18px;align-items:center;font-size:19px}.track{height:15px;background:#25241f;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8d6b1d,#e0b64d);border-radius:99px;animation:grow .65s cubic-bezier(.2,.8,.2,1)}@keyframes grow{from{width:0!important}}.pct{font-family:Georgia,serif;font-size:38px;min-width:105px;text-align:right}.count{font:14px system-ui;color:#aaa59a}.teach{border-top:1px solid #3a372e;padding-top:24px;margin-top:28px;max-width:1250px}.teach strong{font-family:Georgia,serif;font-size:clamp(34px,4vw,62px);font-weight:500}.teach div{font-size:clamp(18px,1.7vw,26px);color:#c8c3b8;margin-top:9px}.giant{font-family:Georgia,serif;font-size:clamp(150px,27vw,430px);line-height:.66;letter-spacing:-.08em}.giantSub{font-size:clamp(26px,3vw,48px);letter-spacing:.14em;color:#d8aa3d;margin-top:28px}.aidGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:27px;max-width:1450px}.aidCard{min-height:145px;border:1px solid #37352f;background:#12120f;border-radius:16px;padding:19px;display:flex;flex-direction:column;justify-content:space-between}.aidCard b{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#d8aa3d}.aidCard span{font-family:Georgia,serif;font-size:clamp(21px,2vw,31px);line-height:1.12;margin-top:15px}.focus{font-size:clamp(19px,1.7vw,26px);margin-top:23px;color:#f2dfae}.shiftWrap{display:grid;grid-template-columns:auto 1fr;gap:35px;align-items:end}.shiftNum{font-family:Georgia,serif;font-size:clamp(150px,23vw,340px);line-height:.7}.shiftWords{font-family:Georgia,serif;font-size:clamp(34px,4vw,68px);line-height:.95}.fade{animation:enter .45s ease both}@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}@media(max-width:760px){.row{grid-template-columns:1fr auto}.track{grid-column:1/-1}.shiftWrap{grid-template-columns:1fr}}</style></head><body><main class="room" id="room"></main><script src="/shared-v08.js"></script><script src="/learning-aids-v084.js"></script><script>const C=Classroom,room=document.getElementById('room');let structural='';function s(){return C.current()}function aid(){return(window.LearningAids||{})[C.snapshot.state.step]||null}function ins(x){return x.roomInstruction||x.studentTask||x.lead||''}function visual(){let a=aid(),x=s();if(!a)return normal();room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label)} · Look closer</div><h1 class="headline">${C.esc(a.title)}</h1><div class="instruction">${C.esc(a.prompt||'')}</div><div class="aidGrid">${(a.items||[]).map(i=>`<div class="aidCard"><b>${C.esc(i[0])}</b><span>${C.esc(i[1])}</span></div>`).join('')}</div>${a.focus?`<div class="focus">→ ${C.esc(a.focus)}</div>`:''}</section>`}function commit(){let x=s(),p=C.participation();room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label)} · Commit</div><h1 class="headline">${C.esc(x.title)}</h1><div class="instruction">${C.esc(ins(x))}</div><div class="status"><span id="commitCount">${p.count}</span> committed. The room stays quiet until everyone makes the call.</div></section>`}function reveal(){let x=s(),out=C.aggregate(x.key),meta=C.aggregateMeta(x.key),total=Math.max(1,meta.respondents);room.innerHTML=`<section class="fade"><div class="label">The room answered</div><h1 class="headline">${C.esc(x.title)}</h1><div class="grid">${(x.choices||[]).map(c=>{let n=out[c]||0,p=Math.round(n/total*100);return`<div class="row"><b>${C.esc(c)}</b><div class="track"><div class="fill" style="width:${Math.min(100,p)}%"></div></div><div class="pct">${p}% <span class="count">${n}</span></div></div>`}).join('')}</div>${x.teachReveal?`<div class="teach"><strong>${C.esc(x.teachReveal.headline)}</strong><div>${C.esc(x.teachReveal.explanation)}</div></div>`:''}</section>`}function shift(){let m=C.changedMinds();room.innerHTML=`<section class="fade"><div class="label">The room moved</div><div class="shiftWrap"><div class="shiftNum">${m.changed}</div><div class="shiftWords">people changed<br>their minds.</div></div><div class="instruction">Better context changed the decision. Changing your mind is evidence of updating.</div></section>`}function match(){let x=s();room.innerHTML=`<section class="fade"><div class="label">Viking Feed says</div><div class="giant">97%</div><div class="giantSub">MATCH</div><div class="instruction">${C.esc(ins(x)||'Would you trust it?')}</div></section>`}function normal(){let x=s();room.innerHTML=`<section class="fade"><div class="label">${C.esc(x.label||'Now')}</div><h1 class="headline">${C.esc(x.title)}</h1><div class="instruction">${C.esc(ins(x)||'Stay with the room.')}</div></section>`}function primitive(){let x=s(),m=C.snapshot.state.roomMoment?.type;if(m==='aid')return'visual';if(x.type==='compare')return'shift';if(C.snapshot.state.resultsVisible&&x.choices)return'reveal';if(x.label==='97% MATCH')return'match';if(x.key&&(x.type==='vote'||x.type==='select'||x.type==='prompt'))return'commit';return'normal'}function render(){let p=primitive();p==='visual'?visual():p==='shift'?shift():p==='reveal'?reveal():p==='match'?match():p==='commit'?commit():normal()}function key(){let st=C.snapshot.state,ed=C.snapshot.sessionEdits?.[st.step]?.updatedAt||0;return[st.step,st.resultsVisible,st.locked,st.roomMoment?.type||'',Object.keys(C.snapshot.answers||{}).map(k=>Object.keys(C.snapshot.answers[k]||{}).length).join(','),ed].join('|')}async function poll(force=false){await C.refresh();let k=key();if(force||k!==structural){structural=k;render()}else if(primitive()==='commit'){let p=C.participation(),a=document.getElementById('commitCount');if(a)a.textContent=p.count}}(async()=>{await C.loadSession();await poll(true);setInterval(()=>poll(),900)})();</script></body></html>
