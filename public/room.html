<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:#080807;color:#f6f1e7;overflow:hidden}.room{height:100svh;position:relative;display:grid;place-items:center}.stage{width:100%;height:100%;padding:5vh 6vw;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#d8aa3d;font-weight:900;margin-bottom:18px}.headline{font-family:Georgia,serif;font-size:clamp(58px,8vw,132px);line-height:.88;letter-spacing:-.06em;font-weight:500;margin:0;max-width:1450px}.sub{font-size:clamp(22px,2.2vw,36px);line-height:1.32;color:#d9d4c9;max-width:1200px;margin-top:24px}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.media.contain{object-fit:contain;background:#080807}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#080807e8 0%,#080807a0 45%,#08080720 75%)}.overlay{position:relative;z-index:2;max-width:900px}.overlay h1{font-family:Georgia,serif;font-size:clamp(58px,8vw,128px);line-height:.88;letter-spacing:-.055em;margin:0}.overlay p{font-size:clamp(21px,2vw,34px);color:#e8e0d3}.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}.pane{border:1px solid #39362f;border-radius:22px;padding:28px;background:#11110e;min-height:250px}.pane b{font-size:12px;letter-spacing:.16em;color:#d8aa3d}.pane strong{display:block;font-family:Georgia,serif;font-size:clamp(34px,4vw,64px);line-height:1;margin-top:20px}.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px}.node{border:1px solid #3a372f;background:#12120f;border-radius:16px;padding:22px 24px;font-family:Georgia,serif;font-size:clamp(22px,2vw,33px);animation:rise .45s ease both}.arrow{font-size:28px;color:#d8aa3d}.profile{position:relative;width:min(1100px,90vw);height:min(650px,72vh);margin-top:10px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;display:grid;place-items:center;border:2px solid #d8aa3d;background:#11110e;font-family:Georgia,serif;font-size:46px;box-shadow:0 0 80px #d8aa3d20}.chip{position:absolute;border:1px solid #3b3830;background:#151512;border-radius:999px;padding:12px 18px;font-size:18px;animation:pop .45s ease both}.sequence{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:30px}.seq{border:1px solid #3a372f;border-radius:22px;padding:26px;background:linear-gradient(145deg,#171612,#0d0d0b);min-height:210px;display:flex;align-items:flex-end;font-family:Georgia,serif;font-size:clamp(24px,2.6vw,43px);line-height:1.02;animation:rise .5s ease both;box-shadow:0 18px 50px #0005}.grid{display:grid;gap:15px;margin-top:28px;max-width:1450px}.row{display:grid;grid-template-columns:minmax(250px,1.3fr) 3fr auto;gap:18px;align-items:center;font-size:19px}.track{height:15px;background:#25241f;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8d6b1d,#e0b64d);border-radius:99px;animation:grow .65s cubic-bezier(.2,.8,.2,1)}.pct{font-family:Georgia,serif;font-size:38px;min-width:105px;text-align:right}.count{font:14px system-ui;color:#aaa59a}.giant{font-family:Georgia,serif;font-size:clamp(170px,30vw,460px);line-height:.62;letter-spacing:-.08em}.giantSub{font-size:clamp(28px,3vw,50px);letter-spacing:.18em;color:#d8aa3d;margin-top:30px}.shift{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:end}.shiftNum{font-family:Georgia,serif;font-size:clamp(150px,24vw,360px);line-height:.68}.shiftWords{font-family:Georgia,serif;font-size:clamp(38px,4.4vw,74px);line-height:.92}.hiddenMedia{display:grid;place-items:center;height:100%;font-family:Georgia,serif;font-size:clamp(44px,5vw,80px);color:#807b71;text-align:center;padding:10vw}.status{font-size:clamp(16px,1.4vw,22px);color:#969188;margin-top:22px}.svgScene{width:100%;height:min(76vh,760px);display:flex;align-items:center;justify-content:center;margin-top:10px}.svgScene svg{width:100%;height:100%;display:block}
.roomMeta{position:absolute;top:3.2vh;right:4vw;z-index:5;color:#918c82;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.detailStack{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:18px;max-width:1450px;margin-top:30px;align-items:stretch}
.detailCard{border:1px solid #39362f;background:#11110ee8;border-radius:18px;padding:20px 22px}
.detailCard.gold{border-color:#755d25;background:#18150ddd}
.detailLabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#d8aa3d;font-weight:900;margin-bottom:8px}
.detailText{font-size:clamp(18px,1.55vw,25px);line-height:1.38;color:#eee8dc}
.choiceGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:24px;max-width:1450px}
.choiceCard{border:1px solid #444038;background:#11110e;border-radius:16px;padding:18px 20px;font-size:clamp(18px,1.6vw,26px);font-weight:800;line-height:1.18}
.choiceCard:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#d8aa3d;margin-right:10px;vertical-align:2px}
.micro{font-size:14px;color:#aaa59a;margin-top:12px;line-height:1.4}
.frameworkStrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.frameworkPill{border:1px solid #3b3830;background:#151512;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;letter-spacing:.05em}
.deckSlide{width:100%;height:100%;padding:4.5vh 5vw 3.5vh;display:flex;flex-direction:column;justify-content:flex-start;position:relative;overflow:hidden}
.deckTop{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.deckKicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#d8aa3d;font-weight:900}
.deckNum{font-size:12px;letter-spacing:.12em;color:#827d73;text-transform:uppercase;font-weight:800;white-space:nowrap}
.deckTitle{font-family:Georgia,serif;font-size:clamp(48px,6vw,88px);line-height:.94;letter-spacing:-.055em;font-weight:500;margin:16px 0 12px;max-width:1450px}
.deckSubtitle{font-size:clamp(20px,1.9vw,30px);line-height:1.35;color:#d8d2c7;max-width:1220px}
.deckBody{display:grid;gap:14px;margin-top:26px;max-width:1450px}
.deckBullets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.deckBullet{border:1px solid #37342d;background:#11110e;border-radius:16px;padding:16px 18px;font-size:clamp(17px,1.45vw,23px);line-height:1.3}
.deckNumbered{display:grid;gap:10px;counter-reset:deckstep}
.deckStep{display:grid;grid-template-columns:42px 1fr;gap:13px;align-items:start;border-bottom:1px solid #282620;padding:10px 0;font-size:clamp(17px,1.45vw,22px);line-height:1.35}
.deckStep:before{counter-increment:deckstep;content:counter(deckstep);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#d8aa3d;color:#111;font-weight:900}
.deckColumns{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.deckCol{border:1px solid #39362f;background:linear-gradient(145deg,#151410,#0e0e0c);border-radius:18px;padding:20px}
.deckColLabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#d8aa3d;font-weight:900}
.deckColTitle{font-family:Georgia,serif;font-size:clamp(24px,2.4vw,38px);line-height:1.02;margin:10px 0}
.deckColText{font-size:clamp(16px,1.3vw,20px);line-height:1.35;color:#cfc8bb}
.deckQuote{border-left:4px solid #d8aa3d;background:#11110e;border-radius:0 16px 16px 0;padding:20px 24px;font-family:Georgia,serif;font-size:clamp(26px,2.8vw,44px);line-height:1.18}
.deckCallout{border:1px solid #70591f;background:#1b160b;border-radius:16px;padding:16px 18px;font-size:clamp(18px,1.5vw,23px);font-weight:800;color:#f5df9b}
.deckFooter{margin-top:auto;display:flex;justify-content:space-between;gap:20px;align-items:flex-end;padding-top:18px;border-top:1px solid #26241f}
.deckTakeaway{font-size:clamp(18px,1.5vw,24px);font-weight:850;color:#f1e7d4}
.deckFramework{font-size:12px;color:#8f8a80;letter-spacing:.08em;white-space:nowrap}
.deckChoiceGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:22px}
.deckChoice{border:1px solid #464238;background:#12110e;border-radius:16px;padding:17px 18px;font-size:clamp(18px,1.55vw,25px);font-weight:850}
.deckResponse{margin-top:16px;color:#99948a;font-size:15px}
@media(max-width:900px){.deckBullets{grid-template-columns:1fr}.deckFooter{display:block}.deckFramework{margin-top:8px;white-space:normal}}
@media(max-width:900px){.detailStack{grid-template-columns:1fr}.roomMeta{display:none}}@keyframes grow{from{width:0!important}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}@media(max-width:760px){.split,.sequence{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.track{grid-column:1/-1}.shift{grid-template-columns:1fr}.profile{height:70vh}.chip{font-size:14px}}</style></head><body><main class="room" id="room"></main><script src="/shared-v08.js"></script><script src="/visual-canvas-v091.js"></script><script src="/week5-visuals-v0109.js?v=109"></script><script>const C=Classroom,room=document.getElementById('room');let structural='';function s(){return C.current()}function p(){const id=C.session?.id||'';return((window.SessionVisuals||{})[id]||{})[C.snapshot.state.step]||(window.VisualCanvas||{})[C.snapshot.state.step]||{}}function visual(){let x=s(),q=p();return{type:q.type||x.visualType||'statement',url:x.mediaUrl||'',fit:x.mediaFit||'cover',overlay:x.mediaOverlay||q.overlay||x.title||'',reveal:x.mediaReveal||'immediate',preset:q}}
function detailed(){return C.session?.id==='inf125-week06-ai-detective-lab'}
function momentMeta(){const i=(C.snapshot.state.step||0),start=C.elapsed(i),x=s();return detailed()?'<div class="roomMeta">Moment '+(i+1)+' / '+C.session.steps.length+' · '+start+'–'+(start+(x.minutes||0))+' min</div>':''}
function framework(){return detailed()?'<div class="frameworkStrip"><span class="frameworkPill">CLAIM</span><span class="frameworkPill">CHECK</span><span class="frameworkPill">CONTEXT</span><span class="frameworkPill">CONSEQUENCE</span><span class="frameworkPill">CALL</span></div>':''}
function detailCards(x){
  if(!detailed())return'';
  const move=x.studentTask||'Look up and stay with the room.';
  const why=x.roomInstruction||x.lead||'';
  return '<div class="detailStack"><div class="detailCard gold"><div class="detailLabel">Your move</div><div class="detailText">'+C.esc(move)+'</div></div><div class="detailCard"><div class="detailLabel">Keep in mind</div><div class="detailText">'+C.esc(why)+'</div></div></div>';
}
function choiceCards(x){
  if(!detailed()||!Array.isArray(x.choices)||!x.choices.length)return'';
  return '<div class="choiceGrid">'+x.choices.map(v=>'<div class="choiceCard">'+C.esc(v)+'</div>').join('')+'</div>';
}function deckBody(slide){
  let h='';
  if(slide.quote)h+='<div class="deckQuote">'+C.esc(slide.quote)+'</div>';
  if(Array.isArray(slide.bullets)&&slide.bullets.length)h+='<div class="deckBullets">'+slide.bullets.map(b=>'<div class="deckBullet">'+C.esc(b)+'</div>').join('')+'</div>';
  if(Array.isArray(slide.numbered)&&slide.numbered.length)h+='<div class="deckNumbered">'+slide.numbered.map(b=>'<div class="deckStep">'+C.esc(b)+'</div>').join('')+'</div>';
  if(Array.isArray(slide.columns)&&slide.columns.length)h+='<div class="deckColumns">'+slide.columns.map(col=>'<div class="deckCol"><div class="deckColLabel">'+C.esc(col[0]||'')+'</div><div class="deckColTitle">'+C.esc(col[1]||'')+'</div><div class="deckColText">'+C.esc(col[2]||'')+'</div></div>').join('')+'</div>';
  if(slide.callout)h+='<div class="deckCallout">'+C.esc(slide.callout)+'</div>';
  return h;
}
function deckSlide(){
  let x=s(),slide=x.slide||{},i=C.snapshot.state.step||0,n=C.session.steps.length;
  const kicker=slide.kicker||x.label||'INF 125';
  const title=slide.title||x.title||'';
  const subtitle=slide.subtitle||x.lead||'';
  const takeaway=slide.takeaway||x.roomInstruction||'';
  const responseCount=C.participation(x.key).count;
  const isInteractive=['vote','choice','select','multi-select','prompt','reflection'].includes(x.type);
  const choices=Array.isArray(x.choices)&&x.choices.length?'<div class="deckChoiceGrid">'+x.choices.map(v=>'<div class="deckChoice">'+C.esc(v)+'</div>').join('')+'</div>':'';
  const task=isInteractive?'<div class="deckCallout" style="margin-top:14px">YOUR MOVE: '+C.esc(x.studentTask||x.roomInstruction||'Respond on your device.')+'</div>':'';
  const response=isInteractive?'<div class="deckResponse"><span id="commitCount">'+responseCount+'</span> committed · results hidden until Reveal</div>':'';
  room.innerHTML='<section class="deckSlide"><div class="deckTop"><div class="deckKicker">'+C.esc(kicker)+'</div><div class="deckNum">Slide '+(i+1)+' of '+n+' · '+C.elapsed(i)+'–'+(C.elapsed(i)+(x.minutes||0))+' min</div></div><h1 class="deckTitle">'+C.esc(title)+'</h1><div class="deckSubtitle">'+C.esc(subtitle)+'</div><div class="deckBody">'+deckBody(slide)+choices+task+response+'</div><div class="deckFooter"><div class="deckTakeaway">'+C.esc(takeaway)+'</div><div class="deckFramework">CLAIM · CHECK · CONTEXT · CONSEQUENCE · CALL</div></div></section>';
}function mediaReady(v){return v.reveal!=='on-reveal'||C.snapshot.state.resultsVisible||C.snapshot.state.roomMoment?.type==='media'}function svgVisual(v){let q=v.preset||{};room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><div class="svgScene">${q.svg||''}</div></section>`}function media(v){if(!mediaReady(v))return`<div class="hiddenMedia">Visual held for Reveal.</div>`;let tag=v.type==='video'?`<video class="media ${v.fit==='contain'?'contain':''}" src="${C.esc(v.url)}" autoplay muted loop playsinline></video>`:`<img class="media ${v.fit==='contain'?'contain':''}" src="${C.esc(v.url)}" alt="Classroom visual">`;return`<section class="stage">${tag}<div class="veil"></div><div class="overlay"><div class="kicker">${C.esc(s().label||'Visual')}</div><h1>${C.esc(v.overlay)}</h1><p>${C.esc(s().roomInstruction||s().lead||'')}</p></div></section>`}function statement(v){let q=v.preset,x=s();room.innerHTML=`<section class="stage">${momentMeta()}<div class="kicker">${C.esc(q.kicker||x.label)}</div><h1 class="headline">${C.esc(v.overlay||x.title)}</h1><div class="sub">${C.esc(q.accent||x.lead||'')}</div>${detailCards(x)}${framework()}</section>`}function split(v){let q=v.preset,l=q.left||['A','One interpretation'],r=q.right||['B','Another interpretation'];room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><h1 class="headline">${C.esc(v.overlay||s().title)}</h1><div class="split"><div class="pane"><b>${C.esc(l[0])}</b><strong>${C.esc(l[1])}</strong></div><div class="pane"><b>${C.esc(r[0])}</b><strong>${C.esc(r[1])}</strong></div></div></section>`}function flow(v){let q=v.preset,nodes=q.nodes||[];room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><h1 class="headline">${C.esc(v.overlay||s().title)}</h1><div class="flow">${nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node" style="animation-delay:${i*.08}s">${C.esc(n)}</div>`).join('')}</div></section>`}function profile(v){let q=v.preset,n=q.nodes||[],pos=[[8,12],[66,8],[77,34],[72,70],[7,67],[2,38],[34,4],[36,82]];room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><div class="profile"><div class="center">${C.esc(q.center||'MAYA')}</div>${n.map((x,i)=>`<div class="chip" style="left:${pos[i%pos.length][0]}%;top:${pos[i%pos.length][1]}%;animation-delay:${i*.07}s">${C.esc(x)}</div>`).join('')}</div></section>`}function sequence(v){let q=v.preset;room.innerHTML=`<section class="stage"><div class="kicker">${C.esc(q.kicker||s().label)}</div><h1 class="headline">${C.esc(v.overlay||s().title)}</h1><div class="sequence">${(q.cards||[]).map((x,i)=>`<div class="seq" style="animation-delay:${i*.18}s">${C.esc(x)}</div>`).join('')}</div></section>`}function results(){let x=s(),out=C.aggregate(x.key),meta=C.aggregateMeta(x.key),total=Math.max(1,meta.respondents);room.innerHTML=`<section class="stage">${momentMeta()}<div class="kicker">THE ROOM ANSWERED · ${total} RESPONSES</div><h1 class="headline">${C.esc(x.title)}</h1><div class="grid">${(x.choices||[]).map(c=>{let n=out[c]||0,p=Math.round(n/total*100);return`<div class="row"><b>${C.esc(c)}</b><div class="track"><div class="fill" style="width:${Math.min(100,p)}%"></div></div><div class="pct">${p}% <span class="count">${n}</span></div></div>`}).join('')}</div>${detailed()?'<div class="detailCard gold" style="margin-top:22px"><div class="detailLabel">Debrief</div><div class="detailText">'+C.esc(x.runbook?.askNext||x.roomInstruction||'What do you notice?')+'</div></div>':''}</section>`}function shift(){let m=C.changedMinds();room.innerHTML=`<section class="stage"><div class="kicker">THE ROOM MOVED</div><div class="shift"><div class="shiftNum">${m.changed}</div><div class="shiftWords">people changed<br>their minds.</div></div><div class="sub">Better context changed the decision.</div></section>`}function confidence(){room.innerHTML=`<section class="stage"><div class="kicker">VIKING FEED SAYS</div><div class="giant">97%</div><div class="giantSub">MATCH</div></section>`}function commit(){let x=s(),n=C.participation().count;room.innerHTML=`<section class="stage">${momentMeta()}<div class="kicker">${C.esc(x.label)} · COMMIT</div><h1 class="headline">${C.esc(x.title)}</h1><div class="sub">${C.esc(x.lead||'')}</div>${choiceCards(x)}${detailCards(x)}<div class="status"><span id="commitCount">${n}</span> committed · results stay hidden.</div>${framework()}</section>`}function render(){let x=s(),v=visual(),forced=C.snapshot.state.roomMoment?.type==='media';if(detailed()&&!C.snapshot.state.resultsVisible&&x.slide)return deckSlide();if(v.type==='svg'&&v.preset?.svg)return svgVisual(v);if(v.url&&(forced||v.type==='gif'||v.type==='image'||v.type==='video'))return room.innerHTML=media(v);if(C.snapshot.state.resultsVisible&&x.choices)return results();if(x.type==='compare'||v.type==='shift')return shift();if(v.type==='confidence')return confidence();if(x.key&&!C.snapshot.state.resultsVisible&&(x.type==='vote'||x.type==='select'||x.type==='prompt')&&!forced)return commit();if(v.type==='split')return split(v);if(v.type==='flow')return flow(v);if(v.type==='profile')return profile(v);if(v.type==='sequence')return sequence(v);if(v.type==='live-results')return results();if(v.type==='none')return room.innerHTML=`<section class="stage">${momentMeta()}<div class="kicker">${C.esc(x.label)}</div><h1 class="headline">${C.esc(x.title)}</h1><div class="sub">${C.esc(x.lead||'')}</div>${detailCards(x)}${framework()}</section>`;return statement(v)function key(){let st=C.snapshot.state,ed=C.snapshot.sessionEdits?.[st.step]?.updatedAt||0;return[st.step,st.resultsVisible,st.locked,st.roomMoment?.type||'',Object.keys(C.snapshot.answers||{}).map(k=>Object.keys(C.snapshot.answers[k]||{}).length).join(','),ed].join('|')}async function poll(force=false){await C.refresh();let k=key();if(force||k!==structural){structural=k;render()}else{let a=document.getElementById('commitCount');if(a)a.textContent=C.participation().count}}(async()=>{await C.loadSession();await poll(true);setInterval(()=>poll(),850)})();</script></body></html>
