<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12223a"><title>INF 125 — AI Ethics Experience Lab</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172640;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.wrap{max-width:1200px;margin:auto;padding:18px}.mast{background:#14243e;color:white;border-radius:19px;padding:24px;margin-bottom:16px}.mast h1{font-size:clamp(27px,5vw,46px);margin:10px 0}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#a8c7ff}.muted{color:#687892}.mast .muted{color:#c7d5ea}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dce3ee;border-radius:16px;padding:19px;margin:12px 0;box-shadow:0 4px 18px #17243e09}.card h2,.card h3{margin:5px 0 12px}.tag{font-size:12px;border-radius:100px;background:#e6eefc;color:#213d6d;padding:7px 12px;font-weight:800}.warn{background:#fff3d4;border:1px solid #f1cb7c;border-radius:10px;padding:13px}.error{color:#b12544}.success{color:#087b56}.btn{border:0;background:#235cbd;color:white;border-radius:11px;padding:13px 17px;font-weight:800}.btn.alt{background:#e9eef6;color:#1b314f}.btn.danger{background:#a92a45}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #86b1ff;outline-offset:2px}.field{display:block;width:100%;border:1px solid #b9c5d7;border-radius:10px;padding:13px;margin-top:8px;color:#15243e;background:white}textarea.field{min-height:110px;resize:vertical}label{display:block;margin:12px 0 5px;font-weight:650}label.option{padding:13px;border:1px solid #d0d8e5;border-radius:12px;cursor:pointer;font-weight:500}.option input{margin-right:10px}.phase{border:1px solid #cfdaeb;background:white;border-radius:12px;padding:12px;text-align:left;width:100%;min-height:99px}.phase.active{border:2px solid #235cbd;background:#eaf2ff}.phase strong{display:block}.phase small{display:block;margin:6px 0;color:#566984}.count{font-weight:850;font-size:22px}.task{background:#ebf2ff;border-left:5px solid #3271cf;padding:16px;border-radius:11px;margin:12px 0}.case{border-top:5px solid #b5c5e3}.case strong{display:block}.case button{margin-top:8px}.case[data-chosen="true"]{background:#edf5ff;border-color:#235cbd}.zone{border-top:6px solid var(--zone)}.zone h3{margin-top:0}.statusline{font-size:13px;color:#50627c}.soft{background:#f6f8fb;border-radius:12px;padding:13px}.sticky{position:sticky;top:0;background:#f4f6faed;backdrop-filter:blur(8px);padding:8px 0;z-index:2}.progress{height:9px;background:#e2eaf6;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:#2766ca}.small{font-size:13px}.quiet{font-size:13px;color:#687892}.nudge{font-size:14px;color:#405b7e}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.number{font-size:30px;font-weight:800}.banner{border-radius:14px;padding:13px;background:#edf8f3;color:#08694a}.stage{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#3e62a2}.room{max-width:1400px}.room .task{font-size:clamp(20px,3vw,31px);line-height:1.35}.room .card{padding:25px}.room .mast h1{font-size:clamp(38px,5vw,64px)}@media(max-width:650px){.wrap{padding:10px}.mast{padding:18px}.pair{grid-template-columns:1fr}.card{padding:15px}.room .card{padding:16px}}
</style></head><body><main id="app" class="wrap"><div class="card">Connecting to the classroom…</div></main>
<script>
'use strict';
const SESSION='inf125-nov10-ethics-v2',API='/api/session/'+SESSION+'/ethics-lab/',GM='/api/session/'+SESSION+'/group-mode/',ZONES=[['A','Red','#dc4b5f'],['B','Blue','#2f80ed'],['C','Purple','#7654d8'],['D','Gold','#d89b24']];
const VIEW=location.pathname.endsWith('/instructor')?'instructor':location.pathname.endsWith('/room')?'room':'student';
const instructorKeyStore='inf125-instructor-link-key';
const incomingKey=new URLSearchParams(location.hash.slice(1)).get('access');
if(incomingKey && VIEW==='instructor' && /^[A-Za-z0-9_-]{40,64}$/.test(incomingKey)){
 sessionStorage.setItem(instructorKeyStore,incomingKey);
 history.replaceState(null,'',location.pathname+location.search);
}
const instructorKey=VIEW==='instructor'?(sessionStorage.getItem(instructorKeyStore)||''):'';
const adminHeaders=()=>instructorKey?{'x-inf125-instructor-key':instructorKey}:{};

const storeKey='inf125-ethics-v2-'+SESSION,me=JSON.parse(localStorage.getItem(storeKey)||'null')||{id:(crypto.randomUUID?.()||String(Date.now())),name:''};
const app=document.getElementById('app');let snap=null,group=null,mySaved=null,error='',notice='',lastKey='',busy=false,auth=false,configured=false,renderedPhase=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
const save=()=>localStorage.setItem(storeKey,JSON.stringify(me));
const draftKey=(phase)=>`ethics-v2-draft-${SESSION}-${me.id}-${phase}`;
const draft=(phase)=>{try{return JSON.parse(localStorage.getItem(draftKey(phase))||'{}')}catch{return {}}};
function remember(){const f=document.querySelector('form[data-save]');if(!f)return;let obj={};new FormData(f).forEach((v,k)=>obj[k]=v);localStorage.setItem(draftKey(renderedPhase??snap.state.phase),JSON.stringify(obj));}
async function api(path,method='GET',body=null,base=API){let response=await fetch(base+path,{method,credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json',...adminHeaders()},body:body?JSON.stringify(body):undefined});let data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||`Request failed (${response.status})`);return data;}
function mast(){const phase=snap?.state.phase??0,p=snap?.phases?.[phase];return `<div class="mast"><div class="row"><span class="eyebrow">INF 125 · Dr. Brandi Neal · ${VIEW.toUpperCase()}</span><span class="tag">${error?'RECONNECTING':'LIVE SESSION'}</span></div><h1>From Learning to Responsibility</h1><div class="muted">${p?esc(p.title)+' · '+p.start+'–'+p.end+' minutes · slides '+esc(p.slide):'AI Ethics Experience Lab'}</div></div>`}
function current(){const s=snap,p=s.phases[s.state.phase];return `<div class="card"><div class="row"><span class="stage">Phase ${s.state.phase+1} of 6</span><span class="tag">${p.start}–${p.end} min</span></div><h2>${esc(p.title)}</h2><div class="task">${esc(p.task)}</div></div>`}
function flash(){return (error?`<div class="warn" role="alert">${esc(error)}</div>`:'')+(notice?`<div class="banner" role="status">${esc(notice)}</div>`:'')}
function formBody(fields,button){const p=snap.state.phase,existing=draft(p),result=[];for(const f of fields){let v=existing[f.key]??mySaved?.response?.fields?.[f.key]??'';result.push(f.options?`<label>${esc(f.label)}</label>${f.options.map(o=>`<label class="option"><input type="radio" name="${esc(f.key)}" value="${esc(o)}" ${v===o?'checked':''} required> ${esc(o)}</label>`).join('')}`:`<label for="${f.key}">${esc(f.label)}</label><textarea class="field" id="${f.key}" name="${f.key}" maxlength="1000" required placeholder="${esc(f.placeholder||'Enter your thoughts…')}">${esc(v)}</textarea>`)}return `<form data-save="1" id="responseForm">${result.join('')}<div style="margin-top:16px"><button class="btn" type="submit">${button}</button></div></form>`}
const casesHelp=[['red','AI Tutor — Better Help or Less Learning?','Should personalized tutoring require access to student records and study behavior?'],['blue','Employee Monitoring','Should employers collect clicks, emails, and keyboard activity to improve AI systems?'],['purple','AI Hiring','What should companies prove before AI scores affect interviews?'],['gold','AI Art','Should artists be asked or paid when models learn from their work?']];

const caseDetails={
 'seed-education':{slide:16,title:'The Perfect AI Tutor',deck:'A university gives every student a personalized AI tutor. It can access grades, assignments, Canvas activity, study habits, questions, accommodations, and deadlines. Students who use it improve academically.',decision:'What student data would you allow the tutor to use—and what would you refuse to give it?',tradeoff:'Personalized learning and support versus privacy, consent, and access to sensitive records.'},
 'seed-privacy':{slide:18,title:'Employee AI Monitoring',deck:'AI reads company email, meeting transcripts, keyboard activity, and project data to calculate a weekly employee “performance score.” Managers say it makes evaluations more objective and identifies struggling employees earlier.',decision:'What should employees know, control, appeal, or refuse?',tradeoff:'Potentially useful feedback versus surveillance, power imbalance, and disputed measurements.'},
 'seed-hiring':{slide:15,title:'AI Hiring',deck:'A company receives 20,000 applications. An AI system ranks candidates using résumés and recorded video interviews. It saves recruiters hundreds of hours. Later, the company discovers that some demographic groups consistently receive lower AI scores.',decision:'What would you require before letting the system influence who gets an interview?',tradeoff:'Faster screening versus unequal treatment and the consequences of biased decisions.'},
 'seed-creativity':{slide:17,title:'AI Art',deck:'A company trains an image model using millions of images gathered online. An artist discovers that users can generate images strongly resembling the artist’s recognizable style. The artist was not asked for permission or compensated.',decision:'What should count as meaningful human authorship, permission, or compensation?',tradeoff:'Creative access and experimentation versus credit, permission, and creative labor.'}
};
const fiveLenses=[['Fairness','Who benefits? Who could be treated unfairly?'],['Privacy','What data is collected, inferred, or shared?'],['Transparency','Do people know AI is involved?'],['Ownership','Who created it? Who gets credit or compensation?'],['Accountability','If something goes wrong, who owns the consequence?']];
function casePanel(c,compact=false){
 const d=caseDetails[c?.id]||null;if(!d)return '<div class="soft"><h3>'+esc(c?.title||'Scenario')+'</h3><p>'+esc(c?.description||'')+'</p></div>';
 return '<section class="soft" style="margin:10px 0"><div class="row"><strong>'+esc(d.title)+'</strong><span class="tag">Source slide '+esc(d.slide)+'</span></div><p><b>THE SCENARIO</b></p><p>'+esc(d.deck)+'</p>'+(compact?'':'<p><b>TRADEOFF:</b> '+esc(d.tradeoff)+'</p>')+'<p><b>DECIDE:</b> Yes / No / Only if…</p><p><b>DISCUSS:</b> '+esc(d.decision)+'</p></section>';
}
const guideContent=[
 {title:'Start with judgment, not an answer',lead:'AI Day reflection → capability versus responsibility. Today: explore, question, judge, apply.',steps:['AI Day: What surprised you? What felt useful? What made you pause about fairness, privacy, or responsibility?','Think for one minute, compare with a partner, then share one observation.','When AI makes a decision, ask both “Can AI do this?” and “Should AI do this?”'],close:'Opening opinion: what kind of AI decision would you want to question?'},
 {title:'Slides 14–18: Make a defensible decision',lead:'Your job is NOT to find the “right” answer. It is to explain a responsible decision.',steps:['BENEFIT — What problem does the AI solve?','STAKEHOLDERS — Name at least three groups affected.','ETHICS LENS — Which concern matters most, and why?','YOUR CALL — Yes, No, or Only under certain conditions?','SAFEGUARD — Require one specific rule that would make it more responsible.'],close:'Ethical is not always the same as legal. Law asks what is permitted; ethics asks what should be done; policy asks what an organization will allow.'},
 {title:'Slides 14–18: Ethical Dilemma Challenge',lead:'Read the scenario in full, choose cases that interest you, and receive one of four color-zone team assignments.',steps:['Browse the four case studies below and save your top two preferences.','When groups are formed, go to your assigned color zone and meet your teammates.','Discuss benefit, at least three stakeholders, the strongest ethics lens, your verdict, and one safeguard.','One reporter saves a group response; everyone should help defend the reasoning.'],close:'A strong argument gives a reason and identifies who gains, who carries the cost, and what safeguard changes the decision.'},
 {title:'Slide 19: Gallery Walk — Compare the Decisions',lead:'Look at ONE other group’s case. Leave a question or challenge, not a grade.',steps:['ASSUMPTION — What claim or assumption would you challenge?','STAKEHOLDER — Whom might that team have missed?','RISK — What impact might be underestimated?','SAFEGUARD — What would you change to make the recommendation more responsible?'],close:'Slides 19–20: Ethics lives in tradeoffs: benefit, risk, and conditions or safeguards.'},
 {title:'Design a November 17 activity',lead:'Your group is designing what visiting high-school students will actually experience, not another lecture.',steps:['ACTION — What will the visitors do themselves?','LEARNING — What should they leave knowing, questioning, or able to explain?','FACILITATION — What will INF 125 students lead?','FEASIBILITY — How long will it take and what materials or technology are needed?','ENGAGEMENT — How will the activity be inviting and fun?'],close:'Aim for one small, testable activity that leads visitors to question an AI output or decision.'},
 {title:'Slides 21–27: AI Implications Infographic',lead:'Pick a specific AI issue. Research it, represent multiple viewpoints, and communicate responsible choices to a nontechnical audience.',steps:['NARROW THE TOPIC — Setting + stakeholder + decision + consequence. “AI and jobs” is too broad; “Should employers analyze video interviews with AI?” is investigable.','SHOW EVIDENCE — Use at least two credible non-AI sources. Verify facts, examples, and statistics; provide readable citations.','SHOW PERSPECTIVES — Identify who benefits, who may be harmed, the risks, and responsible choices.','DOCUMENT AI USE — Record tool and purpose, what it suggested, what you accepted/changed/rejected, and what you verified.','EXIT TICKET — Save a likely topic, affected stakeholder, an evidence question, and one condition for responsible AI.'],close:'Do not enter private, sensitive, confidential, student-record, medical, financial, workplace-protected, or identifying information into an AI tool.'}
];
function phaseGuide(phase,kind='student'){
 const d=guideContent[phase]||guideContent[0];const detailed=kind!=='room';
 return '<section class="card"><div class="row"><h2>'+esc(d.title)+'</h2><span class="tag">Facilitation guide · Slide '+esc(snap.phases[phase].slide)+'</span></div><p class="nudge">'+esc(d.lead)+'</p>'+(detailed?'<ol style="padding-left:24px;line-height:1.65">'+d.steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>':'<p><b>Do now:</b> '+esc(d.steps[0])+'</p>')+'<div class="task">'+esc(d.close)+'</div>'+(phase===1?'<div class="grid">'+fiveLenses.map(([a,b])=>'<div class="soft"><b>'+esc(a)+'</b><p>'+esc(b)+'</p></div>').join('')+'</div>':'')+(phase===2?'<div class="grid">'+Object.entries(caseDetails).map(([id,c])=>'<div class="card case"><h3>'+esc(c.title)+'</h3><p>'+esc(c.deck)+'</p><small class="muted">Slide '+esc(c.slide)+'</small></div>').join('')+'</div>':'')+'</section>';
}

function student(){if(!me.name)return mast()+flash()+`<div class="card"><h2>Join today's class</h2><p>Use a first name or nickname. Your work stays associated with this device when you reconnect.</p><form id="joinForm"><input class="field" name="name" maxlength="50" autocomplete="given-name" placeholder="First name or nickname" required><p><button class="btn">Join and participate</button></p></form></div>`;
 const p=snap.state.phase;let body='';
 if(p===0)body=`<div class="card"><h3>AI Pulse: Your starting point</h3>${formBody([{key:'confidence',label:'How confident are you about judging a difficult AI decision?',options:['Very confident','Somewhat confident','Not yet confident']},{key:'question',label:'What is one AI decision you would want to question?',placeholder:'For example, using AI to decide who gets an interview…'}],'Save my opening thoughts')}</div>`;
 if(p===1)body=`<div class="card"><h3>Apply the 5-question ethics check</h3><p class="nudge">The five lenses: fairness, privacy, transparency, ownership, accountability. Use the cases from slides 15–18 as examples.</p>${formBody([{key:'lens',label:'Which lens matters most to the scenario you chose, and why?'},{key:'stakeholder',label:'Name one person who benefits and one person who could carry the cost.'},{key:'safeguard',label:'What would you require before allowing the AI system?'}],'Save my ethical reasoning')}</div>`;
 if(p>=2&&p<=4)body=groupStudent(p);
 if(p===5)body=`<div class="card"><h3>Gen Ed Signature Assignment · AI Implications Infographic</h3><p class="nudge">Focus on a researchable question, not a broad AI category. You will need at least two credible non-AI sources, multiple perspectives, and documentation of how you used and verified AI assistance.</p>${formBody([{key:'topic',label:'My specific AI issue is…'},{key:'question',label:'My researchable question is…'},{key:'benefit',label:'Who benefits?'},{key:'harm',label:'Who may be harmed?'},{key:'evidence',label:'What claim will I verify with credible sources?'},{key:'open',label:'What is still unknown or undecided?'}],'Save my signature-assignment starter')}</div>`;
 return mast()+flash()+current()+phaseGuide(p)+body+`<p class="quiet">Your responses are saved only when you select Save. Unsaved text is retained on this device.</p>`;
}
function groupStudent(phase){if(!group)return '<div class="card">Loading the team activity…</div>';
 const g=group,person=g.people?.find(x=>x.device===me.id);if(!person)return `<div class="card"><h3>Continue into Group Mode</h3><p>Keep the same nickname; your session ID is preserved.</p><button class="btn" data-action="group-join">Join Group Mode</button></div>`;
 if(!g.state.groupsFormed){const current=g.cases||[],chosen=draft(2).caseIds||[];return `<div class="card"><h3>Case Marketplace</h3><p>Choose up to two cases you're most interested in. The class will form four balanced teams.</p><div class="grid">${current.map(c=>`<div class="card case" data-chosen="${chosen.includes(c.id)}"><span class="stage">${esc(c.field)}</span><h3>${esc(c.title)}</h3><p>${esc(c.question)}</p>${casePanel(c,true)}<button class="btn alt" data-vote="${esc(c.id)}">${chosen.includes(c.id)?'Selected ✓':'Choose case'}</button></div>`).join('')}</div><button class="btn" data-action="vote">Save my case preferences</button></div>`}
 const my=g.groups?.find(x=>x.id===person.groupId);if(!my)return '<div class="card">Your team is being assigned…</div>';
 const prompt=phase===2?'Make a defensible decision for your case.':phase===3?'Challenge another team and strengthen its decision.':'Design a hands-on November 17 high school visit activity.';
 const kind=phase===2?'ethics':phase===3?'critique':'visit';const existing=g.responses?.[kind]?.[person.groupId];const labels=phase===2?[['benefit','What problem does this AI solve?'],['stakeholders','Name at least three affected stakeholders.'],['lens','Which ethics lens matters most, and why?'],['verdict','Decide: Yes, No, or Only if…'],['safeguard','Require one responsible safeguard.']]:phase===3?[['assumption','What assumption should the other group defend?'],['risk','Which stakeholder or risk did they overlook?'],['improvement','What specific safeguard would improve their case?']]:[['activity','What will visitors DO?'],['learning','What should they learn or question?'],['duration','How many minutes will it take?'],['materials','What devices, supplies, or roles are needed?'],['why','Why would this be fun and educational?']];
 const targetId=g.critiqueMap?.[person.groupId],target=g.groups?.find(x=>x.id===targetId),targetResponse=g.responses?.ethics?.[targetId];
 const critiqueContext=phase===3?`<div class="soft"><strong>Review ${esc(target?.zone||'another team')}: ${esc(target?.caseTitle||'')}</strong><p>${esc(target?.caseQuestion||'')}</p><p>${targetResponse?esc(targetResponse.text||Object.values(targetResponse.fields||{}).join(' | ')):'That team has not saved a verdict yet. Ask them to share their decision before critiquing.'}</p></div>`:'';
 return `<div class="card zone" style="--zone:${esc(my.color)}"><span class="stage">${esc(my.zone)} · ${esc(person.role||'TEAM MEMBER')}</span><h2>${esc(my.caseTitle)}</h2><p>${esc(my.caseQuestion)}</p>${casePanel({id:my.caseId,title:my.caseTitle,description:my.caseDescription})}${critiqueContext}<div class="task">${esc(prompt)}</div><p class="statusline">${my.members.length} teammates · one person submits on behalf of the group</p><form id="groupForm" data-group="${kind}">${labels.map(([key,label])=>`<label>${esc(label)}</label><textarea class="field" name="${key}" maxlength="700" placeholder="Discuss, then enter your team's decision…">${esc(draft(phase)[key]??existing?.fields?.[key]??'')}</textarea>`).join('')}<p><button class="btn">Save ${phase===2?'team verdict':phase===3?'team critique':'visit proposal'}</button></p></form>${existing?'<p class="success">A group submission has been saved. You may revise it.</p>':''}</div>`;
}
function instructor(){if(!auth)return mast()+flash()+`<div class="card"><h2>Instructor sign-in</h2><p>${configured?'Enter the instructor PIN to access lesson controls and response exports.':'Open your private instructor access link. A Cloudflare PIN is optional.'}</p>${configured?'<form id="login"><input class="field" type="password" name="pin" placeholder="Instructor PIN" required><p><button class="btn">Unlock controls</button></p></form>':''}</div>`;
 const s=snap,phase=s.state.phase,g=group;return mast()+flash()+`<div class="card"><div class="row"><h2>Lesson control</h2><span class="tag">One controller · all views</span></div><div class="grid">${s.phases.map((p,i)=>`<button class="phase ${i===phase?'active':''}" data-phase="${i}"><strong>${p.start}–${p.end} min</strong><span>${esc(p.title)}</span><small>Slides ${p.slide}</small><span class="count">${i===2||i===3||i===4?'Group Mode':s.counts[i]+' responses'}</span></button>`).join('')}</div><div class="row" style="margin-top:15px"><button class="btn alt" data-phase="${phase-1}" ${phase===0?'disabled':''}>← Previous</button><button class="btn" data-phase="${phase+1}" ${phase===5?'disabled':''}>Next phase →</button><button class="btn alt" id="export">Export all responses (.csv)</button></div></div>${current()}${phaseGuide(phase)}`+
 (phase===2?`<div class="card"><div class="row"><div><h3>Case Marketplace → Teams</h3><p>${g?.totalBallots||0} ballots saved · ${g?.people?.length||0} joined</p></div>${g?.state?.groupsFormed?'<span class="tag">Groups formed ✓</span>':'<button class="btn" id="formGroups">Form four groups</button>'}</div></div>`:'')+
 (phase>=2&&phase<=4?`<div class="card"><h3>Team progress</h3><div class="grid">${ZONES.map(([id,name,color])=>{const z=g?.groups?.find(x=>x.id===id);const kind=phase===2?'ethics':phase===3?'critique':'visit';return `<div class="card zone" style="--zone:${color}"><strong>${name} · ${z?.members?.length||0} students</strong><p>${esc(z?.caseTitle||'Not assigned')}</p><span class="tag">${g?.responses?.[kind]?.[id]?'Submitted ✓':'Working'}</span></div>`}).join('')}</div></div>`:'')+
 `<div class="card"><h3>Readiness and evidence</h3><p><b>${s.groups.joined}</b> joined Group Mode · <b>${s.groups.ballots}</b> case ballots · <b>${s.counts[5]}</b> signature starters saved</p><p class="quiet">Instructor access is protected by a Worker PIN. Avoid sharing this URL or displaying student responses without consent.</p></div>`}
function room(){const s=snap,phase=s.state.phase,g=group;return mast()+flash()+current()+phaseGuide(phase,'room')+`<div class="card room"><h2>${phase===0?'Scan the student QR code and join':phase===1?'Use the 5-question ethics check':phase===2?'Choose → Form teams → Decide':phase===3?'Defend and challenge':phase===4?'Design the high-school visit':'Start your infographic question'}</h2>${phase>=2&&phase<=4?`<div class="grid">${ZONES.map(([id,name,color])=>{const z=g?.groups?.find(x=>x.id===id);const kind=phase===2?'ethics':phase===3?'critique':'visit';return `<div class="card zone" style="--zone:${color}"><h2>${name} Team</h2><p>${esc(z?.caseTitle||'Waiting for case assignment')}</p><p><strong>${z?.members?.length||0}</strong> team members · ${g?.responses?.[kind]?.[id]?'Submitted ✓':'Working'}</p></div>`}).join('')}</div>`:phase===1?'<div class="grid">'+['Fairness','Privacy','Transparency','Ownership','Accountability'].map(x=>`<div class="card"><h2>${x}</h2></div>`).join('')+'</div>':phase===5?'<p>What is your specific AI issue? Who benefits, who may be harmed, and what claim needs evidence?</p>':`<p>Open <strong>classroom.itsbadlabs.com/ethics-lab</strong> on your phone.</p>`}<p class="statusline">${phase>=2&&phase<=4?(g?.people?.length||0)+' joined':'Responses received: '+s.counts[phase]}</p></div>`}
function render(force=false){if(!snap)return;const signature=VIEW+'|'+snap.state.phase+'|'+(group?.state?.phase||'')+'|'+(group?.state?.groupsFormed?'formed':'waiting')+'|'+auth+'|'+me.name;
 if(!force&&signature===lastKey&&VIEW==='student'){return;}if(VIEW==='student')remember();lastKey=signature;renderedPhase=snap.state.phase;app.className='wrap '+VIEW;app.innerHTML=VIEW==='instructor'?instructor():VIEW==='room'?room():student();bind();}
async function refresh(){try{const next=await api('snapshot');snap=next;if(VIEW==='instructor'){let a=await api('auth');auth=a.authorized;configured=a.configured;}if(snap.state.phase>=2&&snap.state.phase<=4){group=await api('snapshot','GET',null,GM);if(VIEW==='student'&&me.name&&!group.people?.some(p=>p.device===me.id)){await api('join','POST',{device:me.id,name:me.name},GM);group=await api('snapshot','GET',null,GM)}}error='';render();}catch(e){error=e.message;if(snap)render(true);else app.innerHTML='<div class="card error">Unable to connect. Check the classroom URL and try refreshing.</div>'}}
async function change(phase){if(!Number.isInteger(phase)||phase<0||phase>5)return;try{await api('advance','POST',{phase});notice='All views moved to the new phase.';await refresh();render(true)}catch(e){error=e.message;render(true)}}
async function groupAction(path,payload){try{await api(path,'POST',payload,GM);notice='Your Group Mode response was saved.';await refresh();render(true)}catch(e){error=e.message;render(true)}}
function bind(){const j=document.getElementById('joinForm');if(j)j.onsubmit=e=>{e.preventDefault();me.name=new FormData(j).get('name').trim().slice(0,50);save();notice='Welcome! You are connected.';render(true)};
 const login=document.getElementById('login');if(login)login.onsubmit=async e=>{e.preventDefault();try{await api('login','POST',{pin:new FormData(login).get('pin')});notice='Instructor access unlocked.';await refresh();render(true)}catch(err){error=err.message;render(true)}};
 const f=document.getElementById('responseForm');if(f){f.oninput=remember;f.onsubmit=async e=>{e.preventDefault();remember();const fields=Object.fromEntries(new FormData(f));try{await api('respond','POST',{phase:snap.state.phase,device:me.id,name:me.name,fields});notice='Saved! Your response was received.';localStorage.removeItem(draftKey(snap.state.phase));mySaved={response:{fields}};render(true)}catch(err){error=err.message;render(true)}}}
 document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>change(Number(b.dataset.phase)));
 document.getElementById('formGroups')?.addEventListener('click',async()=>{try{await api('form-groups','POST',{});notice='Four teams formed and ethics activity opened.';await refresh();render(true)}catch(err){error=err.message;render(true)}});
 document.getElementById('export')?.addEventListener('click',async()=>{try{const r=await fetch(API+'export',{credentials:'same-origin',headers:adminHeaders()});if(!r.ok)throw Error((await r.json()).error||'Export failed');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='inf125-nov10-combined.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){error=e.message;render(true)}});
 document.querySelector('[data-action="group-join"]')?.addEventListener('click',()=>groupAction('join',{device:me.id,name:me.name}));
 document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{const current=draft(2);let list=current.caseIds||[];list=list.includes(b.dataset.vote)?list.filter(x=>x!==b.dataset.vote):[...list,b.dataset.vote].slice(-2);localStorage.setItem(draftKey(2),JSON.stringify({...current,caseIds:list}));render(true)});
 document.querySelector('[data-action="vote"]')?.addEventListener('click',()=>groupAction('vote',{device:me.id,caseIds:draft(2).caseIds||[]}));
 const gf=document.getElementById('groupForm');if(gf){gf.oninput=()=>{const obj=Object.fromEntries(new FormData(gf));localStorage.setItem(draftKey(snap.state.phase),JSON.stringify(obj))};gf.onsubmit=e=>{e.preventDefault();const fields=Object.fromEntries(new FormData(gf));gf.oninput?.();groupAction('response',{device:me.id,phase:gf.dataset.group,fields,text:Object.values(fields).join(' | ')})}}
}
(async()=>{await refresh();setInterval(()=>{if(!document.hidden&&!busy){busy=true;refresh().finally(()=>busy=false)}},4000);})();
</script></body></html>
