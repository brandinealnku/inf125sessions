<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12223a"><title>INF 125 — AI Ethics Experience Lab</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172640;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.wrap{max-width:1200px;margin:auto;padding:18px}.mast{background:#14243e;color:white;border-radius:19px;padding:24px;margin-bottom:16px}.mast h1{font-size:clamp(27px,5vw,46px);margin:10px 0}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#a8c7ff}.muted{color:#687892}.mast .muted{color:#c7d5ea}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dce3ee;border-radius:16px;padding:19px;margin:12px 0;box-shadow:0 4px 18px #17243e09}.card h2,.card h3{margin:5px 0 12px}.tag{font-size:12px;border-radius:100px;background:#e6eefc;color:#213d6d;padding:7px 12px;font-weight:800}.warn{background:#fff3d4;border:1px solid #f1cb7c;border-radius:10px;padding:13px}.error{color:#b12544}.success{color:#087b56}.btn{border:0;background:#235cbd;color:white;border-radius:11px;padding:13px 17px;font-weight:800}.btn.alt{background:#e9eef6;color:#1b314f}.btn.danger{background:#a92a45}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #86b1ff;outline-offset:2px}.field{display:block;width:100%;border:1px solid #b9c5d7;border-radius:10px;padding:13px;margin-top:8px;color:#15243e;background:white}textarea.field{min-height:110px;resize:vertical}label{display:block;margin:12px 0 5px;font-weight:650}label.option{padding:13px;border:1px solid #d0d8e5;border-radius:12px;cursor:pointer;font-weight:500}.option input{margin-right:10px}.phase{border:1px solid #cfdaeb;background:white;border-radius:12px;padding:12px;text-align:left;width:100%;min-height:99px}.phase.active{border:2px solid #235cbd;background:#eaf2ff}.phase strong{display:block}.phase small{display:block;margin:6px 0;color:#566984}.count{font-weight:850;font-size:22px}.task{background:#ebf2ff;border-left:5px solid #3271cf;padding:16px;border-radius:11px;margin:12px 0}.case{border-top:5px solid #b5c5e3}.case strong{display:block}.case button{margin-top:8px}.case[data-chosen="true"]{background:#edf5ff;border-color:#235cbd}.zone{border-top:6px solid var(--zone)}.zone h3{margin-top:0}.statusline{font-size:13px;color:#50627c}.soft{background:#f6f8fb;border-radius:12px;padding:13px}.sticky{position:sticky;top:0;background:#f4f6faed;backdrop-filter:blur(8px);padding:8px 0;z-index:2}.progress{height:9px;background:#e2eaf6;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:#2766ca}.small{font-size:13px}.quiet{font-size:13px;color:#687892}.nudge{font-size:14px;color:#405b7e}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.number{font-size:30px;font-weight:800}.banner{border-radius:14px;padding:13px;background:#edf8f3;color:#08694a}.stage{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#3e62a2}.room{max-width:1400px}.room .task{font-size:clamp(20px,3vw,31px);line-height:1.35}.room .card{padding:25px}.room .mast h1{font-size:clamp(38px,5vw,64px)}@media(max-width:650px){.wrap{padding:10px}.mast{padding:18px}.pair{grid-template-columns:1fr}.card{padding:15px}.room .card{padding:16px}}
