<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INF 125 · Ethics Lab</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#142035;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:18px}.hero{background:#17253e;color:#fff;border-radius:20px;padding:24px;margin-bottom:16px}.hero p{color:#d9e3f6}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:#7eabff;font-weight:800}.card{background:#fff;border:1px solid #dee4ec;border-radius:17px;padding:19px;margin:12px 0;box-shadow:0 5px 18px #17253e0b}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tag{background:#e7eefc;border-radius:100px;padding:6px 12px;font-size:12px;font-weight:750}.btn{border:0;background:#255ec4;color:white;padding:12px 16px;border-radius:11px;font-weight:800;cursor:pointer}.btn.alt{background:#e9eef5;color:#1b2c48}.btn:disabled{opacity:.5}input,textarea{font:inherit;width:100%;padding:13px;border:1px solid #bac5d4;border-radius:10px;margin:8px 0}textarea{min-height:105px}label{display:block;margin:9px 0;line-height:1.4}label input[type=radio]{width:auto;margin:0 9px 0 0}.big{font-size:clamp(28px,4.5vw,50px);line-height:1.12;margin:10px 0}.muted{color:#62718b}.panel{border-left:5px solid #3978d7;background:#eef4ff;padding:14px;border-radius:8px}.embed{width:100%;height:75vh;min-height:550px;border:1px solid #c8d3e2;border-radius:14px;background:white}.small{font-size:13px}.error{color:#ae183a}.success{color:#0c8056}.phase{padding:10px;border:1px solid #dce2eb;border-radius:11px;cursor:pointer;background:#fff;text-align:left}.phase.active{border:2px solid #2866c8;background:#eef4ff}.phase strong{display:block}.stats{font-size:20px;font-weight:800}.hide{display:none}@media(max-width:600px){.wrap{padding:10px}.hero{padding:18px}.embed{min-height:600px}}
</style></head><body><main class="wrap"><div class="hero"><div class="row"><span class="kicker">INF 125 · Dr. Brandi Neal</span><span id="connection" class="tag">Connecting…</span></div><h1 class="big">From Learning to Responsibility</h1><p>Explore → Question → Judge → Apply · November 10, 2026 · 75 minutes</p></div><div id="root"></div></main>
<script>
const paths=location.pathname.split('/').filter(Boolean),view=paths.includes('instructor')?'instructor':paths.includes('room')?'room':'student',session='inf125-nov10-ethics',API='/api/session/'+session+'/ethics-lab/',groupURL=(v)=>'/groups'+(v==='student'?'':'/'+v)+'?session='+session;
const key='nov10-ethics-user',saved=JSON.parse(localStorage.getItem(key)||'null')||{},me={device:saved.device||(crypto.randomUUID?.()||String(Date.now())),name:saved.name||''};let snap=null,flash='',lastPhase=-1,framePhase=-1;const root=document.getElementById('root');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function save(){localStorage.setItem(key,JSON.stringify(me))}
async function request(endpoint,options={}){const r=await fetch(API+endpoint,{cache:'no-store',headers:{'content-type':'application/json'},...options});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
function rowTitle(p){return `<div class="row"><h2>${esc(p.title)}</h2><span class="tag">${p.start}–${p.end} min · Slide ${p.slide}+</span></div>`}
function info(s){return `<div class="card"><div class="row"><strong>Current activity</strong><span class="tag">${s.state.phase+1} / 6</span></div>${rowTitle(s.phases[s.state.phase])}<p>${esc(s.phases[s.state.phase].question)}</p></div>`}
function embed(v){return `<div class="card"><div class="row"><strong>Group Mode · live collaboration</strong><a href="${groupURL(v)}" target="_blank" rel="noopener">Open Group Mode in a separate tab</a></div><iframe class="embed" title="INF 125 live Group Mode" src="${groupURL(v)}"></iframe></div>`}
function student(s){const n=s.state.phase,p=s.phases[n];if(!me.name)return `<div class="card"><h2>Join today's session</h2><p>Use a first name or nickname. Please don't enter private information.</p><form id="join"><input id="joinname" maxlength="60" placeholder="First name or nickname" required><button class="btn">Join the class</button></form></div>`;
 if(n>=2&&n<=4)return `${info(s)}${embed('student')}`;
 if(n===0)return `${info(s)}<div class="card"><h3>${esc(p.question)}</h3><form id="answer">${p.options.map((o,i)=>`<label><input type="radio" name="answer" value="${esc(o)}" ${i===0?'required':''}>${esc(o)}</label>`).join('')}<button class="btn">Submit opinion</button></form></div>`;
 if(n===1)return `${info(s)}<div class="card"><p>Use the five lenses: fairness, privacy, transparency, ownership, and accountability. Explain one tradeoff.</p><form id="answer"><textarea name="answer" required maxlength="1600" placeholder="My response..." aria-label="Your reflection"></textarea><button class="btn">Submit reflection</button></form></div>`;
 return `${info(s)}<div class="card"><h3>Gen Ed: AI Implications Infographic</h3><p>Choose a specific AI issue. Identify a stakeholder who may benefit, one who may be harmed, and something that needs credible evidence. The assignment requires two credible non-AI sources and transparent documentation of any AI assistance.</p><form id="answer"><textarea name="answer" required maxlength="1600" placeholder="My topic… My researchable question… Who benefits or may be harmed… What evidence do I need?" aria-label="Signature assignment starter"></textarea><button class="btn">Save exit ticket</button></form><p class="small muted">You are beginning the assignment, not completing the infographic today.</p></div>`}
function instructor(s){let n=s.state.phase;return `<div class="card"><h2>Instructor · session control</h2><p>Use the phase buttons to move the entire class. All three views check the same live session state.</p><div class="grid">${s.phases.map((p,i)=>`<button class="phase ${n===i?'active':''}" data-phase="${i}"><strong>${p.start}–${p.end} min</strong>${esc(p.title)}<div class="small muted">Slide ${p.slide}+</div><div class="stats">${s.counts[i]} responses</div></button>`).join('')}</div><div class="row" style="margin-top:15px"><button class="btn alt" id="prev" ${n===0?'disabled':''}>← Previous</button><button class="btn" id="next" ${n===5?'disabled':''}>Next phase →</button><a class="btn alt" href="${API}export" download>Export slide responses</a></div><p class="small muted">For Group Mode submissions and formation controls, use the embedded instructor panel below. Group Mode data is stored separately.</p></div>${info(s)}${n>=2&&n<=4?embed('instructor'):`<div class="card"><h3>Submissions · ${s.responses.length}</h3>${s.responses.slice(-12).map(r=>`<p class="panel"><b>${esc(r.name)}:</b> ${esc(r.answer)}</p>`).join('')||'<p class="muted">No responses yet.</p>'}</div>`}`}
function room(s){const n=s.state.phase;if(n>=2&&n<=4)return `${info(s)}${embed('room')}`;return `${info(s)}<div class="card"><h2>${n===0?'What do you think?':n===1?'The Five-Question Ethics Check':'Start your infographic question'}</h2><div class="grid">${(n===0?['Very confident','Somewhat confident','Not yet confident']:n===1?['Fairness','Privacy','Transparency','Ownership','Accountability']:['AI issue','Stakeholders','Benefits & risks','Evidence','Responsible choices']).map(x=>`<div class="panel">${esc(x)}</div>`).join('')}</div><p class="muted">Responses received: ${s.counts[n]}. Responses are not displayed publicly.</p></div>`}
function bind(){const f=document.querySelector('#join');if(f)f.onsubmit=e=>{e.preventDefault();me.name=document.getElementById('joinname').value.trim().slice(0,60);save();render()};const answer=document.querySelector('#answer');if(answer)answer.onsubmit=async e=>{e.preventDefault();try{const fd=new FormData(answer);await request('respond',{method:'POST',body:JSON.stringify({device:me.device,name:me.name,phase:snap.state.phase,answer:fd.get('answer')})});flash='Saved! Your answer was received.';await load()}catch(err){flash=err.message;render()}};document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>advance(+b.dataset.phase));const prev=document.querySelector('#prev'),next=document.querySelector('#next');if(prev)prev.onclick=()=>advance(snap.state.phase-1);if(next)next.onclick=()=>advance(snap.state.phase+1)}
async function advance(phase){try{await request('advance',{method:'POST',body:JSON.stringify({phase})});flash='Phase updated for the room.';await load()}catch(err){flash=err.message;render()}}
function render(){if(!snap)return;document.getElementById('connection').textContent='LIVE SESSION';const phase=snap.state.phase;const current=document.querySelector('iframe');const newEmbed=phase>=2&&phase<=4;
 if(lastPhase===phase && document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
 // Preserve the group iframe across routine polls to avoid losing in-progress student work.
 if(newEmbed&&current&&framePhase===phase&&lastPhase===phase){const header=root.querySelector('[data-instruction]');if(header)header.innerHTML=info(snap);return;}
 root.innerHTML=(flash?`<div class="card ${flash.startsWith('Saved')?'success':'error'}" role="status">${esc(flash)}</div>`:'')+`<div data-instruction>${view==='student'?'':info(snap)}</div>`+(view==='student'?student(snap):view==='room'?room(snap):instructor(snap));lastPhase=phase;framePhase=newEmbed?phase:-1;bind()}
async function load(){try{snap=await request('snapshot');render()}catch(err){document.getElementById('connection').textContent='RECONNECTING';if(!snap)root.innerHTML='<div class="card error">Unable to connect. Refresh when the network is available.</div>'}}
load();setInterval(load,3500);
</script></body></html>
