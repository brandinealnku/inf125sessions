<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowRunner Builder · V0.10.3</title><link rel="stylesheet" href="/shared-v08.css"><style>:root{--bg:#0a0a09;--panel:#121210;--ink:#f4f0e7;--muted:#a7a197;--line:#302e29;--gold:#d8aa3d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.rail{padding:22px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}.main{padding:26px 30px 100px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:900}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}.btn{border:1px solid #4a463d;background:transparent;color:var(--ink);padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer}.btn.primary{background:var(--ink);color:#111}.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}.sessions{display:grid;gap:8px;margin-top:14px}.session{padding:11px;border:1px solid transparent;border-radius:12px;color:var(--muted);cursor:pointer}.session.active,.session:hover{border-color:var(--line);background:var(--panel);color:var(--ink)}.session strong{display:block}.header{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px}.header h1{font:500 clamp(38px,5vw,66px)/.95 Georgia,serif;margin:5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.meta,.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta{grid-template-columns:2fr 1fr 1fr;margin:18px 0}.field label{display:block;color:var(--gold);font-size:12px;font-weight:900;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;background:#0d0d0b;border:1px solid #3b3832;color:var(--ink);border-radius:10px;padding:11px 12px}.field textarea{min-height:84px;resize:vertical}.wide{grid-column:1/-1}.studio{display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px}.story{border-right:1px solid var(--line);padding-right:18px}.moment{padding:12px;border:1px solid transparent;border-radius:12px;margin:8px 0;cursor:pointer}.moment.active,.moment:hover{background:var(--panel);border-color:var(--line)}.moment small{color:var(--gold);font-weight:900}.moment strong{display:block;font:500 18px Georgia,serif;margin:5px 0}.section{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;margin-top:7px}.section h3{font:500 27px Georgia,serif;margin:0 0 4px}.sceneGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.scene{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px;border-radius:10px;text-align:left;cursor:pointer}.scene.active{border-color:var(--gold);background:#1b1811}.scene b{display:block}.scene span{font-size:11px;color:var(--muted)}.preview{grid-column:1/-1;background:#070706;border:1px solid var(--line);border-radius:18px;min-height:260px;padding:24px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}.preview h2{font:500 clamp(36px,5vw,70px)/.95 Georgia,serif;margin:6px 0;max-width:900px}.preview p{font-size:20px;color:#d8d3c8;max-width:760px}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38}.preview>div{position:relative;z-index:2}.runbook{background:#10100e;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.runbook h3{font:500 30px Georgia,serif;margin:0 0 6px}.runbook .grid{margin-top:14px}.status{position:fixed;right:20px;bottom:20px;background:#171612;border:1px solid var(--line);padding:10px 14px;border-radius:10px;display:none}.status.show{display:block}@media(max-width:1100px){.sceneGrid{grid-template-columns:repeat(3,1fr)}.studio{grid-template-columns:1fr}.story{border-right:0;border-bottom:1px solid var(--line);padding:0 0 16px}}@media(max-width:760px){.shell{grid-template-columns:1fr}.rail{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px 14px 90px}.header{display:block}.actions{margin-top:12px}.meta,.grid{grid-template-columns:1fr}.wide,.section{grid-column:auto}.sceneGrid{grid-template-columns:1fr 1fr}}</style></head><body><div class="shell"><aside class="rail"><div class="eyebrow">ShowRunner · V0.10.3</div><h2>Direct the room.</h2><p class="muted">Build visual beats and the words that carry them.</p><button class="btn primary" id="newBtn">+ New experience</button><div class="eyebrow" style="margin-top:24px">Experiences</div><div id="sessions" class="sessions"></div></aside><main class="main"><div id="empty"><h1>Choose or create an experience.</h1></div><div id="work" hidden><header class="header"><div><div class="eyebrow">Teaching experience</div><h1 id="heading"></h1><div id="summary" class="muted"></div></div><div class="actions"><a class="btn" id="rehearse" target="_blank">Room preview</a><a class="btn" id="teach" target="_blank">Teach →</a><button class="btn gold" id="save">Save</button></div></header><section class="meta"><div class="field"><label>Experience title</label><input id="title"></div><div class="field"><label>Course / context</label><input id="course"></div><div class="field"><label>Minutes</label><input id="minutes" type="number"></div><div class="field wide"><label>What should change in the room?</label><textarea id="description"></textarea></div></section><div class="studio"><aside class="story"><div class="actions" style="justify-content:space-between"><div><div class="eyebrow">The arc</div><span class="muted">Visual beat + teaching beat</span></div><button class="btn" id="add">+ Moment</button></div><div id="moments"></div></aside><section id="editor"></section></div></div></main></div><div class="status" id="status"></div><script>const E=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let lib=[],s=null,idx=0;const scenes={hook:['HOOK','Create curiosity'],compare:['COMPARE','Put two ideas in tension'],evidence:['EVIDENCE','Show what matters'],sequence:['SEQUENCE','Build an idea step by step'],quote:['QUOTE','Let one line carry the room'],profile:['PROFILE','Make a person or case concrete'],data:['DATA','Lead with a number'],reveal:['REVEAL','Expose hidden information'],shift:['SHIFT','Show movement in thinking'],takeaway:['TAKEAWAY','Land the lesson']};const rb=()=>({openWith:'',whyMatters:'',ask:'',pause:'',listenFor:'',ifTheySay:'',ifQuiet:'',pushFurther:'',revealWhen:'',sayDuringReveal:'',landHere:'',transition:'',watchFor:'',advanceWhen:''});const blank=n=>({label:'MOMENT '+n,title:'Untitled moment',lead:'',minutes:5,type:'teaching',key:'moment_'+n,choices:[],multi:false,studentTask:'',roomInstruction:'',visualScene:'hook',visualType:'statement',visualAccent:'',visualCaption:'',mediaUrl:'',mediaFit:'cover',mediaOverlay:'',mediaReveal:'immediate',focalX:50,focalY:50,runbook:rb()});function toast(t){E('status').textContent=t;E('status').classList.add('show');setTimeout(()=>E('status').classList.remove('show'),1800)}async function api(p,o={}){let r=await fetch('/api/builder'+p,{headers:{'content-type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){lib=(await api('/sessions')).sessions||[];renderLib()}function renderLib(){E('sessions').innerHTML=lib.map(x=>`<div class="session ${s?.id===x.id?'active':''}" data-id="${esc(x.id)}"><strong>${esc(x.title)}</strong><span>${x.stepCount} moments · ${x.durationMinutes} min</span></div>`).join('');E('sessions').querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>open(x.dataset.id))}async function open(id){s=await api('/session/'+encodeURIComponent(id));s.steps.forEach(x=>{x.runbook={...rb(),...(x.runbook||{})};x.visualScene=x.visualScene||sceneFrom(x)});idx=0;render()}function sceneFrom(m){if(m.visualType==='shift')return'shift';if(m.visualType==='live-results')return'data';return m.mediaUrl?'evidence':'hook'}function syncMeta(){s.title=E('title').value||'Untitled experience';s.course=E('course').value;s.durationMinutes=+E('minutes').value||75;s.description=E('description').value;E('heading').textContent=s.title}function render(){E('empty').hidden=!!s;E('work').hidden=!s;if(!s)return;E('heading').textContent=s.title;E('summary').textContent=`${s.steps.length} moments · ${s.durationMinutes} minutes`;E('title').value=s.title||'';E('course').value=s.course||'';E('minutes').value=s.durationMinutes||75;E('description').value=s.description||'';E('teach').href='/instructor?session='+encodeURIComponent(s.id);E('rehearse').href='/room?session='+encodeURIComponent(s.id);renderMoments();renderEditor();renderLib()}function syncMeta(){s.title=E('title').value||'Untitled experience';s.course=E('course').value;s.durationMinutes=+E('minutes').value||75;s.description=E('description').value;E('heading').textContent=s.title}function renderMoments(){let t=0;E('moments').innerHTML=s.steps.map((m,i)=>{let a=t;t+=+m.minutes||0;return`<div class="moment ${i===idx?'active':''}" data-i="${i}"><small>${esc((m.visualScene||'hook').toUpperCase())} · ${a}–${t} MIN</small><strong>${esc(m.title)}</strong><span class="muted">${esc(m.label)}</span></div>`}).join('');E('moments').querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{idx=+x.dataset.i;renderMoments();renderEditor()})}function f(k,label,val='',wide=false,area=false){return`<div class="field ${wide?'wide':''}"><label>${label}</label>${area?`<textarea data-k="${k}">${esc(val)}</textarea>`:`<input data-k="${k}" value="${esc(val)}">`}</div>`}function renderEditor(){let m=s.steps[idx];if(!m)return E('editor').innerHTML='';m.runbook={...rb(),...(m.runbook||{})};E('editor').innerHTML=`<div class="eyebrow">Moment ${idx+1}</div><div class="grid">${f('title','What should the room focus on?',m.title,true)}${f('lead','Context / setup',m.lead,true,true)}${f('studentTask','What students do',m.studentTask,true,true)}${f('minutes','Minutes',m.minutes)}${f('label','Moment label',m.label)}<div class="section"><h3>Visual beat</h3><p class="muted">Choose what the visual is meant to do, not a layout.</p><div class="sceneGrid">${Object.entries(scenes).map(([k,v])=>`<button class="scene ${m.visualScene===k?'active':''}" data-scene="${k}"><b>${v[0]}</b><span>${v[1]}</span></button>`).join('')}</div></div>${f('visualAccent','Visual accent / big number / quote',m.visualAccent,true)}${f('visualCaption','Supporting caption',m.visualCaption,true,true)}${f('mediaUrl','Image / GIF / video URL',m.mediaUrl,true)}${f('mediaOverlay','Overlay headline',m.mediaOverlay,true)}<div class="field"><label>Image focal X (0–100)</label><input data-k="focalX" type="number" min="0" max="100" value="${m.focalX??50}"></div><div class="field"><label>Image focal Y (0–100)</label><input data-k="focalY" type="number" min="0" max="100" value="${m.focalY??50}"></div><div class="preview">${m.mediaUrl?`<img src="${esc(m.mediaUrl)}" style="object-position:${m.focalX??50}% ${m.focalY??50}%">`:''}<div><div class="eyebrow">${esc((m.visualScene||'hook').toUpperCase())}</div><h2>${esc(m.mediaOverlay||m.title)}</h2><p>${esc(m.visualAccent||m.visualCaption||m.lead)}</p></div></div></div><div class="runbook"><div class="eyebrow">Instructor runbook</div><h3>What do you say and do?</h3><div class="grid">${f('rb.openWith','Open with',m.runbook.openWith,true,true)}${f('rb.whyMatters','Why this matters',m.runbook.whyMatters,true,true)}${f('rb.ask','Ask',m.runbook.ask,true,true)}${f('rb.pause','Pause / wait instruction',m.runbook.pause)}${f('rb.listenFor','Listen for',m.runbook.listenFor,true,true)}${f('rb.ifTheySay','If they say…',m.runbook.ifTheySay,true,true)}${f('rb.ifQuiet','If the room is quiet…',m.runbook.ifQuiet,true,true)}${f('rb.pushFurther','Push further',m.runbook.pushFurther,true,true)}${f('rb.revealWhen','Reveal when…',m.runbook.revealWhen,true,true)}${f('rb.sayDuringReveal','Say during reveal',m.runbook.sayDuringReveal,true,true)}${f('rb.landHere','Land here',m.runbook.landHere,true,true)}${f('rb.transition','Bridge to next',m.runbook.transition,true,true)}</div></div>`;E('editor').querySelectorAll('[data-k]').forEach(x=>x.oninput=()=>{let k=x.dataset.k,v=x.type==='number'?+x.value:x.value;if(k.startsWith('rb.'))m.runbook[k.slice(3)]=v;else m[k]=v;renderMoments()});E('editor').querySelectorAll('[data-scene]').forEach(x=>x.onclick=()=>{m.visualScene=x.dataset.scene;m.visualType=x.dataset.scene==='shift'?'shift':x.dataset.scene==='data'?'live-results':'statement';renderEditor();renderMoments()})}['title','course','minutes','description'].forEach(id=>E(id).addEventListener('input',syncMeta));E('save').onclick=async()=>{syncMeta();let r=await api('/session',{method:'POST',body:JSON.stringify(s)});s=r.session;toast('Saved');await load();render()};E('add').onclick=()=>{s.steps.push(blank(s.steps.length+1));idx=s.steps.length-1;render()};E('newBtn').onclick=async()=>{let id='experience-'+Date.now().toString(36),n={id,title:'New experience',course:'',description:'',durationMinutes:30,version:'0.10.3',steps:[blank(1)]};await api('/session',{method:'POST',body:JSON.stringify(n)});await load();open(id)};load().catch(()=>toast('Builder could not load'));</script></body></html>
