<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowRunner Builder · V0.10.3</title><link rel="stylesheet" href="/shared-v08.css"><style>:root{--bg:#0a0a09;--panel:#121210;--ink:#f4f0e7;--muted:#a7a197;--line:#302e29;--gold:#d8aa3d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.rail{padding:22px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}.main{padding:26px 30px 100px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:900}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}.btn{border:1px solid #4a463d;background:transparent;color:var(--ink);padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:var(--ink);color:#111}.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}.btn.danger{color:#e5a3a3}.sessions{display:grid;gap:8px;margin-top:14px}.session{padding:11px;border:1px solid transparent;border-radius:12px;color:var(--muted);cursor:pointer}.session.active,.session:hover{border-color:var(--line);background:var(--panel);color:var(--ink)}.session strong{display:block}.header{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px}.header h1{font:500 clamp(38px,5vw,66px)/.95 Georgia,serif;margin:5px 0}.actions,.modebar,.tools{display:flex;gap:8px;flex-wrap:wrap}.modebar{margin:18px 0}.mode{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 15px;border-radius:999px;font-weight:900;cursor:pointer}.mode.active{background:var(--ink);color:#111}.meta,.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta{grid-template-columns:2fr 1fr 1fr;margin:18px 0}.field label{display:block;color:var(--gold);font-size:12px;font-weight:900;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;background:#0d0d0b;border:1px solid #3b3832;color:var(--ink);border-radius:10px;padding:11px 12px}.field textarea{min-height:84px;resize:vertical}.wide{grid-column:1/-1}.studio{display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px}.story{border-right:1px solid var(--line);padding-right:18px}.moment{padding:12px;border:1px solid transparent;border-radius:12px;margin:8px 0;cursor:pointer}.moment.active,.moment:hover{background:var(--panel);border-color:var(--line)}.moment small{color:var(--gold);font-weight:900}.moment strong{display:block;font:500 18px Georgia,serif;margin:5px 0}.tiny{border:0;border-radius:7px;background:#24221e;color:#ccc5b8;padding:6px 8px;cursor:pointer}.section{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;margin-top:7px}.section h3{font:500 27px Georgia,serif;margin:0 0 4px}.intentGrid,.sceneGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.sceneGrid{grid-template-columns:repeat(5,1fr)}.intent,.scene{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px;border-radius:10px;text-align:left;cursor:pointer}.intent.active,.scene.active{border-color:var(--gold);background:#1b1811}.intent b,.scene b{display:block}.intent span,.scene span{font-size:11px;color:var(--muted)}.preview{grid-column:1/-1;background:#070706;border:1px solid var(--line);border-radius:18px;min-height:260px;padding:24px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}.preview h2{font:500 clamp(36px,5vw,70px)/.95 Georgia,serif;margin:6px 0}.preview p{font-size:20px;color:#d8d3c8}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38}.preview>div{position:relative;z-index:2}.runbook{background:#10100e;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.runbook h3{font:500 30px Georgia,serif;margin:0}.rehearse{display:none}.rehearse.on{display:block}.studio.hide{display:none}.stageGrid{display:grid;grid-template-columns:.75fr 1.35fr 1fr;gap:12px}.stage{border:1px solid var(--line);background:var(--panel);border-radius:16px;min-height:430px;padding:18px}.stage.room{background:#050505}.phone{max-width:260px;margin:20px auto;border:1px solid #3a3730;border-radius:28px;padding:22px 14px;min-height:300px}.roomHero{font:500 clamp(34px,4vw,64px)/1 Georgia,serif;margin-top:70px}.cue{border-left:2px solid var(--gold);padding-left:12px;margin:16px 0}.rehearseControls{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.pulse{height:2px;background:#24221e;position:relative;margin:15px 0}.pulse i{display:block;height:2px;background:var(--gold)}.status{position:fixed;right:20px;bottom:20px;background:#171612;border:1px solid var(--line);padding:10px 14px;border-radius:10px;display:none}.status.show{display:block}@media(max-width:1100px){.sceneGrid{grid-template-columns:repeat(3,1fr)}.studio{grid-template-columns:1fr}.story{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.rail{position:relative;height:auto}.main{padding:18px 14px 90px}.meta,.grid,.intentGrid,.stageGrid{grid-template-columns:1fr}.wide,.section{grid-column:auto}.sceneGrid{grid-template-columns:1fr 1fr}}</style></head><body><div class="shell"><aside class="rail"><div class="eyebrow">ShowRunner · V0.10.3</div><h2>Direct the room.</h2><p class="muted">Build the arc, stage the visual beats, rehearse, then teach.</p><button class="btn primary" id="newBtn">+ New experience</button><div class="eyebrow" style="margin-top:24px">Experiences</div><div id="sessions" class="sessions"></div></aside><main class="main"><div id="empty"><h1>Choose or create an experience.</h1></div><div id="work" hidden><header class="header"><div><div class="eyebrow">Teaching experience</div><h1 id="heading"></h1><div id="summary" class="muted"></div></div><div class="actions"><button class="btn" id="dupSession">Duplicate</button><button class="btn danger" id="delSession">Delete</button><button class="btn gold" id="save">Save</button></div></header><div class="modebar"><button class="mode active" data-mode="edit">EDIT</button><button class="mode" data-mode="rehearse">REHEARSE</button><a class="btn" id="teach" target="_blank">TEACH →</a></div><section class="meta"><div class="field"><label>Experience title</label><input id="title"></div><div class="field"><label>Course / context</label><input id="course"></div><div class="field"><label>Minutes</label><input id="minutes" type="number"></div><div class="field wide"><label>What should change in the room?</label><textarea id="description"></textarea></div></section><div id="studio" class="studio"><aside class="story"><div class="actions" style="justify-content:space-between"><div><div class="eyebrow">The arc</div><span class="muted">Visual beat + teaching beat</span></div><button class="btn" id="add">+ Moment</button></div><div id="moments"></div></aside><section id="editor"></section></div><section id="rehearse" class="rehearse"><div class="rehearseControls"><div><div class="eyebrow">Rehearsal mode</div><strong id="rehearseLabel"></strong></div><div class="actions"><button class="btn" id="prevR">← Previous</button><button class="btn primary" id="nextR">Next →</button></div></div><div class="pulse"><i id="pulseFill"></i></div><div class="stageGrid"><div class="stage"><div class="eyebrow">Student</div><div class="phone" id="studentStage"></div></div><div class="stage room"><div class="eyebrow">Room</div><div id="roomStage"></div></div><div class="stage"><div class="eyebrow">Showrunner</div><div id="directorStage"></div></div></div></section></div></main></div><div class="status" id="status"></div><script>const E=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let lib=[],s=null,idx=0,mode='edit';const intents={teach:['TEACH','Explain or model','teaching'],ask:['ASK','Surface what the room thinks','vote'],choose:['CHOOSE','Commit to a choice','choice'],discuss:['DISCUSS','Turn attention to one another','discussion'],evidence:['EVIDENCE','Notice something important','teaching'],challenge:['CHALLENGE','Complicate a belief','choice'],shift:['SHIFT','See whether thinking changed','vote'],reflect:['REFLECT','Make meaning','reflection'],create:['CREATE','Make or apply','prompt']};const scenes={hook:['HOOK','Create curiosity'],compare:['COMPARE','Put ideas in tension'],evidence:['EVIDENCE','Show what matters'],sequence:['SEQUENCE','Build step by step'],quote:['QUOTE','Let one line carry'],profile:['PROFILE','Make a case concrete'],data:['DATA','Lead with a number'],reveal:['REVEAL','Expose hidden information'],shift:['SHIFT','Show movement'],takeaway:['TAKEAWAY','Land the lesson']};const rb=()=>({say:'',studentDoes:'',askNext:'',watchFor:'',ifStuck:'',advanceWhen:'',openWith:'',whyMatters:'',ask:'',pause:'',listenFor:'',ifTheySay:'',ifQuiet:'',pushFurther:'',revealWhen:'',sayDuringReveal:'',landHere:'',transition:''});const blank=(n=1,intent='teach')=>({label:intents[intent][0],title:'Untitled moment',lead:'',minutes:5,type:intents[intent][2],key:'moment_'+n,choices:[],multi:false,studentTask:'',roomInstruction:'',intent,visualScene:'hook',visualType:'statement',visualAccent:'',visualCaption:'',mediaUrl:'',mediaFit:'cover',mediaOverlay:'',mediaReveal:'immediate',focalX:50,focalY:50,runbook:rb()});function toast(t){E('status').textContent=t;E('status').classList.add('show');setTimeout(()=>E('status').classList.remove('show'),1800)}async function api(p,o={}){let r=await fetch('/api/builder'+p,{headers:{'content-type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}function hydrate(m){m.runbook={...rb(),...(m.runbook||{})};if(!m.intent)m.intent=m.type==='discussion'?'discuss':m.type==='reflection'?'reflect':m.type==='vote'?'ask':m.type==='choice'||m.type==='multi-select'?'choose':'teach';m.visualScene=m.visualScene||(m.visualType==='shift'?'shift':m.visualType==='live-results'?'data':m.mediaUrl?'evidence':'hook');return m}async function load(){lib=(await api('/sessions')).sessions||[];renderLib()}function renderLib(){E('sessions').innerHTML=lib.map(x=>`<div class="session ${s?.id===x.id?'active':''}" data-id="${esc(x.id)}"><strong>${esc(x.title)}</strong><span>${x.stepCount} moments · ${x.durationMinutes} min</span></div>`).join('')||'<p class="muted">No experiences yet.</p>';E('sessions').querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>open(x.dataset.id))}async function open(id){s=await api('/session/'+encodeURIComponent(id));s.steps.forEach(hydrate);idx=0;render()}function syncMeta(){s.title=E('title').value||'Untitled experience';s.course=E('course').value;s.durationMinutes=+E('minutes').value||75;s.description=E('description').value;E('heading').textContent=s.title}function render(){E('empty').hidden=!!s;E('work').hidden=!s;if(!s)return;E('heading').textContent=s.title;E('summary').textContent=`${s.steps.length} moments · ${s.durationMinutes} minutes`;E('title').value=s.title||'';E('course').value=s.course||'';E('minutes').value=s.durationMinutes||75;E('description').value=s.description||'';E('teach').href='/instructor?session='+encodeURIComponent(s.id);renderMoments();renderEditor();renderRehearse();renderLib();setMode(mode)}function renderMoments(){let t=0;E('moments').innerHTML=s.steps.map((m,i)=>{hydrate(m);let a=t;t+=+m.minutes||0;return`<div class="moment ${i===idx?'active':''}" data-i="${i}"><small>${esc((intents[m.intent]||intents.teach)[0])} · ${a}–${t} MIN</small><strong>${esc(m.title)}</strong><span class="muted">${esc(m.visualScene.toUpperCase())}</span><div class="tools"><button class="tiny" data-act="up" data-n="${i}">↑</button><button class="tiny" data-act="down" data-n="${i}">↓</button><button class="tiny" data-act="copy" data-n="${i}">Duplicate</button><button class="tiny" data-act="delete" data-n="${i}">Delete</button></div></div>`}).join('');E('moments').querySelectorAll('.moment').forEach(x=>x.onclick=ev=>{if(ev.target.dataset.act)return;idx=+x.dataset.i;renderMoments();renderEditor();renderRehearse()});E('moments').querySelectorAll('[data-act]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();let n=+b.dataset.n,a=b.dataset.act;if(a==='up'&&n>0)[s.steps[n-1],s.steps[n]]=[s.steps[n],s.steps[n-1]],idx=n-1;if(a==='down'&&n<s.steps.length-1)[s.steps[n+1],s.steps[n]]=[s.steps[n],s.steps[n+1]],idx=n+1;if(a==='copy'){s.steps.splice(n+1,0,structuredClone(s.steps[n]));idx=n+1}if(a==='delete'&&s.steps.length>1){s.steps.splice(n,1);idx=Math.min(idx,s.steps.length-1)}renderMoments();renderEditor();renderRehearse()})}function f(k,label,val='',wide=false,area=false){return`<div class="field ${wide?'wide':''}"><label>${label}</label>${area?`<textarea data-k="${k}">${esc(val)}</textarea>`:`<input data-k="${k}" value="${esc(val)}">`}</div>`}function sel(k,label,opts,val){return`<div class="field"><label>${label}</label><select data-k="${k}">${opts.map(o=>`<option value="${o[0]}" ${o[0]===val?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}function renderEditor(){let m=s.steps[idx];if(!m)return;hydrate(m);E('editor').innerHTML=`<div class="eyebrow">Moment ${idx+1}</div><div class="section"><h3>What should happen here?</h3><div class="intentGrid">${Object.entries(intents).map(([k,v])=>`<button class="intent ${m.intent===k?'active':''}" data-intent="${k}"><b>${v[0]}</b><span>${v[1]}</span></button>`).join('')}</div></div><div class="grid">${f('title','What should the room focus on?',m.title,true)}${f('lead','Context / setup',m.lead,true,true)}${f('studentTask','What students do',m.studentTask,true,true)}${f('roomInstruction','What the Room says',m.roomInstruction,true,true)}${f('minutes','Minutes',m.minutes)}${f('label','Moment label',m.label)}<div class="section"><h3>Consequence</h3><p class="muted">For choice moments, add one choice per line.</p></div>${f('choicesText','Choices',m.choices.join('\n'),true,true)}${sel('multi','Choice behavior',[['single','Single choice'],['multiple','Multiple choice']],m.multi?'multiple':'single')}<div class="section"><h3>Visual beat</h3><p class="muted">Choose what the visual is meant to do.</p><div class="sceneGrid">${Object.entries(scenes).map(([k,v])=>`<button class="scene ${m.visualScene===k?'active':''}" data-scene="${k}"><b>${v[0]}</b><span>${v[1]}</span></button>`).join('')}</div></div>${f('visualAccent','Visual accent / big number / quote',m.visualAccent,true)}${f('visualCaption','Supporting caption',m.visualCaption,true,true)}${f('mediaUrl','Image / GIF / video URL',m.mediaUrl,true)}${f('mediaOverlay','Overlay headline',m.mediaOverlay,true)}${f('focalX','Image focal X (0–100)',m.focalX)}${f('focalY','Image focal Y (0–100)',m.focalY)}<div class="preview">${m.mediaUrl?`<img src="${esc(m.mediaUrl)}" style="object-position:${m.focalX}% ${m.focalY}%">`:''}<div><div class="eyebrow">${esc(m.visualScene.toUpperCase())}</div><h2>${esc(m.mediaOverlay||m.title)}</h2><p>${esc(m.visualAccent||m.visualCaption||m.lead)}</p></div></div></div><div class="runbook"><div class="eyebrow">Instructor runbook</div><h3>What do you say and do?</h3><div class="grid">${f('rb.openWith','Open with',m.runbook.openWith,true,true)}${f('rb.whyMatters','Why this matters',m.runbook.whyMatters,true,true)}${f('rb.ask','Ask',m.runbook.ask,true,true)}${f('rb.pause','Pause / wait instruction',m.runbook.pause)}${f('rb.listenFor','Listen for',m.runbook.listenFor,true,true)}${f('rb.ifTheySay','If they say…',m.runbook.ifTheySay,true,true)}${f('rb.ifQuiet','If the room is quiet…',m.runbook.ifQuiet,true,true)}${f('rb.pushFurther','Push further',m.runbook.pushFurther,true,true)}${f('rb.revealWhen','Reveal when…',m.runbook.revealWhen,true,true)}${f('rb.sayDuringReveal','Say during reveal',m.runbook.sayDuringReveal,true,true)}${f('rb.landHere','Land here',m.runbook.landHere,true,true)}${f('rb.transition','Bridge to next',m.runbook.transition,true,true)}</div></div><details class="wide"><summary>Advanced interaction controls</summary><div class="grid">${sel('type','Interaction type',[['teaching','Teaching'],['vote','Vote'],['choice','Choice'],['multi-select','Multi-select'],['discussion','Discussion'],['reflection','Reflection'],['prompt','Prompt']],m.type)}${f('key','Response key',m.key)}</div></details>`;E('editor').querySelectorAll('[data-k]').forEach(x=>x.oninput=()=>{let k=x.dataset.k,v=x.value;if(k==='choicesText')m.choices=v.split('\n').map(x=>x.trim()).filter(Boolean);else if(k==='multi'){m.multi=v==='multiple';if(m.multi&&m.type==='choice')m.type='multi-select';if(!m.multi&&m.type==='multi-select')m.type='choice'}else if(k.startsWith('rb.'))m.runbook[k.slice(3)]=v;else if(k==='minutes'||k==='focalX'||k==='focalY')m[k]=+v;else m[k]=v;renderMoments();renderRehearse()});E('editor').querySelectorAll('[data-intent]').forEach(x=>x.onclick=()=>{m.intent=x.dataset.intent;m.type=intents[m.intent][2];m.label=intents[m.intent][0];renderEditor();renderMoments()});E('editor').querySelectorAll('[data-scene]').forEach(x=>x.onclick=()=>{m.visualScene=x.dataset.scene;m.visualType=m.visualScene==='shift'?'shift':m.visualScene==='data'?'live-results':'statement';renderEditor();renderMoments();renderRehearse()})}function renderRehearse(){if(!s||!s.steps.length)return;let m=s.steps[idx],r=m.runbook||rb(),pct=((idx+1)/s.steps.length)*100;E('rehearseLabel').textContent=`${idx+1} of ${s.steps.length} · ${m.title}`;E('pulseFill').style.width=pct+'%';let interactive=m.choices?.length?m.choices.map(c=>`<button class="btn" style="width:100%;margin:4px 0">${esc(c)}</button>`).join(''):`<p class="muted">${esc(m.studentTask||'Phone down. Look up.')}</p>`;E('studentStage').innerHTML=`<div class="eyebrow">${esc(m.label)}</div><h3>${esc(m.title)}</h3>${interactive}`;E('roomStage').innerHTML=`<div class="eyebrow">${esc((m.visualScene||'hook').toUpperCase())}</div><div class="roomHero">${esc(m.mediaOverlay||m.title)}</div><p class="muted">${esc(m.visualAccent||m.visualCaption||m.roomInstruction||'')}</p>`;E('directorStage').innerHTML=`<h3>${esc(m.title)}</h3>${r.openWith?`<div class="cue"><b>OPEN WITH</b><p>${esc(r.openWith)}</p></div>`:''}${r.ask?`<div class="cue"><b>ASK</b><p>${esc(r.ask)}</p></div>`:''}${r.listenFor?`<div class="cue"><b>LISTEN FOR</b><p>${esc(r.listenFor)}</p></div>`:''}${r.landHere?`<div class="cue"><b>LAND HERE</b><p>${esc(r.landHere)}</p></div>`:''}`}function setMode(v){mode=v;E('studio').classList.toggle('hide',v==='rehearse');E('rehearse').classList.toggle('on',v==='rehearse');document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===v));if(v==='rehearse')renderRehearse()}document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>setMode(x.dataset.mode));['title','course','minutes','description'].forEach(id=>E(id).addEventListener('input',syncMeta));E('save').onclick=async()=>{syncMeta();let r=await api('/session',{method:'POST',body:JSON.stringify(s)});s=r.session;s.steps.forEach(hydrate);toast('Saved');await load();render()};E('add').onclick=()=>{s.steps.push(blank(s.steps.length+1));idx=s.steps.length-1;render()};E('prevR').onclick=()=>{idx=Math.max(0,idx-1);renderMoments();renderRehearse()};E('nextR').onclick=()=>{idx=Math.min(s.steps.length-1,idx+1);renderMoments();renderRehearse()};E('dupSession').onclick=async()=>{let r=await api('/session/'+encodeURIComponent(s.id)+'/duplicate',{method:'POST',body:JSON.stringify({title:s.title+' — Copy'})});await load();open(r.session.id)};E('delSession').onclick=async()=>{if(!confirm('Delete this experience?'))return;await api('/session/'+encodeURIComponent(s.id),{method:'DELETE'});s=null;await load();render()};E('newBtn').onclick=async()=>{let id='experience-'+Date.now().toString(36),n={id,title:'New experience',course:'',description:'',durationMinutes:30,version:'0.10.3',steps:[blank(1)]};await api('/session',{method:'POST',body:JSON.stringify(n)});await load();open(id)};load().catch(()=>toast('Builder could not load'));</script></body></html>
