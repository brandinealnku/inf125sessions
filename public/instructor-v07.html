<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e8"><title>Run the room · INF 125</title><style>:root{--paper:#f4f1e8;--ink:#151515;--muted:#6b685f;--line:#d8d3c8;--accent:#b68616;--soft:#ebe6da;--dark:#1c1c1b;--ok:#3d6b4a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}.wrap{max-width:1440px;margin:auto;padding:28px 28px 110px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{font-size:14px;font-weight:800}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted)}.status{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:28px;margin-top:26px}.rail{border-right:1px solid var(--line);padding-right:18px}.rail button{width:100%;border:0;background:transparent;text-align:left;padding:9px 0;color:var(--muted);cursor:pointer}.rail button.active{color:var(--ink);font-weight:800}.rail .time{font-size:11px;color:var(--accent);display:block}.now{padding-right:10px}.now h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,5vw,72px);font-weight:500;line-height:.98;letter-spacing:-.035em;margin:10px 0 18px}.say{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.45;max-width:800px;margin:28px 0}.say:before{content:'SAY';display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.18em;color:var(--accent);margin-bottom:8px}.room{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}.roomGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.roomStat strong{font-size:32px;font-weight:700;display:block}.roomStat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.signal{margin-top:22px;font-size:18px;line-height:1.5}.signal b{color:var(--accent)}.next{border-left:1px solid var(--line);padding-left:24px}.next h2{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:500;margin:8px 0 10px}.nextBlock{margin-bottom:26px}.nextBlock p{line-height:1.5;color:#393831}.detail{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.detail summary{cursor:pointer;font-weight:700}.detail div{margin-top:10px;line-height:1.5;color:#45433d}.timer{font-size:56px;letter-spacing:-.05em;font-weight:650;margin-top:8px}.actions{position:fixed;left:0;right:0;bottom:0;background:rgba(244,241,232,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.actionsIn{max-width:1440px;margin:auto;padding:12px 28px;display:flex;justify-content:space-between;gap:12px}.group{display:flex;gap:8px}.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:11px 15px;border-radius:4px;cursor:pointer;font-weight:750}.btn.primary{background:var(--ink);color:var(--paper)}.btn.quiet{border-color:var(--line)}.btn.danger{border-color:#a25a5a;color:#7c3434}@media(max-width:1000px){.layout{grid-template-columns:1fr}.rail,.next{border:0;padding:0}.rail{display:none}.roomGrid{grid-template-columns:1fr 1fr 1fr}}@media(max-width:650px){.wrap{padding:18px 16px 145px}.top{align-items:flex-start}.status{flex-wrap:wrap}.roomGrid{grid-template-columns:1fr}.actionsIn{padding:10px 16px;flex-wrap:wrap}.group{width:100%}.group .btn{flex:1}}</style></head><body><main class="wrap"><header class="top"><div><div class="kicker">INF 125</div><div class="brand">Run the room</div></div><div class="status" id="status"></div></header><div class="layout"><aside class="rail"><div class="kicker">Today</div><div id="rail"></div></aside><section class="now" id="now"></section><aside class="next" id="next"></aside></div></main><footer class="actions"><div class="actionsIn" id="controls"></div></footer><script>let session={steps:[]},snapshot={state:{step:0,locked:false,resultsVisible:false,timerEndsAt:null},participantCount:0,answers:{}},struct='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(p,o={}){const r=await fetch('/api/session/'+session.id+p,{headers:{'content-type':'application/json'},...o});if(!r.ok)throw new Error(await r.text());return r.json()}function elapsed(i){return session.steps.slice(0,i).reduce((a,s)=>a+s.minutes,0)}function cur(){return session.steps[snapshot.state.step]}function agg(k){const rows=Object.values(snapshot.answers?.[k]||{}),out={};rows.forEach(x=>typeof x.response==='string'&&(out[x.response]=(out[x.response]||0)+1));return{rows,out}}function count(){const s=cur();return s.key?agg(s.key).rows.length:0}function timer(){if(!snapshot.state.timerEndsAt)return'—';const ms=Math.max(0,snapshot.state.timerEndsAt-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')}function read(){const s=cur(),n=count(),p=snapshot.participantCount?Math.round(n/snapshot.participantCount*100):0;if(!s.key)return{signal:'Watch the room, not the screen.',move:(s.runbook?.advanceWhen||'Advance when the idea lands.')};if(s.choices){const {out}=agg(s.key),a=s.choices.map(c=>[c,out[c]||0]).sort((x,y)=>y[1]-x[1]),top=a[0]||['',0],two=a[1]||['',0],gap=n?Math.round((top[1]-two[1])/n*100):0;if(p<60)return{signal:`${p}% have committed. The room is still forming.`,move:'Hold the reveal. Give them another moment.'};if(gap<15)return{signal:'The room is split.',move:'Ask each side what evidence it is using.'};if(top[1]/Math.max(1,n)>.75)return{signal:'The room strongly agrees.',move:'Challenge the majority before you validate it.'};return{signal:`${top[0]} is leading, but not decisively.`,move:'Ask for one defense and one counterpoint.'}}return{signal:`${n} written responses are in.`,move:'Choose two contrasting responses to surface.'}}function status(){document.getElementById('status').innerHTML=`<span><span class="dot"></span>Live</span><span>${snapshot.participantCount} in room</span><span>${elapsed(snapshot.state.step)}/${session.durationMinutes} min</span>`}function rail(){document.getElementById('rail').innerHTML=session.steps.map((s,i)=>`<button class="${i===snapshot.state.step?'active':''}" onclick="go(${i})"><span class="time">${elapsed(i)}–${elapsed(i)+s.minutes}</span>${esc(s.label)}</button>`).join('')}function now(){const s=cur(),r=s.runbook||{},rr=read(),p=snapshot.participantCount?Math.round(count()/snapshot.participantCount*100):0;document.getElementById('now').innerHTML=`<div class="kicker">Now · ${esc(s.label)}</div><h1>${esc(s.title)}</h1><div class="say">${esc(r.say||s.instructorCue||'Guide the room through this moment.')}</div><div class="room"><div class="kicker">Room</div><div class="roomGrid"><div class="roomStat"><strong id="responses">${count()}</strong><span>responses</span></div><div class="roomStat"><strong id="participation">${p}%</strong><span>participation</span></div><div class="roomStat"><strong id="timer">${timer()}</strong><span>timer</span></div></div><div class="signal"><b>Signal:</b> <span id="signal">${esc(rr.signal)}</span></div></div>`}function next(){const s=cur(),r=s.runbook||{},n=session.steps[snapshot.state.step+1],rr=read();document.getElementById('next').innerHTML=`<div class="kicker">Next</div><div class="nextBlock"><h2>${esc(rr.move)}</h2></div>${n?`<div class="nextBlock"><div class="kicker">Up next</div><p><b>${esc(n.label)}</b><br>${esc(n.title)}</p></div>`:''}<details class="detail"><summary>More guidance</summary><div><b>Watch for</b><br>${esc(r.watchFor||'Assumptions, hesitation, and competing reasoning.')}</div><div><b>If the room stalls</b><br>${esc(r.ifStuck||'Ask what evidence changed someone’s mind.')}</div><div><b>Transition</b><br>${esc(r.transition||'Connect this moment to what comes next.')}</div></details>`}function controls(){document.getElementById('controls').innerHTML=`<div class="group"><button class="btn quiet" onclick="prev()">Back</button><button class="btn ${snapshot.state.locked?'danger':'quiet'}" onclick="toggleLock()">${snapshot.state.locked?'Unlock':'Commit'}</button><button class="btn quiet" onclick="toggleResults()">${snapshot.state.resultsVisible?'Hide':'Reveal'}</button></div><div class="group"><a class="btn quiet" target="_blank" href="/?display=1">Room display</a><button class="btn primary" onclick="nextStep()">Next</button></div>`}function renderAll(){status();rail();now();next();controls()}function live(){status();const p=snapshot.participantCount?Math.round(count()/snapshot.participantCount*100):0,rr=read();[['responses',count()],['participation',p+'%'],['signal',rr.signal]].forEach(([id,v])=>{const e=document.getElementById(id);if(e&&e.textContent!==String(v))e.textContent=v})}function structure(){return [snapshot.state.step,snapshot.state.locked,snapshot.state.resultsVisible].join('|')}async function refresh(force=false){snapshot=await api('/snapshot');const k=structure();if(force||k!==struct){struct=k;renderAll()}else live()}async function setState(p){await api('/state',{method:'POST',body:JSON.stringify(p)});await refresh(true)}function go(i){setState({step:Math.max(0,Math.min(session.steps.length-1,i)),resultsVisible:false,locked:false,timerEndsAt:null})}function nextStep(){go(snapshot.state.step+1)}function prev(){go(snapshot.state.step-1)}function toggleLock(){setState({locked:!snapshot.state.locked})}function toggleResults(){setState({resultsVisible:!snapshot.state.resultsVisible})}function startTimer(m){setState({timerEndsAt:Date.now()+m*60000})}function tick(){const e=document.getElementById('timer');if(e)e.textContent=timer()}async function boot(){session=await fetch('/sessions/how-ai-works.json',{cache:'no-store'}).then(r=>r.json());await refresh(true);setInterval(()=>refresh(false),1500);setInterval(tick,250)}boot();</script></body></html>
