<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171421"><title>INF 128 · Context Quest</title>
<style>
:root{--ink:#171421;--cream:#fff8e8;--paper:#fffdf5;--purple:#7654d8;--pink:#ed5c8f;--orange:#f2a13b;--yellow:#f5d65d;--green:#5bbd82;--teal:#42b9b1;--blue:#4b83d1;--red:#db5a50;--muted:#756d7d;--shadow:#251f31}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{background:#eee6d7;background-image:radial-gradient(#d3c7b5 1px,transparent 1px);background-size:18px 18px}button,input,textarea{font:inherit}.wrap{width:min(1120px,100%);margin:auto;padding:18px 16px 70px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:white;border-radius:18px;padding:13px 16px;box-shadow:0 6px 0 #0003}.logo{font-weight:1000;letter-spacing:-.04em}.logo span{color:var(--yellow)}.tiny{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:900}.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;background:white;color:var(--ink);padding:7px 10px;font-size:12px;font-weight:900}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--shadow);padding:22px;margin:18px 0}.hero{background:linear-gradient(135deg,#fff9df,#f8d98e);overflow:hidden;position:relative}.hero:after{content:"?";position:absolute;right:18px;top:-42px;font-size:210px;font-weight:1000;color:#ffffff66;transform:rotate(12deg)}.hero h1{position:relative;z-index:1;font-size:clamp(48px,9vw,90px);line-height:.84;letter-spacing:-.075em;margin:10px 0;text-transform:uppercase}.hero p{position:relative;z-index:1;font-size:18px;line-height:1.45;max-width:760px}.btn{border:3px solid var(--ink);border-radius:13px;padding:13px 16px;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 var(--ink);background:var(--yellow);color:var(--ink);text-transform:uppercase}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.purple{background:var(--purple);color:white}.btn.red{background:var(--red);color:white}.btn.teal{background:var(--teal)}.btn.soft{background:white}.field,.prompt{width:100%;border:3px solid var(--ink);border-radius:13px;background:white;padding:14px;outline:none}.prompt{min-height:145px;resize:vertical;font-size:16px;line-height:1.45}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rule{border:3px solid var(--ink);border-radius:15px;padding:15px;background:white}.rule b{display:block;text-transform:uppercase;margin-bottom:4px}.hud{position:sticky;top:0;z-index:20;background:#eee6d7ee;backdrop-filter:blur(8px);padding:10px 0}.hudrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:flex;gap:7px;flex-wrap:wrap}.core{display:flex;gap:6px;flex-wrap:wrap}.gem{border:3px solid var(--ink);border-radius:10px;padding:7px 9px;background:#cfc8bd;color:#6c6570;font-size:11px;font-weight:1000}.gem.on{background:var(--yellow);color:var(--ink)}.board{position:relative;min-height:410px;background:#d8efd9;border:4px solid var(--ink);border-radius:28px;box-shadow:7px 7px 0 var(--shadow);overflow:hidden;margin:16px 0;background-image:radial-gradient(#9ccca1 2px,transparent 2px);background-size:28px 28px}.path{position:absolute;inset:20px}.space{position:absolute;width:82px;height:82px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:1000;line-height:1.05;box-shadow:0 5px 0 #0004;background:white}.space .ico{display:block;font-size:25px}.space.current{outline:6px solid #fff9;transform:scale(1.08)}.space.done{filter:saturate(.65)}.token{position:absolute;width:35px;height:35px;border:3px solid var(--ink);border-radius:50%;background:var(--purple);display:grid;place-items:center;color:white;font-weight:1000;box-shadow:0 3px 0 #0005;transition:.45s left,.45s top;z-index:5}.centerCore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;border:5px solid var(--ink);background:conic-gradient(var(--yellow),var(--pink),var(--purple),var(--teal),var(--yellow));display:grid;place-items:center;text-align:center;font-weight:1000;box-shadow:0 7px 0 #0004}.boardTitle{position:absolute;left:16px;top:14px;background:white;border:3px solid var(--ink);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:1000}.turn{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.stage{border:3px solid var(--ink);border-radius:18px;background:white;padding:18px}.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:1000;color:var(--purple)}.bigq{font-size:clamp(25px,4vw,39px);font-weight:1000;letter-spacing:-.045em;line-height:1.08;margin:9px 0 15px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gamecard{position:relative;min-height:112px;border:3px solid var(--ink);border-radius:16px;padding:13px;box-shadow:0 5px 0 var(--ink);background:var(--cream);transform:rotate(-.5deg)}.gamecard:nth-child(even){transform:rotate(.6deg)}.gamecard small{display:block;text-transform:uppercase;font-size:10px;font-weight:1000;letter-spacing:.09em;margin-bottom:7px}.gamecard b{font-size:17px}.success{background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:13px;font-weight:900;margin:12px 0}.chaos{background:#ffd9d3;border:4px solid var(--red);border-radius:16px;padding:15px;margin:12px 0;animation:pop .25s ease-out}.chaos h3{margin:0 0 5px;color:#9d3028}.actions,.powers{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.power{border:3px solid var(--ink);border-radius:999px;background:#e8defc;padding:8px 11px;font-size:11px;font-weight:1000;cursor:pointer}.judge{display:grid;gap:8px}.judge button{width:100%}.eventCard{text-align:center;padding:24px}.eventCard .icon{font-size:70px}.eventCard h2{font-size:42px;letter-spacing:-.05em;margin:8px 0}.reward{font-size:55px;font-weight:1000}.final{background:linear-gradient(135deg,#2b2341,#51386f);color:white}.final .stage{color:var(--ink)}.footer{text-align:center;color:#625a68;font-size:11px;font-weight:800;margin-top:28px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:var(--ink);color:white;border-radius:12px;padding:12px 15px;font-weight:900;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}@media(max-width:760px){.turn{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.board{min-height:500px}.space{width:68px;height:68px}.wrap{padding:10px 10px 50px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div id="app"></div></main><div id="toast" class="toast"></div>
<script>
const D={audience:["a 7-year-old","a skeptical CEO","a first-year informatics student","someone who hates technology","a hiring manager","a nervous parent","a professor outside computing","a small-business owner","a social-media creator","a city council member"],format:["a TikTok script","a warning label","a bedtime story","an executive memo","a movie trailer","a text message","a 3-bullet briefing","a FAQ","a campus poster","a 60-second pitch"],tone:["ominous","brutally simple","overly enthusiastic","skeptical","dead serious","playfully dramatic","calm and reassuring","curious","confident but cautious","dryly funny"],goal:["help someone make a decision","teach the idea in under 1 minute","prevent a costly mistake","prepare someone to ask better questions","compare two choices fairly","help someone spot weak evidence","turn confusion into an action plan","challenge an assumption"],constraint:["no technical vocabulary","use one analogy","include one limitation","give two alternatives","state what you do not know","include a verification step","no more than 3 bullets","ask 2 questions before answering","separate fact from assumption"],chaos:["The audience suddenly changed.","This will be posted publicly.","The answer could cost someone money.","Private data is involved.","The AI gives a confident statistic with no source.","A key fact is missing.","Two sources disagree.","Your user has accessibility needs.","The stakes just became high.","The answer will be reused by other people."],success:["Most useful for the audience","Best use of context","Most precise instructions","Best verification plan","Most responsible answer","Best recovery after the plot twist","Clearest output","Least likely to be misunderstood","Strongest evidence thinking"],prompt:["Explain artificial intelligence.","Help me choose a career.","Tell me whether this source is trustworthy.","Write something about AI for my class.","Help me decide which AI tool to use.","Summarize this information.","Tell me if I should trust this AI answer.","Explain why AI makes mistakes."],stakeholder:["STUDENT","ACADEMIC ADVISOR","PROFESSOR","UNIVERSITY","PARENT","ACCESSIBILITY OFFICE"]};
const SPACES=[["START","🎲","#fff"],["CONTEXT","🃏","#f5d65d"],["PROMPT","⚡","#ed5c8f"],["WILD","🎲","#fff"],["VERIFY","🛡️","#42b9b1"],["CHAOS","💥","#db5a50"],["SWAP","🔄","#7654d8"],["CONTEXT","🃏","#f5d65d"],["PROMPT","⚡","#ed5c8f"],["VERIFY","🛡️","#42b9b1"],["CHAOS","💥","#db5a50"],["BOSS","👾","#f2a13b"]];
const POS=[[7,68],[20,80],[36,82],[54,78],[72,69],[82,50],[74,28],[57,16],[38,15],[20,23],[9,39],[50,48]];
const CORE=[["WHO","👤"],["WHY","🎯"],["CONTEXT","🧩"],["CHECK","🛡️"]];
let S={name:"",pos:0,turn:0,xp:0,streak:0,cores:[],deal:{},draft:"",chaos:"",event:"",stakeholder:"",phase:"board"};
const pick=k=>D[k][Math.floor(Math.random()*D[k].length)],esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem("inf128-context-board-v2",JSON.stringify(S))}function load(){try{let x=JSON.parse(localStorage.getItem("inf128-context-board-v2"));if(x)S=x}catch(e){}}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}
function mast(inner){return '<header class="mast"><div><div class="logo">CONTEXT <span>QUEST</span></div><div class="tiny">INF 128 · AI LITERACY</div></div><div class="pill">DIGITAL PARTY-BOARD GAME</div></header>'+inner+'<div class="footer">DRAW → BUILD → TEST → REVEAL → ADAPT → SCORE → MOVE</div>'}
function start(){document.getElementById("app").innerHTML=mast('<section class="panel hero"><div class="tiny">THE AI PROMPT PARTY GAME</div><h1>CONTEXT<br>IS EVERYTHING.</h1><p>A living board game about the thing most people miss when they use AI: the same request can need a completely different prompt when the person, purpose, evidence, constraints, or consequences change.</p></section><section class="panel"><h2>NAME YOUR TEAM</h2><input id="team" class="field" placeholder="e.g. Prompt Goblins"><div class="rules" style="margin-top:14px"><div class="rule"><b>🃏 DRAW</b>Get a situation you did not choose.</div><div class="rule"><b>⚡ BUILD + TEST</b>Create a prompt and run it in an AI tool.</div><div class="rule"><b>💥 ADAPT</b>Survive changes, judge the output, and collect the Context Core.</div></div><div class="actions"><button class="btn purple" onclick="begin()">START THE GAME →</button></div></section>')}
function begin(){S={name:document.getElementById("team").value.trim()||"Team Context",pos:0,turn:0,xp:0,streak:0,cores:[],deal:{},draft:"",chaos:"",event:"",stakeholder:"",phase:"board"};save();board()}
function hud(){return '<div class="hud"><div class="hudrow"><b>'+esc(S.name)+'</b><div class="stats"><span class="pill">⚡ '+S.xp+' XP</span><span class="pill">🔥 '+S.streak+'</span></div></div><div class="core">'+CORE.map(c=>'<span class="gem '+(S.cores.includes(c[0])?"on":"")+'">'+c[1]+' '+c[0]+'</span>').join("")+'</div></div>'}
function boardHTML(){return '<div class="board"><div class="boardTitle">THE ROAD TO THE CONTEXT CORE</div><div class="path">'+SPACES.map((s,i)=>'<div class="space '+(i<S.pos?"done":"")+(i===S.pos?" current":"")+'" style="left:'+POS[i][0]+'%;top:'+POS[i][1]+'%;background:'+s[2]+';transform:translate(-50%,-50%)"><span><span class="ico">'+s[1]+'</span>'+s[0]+'</span></div>').join("")+'<div class="token" style="left:'+POS[S.pos][0]+'%;top:'+POS[S.pos][1]+'%;transform:translate(-50%,-50%)">★</div><div class="centerCore">✨<br>CONTEXT<br>CORE<br><small>'+S.cores.length+'/4 PIECES</small></div></div></div>'}
function board(){if(S.pos>=11&&S.cores.length>=4)return boss();document.getElementById("app").innerHTML=mast(hud()+boardHTML()+'<section class="panel"><div class="label">TURN '+(S.turn+1)+'</div><h2>'+(S.pos===0?"Ready to move?":"You landed on "+SPACES[S.pos][0]+".")+'</h2><p>'+spaceHint(SPACES[S.pos][0])+'</p><div class="actions"><button class="btn purple" onclick="roll()">'+(S.pos===0?"ROLL TO BEGIN 🎲":"ROLL + MOVE 🎲")+'</button></div></section>')}
function spaceHint(t){return {START:"The board decides what happens next. Adapt.",CONTEXT:"Draw context cards and make a weak prompt fit.",PROMPT:"Build under pressure. Success depends on the situation.",WILD:"The rules are about to bend.",VERIFY:"Trust is earned. Decide what needs checking.",CHAOS:"Your first solution will not survive unchanged.",SWAP:"Perspective changes the prompt.",BOSS:"Collect all four Core pieces to face the Final Boss."}[t]||""}
function roll(){let step=1+Math.floor(Math.random()*3);S.pos=Math.min(11,S.pos+step);S.turn++;save();landing(step)}
function landing(step){let type=SPACES[S.pos][0];if(type==="BOSS"&&S.cores.length<4){S.pos=7;save();return eventScreen("🔒","THE CORE IS LOCKED","You reached the gate, but you need all four Context Core pieces. The board sends you back for one more challenge.","RETURN TO BOARD",board)}if(type==="WILD")return wild();if(type==="SWAP")return swapEvent();challenge(type,step)}
function challenge(type,step){let types=type==="CONTEXT"?["audience","format","tone"]:type==="VERIFY"?["audience","goal","constraint"]:["audience","goal","constraint","format"];S.deal={prompt:pick("prompt")};types.forEach(t=>S.deal[t]=pick(t));S.chaos=type==="CHAOS"?pick("chaos"):"";S.event=type;S.draft="";save();renderChallenge(step)}
function renderChallenge(step){let type=S.event,types=Object.keys(S.deal).filter(k=>k!=="prompt");document.getElementById("app").innerHTML=mast(hud()+'<section class="panel"><div class="label">🎲 MOVED '+(step||"")+" · "+type+' SPACE</div><div class="turn"><div class="stage"><div class="label">STARTING REQUEST</div><div class="bigq">'+esc(S.deal.prompt)+'</div><div class="cards">'+types.map(t=>'<div class="gamecard"><small>'+t+'</small><b>'+esc(S.deal[t])+'</b></div>').join("")+'</div>'+(S.chaos?'<div class="chaos"><h3>💥 CHAOS EVENT</h3><b>'+esc(S.chaos)+'</b><p>Your original plan is no longer enough. Repair it.</p></div>':'')+'<h3>BUILD YOUR PROMPT</h3><textarea id="draft" class="prompt" placeholder="What does the AI need to know to succeed here?">'+esc(S.draft)+'</textarea><div class="powers"><button class="power" onclick="power(\'context\')">🔎 CONTEXT SCANNER</button><button class="power" onclick="power(\'evidence\')">🛡 EVIDENCE SHIELD</button><button class="power" onclick="power(\'human\')">✋ HUMAN OVERRIDE</button></div><div class="actions"><button class="btn purple" onclick="copyPrompt()">COPY + TEST IN AI</button>'+(type!=="CHAOS"?'<button class="btn red" onclick="revealChaos()">💥 FLIP CHAOS CARD</button>':'')+'</div></div><aside class="stage"><div class="label">SUCCESS CARD</div><div class="success">'+esc(pickStableSuccess())+'</div><p><b>Human judgment:</b> Don't reward the answer because it sounds polished. Reward it if it fits the actual situation.</p><div class="judge"><button class="btn soft" onclick="judge(1)">NEEDS REPAIR · +100</button><button class="btn" onclick="judge(2)">SOLID · +200</button><button class="btn teal" onclick="judge(3)">NAILED IT · +300</button></div></aside></div></section>')}
function pickStableSuccess(){if(!S.success)S.success=pick("success");save();return S.success}
function revealChaos(){S.draft=document.getElementById("draft").value;S.chaos=pick("chaos");save();renderChallenge();toast("PLOT TWIST — repair your prompt!")}
function power(t){let b=document.getElementById("draft"),x=t==="context"?"\nBefore answering, identify important missing context and ask for it.":t==="evidence"?"\nSeparate supported claims from assumptions and explain how important claims should be verified.":"\nIdentify what judgment should remain with a human.";b.value+=x;S.draft=b.value;toast("Power card played!")}
function copyPrompt(){S.draft=document.getElementById("draft").value.trim();save();if(!S.draft)return toast("Build the prompt first.");navigator.clipboard?.writeText(S.draft);toast("Copied — test it in your AI tool.")}
function judge(n){S.draft=document.getElementById("draft").value;S.xp+=n*100;S.streak=n===3?S.streak+1:0;awardCore();S.success="";save();eventScreen(n===3?"🏆":n===2?"⭐":"🧭",n===3?"CONTEXT HIT!":n===2?"STRONG MOVE":"REPAIR IS PART OF THE GAME","+"+(n*100)+" XP · "+(S.cores.length<4?"Keep moving toward the Context Core.":"All four Core pieces collected. The boss gate is open!"),"BACK TO BOARD",board)}
function awardCore(){let map={CONTEXT:"WHO",PROMPT:"WHY",CHAOS:"CONTEXT",VERIFY:"CHECK"};let g=map[S.event];if(g&&!S.cores.includes(g))S.cores.push(g);else if(S.cores.length<4){let next=CORE.map(x=>x[0]).find(x=>!S.cores.includes(x));if(next)S.cores.push(next)}}
function wild(){let events=[["🎁","POWER CACHE","You found a Context Scanner. +150 XP.","xp"],["⏩","SHORTCUT","A clear goal saves time. Move forward one space.","move"],["🧠","HUMAN CHECK","Explain one decision AI should not make alone. Earn a Core piece.","core"]],e=events[Math.floor(Math.random()*events.length)];if(e[3]==="xp")S.xp+=150;if(e[3]==="move")S.pos=Math.min(10,S.pos+1);if(e[3]==="core")awardCore();save();eventScreen(e[0],e[1],e[2],"CONTINUE",board)}
function swapEvent(){S.deal={prompt:pick("prompt"),audience:pick("audience"),goal:pick("goal")};S.event="SWAP";S.chaos="Your audience has changed to "+pick("audience")+".";S.draft="";save();renderChallenge()}
function eventScreen(icon,title,text,button,fn){window._next=fn;document.getElementById("app").innerHTML=mast(hud()+'<section class="panel eventCard"><div class="icon">'+icon+'</div><div class="label">BOARD EVENT</div><h2>'+title+'</h2><p>'+text+'</p><button class="btn purple" onclick="_next()">'+button+' →</button></section>')}
function boss(){S.stakeholder=S.stakeholder||pick("stakeholder");save();document.getElementById("app").innerHTML=mast(hud()+'<section class="panel final"><div class="label" style="color:#f5d65d">👾 FINAL BOSS · CAMPUS AI CRISIS</div><h2 style="font-size:44px;margin:8px 0">THE CONTEXT CORE IS OPEN.</h2><p>A university wants an AI assistant that recommends courses, answers high-stakes student questions, and uses student information.</p><div class="turn"><div class="stage"><div class="label">YOUR STAKEHOLDER</div><div class="bigq">'+esc(S.stakeholder)+'</div><p>Design the AI interaction for this person. Use everything you've collected.</p><textarea id="draft" class="prompt" placeholder="WHO? WHAT? WHY? CONTEXT? CONSTRAINTS? OUTPUT? CHECK?"></textarea><div class="actions"><button class="btn" onclick="bossSwap()">🔄 STAKEHOLDER SWAP</button><button class="btn purple" onclick="copyPrompt()">COPY + TEST</button></div></div><aside class="stage"><div class="label">BOSS CHAOS EVENT</div><div class="chaos"><h3>🚨 NEW INFORMATION</h3><b>The AI confidently gives a student incorrect high-stakes information.</b></div><p>What changes now? Add verification, boundaries, uncertainty, escalation, or human judgment where appropriate.</p><button class="btn red" onclick="beatBoss()">SUBMIT FINAL DESIGN →</button></aside></div></section>')}
function bossSwap(){S.draft=document.getElementById("draft").value;let o=S.stakeholder;do{S.stakeholder=pick("stakeholder")}while(S.stakeholder===o);save();boss();toast("Perspective flipped. Repair the design.")}
function beatBoss(){S.xp+=500;S.phase="complete";save();document.getElementById("app").innerHTML=mast('<section class="panel hero"><div class="tiny">QUEST COMPLETE</div><h1>YOU FOUND THE<br>CONTEXT CORE.</h1><div class="reward">'+S.xp+' XP</div><p>The winning move was never a magic prompt. It was recognizing that <b>who, why, context, constraints, evidence, consequences, and verification</b> change what a good AI interaction looks like.</p></section><section class="panel eventCard"><div class="icon">✨</div><h2>DRAW → BUILD → TEST → REVEAL → ADAPT</h2><p><b>WHO → WHAT → WHY → CONTEXT → CONSTRAINTS → OUTPUT → CHECK</b></p><button class="btn soft" onclick="restart()">PLAY AGAIN</button></section>')}
function restart(){localStorage.removeItem("inf128-context-board-v2");S={name:"",pos:0,turn:0,xp:0,streak:0,cores:[],deal:{},draft:"",chaos:"",event:"",stakeholder:"",phase:"board"};start()}
load();if(S.phase==="complete")beatBoss();else if(S.name)board();else start();
</script></body></html>
