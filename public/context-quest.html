<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b18">
<title>INF 128 · Context Quest</title>
<style>
:root{--sky:#86c8ff;--grass:#56a63a;--grass2:#72bd4d;--dirt:#8b5a32;--ink:#172016;--paper:#f8f4df;--gold:#f5c542;--green:#53a93f;--red:#c94a3c;--blue:#3b77c3;--purple:#7d5bb7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
body{background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 28%),linear-gradient(180deg,var(--sky) 0 52%,var(--grass2) 52% 56%,var(--grass) 56% 60%,var(--dirt) 60% 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.11;background-image:linear-gradient(90deg,rgba(0,0,0,.18) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.18) 1px,transparent 1px);background-size:24px 24px}
button,input,textarea{font:inherit}.shell{width:min(980px,100%);margin:auto;padding:14px 16px 72px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 13px;background:rgba(255,251,233,.94);border:4px solid #263c23;box-shadow:0 6px 0 #1d2b1a}.brand{font-weight:1000;letter-spacing:-.04em;text-transform:uppercase}.subtle{font-size:12px;color:#5d684f}.badge,.stat{display:inline-flex;align-items:center;gap:7px;border:3px solid #263c23;background:#fff8d6;padding:8px 11px;font-size:12px;font-weight:950;box-shadow:3px 3px 0 #263c23}
.hero,.card,.mission{background:rgba(255,251,233,.97);border:5px solid #263c23;box-shadow:8px 8px 0 rgba(32,53,30,.78)}.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff7d0,#f2e5af);padding:28px;margin:22px 0}.kicker,.missionLabel{font-size:11px;font-weight:1000;letter-spacing:.13em;text-transform:uppercase;color:#3f6e2c}.hero h1{font-size:clamp(43px,9vw,78px);line-height:.88;letter-spacing:-.075em;margin:10px 0 15px;text-transform:uppercase;max-width:760px;text-shadow:3px 3px 0 #d2bd72}.hero p{font-family:Inter,system-ui,sans-serif;font-size:18px;line-height:1.5;color:#3e4938;max-width:720px}.card{padding:22px;margin:18px 0}.field{width:100%;padding:15px;border:4px solid #42513b;background:#fffef5;color:var(--ink);font-size:17px;outline:none;box-shadow:inset 3px 3px 0 #d7d0b6}.action{border:4px solid #263c23;background:#4d9a38;color:#fff;font-weight:1000;padding:14px 18px;cursor:pointer;min-height:52px;text-transform:uppercase;box-shadow:0 6px 0 #2d6022}.action.gold{background:#e2a72a;color:#241a08;box-shadow:0 6px 0 #9e7019}.action.gray{background:#77818a;box-shadow:0 6px 0 #4b535a}.action.red{background:#c94a3c;box-shadow:0 6px 0 #7c2f28}.action:active{transform:translateY(4px);box-shadow:0 2px 0 #2d6022}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rule{background:#f7ecc0;border:4px solid #42513b;padding:15px;color:#4e5846;font-family:Inter,system-ui,sans-serif;font-size:13px;box-shadow:5px 5px 0 rgba(38,60,35,.65)}.rule b{display:block;color:#1d2c1a;margin-bottom:4px;font-family:ui-monospace,monospace;text-transform:uppercase}
.hud{position:sticky;top:0;z-index:12;background:rgba(134,200,255,.94);backdrop-filter:blur(7px);padding:10px 0 12px}.hudTop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.hudStats{display:flex;gap:7px;flex-wrap:wrap}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.node{text-align:center;border:4px solid #42513b;background:#9ba4aa;padding:9px 6px;color:#273029;font-size:10px;font-weight:1000;text-transform:uppercase;box-shadow:0 4px 0 #596167}.node.done{background:#68b04a;border-color:#284b22}.node.active{background:#f2c94c;border-color:#624b14}.progress{height:13px;background:#4b3827;border:3px solid #263c23;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:repeating-linear-gradient(90deg,#68b04a 0 22px,#5aa03e 22px 44px)}
.mission{overflow:hidden;margin-top:18px}.missionHead{padding:17px 20px;border-bottom:5px solid #263c23;display:flex;justify-content:space-between;gap:14px;background:linear-gradient(180deg,#d8cfac,#beb38f)}.missionBody{padding:22px}.scenario{background:#e6dcad;border:4px solid #6e6244;border-left:9px solid #5c8f3a;padding:16px 17px;color:#343b31;line-height:1.5;font-family:Inter,system-ui,sans-serif}.question{font-size:clamp(25px,5vw,38px);line-height:1.1;letter-spacing:-.045em;margin:19px 0}.deal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.dealCard{background:#fff9df;border:4px solid #5b654f;padding:14px;box-shadow:0 4px 0 #879078}.dealCard small{display:block;font-weight:1000;text-transform:uppercase;color:#5d684f;margin-bottom:6px}.dealCard b{font-family:Inter,system-ui,sans-serif;font-size:17px}.promptBox{width:100%;min-height:150px;padding:15px;border:4px solid #42513b;background:#fffef5;color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;resize:vertical}.success{background:#f4d46b;border:4px solid #6c5014;padding:14px;margin:14px 0;font-weight:900}.chaos{background:#f4d2cb;border:5px solid #a73b30;padding:18px;margin:15px 0}.chaos h3{margin:0 0 5px;color:#8a2d25;text-transform:uppercase}.powerRow,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.power{border:4px solid #3e4b39;background:#b9ac78;color:#1f291d;padding:9px 12px;font-size:12px;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 #756b48;text-transform:uppercase}.levelComplete{text-align:center;padding:38px 24px}.levelIcon{font-size:58px}.levelComplete h2{font-size:41px;margin:8px 0;text-transform:uppercase}.scoreBig{font-size:70px;font-weight:1000}.hidden{display:none!important}.footer{text-align:center;color:#34412f;font-size:12px;margin-top:27px;font-weight:900}.toast{position:fixed;right:18px;bottom:18px;background:#fff8d6;border:4px solid #263c23;padding:12px 15px;font-weight:900;box-shadow:4px 4px 0 #263c23;opacity:0;transform:translateY(12px);transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}
@media(max-width:650px){.shell{padding:10px 11px 46px}.hero,.card{padding:18px}.hero h1{font-size:48px}.rules{grid-template-columns:1fr}.map{grid-template-columns:repeat(4,minmax(65px,1fr));overflow:auto}.deal{grid-template-columns:1fr}.missionBody{padding:17px}.top{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="shell"><div id="app"></div></main><div class="toast" id="toast"></div>
<script>
const DATA={
audience:["a 7-year-old","your grandmother","a skeptical CEO","a first-year informatics student","someone who hates technology","a hiring manager","a nervous parent","a professor outside computing","a small-business owner","a social-media creator","a city council member","a student who missed class"],
format:["a TikTok script","a warning label","a bedtime story","an executive memo","a movie trailer","a text message","a 3-bullet briefing","a FAQ","a campus poster","a 60-second pitch","a step-by-step guide","a debate opening statement"],
tone:["ominous","brutally simple","overly enthusiastic","skeptical","dead serious","playfully dramatic","calm and reassuring","curious","confident but cautious","dryly funny","urgent","neutral and precise"],
goal:["help someone make a decision","teach the idea in under 1 minute","persuade without exaggerating","prevent a costly mistake","prepare someone to ask better questions","compare two choices fairly","help someone spot weak evidence","turn confusion into an action plan","explain a risk without panic","make the next step obvious","challenge an assumption","create a useful starting draft"],
constraint:["exactly 50 words","no technical vocabulary","use one analogy","include one limitation","give two alternatives","state what you do not know","include a verification step","no more than 3 bullets","use one concrete example","define every acronym","ask 2 questions before answering","separate fact from assumption"],
chaos:["The audience changed.","This will be posted publicly.","The answer could cost someone money.","Private data is involved.","The AI gives a confident statistic.","You have 30 seconds.","A key fact is missing.","Two sources disagree.","Your user has accessibility needs.","The stakes just became high.","The answer will be reused by others.","Your first output sounds great—but has no sources."],
success:["Most useful for the audience","Best use of context","Most precise instructions","Best verification plan","Most responsible answer","Best recovery after the plot twist","Clearest output","Best balance of usefulness + caution","Least likely to be misunderstood","Strongest evidence thinking","Best stakeholder awareness","Funniest answer that is still useful"],
prompt:["Explain artificial intelligence.","Help me choose a career.","Tell me whether this source is trustworthy.","Write something about AI for my class.","Help me decide which AI tool to use.","Summarize this information.","Tell me if I should trust this AI answer.","Help me prepare for a job interview.","Explain why AI makes mistakes.","Help me make a decision using this data.","Create a plan for learning a new skill.","Tell me what I should do next."],
stakeholder:["STUDENT","ACADEMIC ADVISOR","PROFESSOR","UNIVERSITY","PARENT","ACCESSIBILITY OFFICE"]};
const LEVELS=[{name:"Mad Libs Meadow",short:"Context",icon:"🃏",blurb:"Audience + format + tone"},{name:"Prompt Forge",short:"Build",icon:"⚒️",blurb:"Goal + constraints"},{name:"Chaos Cavern",short:"Repair",icon:"💥",blurb:"Reality changes"},{name:"Final Boss",short:"Stakeholders",icon:"👾",blurb:"Perspective changes"}];
let S={name:"",level:0,xp:0,streak:0,best:0,deal:{},draft:"",chaos:"",success:""};
const pick=k=>DATA[k][Math.floor(Math.random()*DATA[k].length)];
function save(){localStorage.setItem("inf128-context-quest",JSON.stringify(S))}
function load(){try{const x=JSON.parse(localStorage.getItem("inf128-context-quest"));if(x)S=x}catch(e){}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}
function shell(inner){return '<div class="top"><div><div class="brand">INF 128 · CONTEXT QUEST</div><div class="subtle">AI Literacy · Principles of Informatics</div></div><span class="badge">CONTEXT IS EVERYTHING</span></div>'+inner+'<div class="footer">ITSBAD Labs · AI literacy through play</div>'}
function start(){document.getElementById("app").innerHTML=shell('<section class="hero"><div class="kicker">AI PROMPT PARTY GAME</div><h1>CONTEXT<br>IS EVERYTHING</h1><p>Your mission: stop hunting for magic prompt words. Learn to give AI the context it needs—and recognize when the situation changes what “good” means.</p></section><section class="card"><h2>CREATE YOUR TEAM</h2><input id="name" class="field" placeholder="Team name"><div class="rules" style="margin-top:14px"><div class="rule"><b>BUILD</b>Turn weak requests into useful AI instructions.</div><div class="rule"><b>BREAK</b>Survive plot twists that make your first prompt fail.</div><div class="rule"><b>JUDGE</b>Decide whether the output actually fits the situation.</div></div><div class="actions"><button class="action" onclick="begin()">ENTER THE QUEST →</button></div></section>')}
function begin(){S.name=document.getElementById("name").value.trim()||"Team Context";S.level=0;S.xp=0;S.streak=0;S.best=0;save();map()}
function hud(){return '<div class="hud"><div class="hudTop"><b>'+esc(S.name)+'</b><div class="hudStats"><span class="stat">⚡ <b>'+S.xp+'</b> XP</span><span class="stat">🔥 <b>'+S.streak+'</b> STREAK</span></div></div><div class="map">'+LEVELS.map((l,i)=>'<div class="node '+(i<S.level?'done':i===S.level?'active':'')+'">'+(i<S.level?'✓ ':i===S.level?'▶ ':'🔒 ')+l.short+'</div>').join("")+'</div><div class="progress"><span style="width:'+(S.level/4*100)+'%"></span></div></div>'}
function map(){if(S.level>=4)return results();document.getElementById("app").innerHTML=shell(hud()+'<section class="hero"><div class="kicker">LEVEL '+(S.level+1)+' OF 4</div><h1>'+LEVELS[S.level].icon+' '+LEVELS[S.level].name+'</h1><p>'+LEVELS[S.level].blurb+'</p><button class="action gold" onclick="play()">LAUNCH MISSION →</button></section>')}
function deal(types){S.deal={prompt:pick("prompt")};types.forEach(t=>S.deal[t]=pick(t));S.success=pick("success");S.chaos="";S.draft="";save()}
function play(){if(S.level===3)return boss();const types=S.level===0?["audience","format","tone"]:S.level===1?["audience","format","goal","constraint"]:["audience","goal","constraint"];deal(types);renderPlay()}
function renderPlay(){const types=Object.keys(S.deal).filter(k=>k!=="prompt");document.getElementById("app").innerHTML=shell(hud()+'<section class="mission"><div class="missionHead"><div><div class="missionLabel">LEVEL '+(S.level+1)+' · '+LEVELS[S.level].name+'</div><b>BUILD THE PROMPT</b></div><span class="badge">'+LEVELS[S.level].icon+'</span></div><div class="missionBody"><div class="scenario"><b>STARTING PROMPT</b><br>'+esc(S.deal.prompt)+'</div><div class="question">Make this prompt fit the situation.</div><div class="deal">'+types.map(t=>'<div class="dealCard"><small>'+t+'</small><b>'+esc(S.deal[t])+'</b></div>').join("")+'</div><div class="success"><b>🏆 SUCCESS CARD:</b> '+esc(S.success)+'</div>'+(S.chaos?'<div class="chaos"><h3>💥 Plot Twist</h3><b>'+esc(S.chaos)+'</b><p>Repair your prompt. What changed—and why does it matter?</p></div>':'')+'<h3>YOUR PROMPT</h3><textarea id="draft" class="promptBox" placeholder="Write the prompt your team would actually give the AI...">'+esc(S.draft)+'</textarea><div class="powerRow"><button class="power" onclick="power(\'context\')">🔎 Context Scanner</button><button class="power" onclick="power(\'evidence\')">🛡 Evidence Check</button><button class="power" onclick="power(\'human\')">✋ Human Override</button></div><div class="actions"><button class="action" onclick="copyPrompt()">COPY + RUN IN AI</button><button class="action gray" onclick="redraw()">↻ REDRAW</button>'+(S.level===2&&!S.chaos?'<button class="action red" onclick="chaos()">💥 REVEAL CHAOS</button>':'')+'</div><hr style="border:0;border-top:4px solid #263c23;margin:22px 0"><div class="missionLabel">HUMAN JUDGMENT</div><h3>How well did the AI output meet the Success Card?</h3><div class="actions"><button class="action gray" onclick="score(1)">+100 · NEEDS WORK</button><button class="action gold" onclick="score(2)">+200 · SOLID</button><button class="action" onclick="score(3)">+300 · NAILED IT</button></div></div></section>')}
function redraw(){play();toast("New context dealt!")}
function chaos(){S.draft=document.getElementById("draft").value;S.chaos=pick("chaos");save();renderPlay();toast("PLOT TWIST! Repair the prompt.")}
function power(type){let box=document.getElementById("draft");let add=type==="context"?"\nBefore answering, identify any important context that is missing and ask for it.":type==="evidence"?"\nSeparate supported claims from assumptions and tell me how important claims should be verified.":"\nIdentify what judgment or decision should remain with a human.";box.value+=add;S.draft=box.value;toast("Power-up added!")}
function copyPrompt(){S.draft=document.getElementById("draft").value.trim();save();if(!S.draft)return toast("Build your prompt first.");navigator.clipboard?.writeText(S.draft);toast("Copied! Run it in your AI tool.")}
function score(n){S.draft=document.getElementById("draft").value;S.xp+=n*100;S.streak=n===3?S.streak+1:0;S.best=Math.max(S.best,S.streak);S.level++;save();complete(n)}
function complete(n){document.getElementById("app").innerHTML=shell(hud()+'<section class="card levelComplete"><div class="levelIcon">'+(n===3?"🏆":n===2?"⭐":"🧭")+'</div><div class="kicker">MISSION COMPLETE</div><h2>'+(n===3?"CONTEXT MASTERED":n===2?"STRONG BUILD":"ITERATE + IMPROVE")+'</h2><div class="scoreBig">+'+(n*100)+' XP</div><p>'+(S.level===3?"Next: reality changes. Your first prompt may not survive.":"You are learning that prompt quality depends on the situation—not a magic formula.")+'</p><button class="action gold" onclick="map()">CONTINUE →</button></section>')}
function boss(){S.deal={stakeholder:pick("stakeholder")};S.draft="";save();renderBoss()}
function renderBoss(){document.getElementById("app").innerHTML=shell(hud()+'<section class="mission"><div class="missionHead"><div><div class="missionLabel">👾 FINAL BOSS</div><b>STAKEHOLDER SWAP</b></div><span class="badge">BOSS FIGHT</span></div><div class="missionBody"><div class="scenario">A university wants an AI assistant that helps first-year students decide which courses to take.</div><div class="question">Design the AI interaction for: <u>'+esc(S.deal.stakeholder)+'</u></div><div class="success"><b>CONTEXT STACK:</b> WHO → WHAT → WHY → CONTEXT → CONSTRAINTS → OUTPUT → CHECK</div><textarea id="draft" class="promptBox" placeholder="What should the AI know? What should it do? What boundaries matter? What should a human still decide?">'+esc(S.draft)+'</textarea><div class="actions"><button class="action gold" onclick="swap()">🔄 SWAP STAKEHOLDER</button><button class="action" onclick="copyPrompt()">COPY + TEST</button><button class="action red" onclick="beatBoss()">DEFEAT FINAL BOSS →</button></div><p style="font-family:Inter,system-ui,sans-serif"><b>The trick:</b> when the stakeholder changes, your “perfect” prompt should need repair. That is the point.</p></div></section>')}
function swap(){S.draft=document.getElementById("draft").value;let old=S.deal.stakeholder;do{S.deal.stakeholder=pick("stakeholder")}while(S.deal.stakeholder===old);save();renderBoss();toast("Stakeholder changed. Repair your design!")}
function beatBoss(){S.draft=document.getElementById("draft").value;S.xp+=500;S.level=4;save();results()}
function results(){document.getElementById("app").innerHTML=shell('<section class="hero" style="background:#2f5f29;color:white"><div class="kicker" style="color:#ffe16f">QUEST COMPLETE</div><h1>YOU BEAT<br>THE PROMPT.</h1><div class="scoreBig">'+S.xp+' XP</div><p style="color:white">Best streak: '+S.best+'. But the real unlock is this:</p></section><section class="card levelComplete"><div class="levelIcon">🧠</div><h2>BETTER PROMPTING ISN\'T MAGIC WORDING.</h2><p style="font:20px/1.5 Inter,system-ui,sans-serif">It is better <b>specification</b> + better <b>judgment</b>.</p><div class="success">WHO → WHAT → WHY → CONTEXT → CONSTRAINTS → OUTPUT → CHECK</div><p>When the person, purpose, stakes, evidence, or consequences change, the prompt should change too.</p><button class="action gray" onclick="restart()">PLAY AGAIN</button></section>')}
function restart(){localStorage.removeItem("inf128-context-quest");S={name:"",level:0,xp:0,streak:0,best:0,deal:{},draft:"",chaos:"",success:""};start()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
load(); if(S.name&&S.level<4)map(); else if(S.level>=4)results(); else start();
</script></body></html>
