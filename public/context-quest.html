<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171421"><title>INF 128 · Context Quest</title>
<style>
:root{--ink:#171421;--cream:#fff8e8;--paper:#fffdf5;--purple:#7654d8;--pink:#ed5c8f;--orange:#f2a13b;--yellow:#f5d65d;--green:#5bbd82;--teal:#42b9b1;--blue:#4b83d1;--red:#db5a50;--muted:#756d7d;--shadow:#251f31}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{background:#eee6d7;background-image:radial-gradient(#d3c7b5 1px,transparent 1px);background-size:18px 18px}button,input,textarea{font:inherit}.wrap{width:min(1120px,100%);margin:auto;padding:18px 16px 70px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:white;border-radius:18px;padding:13px 16px;box-shadow:0 6px 0 #0003}.logo{font-weight:1000;letter-spacing:-.04em}.logo span{color:var(--yellow)}.tiny{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:900}.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;background:white;color:var(--ink);padding:7px 10px;font-size:12px;font-weight:900}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--shadow);padding:22px;margin:18px 0}.hero{background:linear-gradient(135deg,#fff9df,#f8d98e);overflow:hidden;position:relative}.hero:after{content:"?";position:absolute;right:18px;top:-42px;font-size:210px;font-weight:1000;color:#ffffff66;transform:rotate(12deg)}.hero h1{position:relative;z-index:1;font-size:clamp(48px,9vw,90px);line-height:.84;letter-spacing:-.075em;margin:10px 0;text-transform:uppercase}.hero p{position:relative;z-index:1;font-size:18px;line-height:1.45;max-width:760px}.btn{border:3px solid var(--ink);border-radius:13px;padding:13px 16px;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 var(--ink);background:var(--yellow);color:var(--ink);text-transform:uppercase}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.purple{background:var(--purple);color:white}.btn.red{background:var(--red);color:white}.btn.teal{background:var(--teal)}.btn.soft{background:white}.field,.prompt{width:100%;border:3px solid var(--ink);border-radius:13px;background:white;padding:14px;outline:none}.prompt{min-height:145px;resize:vertical;font-size:16px;line-height:1.45}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rule{border:3px solid var(--ink);border-radius:15px;padding:15px;background:white}.rule b{display:block;text-transform:uppercase;margin-bottom:4px}.hud{position:sticky;top:0;z-index:20;background:#eee6d7ee;backdrop-filter:blur(8px);padding:10px 0}.hudrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:flex;gap:7px;flex-wrap:wrap}.core{display:flex;gap:6px;flex-wrap:wrap}.gem{border:3px solid var(--ink);border-radius:10px;padding:7px 9px;background:#cfc8bd;color:#6c6570;font-size:11px;font-weight:1000}.gem.on{background:var(--yellow);color:var(--ink)}.board{position:relative;min-height:410px;background:#d8efd9;border:4px solid var(--ink);border-radius:28px;box-shadow:7px 7px 0 var(--shadow);overflow:hidden;margin:16px 0;background-image:radial-gradient(#9ccca1 2px,transparent 2px);background-size:28px 28px}.path{position:absolute;inset:20px}.space{position:absolute;width:82px;height:82px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:1000;line-height:1.05;box-shadow:0 5px 0 #0004;background:white}.space .ico{display:block;font-size:25px}.space.current{outline:6px solid #fff9;transform:scale(1.08)}.space.done{filter:saturate(.65)}.token{position:absolute;width:35px;height:35px;border:3px solid var(--ink);border-radius:50%;background:var(--purple);display:grid;place-items:center;color:white;font-weight:1000;box-shadow:0 3px 0 #0005;transition:.45s left,.45s top;z-index:5}.centerCore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;border:5px solid var(--ink);background:conic-gradient(var(--yellow),var(--pink),var(--purple),var(--teal),var(--yellow));display:grid;place-items:center;text-align:center;font-weight:1000;box-shadow:0 7px 0 #0004}.boardTitle{position:absolute;left:16px;top:14px;background:white;border:3px solid var(--ink);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:1000}.turn{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.stage{border:3px solid var(--ink);border-radius:18px;background:white;padding:18px}.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:1000;color:var(--purple)}.bigq{font-size:clamp(25px,4vw,39px);font-weight:1000;letter-spacing:-.045em;line-height:1.08;margin:9px 0 15px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gamecard{position:relative;min-height:112px;border:3px solid var(--ink);border-radius:16px;padding:13px;box-shadow:0 5px 0 var(--ink);background:var(--cream);transform:rotate(-.5deg)}.gamecard:nth-child(even){transform:rotate(.6deg)}.gamecard small{display:block;text-transform:uppercase;font-size:10px;font-weight:1000;letter-spacing:.09em;margin-bottom:7px}.gamecard b{font-size:17px}.success{background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:13px;font-weight:900;margin:12px 0}.chaos{background:#ffd9d3;border:4px solid var(--red);border-radius:16px;padding:15px;margin:12px 0;animation:pop .25s ease-out}.chaos h3{margin:0 0 5px;color:#9d3028}.actions,.powers{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.power{border:3px solid var(--ink);border-radius:999px;background:#e8defc;padding:8px 11px;font-size:11px;font-weight:1000;cursor:pointer}.judge{display:grid;gap:8px}.judge button{width:100%}.eventCard{text-align:center;padding:24px}.eventCard .icon{font-size:70px}.eventCard h2{font-size:42px;letter-spacing:-.05em;margin:8px 0}.reward{font-size:55px;font-weight:1000}.final{background:linear-gradient(135deg,#2b2341,#51386f);color:white}.final .stage{color:var(--ink)}.footer{text-align:center;color:#625a68;font-size:11px;font-weight:800;margin-top:28px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:var(--ink);color:white;border-radius:12px;padding:12px 15px;font-weight:900;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}@media(max-width:760px){.turn{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.board{min-height:500px}.space{width:68px;height:68px}.wrap{padding:10px 10px 50px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div id="app"></div></main><div id="toast" class="toast"></div>
<script src="/context-quest.js"></script></body></html>
