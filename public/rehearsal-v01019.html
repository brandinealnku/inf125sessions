<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowRunner · Rehearsal Guide</title><style>:root{font-family:Arial,sans-serif;color:#171717}body{margin:0;background:#eceae5}.page{max-width:920px;margin:28px auto;background:#fff;padding:46px 54px;box-shadow:0 10px 40px #0002}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;border-bottom:3px solid #171717;padding-bottom:22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.top h1{font:500 38px/1.05 Georgia,serif;margin:7px 0}.muted{color:#666}.print{border:0;background:#171717;color:#fff;border-radius:8px;padding:12px 16px;font-weight:800}.brief,.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:25px 0}.box,.cell{border:1px solid #bbb;border-radius:10px;padding:16px}.anchor{font:600 22px/1.3 Georgia,serif}.moment{break-inside:avoid;border-top:2px solid #222;padding:25px 0 8px}.momenthead{display:grid;grid-template-columns:90px 1fr;gap:15px}.time{font-weight:900}.moment h2{font:500 27px/1.15 Georgia,serif;margin:0 0 7px}.purpose{font-size:17px;line-height:1.45}.cell b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.cell p{margin:0;line-height:1.45}.talk{grid-column:1/-1;background:#f4f1e8}.footer{margin-top:30px;border-top:1px solid #aaa;padding-top:15px;color:#666;font-size:12px}@media(max-width:700px){.page{margin:0;padding:25px 20px}.brief,.grid{grid-template-columns:1fr}.talk{grid-column:auto}.top{flex-direction:column}}@media print{body{background:#fff}.page{max-width:none;margin:0;padding:0;box-shadow:none}.print{display:none}.moment{page-break-inside:avoid}@page{margin:.55in}}</style></head><body><main class="page"><header class="top"><div><div class="eyebrow">ShowRunner · Instructor rehearsal report</div><h1 id="title">Loading session…</h1><div class="muted" id="meta"></div></div><button class="print" onclick="window.print()">Print / Save PDF</button></header><section class="brief" id="brief"></section><div id="moments"></div><footer class="footer">Generated from the current ShowRunner build. Rehearse explanations, questions, misconceptions, transitions, and landing points before teaching.</footer></main><script src="/shared-v08.js"></script><script src="/v01019-moment-guides.js"></script><script src="/v01020-guides.js"></script><script>const C=Classroom,e=C.esc,G=window.ShowRunnerMomentGuides||{};function rb(x){let r=x.runbook||{};return{open:r.openWith||r.say||x.lead||'',ask:r.ask||r.askNext||'',listen:r.listenFor||r.watchFor||'',transition:r.transition||'',land:r.landHere||''}}function cell(l,t,c=''){return t?`<div class="cell ${c}"><b>${e(l)}</b><p>${e(t)}</p></div>`:''}(async()=>{await C.loadSession();const s=C.session;document.title=`${s.title} · Rehearsal Guide`;title.textContent=s.title;meta.textContent=`${s.steps.length} moments · ${s.durationMinutes} minutes · Session ${s.id}`;brief.innerHTML=`<div class="box"><div class="eyebrow">Session anchor</div><p class="anchor">DATA → MODEL / TOOL → OUTPUT → HUMAN DECISION</p><p>Use evidence to identify inputs, what the model/tool does, the output it produces, and the responsible human action that follows.</p></div><div class="box"><div class="eyebrow">Rehearsal checklist</div><p>□ Explain each example without reading.<br>□ Practice the main question aloud.<br>□ Anticipate the misconception.<br>□ Know the landing point.<br>□ Practice the transition.</p></div>`;let elapsed=0;moments.innerHTML=s.steps.map((x,i)=>{const start=elapsed;elapsed+=x.minutes||0;const g=G[x.key]||{},r=rb(x);return`<section class="moment"><div class="momenthead"><div class="time">${start}–${elapsed} min</div><div><div class="eyebrow">Moment ${i+1} · ${e(x.label||'')}</div><h2>${e(x.title)}</h2><div class="purpose">${e(g.purpose||x.lead||'')}</div></div></div><div class="grid">${cell('Topic background',g.background)}${cell('Explain it this way',g.explain,'talk')}${cell('Open with',r.open)}${cell('Ask',r.ask)}${cell('Likely student thinking',g.likely)}${cell('How to respond',g.respond)}${cell('Common misconception',g.mis)}${cell('Push deeper',g.deeper)}${cell('Listen for',r.listen)}${cell('Scope boundary',g.scope)}${cell('Land here',g.land||r.land)}${cell('Transition',r.transition)}</div></section>`}).join('')})();</script></body></html>
