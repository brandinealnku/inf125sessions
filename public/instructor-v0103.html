<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Showrunner · V0.10.3</title><link rel="stylesheet" href="/shared-v08.css"><style>:root{--bg:#090908;--panel:#11110f;--ink:#f4f1e8;--muted:#a29d93;--line:#2d2b27;--gold:#d8aa3d}html,body{margin:0;background:var(--bg);color:var(--ink)}.shell{max-width:1700px;margin:auto;padding:20px 22px 125px}.header{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:900}.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;gap:24px;margin-top:20px}.rail{border-right:1px solid var(--line);padding-right:16px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:18px}.rail button{width:100%;background:transparent;border:0;border-bottom:1px solid #20201d;color:#a29d93;text-align:left;padding:10px 3px}.rail button.active{color:#fff}.rail strong{display:block;font:500 15px Georgia,serif}.now h1{font:500 var(--director-now)/.94 Georgia,serif;letter-spacing:-.05em;margin:8px 0 18px}.cue{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px 17px;margin:10px 0}.cue.hot{border-left:3px solid var(--gold)}.cue b{display:block;color:var(--gold);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.cue p{margin:0;font-size:18px;line-height:1.45}.cue.say p{font:500 24px/1.35 Georgia,serif}.side{border-left:1px solid var(--line);padding-left:20px}.side h3{font:500 25px Georgia,serif;margin:5px 0}.side .small{color:#c8c2b7;line-height:1.45}.conditional{border:1px solid #4a3f24;background:#17130b;border-radius:14px;padding:15px;margin:12px 0}.conditional b{color:var(--gold)}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:900}.note{padding:10px 0}.note b{display:block;color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.note p{margin:4px 0;color:#d3cec4;line-height:1.45}.controls{position:fixed;left:0;right:0;bottom:0;background:#090908f2;border-top:1px solid var(--line);backdrop-filter:blur(14px)}.controlsIn{max-width:1700px;margin:auto;padding:10px 22px;display:flex;justify-content:space-between;gap:10px}.group{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #48453e;background:transparent;color:#fff;padding:11px 15px;border-radius:9px;font-weight:850;cursor:pointer;text-decoration:none}.btn.primary{background:#fff;color:#111}.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}@media(max-width:1050px){.grid{grid-template-columns:1fr 340px}.rail{display:none}}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);padding-left:0}.controlsIn{flex-wrap:wrap}.group{width:100%}.group .btn{flex:1}}</style></head><body><main class="shell"><header class="header"><div><div class="eyebrow">Showrunner · V0.10.3</div><strong id="brand">Loading…</strong></div><div id="status" class="eyebrow"></div></header><div class="grid"><nav class="rail" id="rail"></nav><section class="now" id="main"></section><aside class="side" id="side"></aside></div></main><footer class="controls"><div class="controlsIn" id="controls"></div></footer><script src="/shared-v08.js"></script><script>const C=Classroom,E=id=>document.getElementById(id),e=C.esc;let last='';function m(){return C.current()}function rb(){let r=m().runbook||{};return{openWith:r.openWith||r.say||m().lead||'',whyMatters:r.whyMatters||'',ask:r.ask||r.askNext||'',pause:r.pause||'',listenFor:r.listenFor||r.watchFor||'',ifTheySay:r.ifTheySay||'',ifQuiet:r.ifQuiet||r.ifStuck||'',pushFurther:r.pushFurther||'',revealWhen:r.revealWhen||r.advanceWhen||'',sayDuringReveal:r.sayDuringReveal||'',landHere:r.landHere||'',transition:r.transition||''}}function card(label,text,cls=''){return text?`<div class="cue ${cls}"><b>${label}</b><p>${e(text)}</p></div>`:''}function timeline(){E('rail').innerHTML=C.session.steps.map((x,i)=>`<button class="${i===C.snapshot.state.step?'active':''}" data-i="${i}"><span>${C.elapsed(i)}–${C.elapsed(i)+(x.minutes||0)} min</span><strong>${e(x.title)}</strong></button>`).join('');E('rail').querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>go(+x.dataset.i))}function roomRead(){let x=m();if(!x.key||!x.choices?.length)return'';let out=C.aggregate(x.key),meta=C.aggregateMeta(x.key),total=Math.max(1,meta.respondents),arr=x.choices.map(c=>[c,out[c]||0]).sort((a,b)=>b[1]-a[1]);if(meta.respondents<2)return'Not enough responses yet. Give the room a little more time.';let top=Math.round(arr[0][1]/total*100),second=Math.round((arr[1]?.[1]||0)/total*100);if(top>=70)return`The room is leaning strongly toward “${arr[0][0]}” (${top}%). Ask what assumption is driving that agreement.`;if(Math.abs(top-second)<=15)return`The room is split. Turn the disagreement into discussion before you reveal anything.`;return`“${arr[0][0]}” is leading at ${top}%. Ask one person from another position to explain their reasoning.`}function render(){let x=m(),r=rb(),next=C.session.steps[C.snapshot.state.step+1];E('brand').textContent=C.session.title;E('status').textContent=`${C.snapshot.participantCount} in room · ${C.elapsed(C.snapshot.state.step)}/${C.session.durationMinutes} min`;timeline();E('main').innerHTML=`<div class="eyebrow">NOW · ${e(x.label||'Moment')}</div><h1>${e(x.title)}</h1>${card('OPEN WITH',r.openWith,'say hot')}${card('ASK',r.ask,'hot')}${card('STUDENTS DO',x.studentTask)}${card('PAUSE',r.pause)}${card('LISTEN FOR',r.listenFor)}${card('LAND HERE',r.landHere,'hot')}`;let conditional=roomRead();E('side').innerHTML=`<div class="eyebrow">Live coaching</div><h3>Read the room.</h3>${conditional?`<div class="conditional"><b>RIGHT NOW</b><div class="small">${e(conditional)}</div></div>`:''}<details open><summary>Facilitation notes</summary>${note('Why this matters',r.whyMatters)}${note('If they say…',r.ifTheySay)}${note('If the room is quiet…',r.ifQuiet)}${note('Push further',r.pushFurther)}${note('Reveal when…',r.revealWhen)}${note('Say during reveal',r.sayDuringReveal)}</details>${next?`<details open><summary>Bridge to next</summary>${note('Say this',r.transition||`Now we move to ${next.title}.`)}</details>`:''}`;renderControls()}function note(l,t){return t?`<div class="note"><b>${l}</b><p>${e(t)}</p></div>`:''}function renderControls(){let st=C.snapshot.state;E('controls').innerHTML=`<div class="group"><button class="btn" id="back">Back</button><button class="btn ${st.locked?'gold':''}" id="commit">${st.locked?'Open responses':'Commit'}</button><button class="btn ${st.resultsVisible?'gold':''}" id="reveal">${st.resultsVisible?'Hide results':'Reveal'}</button><a class="btn" target="_blank" href="/room?session=${encodeURIComponent(C.session.id)}">Room</a></div><div class="group"><button class="btn primary" id="next">Next →</button></div>`;E('back').onclick=()=>go(st.step-1);E('commit').onclick=()=>setState({locked:!st.locked,roomMoment:{type:'commit'}});E('reveal').onclick=()=>setState({resultsVisible:!st.resultsVisible,locked:true,roomMoment:{type:'reveal'}});E('next').onclick=()=>go(st.step+1)}async function setState(p){await C.state(p);last='';await poll(true)}function go(i){i=Math.max(0,Math.min(C.session.steps.length-1,i));setState({step:i,locked:false,resultsVisible:false,roomMoment:null})}function key(){let s=C.snapshot.state;return[s.step,s.locked,s.resultsVisible,C.participation().count,C.snapshot.sessionEdits?.[s.step]?.updatedAt||0].join('|')}async function poll(force=false){await C.refresh();let k=key();if(force||k!==last){last=k;render()}}(async()=>{await C.loadSession();await poll(true);setInterval(()=>poll(),900)})();</script></body></html>
