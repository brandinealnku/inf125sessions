<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INF 125 Live · V0.3</title>
<style>
:root{--gold:#ffc800;--bg:#070707;--panel:#121212;--panel2:#181818;--line:#333;--text:#fff;--muted:#b8b8b8;--green:#b9ff8a;--red:#ff9f9f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{touch-action:manipulation}.top{height:8px;background:var(--gold)}.wrap{max-width:1180px;margin:auto;padding:28px}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(38px,6.6vw,76px);line-height:.98;letter-spacing:-.04em;margin:14px 0 18px}h2{font-size:clamp(24px,3.5vw,42px);line-height:1.08}.lead{font-size:clamp(18px,2.2vw,26px);line-height:1.4;color:#ddd;max-width:920px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin:20px 0}.hero{border:2px solid var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:24px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:105px}.flow .card{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900}.choice{width:100%;text-align:left;background:var(--panel);color:#fff;border:2px solid var(--line);border-radius:16px;padding:18px;font-weight:800;min-height:72px;cursor:pointer}.choice:hover,.choice.sel{border-color:var(--gold);color:var(--gold);background:#171300}.choice:disabled{opacity:.55;cursor:not-allowed}.primary,.secondary,.danger{border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:#000;border:0}.secondary{background:#202020;color:#fff;border:1px solid #555}.danger{background:#281111;color:#fff;border:1px solid #713333}input,textarea{width:100%;background:#111;color:#fff;border:1px solid #555;border-radius:13px;padding:14px;margin-top:10px;font-size:16px}textarea{min-height:120px}.join{max-width:620px;margin:8vh auto}.join input{font-size:21px;padding:17px}.join .primary{width:100%;margin-top:12px;font-size:19px}.status{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 24px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.locked{color:var(--red);border-color:#713333}.barRow{margin:14px 0}.barLabel{display:flex;justify-content:space-between;gap:12px;font-weight:800}.bar{height:28px;background:#242424;border-radius:8px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:var(--gold)}.count{font-size:62px;font-weight:950;color:var(--gold)}.response{border-left:4px solid var(--gold);padding:12px 14px;margin:10px 0;background:#101010;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.responseText{flex:1}.console{position:sticky;bottom:0;background:rgba(7,7,7,.98);border-top:1px solid #333;padding:12px 0;z-index:20}.consoleIn{max-width:1180px;margin:auto;padding:0 28px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:9px;flex-wrap:wrap}.muted{color:var(--muted)}.gold{color:var(--gold)}.command{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:18px}.timeline{display:grid;gap:8px}.timelineBtn{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}.timelineBtn.active{border-color:var(--gold);background:#171300}.timelineMin{font-weight:950;color:var(--gold)}.cue{font-size:15px;color:#d5d5d5;line-height:1.4}.timer{font-size:clamp(42px,7vw,82px);font-weight:950;letter-spacing:-.04em;color:var(--gold)}.timer.done{color:var(--red)}.spotlight{border:2px solid var(--gold);background:#171300}.spotlightQuote{font-size:clamp(27px,4vw,48px);line-height:1.2;font-weight:800}.display .wrap{max-width:1400px;padding:5vh 6vw}.display h1{font-size:clamp(54px,8vw,108px)}.display .lead{font-size:clamp(28px,3vw,42px);max-width:1200px}.display .status{display:none}.display .console{display:none}.display .panel{padding:30px}.pace{display:flex;justify-content:space-between;gap:14px;align-items:center}.paceTrack{height:8px;background:#242424;border-radius:999px;overflow:hidden;flex:1}.paceTrack span{display:block;height:100%;background:var(--gold)}.small{font-size:13px}.toast{position:fixed;right:18px;top:18px;background:#222;border:1px solid #555;padding:12px 16px;border-radius:12px;z-index:50}
@media(max-width:900px){.command{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.flow .card{min-height:68px}.wrap{padding:20px}.consoleIn{padding:0 20px}.group button{flex:1}.join{margin:4vh auto}.panel{padding:18px}.timelineBtn{grid-template-columns:55px 1fr}.timelineBtn .small{display:none}}
</style>
</head>
<body><div class="top"></div><div id="app"></div>
<script>
const qs=new URLSearchParams(location.search);
const mode=location.pathname==='/instructor'||qs.get('instructor')==='1'?'instructor':location.pathname==='/display'||qs.get('display')==='1'?'display':'student';
const instructor=mode==='instructor',display=mode==='display';
const device=localStorage.inf125Device||(localStorage.inf125Device=(crypto.randomUUID?crypto.randomUUID():'dev-'+Math.random().toString(36).slice(2)));
let name=localStorage.inf125Name||'';
let session={id:'session-2',title:'How AI Works',durationMinutes:75,framework:[],steps:[]};
let snapshot={state:{step:0,resultsVisible:false,status:'live',locked:false,timerEndsAt:null,spotlight:null},participantCount:0,participants:[],answers:{}};
let localAnswers=JSON.parse(localStorage.inf125Answers||'{}');
let pendingRender=false,timerTick=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const isEditing=()=>{const el=document.activeElement;return !!el&&el.matches?.('input,textarea,select,[contenteditable="true"]')};
async function loadSession(){session=await fetch('/sessions/how-ai-works.json',{cache:'no-store'}).then(r=>r.json())}
async function api(path,opts={}){const r=await fetch('/api/session/'+session.id+path,{headers:{'content-type':'application/json'},...opts});if(r.status===423)throw new Error('Responses are locked');if(!r.ok)throw new Error(await r.text());return r.json()}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
async function refresh(){try{snapshot=await api('/snapshot');if(isEditing()&&!instructor&&!display){pendingRender=true;return}pendingRender=false;render()}catch(e){console.error(e)}}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!isEditing()){pendingRender=false;render()}},0)});
async function join(){const input=document.getElementById('name');const v=input?.value.trim();if(!v)return;name=v.slice(0,40);localStorage.inf125Name=name;await api('/join',{method:'POST',body:JSON.stringify({device,name})});await refresh()}
async function heartbeat(){if(!name||instructor||display)return;try{await api('/heartbeat',{method:'POST',body:JSON.stringify({device})})}catch{}}
async function answer(key,response){try{localAnswers[key]=response;localStorage.inf125Answers=JSON.stringify(localAnswers);await api('/answer',{method:'POST',body:JSON.stringify({device,name:name||'Student',question:key,response})});await refresh()}catch(e){toast(e.message);delete localAnswers[key]}}
async function setState(patch){await api('/state',{method:'POST',body:JSON.stringify(patch)});await refresh()}
const goStep=i=>setState({step:Math.max(0,Math.min(session.steps.length-1,i)),resultsVisible:false,locked:false,timerEndsAt:null,spotlight:null,status:'live'});
const next=()=>goStep(snapshot.state.step+1),prev=()=>goStep(snapshot.state.step-1);
const toggleResults=()=>setState({resultsVisible:!snapshot.state.resultsVisible});
const toggleLock=()=>setState({locked:!snapshot.state.locked});
const clearSpotlight=()=>setState({spotlight:null});
async function spotlight(question,dev){await api('/spotlight',{method:'POST',body:JSON.stringify({question,device:dev,anonymous:true})});await refresh()}
async function resetClass(){if(!confirm('Reset the class session and clear responses?'))return;await api('/reset',{method:'POST',body:'{}'});localAnswers={};localStorage.inf125Answers='{}';await refresh()}
function startTimer(mins){setState({timerEndsAt:Date.now()+mins*60000})}
function stopTimer(){setState({timerEndsAt:null})}
function remainingMs(){return snapshot.state.timerEndsAt?Math.max(0,snapshot.state.timerEndsAt-Date.now()):0}
function timerHTML(){if(!snapshot.state.timerEndsAt)return '<div class="muted">No timer running</div>';const ms=remainingMs(),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `<div class="timer ${ms===0?'done':''}">${m}:${String(s).padStart(2,'0')}</div>`}
function aggregate(key){const rows=Object.values(snapshot.answers?.[key]||{});const out={};rows.forEach(x=>{if(typeof x.response==='string')out[x.response]=(out[x.response]||0)+1});return {rows,out}}
function bars(key,choices){const {rows,out}=aggregate(key),total=rows.length;return `<div class="panel"><div class="count">${total}</div><div class="muted">class responses</div>${choices.map(c=>{const n=out[c]||0,p=total?Math.round(n/total*100):0;return `<div class="barRow"><div class="barLabel"><span>${esc(c)}</span><span>${n} · ${p}%</span></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`}
function responseRows(key){const rows=Object.values(snapshot.answers?.[key]||{});return `<div class="panel"><h3>${rows.length} responses</h3>${rows.length?rows.slice().reverse().map(x=>`<div class="response"><div class="responseText"><b>${esc(x.name)}</b><br>${esc(typeof x.response==='string'?x.response:JSON.stringify(x.response))}</div>${instructor?`<button class="secondary" onclick='spotlight(${JSON.stringify(key)},${JSON.stringify(x.device)})'>Spotlight</button>`:''}</div>`).join(''):'<p class="muted">No responses yet.</p>'}</div>`}
function vote(s){const disabled=snapshot.state.locked?'disabled':'';return `<div class="grid">${s.choices.map(c=>`<button ${disabled} class="choice ${localAnswers[s.key]===c?'sel':''}" onclick='answer(${JSON.stringify(s.key)},${JSON.stringify(c)})'>${esc(c)}</button>`).join('')}</div>${instructor?(snapshot.state.resultsVisible?bars(s.key,s.choices):'<div class="panel"><b>Results hidden.</b> Reveal after students commit.</div>'):snapshot.state.locked?'<div class="panel"><b>Responses are locked.</b></div>':''}`}
function prompt(s){return `<div class="panel hero"><textarea id="prompt" ${snapshot.state.locked?'disabled':''} autocapitalize="sentences" spellcheck="true" placeholder="${esc(s.placeholder)}">${esc(localAnswers[s.key]||'')}</textarea><button class="primary" style="margin-top:12px" ${snapshot.state.locked?'disabled':''} onclick="answer(${JSON.stringify(s.key)},document.getElementById('prompt').value.trim())">Submit</button></div>${instructor?responseRows(s.key):''}`}
function build(s){const val=localAnswers[s.key]||{};return `<div class="grid">${s.fields.map(([k,l])=>`<div class="card"><div class="eyebrow">${esc(l)}</div><textarea id="f-${k}" ${snapshot.state.locked?'disabled':''} autocapitalize="sentences" spellcheck="true">${esc(val[k]||'')}</textarea></div>`).join('')}</div><button class="primary" ${snapshot.state.locked?'disabled':''} onclick="saveBuild()">Save my model</button>`}
function saveBuild(){const s=session.steps[snapshot.state.step],o={};s.fields.forEach(([k])=>o[k]=document.getElementById('f-'+k).value.trim());answer(s.key,o)}
function spotlightHTML(){const sp=snapshot.state.spotlight;if(!sp)return '';const text=typeof sp.response==='string'?sp.response:JSON.stringify(sp.response);return `<div class="panel spotlight"><div class="eyebrow">SPOTLIGHT</div><div class="spotlightQuote">“${esc(text)}”</div>${!sp.anonymous?`<p>${esc(sp.name)}</p>`:''}${instructor?'<button class="secondary" onclick="clearSpotlight()">Clear spotlight</button>':''}</div>`}
function activityContent(){const s=session.steps[Math.max(0,Math.min(session.steps.length-1,snapshot.state.step))];let h=`${spotlightHTML()}<div class="eyebrow">${esc(s.label)} · ${s.minutes} MIN</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead||'')}</p>`;
if(s.type==='welcome')h+=`<div class="panel hero"><h2 class="gold">Your screen is part of the classroom.</h2><p class="lead">When the instructor advances, this page advances with the room.</p></div>`;
if(s.type==='prompt')h+=prompt(s);
if(s.type==='teach')h+=`<div class="flow">${s.flow.map(x=>`<div class="card">${esc(x)}</div>`).join('')}</div>`;
if(s.type==='build')h+=build(s);
if(s.type==='vote')h+=vote(s);
if(s.type==='reveal')h+=bars(s.key,s.choices)+`<div class="panel hero"><h2>${esc(s.prompt||'What assumptions are hiding here?')}</h2></div>`;
if(s.type==='compare')h+=`<div class="grid">${s.compare.map(c=>`<div><div class="eyebrow">${esc(c.label)}</div>${bars(c.key,c.choices)}</div>`).join('')}</div><div class="panel hero"><h2>${esc(s.hero)}</h2></div>`;
if(s.closing)h+=`<div class="panel hero"><h2 class="gold">${esc(s.closing)}</h2></div>`;
return h}
function elapsedBefore(i){return session.steps.slice(0,i).reduce((a,s)=>a+s.minutes,0)}
function timelineHTML(){return `<div class="timeline">${session.steps.map((s,i)=>{const start=elapsedBefore(i),end=start+s.minutes;return `<button class="timelineBtn ${i===snapshot.state.step?'active':''}" onclick="goStep(${i})"><span class="timelineMin">${start}–${end}</span><span><b>${esc(s.label)}</b><br><span class="small muted">${esc(s.title)}</span></span><span class="small">${s.minutes}m</span></button>`}).join('')}</div>`}
function commandCenter(){const s=session.steps[snapshot.state.step],elapsed=elapsedBefore(snapshot.state.step),progress=Math.round(elapsed/session.durationMinutes*100);return `<main class="wrap"><div class="eyebrow">${esc(session.course)} · V0.3 INSTRUCTOR COMMAND CENTER</div><h1>${esc(session.title)}</h1><div class="status"><span class="pill"><span class="dot"></span>LIVE</span><span class="pill"><b>${snapshot.participantCount}</b> active</span><span class="pill">${snapshot.state.locked?'🔒 Responses locked':'Responses open'}</span><span class="pill">${elapsed}/${session.durationMinutes} min planned</span></div><div class="pace"><span class="small muted">Session pace</span><div class="paceTrack"><span style="width:${progress}%"></span></div><b>${progress}%</b></div><div class="command"><section><div class="panel hero"><div class="eyebrow">CURRENT · ${esc(s.label)} · ${s.minutes} MIN</div><h2>${esc(s.title)}</h2><p class="cue">${esc(s.instructorCue||'')}</p><div id="timer">${timerHTML()}</div><div class="group"><button class="primary" onclick="startTimer(${s.minutes})">Start ${s.minutes}-min timer</button><button class="secondary" onclick="startTimer(1)">1 min</button><button class="secondary" onclick="stopTimer()">Stop timer</button></div></div>${activityContent()}</section><aside><div class="panel"><div class="eyebrow">75-MINUTE RUN OF SHOW</div><h2>Jump anywhere</h2>${timelineHTML()}</div></aside></div></main>${consoleBar()}`}
function consoleBar(){return `<div class="console"><div class="consoleIn"><div class="group"><button class="secondary" onclick="prev()">← Back</button><button class="${snapshot.state.locked?'danger':'secondary'}" onclick="toggleLock()">${snapshot.state.locked?'Unlock responses':'Lock responses'}</button><button class="secondary" onclick="toggleResults()">${snapshot.state.resultsVisible?'Hide':'Reveal'} results</button></div><div class="group"><a class="secondary" href="/display" target="_blank" style="text-decoration:none">Open projector</a><button class="primary" onclick="next()">Next →</button><button class="danger" onclick="resetClass()">Reset</button></div></div></div>`}
function displayPage(){document.body.classList.add('display');return `<main class="wrap"><div class="eyebrow">${esc(session.course)} · LIVE · ${esc(session.title)}</div>${snapshot.state.timerEndsAt?`<div id="timer">${timerHTML()}</div>`:''}${activityContent()}</main>`}
function studentPage(){return `<main class="wrap"><div class="eyebrow">${esc(session.course)} · ${esc(session.title)} · STUDENT</div><div class="status"><span class="pill"><span class="dot"></span>LIVE</span><span class="pill">${snapshot.participantCount} active</span><span class="pill">${esc(name)}</span>${snapshot.state.locked?'<span class="pill locked">Responses locked</span>':''}</div>${snapshot.state.timerEndsAt?`<div id="timer">${timerHTML()}</div>`:''}${activityContent()}</main>`}
function render(){if(!session.steps.length)return;if(instructor){document.getElementById('app').innerHTML=commandCenter();return}if(display){document.getElementById('app').innerHTML=displayPage();return}if(!name){document.getElementById('app').innerHTML=`<main class="wrap join"><div class="eyebrow">${esc(session.course)} · LIVE</div><h1>${esc(session.title)}</h1><p class="lead">${session.durationMinutes} minutes. One shared experiment.</p><div class="panel hero"><label for="name"><b>First name or nickname</b></label><input id="name" maxlength="40" autocomplete="given-name" autocapitalize="words" enterkeyhint="go"><button class="primary" onclick="join()">Join class →</button></div></main>`;return}document.getElementById('app').innerHTML=studentPage()}
function tickTimer(){const el=document.getElementById('timer');if(el&&snapshot.state.timerEndsAt)el.innerHTML=timerHTML()}
async function boot(){await loadSession();render();await refresh();setInterval(refresh,1500);setInterval(heartbeat,30000);timerTick=setInterval(tickTimer,250)}
boot();
</script></body></html>
