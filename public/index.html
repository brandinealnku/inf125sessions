<!doctype html>

<title>INF 125 · Live Classroom</title>
<style>
:root{--gold:#f4c542;--gold2:#ffe28a;--bg:#070706;--panel:rgba(20,20,18,.76);--panel2:#151512;--line:rgba(244,197,66,.18);--text:#f8f7f2;--muted:#aaa79d;--green:#b8f5c5;--red:#ffaaaa;--shadow:0 28px 80px rgba(0,0,0,.34)}
*{box-sizing:border-box}html{background:var(--bg)}html,body{margin:0;min-height:100%;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 12% -10%,rgba(244,197,66,.10),transparent 32rem),radial-gradient(circle at 90% 10%,rgba(255,255,255,.035),transparent 28rem),var(--bg);background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:48px 48px}.top{height:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),transparent);box-shadow:0 0 28px rgba(244,197,66,.42)}button,input,textarea{font:inherit}button{touch-action:manipulation}.wrap{max-width:1220px;margin:auto;padding:40px 30px 110px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}h1{font-size:clamp(42px,7vw,88px);font-weight:720;line-height:.94;letter-spacing:-.055em;margin:18px 0 22px;max-width:1050px}h2{font-size:clamp(25px,3.5vw,44px);line-height:1.05;letter-spacing:-.035em}.lead{font-size:clamp(18px,2.1vw,25px);line-height:1.5;color:#d5d2c9;max-width:900px}.panel,.card{background:linear-gradient(145deg,rgba(26,26,23,.84),rgba(14,14,13,.88));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.panel{border-radius:26px;padding:26px;margin:22px 0}.hero{border-color:rgba(244,197,66,.48);box-shadow:0 30px 90px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.05)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:24px 0}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:28px 0}.card{border-radius:22px;padding:22px;min-height:110px}.flow .card{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;white-space:pre-line}.choice{position:relative;width:100%;text-align:left;background:linear-gradient(145deg,#171714,#0f0f0e);color:#f7f6f1;border:1px solid rgba(255,255,255,.11);border-radius:22px;padding:22px;font-weight:760;min-height:82px;cursor:pointer;transition:.22s ease;box-shadow:0 16px 45px rgba(0,0,0,.22)}.choice:hover{transform:translateY(-2px);border-color:rgba(244,197,66,.55)}.choice.sel{border-color:var(--gold);color:var(--gold2);background:linear-gradient(145deg,rgba(244,197,66,.14),rgba(18,16,8,.94));box-shadow:0 0 0 1px rgba(244,197,66,.12),0 22px 55px rgba(0,0,0,.34)}.choice:disabled{opacity:.5;cursor:not-allowed;transform:none}.primary,.secondary,.danger{border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;transition:.18s ease}.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;border:0;box-shadow:0 8px 30px rgba(244,197,66,.18)}.primary:hover,.secondary:hover{transform:translateY(-1px)}.secondary{background:rgba(255,255,255,.045);color:#f7f6f1;border:1px solid rgba(255,255,255,.14)}.danger{background:rgba(125,34,34,.2);color:#ffd7d7;border:1px solid rgba(255,120,120,.28)}input,textarea{width:100%;background:rgba(5,5,5,.62);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:16px;margin-top:12px;font-size:16px;outline:none;transition:.2s}input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(244,197,66,.08)}textarea{min-height:128px;resize:vertical}.join{max-width:680px;margin:9vh auto}.join:before{content:"INF 125  /  CUSTOMER 0";display:inline-block;color:var(--gold);font-size:10px;letter-spacing:.24em;margin-bottom:10px}.join input{font-size:20px;padding:18px}.join .primary{width:100%;margin-top:14px;font-size:18px;padding:16px}.status{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 26px}.pill{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.025);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(184,245,197,.7);margin-right:7px}.locked{color:var(--red);border-color:rgba(255,120,120,.24)}.barRow{margin:17px 0}.barLabel{display:flex;justify-content:space-between;gap:12px;font-weight:760}.bar{height:12px;background:#25241f;border-radius:999px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#b88712,var(--gold2));border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}.count{font-size:72px;line-height:1;font-weight:760;letter-spacing:-.06em;color:var(--gold2)}.response{border-left:2px solid var(--gold);padding:14px 16px;margin:10px 0;background:rgba(255,255,255,.025);display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border-radius:0 16px 16px 0}.responseText{flex:1}.console{position:fixed;left:0;right:0;bottom:0;background:rgba(7,7,6,.86);backdrop-filter:blur(24px);border-top:1px solid rgba(244,197,66,.14);padding:12px 0;z-index:20}.consoleIn{max-width:1220px;margin:auto;padding:0 30px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:9px;flex-wrap:wrap}.muted{color:var(--muted)}.gold{color:var(--gold2)}.command{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:20px}.timeline{display:grid;gap:8px}.timelineBtn{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.025);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:13px;cursor:pointer;transition:.18s}.timelineBtn:hover{border-color:rgba(244,197,66,.35)}.timelineBtn.active{border-color:rgba(244,197,66,.55);background:rgba(244,197,66,.08)}.timelineMin{font-weight:800;color:var(--gold2)}.cue{font-size:15px;color:#d1cec5;line-height:1.55}.timer{font-size:clamp(46px,7vw,86px);font-weight:700;letter-spacing:-.06em;color:var(--gold2);font-variant-numeric:tabular-nums}.timer.done{color:var(--red)}.spotlight{border-color:var(--gold);background:radial-gradient(circle at top left,rgba(244,197,66,.13),rgba(14,14,12,.94))}.spotlightQuote{font-size:clamp(29px,4vw,52px);line-height:1.18;font-weight:680;letter-spacing:-.035em}.display .wrap{max-width:1500px;padding:7vh 7vw}.display h1{font-size:clamp(64px,9vw,128px);max-width:1350px}.display .lead{font-size:clamp(28px,3vw,44px);max-width:1200px}.display .status,.display .console{display:none}.display .panel{padding:36px}.display .card{min-height:150px;font-size:clamp(18px,1.7vw,28px)}.pace{display:flex;justify-content:space-between;gap:14px;align-items:center}.paceTrack{height:5px;background:#24231f;border-radius:999px;overflow:hidden;flex:1}.paceTrack span{display:block;height:100%;background:linear-gradient(90deg,#a8780e,var(--gold2));transition:width .5s}.small{font-size:12px}.toast{position:fixed;right:20px;top:20px;background:rgba(20,20,18,.94);border:1px solid rgba(244,197,66,.25);padding:13px 17px;border-radius:16px;z-index:50;box-shadow:var(--shadow)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media(max-width:900px){.command{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.flow .card{min-height:70px}.wrap{padding:26px 18px 110px}.consoleIn{padding:0 18px}.group{width:100%}.group button,.group a{flex:1;text-align:center}.join{margin:5vh auto}.panel{padding:20px;border-radius:22px}.timelineBtn{grid-template-columns:55px 1fr}.timelineBtn .small{display:none}h1{font-size:clamp(40px,12vw,66px)}.choice{min-height:76px;padding:19px}.display .wrap{padding:5vh 6vw}}
</style>
</head><body><div class="top"></div><div id="app"></div><script>
const qs=new URLSearchParams(location.search),path=location.pathname.replace(/\/+$/,'')||'/';
const mode=path==='/instructor'||qs.get('instructor')==='1'?'instructor':path==='/display'||qs.get('display')==='1'?'display':'student';
const instructor=mode==='instructor',display=mode==='display';
const device=localStorage.inf125Device||(localStorage.inf125Device=(crypto.randomUUID?crypto.randomUUID():'dev-'+Math.random().toString(36).slice(2)));
let name=localStorage.inf125Name||'',session={id:'session-2',title:'How AI Works',durationMinutes:75,framework:[],steps:[]},snapshot={state:{step:0,resultsVisible:false,status:'live',locked:false,timerEndsAt:null,spotlight:null},participantCount:0,participants:[],answers:{}},localAnswers=JSON.parse(localStorage.inf125Answers||'{}'),pendingRender=false,timerTick=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const isEditing=()=>{const el=document.activeElement;return !!el&&el.matches?.('input,textarea,select,[contenteditable="true"]')};
async function loadSession(){session=await fetch('/sessions/how-ai-works.json',{cache:'no-store'}).then(r=>r.json())}
async function api(path,opts={}){const r=await fetch('/api/session/'+session.id+path,{headers:{'content-type':'application/json'},...opts});if(r.status===423)throw new Error('Responses are locked');if(!r.ok)throw new Error(await r.text());return r.json()}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
async function refresh(){try{snapshot=await api('/snapshot');if(isEditing()&&!instructor&&!display){pendingRender=true;return}pendingRender=false;render()}catch(e){console.error(e)}}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!isEditing()){pendingRender=false;render()}},0)});
async function join(){const input=document.getElementById('name'),v=input?.value.trim();if(!v)return;name=v.slice(0,40);localStorage.inf125Name=name;await api('/join',{method:'POST',body:JSON.stringify({device,name})});await refresh()}
async function heartbeat(){if(!name||instructor||display)return;try{await api('/heartbeat',{method:'POST',body:JSON.stringify({device})})}catch{}}
async function answer(key,response){try{localAnswers[key]=response;localStorage.inf125Answers=JSON.stringify(localAnswers);await api('/answer',{method:'POST',body:JSON.stringify({device,name:name||'Student',question:key,response})});await refresh()}catch(e){toast(e.message);delete localAnswers[key]}}
async function setState(patch){await api('/state',{method:'POST',body:JSON.stringify(patch)});await refresh()}
const goStep=i=>setState({step:Math.max(0,Math.min(session.steps.length-1,i)),resultsVisible:false,locked:false,timerEndsAt:null,spotlight:null,status:'live'}),next=()=>goStep(snapshot.state.step+1),prev=()=>goStep(snapshot.state.step-1),toggleResults=()=>setState({resultsVisible:!snapshot.state.resultsVisible}),toggleLock=()=>setState({locked:!snapshot.state.locked}),clearSpotlight=()=>setState({spotlight:null});
async function spotlight(question,dev){await api('/spotlight',{method:'POST',body:JSON.stringify({question,device:dev,anonymous:true})});await refresh()}
async function resetClass(){if(!confirm('Reset the class session and clear responses?'))return;await api('/reset',{method:'POST',body:'{}'});localAnswers={};localStorage.inf125Answers='{}';await refresh()}
function startTimer(mins){setState({timerEndsAt:Date.now()+mins*60000})}function stopTimer(){setState({timerEndsAt:null})}function remainingMs(){return snapshot.state.timerEndsAt?Math.max(0,snapshot.state.timerEndsAt-Date.now()):0}function timerHTML(){if(!snapshot.state.timerEndsAt)return '<div class="muted">Timer ready</div>';const ms=remainingMs(),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `<div class="timer ${ms===0?'done':''}">${m}:${String(s).padStart(2,'0')}</div>`}
function aggregate(key){const rows=Object.values(snapshot.answers?.[key]||{}),out={};rows.forEach(x=>{if(typeof x.response==='string')out[x.response]=(out[x.response]||0)+1});return{rows,out}}
function bars(key,choices){const{rows,out}=aggregate(key),total=rows.length;return `<div class="panel"><div class="eyebrow">CLASS PULSE</div><div class="count">${total}</div><div class="muted">responses in the room</div>${choices.map(c=>{const n=out[c]||0,p=total?Math.round(n/total*100):0;return `<div class="barRow"><div class="barLabel"><span>${esc(c)}</span><span>${p}%</span></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`}
function responseRows(key){const rows=Object.values(snapshot.answers?.[key]||{});return `<div class="panel"><div class="eyebrow">ROOM THINKING</div><h3>${rows.length} responses</h3>${rows.length?rows.slice().reverse().map(x=>`<div class="response"><div class="responseText"><b>${esc(x.name)}</b><br>${esc(typeof x.response==='string'?x.response:JSON.stringify(x.response))}</div>${instructor?`<button class="secondary" onclick='spotlight(${JSON.stringify(key)},${JSON.stringify(x.device)})'>Spotlight</button>`:''}</div>`).join(''):'<p class="muted">Waiting for the room.</p>'}</div>`}
function vote(s){if(display)return `<div class="grid">${s.choices.map(c=>`<div class="card"><b>${esc(c)}</b></div>`).join('')}</div>${snapshot.state.resultsVisible?bars(s.key,s.choices):''}`;if(instructor)return snapshot.state.resultsVisible?bars(s.key,s.choices):'<div class="panel"><div class="eyebrow">REVEAL HELD</div><h2>Let the room commit first.</h2><p class="muted">Results stay private until you reveal them.</p></div>';const disabled=snapshot.state.locked?'disabled':'';return `<div class="grid">${s.choices.map(c=>`<button ${disabled} class="choice ${localAnswers[s.key]===c?'sel':''}" onclick='answer(${JSON.stringify(s.key)},${JSON.stringify(c)})'>${esc(c)}</button>`).join('')}</div>${snapshot.state.locked?'<div class="panel"><b>Responses are locked.</b></div>':''}`}
function prompt(s){if(display)return `<div class="panel hero"><div class="eyebrow">YOUR TURN</div><h2>${esc(s.placeholder||'Think, then respond on your device.')}</h2></div>`;if(instructor)return responseRows(s.key);return `<div class="panel hero"><textarea id="prompt" ${snapshot.state.locked?'disabled':''} autocapitalize="sentences" spellcheck="true" placeholder="${esc(s.placeholder)}">${esc(localAnswers[s.key]||'')}</textarea><button class="primary" style="margin-top:14px" ${snapshot.state.locked?'disabled':''} onclick="answer(${JSON.stringify(s.key)},document.getElementById('prompt').value.trim())">Send to the room</button></div>`}
function build(s){if(display||instructor)return `<div class="flow">${s.fields.map(([,l])=>`<div class="card">${esc(l)}</div>`).join('')}</div>${instructor?`<div class="panel"><div class="eyebrow">MODELS SAVED</div><div class="count">${Object.keys(snapshot.answers?.[s.key]||{}).length}</div></div>`:''}`;const val=localAnswers[s.key]||{};return `<div class="grid">${s.fields.map(([k,l])=>`<div class="card"><div class="eyebrow">${esc(l)}</div><textarea id="f-${k}" ${snapshot.state.locked?'disabled':''} autocapitalize="sentences" spellcheck="true">${esc(val[k]||'')}</textarea></div>`).join('')}</div><button class="primary" ${snapshot.state.locked?'disabled':''} onclick="saveBuild()">Save my model</button>`}
function saveBuild(){const s=session.steps[snapshot.state.step],o={};s.fields.forEach(([k])=>o[k]=document.getElementById('f-'+k).value.trim());answer(s.key,o)}
function spotlightHTML(){const sp=snapshot.state.spotlight;if(!sp)return'';const text=typeof sp.response==='string'?sp.response:JSON.stringify(sp.response);return `<div class="panel spotlight"><div class="eyebrow">FROM THE ROOM · ANONYMOUS</div><div class="spotlightQuote">“${esc(text)}”</div>${instructor?'<button class="secondary" onclick="clearSpotlight()">Clear spotlight</button>':''}</div>`}
function activityContent(){const s=session.steps[Math.max(0,Math.min(session.steps.length-1,snapshot.state.step))];let h=`${spotlightHTML()}<div class="eyebrow">${esc(s.label)} · ${s.minutes} MIN</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead||'')}</p>`;if(s.hero)h+=`<div class="panel hero"><div class="eyebrow">THE SIGNAL</div><h2 class="gold">${esc(s.hero)}</h2></div>`;if(s.type==='welcome')h+=`<div class="panel hero"><h2 class="gold">Your screen is part of the classroom.</h2></div>`;if(s.type==='prompt')h+=prompt(s);if(s.type==='teach')h+=`<div class="flow">${s.flow.map(x=>`<div class="card">${esc(x)}</div>`).join('')}</div>`;if(s.type==='build')h+=build(s);if(s.type==='vote')h+=vote(s);if(s.type==='reveal')h+=bars(s.key,s.choices)+`<div class="panel hero"><h2>${esc(s.prompt||'What assumptions are hiding here?')}</h2></div>`;if(s.type==='compare')h+=`<div class="grid">${s.compare.map(c=>`<div><div class="eyebrow">${esc(c.label)}</div>${bars(c.key,c.choices)}</div>`).join('')}</div><div class="panel hero"><h2>${esc(s.hero)}</h2></div>`;if(s.closing)h+=`<div class="panel hero"><div class="eyebrow">TAKE THIS WITH YOU</div><h2 class="gold">${esc(s.closing)}</h2></div>`;return h}
function elapsedBefore(i){return session.steps.slice(0,i).reduce((a,s)=>a+s.minutes,0)}function timelineHTML(){return `<div class="timeline">${session.steps.map((s,i)=>{const start=elapsedBefore(i),end=start+s.minutes;return `<button class="timelineBtn ${i===snapshot.state.step?'active':''}" onclick="goStep(${i})"><span class="timelineMin">${start}–${end}</span><span><b>${esc(s.label)}</b><br><span class="small muted">${esc(s.title)}</span></span><span class="small">${s.minutes}m</span></button>`}).join('')}</div>`}
function commandCenter(){const s=session.steps[snapshot.state.step],elapsed=elapsedBefore(snapshot.state.step),progress=Math.round(elapsed/session.durationMinutes*100);return `<main class="wrap"><div class="eyebrow">${esc(session.course)} · CUSTOMER 0 · LIVE CONTROL</div><h1>${esc(session.title)}</h1><div class="status"><span class="pill"><span class="dot"></span>LIVE</span><span class="pill"><b>${snapshot.participantCount}</b> in room</span><span class="pill">${snapshot.state.locked?'🔒 Locked':'Responses open'}</span><span class="pill">${elapsed}/${session.durationMinutes} min</span></div><div class="pace"><span class="small muted">ROOM PACE</span><div class="paceTrack"><span style="width:${progress}%"></span></div><b>${progress}%</b></div><div class="command"><section><div class="panel hero"><div class="eyebrow">NOW · ${esc(s.label)} · ${s.minutes} MIN</div><h2>${esc(s.title)}</h2><p class="cue">${esc(s.instructorCue||'')}</p><div id="timer">${timerHTML()}</div><div class="group"><button class="primary" onclick="startTimer(${s.minutes})">Start ${s.minutes} min</button><button class="secondary" onclick="startTimer(1)">1 min</button><button class="secondary" onclick="stopTimer()">Stop</button></div></div>${activityContent()}</section><aside><div class="panel"><div class="eyebrow">75-MINUTE EXPERIENCE</div><h2>Run of show</h2>${timelineHTML()}</div></aside></div></main>${consoleBar()}`}
function consoleBar(){return `<div class="console"><div class="consoleIn"><div class="group"><button class="secondary" onclick="prev()">← Back</button><button class="${snapshot.state.locked?'danger':'secondary'}" onclick="toggleLock()">${snapshot.state.locked?'Unlock':'Lock'}</button><button class="secondary" onclick="toggleResults()">${snapshot.state.resultsVisible?'Hide':'Reveal'} results</button></div><div class="group"><a class="secondary" href="/?display=1" target="_blank" style="text-decoration:none">Projector ↗</a><button class="primary" onclick="next()">Next moment →</button><button class="danger" onclick="resetClass()">Reset</button></div></div></div>`}
function displayPage(){document.body.classList.add('display');return `<main class="wrap"><div class="eyebrow">${esc(session.course)} · LIVE EXPERIENCE</div>${snapshot.state.timerEndsAt?`<div id="timer">${timerHTML()}</div>`:''}${activityContent()}</main>`}
function studentPage(){return `<main class="wrap"><div class="eyebrow">${esc(session.course)} · LIVE · ${esc(session.title)}</div><div class="status"><span class="pill"><span class="dot"></span>CONNECTED</span><span class="pill">${snapshot.participantCount} in room</span><span class="pill">${esc(name)}</span>${snapshot.state.locked?'<span class="pill locked">Locked</span>':''}</div>${snapshot.state.timerEndsAt?`<div id="timer">${timerHTML()}</div>`:''}${activityContent()}</main>`}
function render(){if(!session.steps.length)return;if(instructor){document.getElementById('app').innerHTML=commandCenter();return}if(display){document.getElementById('app').innerHTML=displayPage();return}if(!name){document.getElementById('app').innerHTML=`<main class="wrap join"><div class="eyebrow">${esc(session.course)} · LIVE CLASSROOM</div><h1>${esc(session.title)}</h1><p class="lead">Not a presentation. A shared ${session.durationMinutes}-minute experiment.</p><div class="panel hero"><label for="name"><div class="eyebrow">ENTER THE ROOM</div><h2>What should we call you?</h2></label><input id="name" maxlength="40" autocomplete="given-name" autocapitalize="words" enterkeyhint="go" placeholder="First name or nickname"><button class="primary" onclick="join()">Enter experience →</button></div></main>`;return}document.getElementById('app').innerHTML=studentPage()}
function tickTimer(){const el=document.getElementById('timer');if(el&&snapshot.state.timerEndsAt)el.innerHTML=timerHTML()}async function boot(){await loadSession();render();await refresh();setInterval(refresh,1500);setInterval(heartbeat,30000);timerTick=setInterval(tickTimer,250)}boot();
</script></body></html>
