<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INF 125 Live · How AI Works</title>
<style>
:root{--gold:#ffc800;--bg:#070707;--panel:#121212;--line:#333;--text:#fff;--muted:#b8b8b8;--green:#b9ff8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}.top{height:8px;background:var(--gold)}.wrap{max-width:1160px;margin:auto;padding:28px}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(40px,7vw,78px);line-height:.96;letter-spacing:-.04em;margin:14px 0 18px}h2{font-size:clamp(26px,4vw,46px);line-height:1.05}.lead{font-size:clamp(18px,2.3vw,27px);line-height:1.35;color:#ddd;max-width:920px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin:20px 0}.hero{border:2px solid var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:24px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:110px}.flow .card{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900}.choice{width:100%;text-align:left;background:var(--panel);color:#fff;border:2px solid var(--line);border-radius:16px;padding:18px;font-weight:800;min-height:74px;cursor:pointer}.choice:hover,.choice.sel{border-color:var(--gold);color:var(--gold);background:#171300}.primary,.secondary,.danger{border-radius:13px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:#000;border:0}.secondary{background:#202020;color:#fff;border:1px solid #555}.danger{background:#281111;color:#fff;border:1px solid #713333}input,textarea{width:100%;background:#111;color:#fff;border:1px solid #555;border-radius:13px;padding:14px;margin-top:10px}textarea{min-height:120px}.join{max-width:620px;margin:8vh auto}.join input{font-size:21px;padding:17px}.join .primary{width:100%;margin-top:12px;font-size:19px}.status{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 28px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.barRow{margin:14px 0}.barLabel{display:flex;justify-content:space-between;gap:12px;font-weight:800}.bar{height:28px;background:#242424;border-radius:8px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:var(--gold)}.count{font-size:64px;font-weight:950;color:var(--gold)}.response{border-left:4px solid var(--gold);padding:10px 14px;margin:10px 0;background:#101010}.console{position:sticky;bottom:0;background:rgba(7,7,7,.97);border-top:1px solid #333;padding:14px 0}.consoleIn{max-width:1160px;margin:auto;padding:0 28px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:9px;flex-wrap:wrap}.muted{color:var(--muted)}.gold{color:var(--gold)}
@media(max-width:780px){.wrap{padding:20px}.flow{grid-template-columns:1fr}.flow .card{min-height:70px}.consoleIn{padding:0 20px}.group button{flex:1}}
</style>
</head>
<body><div class="top"></div><div id="app"></div>
<script>
const SESSION='session-2';
const instructor=new URLSearchParams(location.search).get('instructor')==='1';
const device=localStorage.inf125Device||(localStorage.inf125Device=(crypto.randomUUID?crypto.randomUUID():'dev-'+Math.random().toString(36).slice(2)));
let name=localStorage.inf125Name||'';
let snapshot={state:{step:0,resultsVisible:false,status:'waiting'},participantCount:0,participants:[],answers:{}};
let localAnswers=JSON.parse(localStorage.inf125Answers||'{}');
const steps=[
{type:'welcome',label:'OPEN',title:'30 people. One experiment.',lead:'Today you will build, test, challenge, and revise a model of how AI works.'},
{type:'prompt',label:'THINK',key:'needs',title:'What would an AI need to know before you trusted this answer?',lead:'You ask an AI system: “Should I drop my calculus course?” Name one piece of information it would need.',placeholder:'One thing the AI would need to know is…'},
{type:'teach',label:'TEACH',title:'Separate the system into five parts.',lead:'This lens will help us reason about almost any AI-supported decision.',flow:['DATA','MODEL / TOOL','OUTPUT','HUMAN INTERPRETATION','DECISION / ACTION']},
{type:'build',label:'DO',key:'flowbuild',title:'Build the system.',lead:'Describe what belongs in each part of the calculus-advice system.',fields:[['data','DATA'],['model','MODEL / TOOL'],['output','OUTPUT'],['human','HUMAN INTERPRETATION'],['decision','DECISION / ACTION']]},
{type:'vote',label:'PREDICT',key:'drop1',title:'Should the AI recommend dropping the course?',lead:'Known information: GPA 2.8 · Calculus grade D · Major: Computer Science',choices:['Recommend DROP','Recommend STAY','Not enough information']},
{type:'reveal',label:'REVEAL',key:'drop1',title:'The class has committed.',lead:'Now look at the system, not just the answer.',choices:['Recommend DROP','Recommend STAY','Not enough information']},
{type:'vote',label:'UPDATE',key:'drop2',title:'New information. Does your recommendation change?',lead:'Calculus is a prerequisite for three courses the student planned to take next semester.',choices:['Recommend DROP','Recommend STAY','Still not enough information']},
{type:'compare',label:'DISCUSS',title:'The information changed. So did the problem.',lead:'What does the shift tell us about data, models, and human judgment?'},
{type:'vote',label:'DO',key:'failure',title:'Where can this system fail?',lead:'Choose the point you think creates the greatest risk.',choices:['DATA: missing or biased information','MODEL / TOOL: bad assumptions or patterns','OUTPUT: misleading recommendation','HUMAN INTERPRETATION: over-trust or misunderstanding','DECISION / ACTION: consequences poorly considered']},
{type:'prompt',label:'THINK',key:'responsibility',title:'What is still the human’s job?',lead:'Complete the sentence in one strong thought.',placeholder:'Even with AI support, a human still needs to…'},
{type:'prompt',label:'EXIT',key:'exit',title:'What changed in your thinking today?',lead:'Write one thing you understand differently now about how AI systems work.',placeholder:'Before today I thought… Now I think…'},
{type:'finish',label:'DONE',title:'AI can support a decision. It does not remove responsibility.',lead:'DATA → MODEL / TOOL → OUTPUT → HUMAN INTERPRETATION → DECISION / ACTION'}
];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opts={}){const r=await fetch('/api/session/'+SESSION+path,{headers:{'content-type':'application/json'},...opts});if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){try{snapshot=await api('/snapshot');render()}catch(e){console.error(e)}}
async function join(){const v=document.getElementById('name').value.trim();if(!v)return;name=v.slice(0,40);localStorage.inf125Name=name;await api('/join',{method:'POST',body:JSON.stringify({device,name})});await refresh()}
async function heartbeat(){if(!name||instructor)return;try{await api('/heartbeat',{method:'POST',body:JSON.stringify({device})})}catch{}}
async function answer(key,response){localAnswers[key]=response;localStorage.inf125Answers=JSON.stringify(localAnswers);await api('/answer',{method:'POST',body:JSON.stringify({device,name:name||'Instructor',question:key,response})});await refresh()}
async function setState(patch){await api('/state',{method:'POST',body:JSON.stringify({...snapshot.state,...patch})});await refresh()}
const next=()=>setState({step:Math.min(steps.length-1,snapshot.state.step+1),resultsVisible:false,status:'live'});
const prev=()=>setState({step:Math.max(0,snapshot.state.step-1),resultsVisible:false});
const toggle=()=>setState({resultsVisible:!snapshot.state.resultsVisible});
async function resetClass(){if(!confirm('Reset the class session?'))return;await api('/reset',{method:'POST',body:'{}'});localAnswers={};localStorage.inf125Answers='{}';await refresh()}
function aggregate(key){const rows=Object.values(snapshot.answers?.[key]||{});const out={};rows.forEach(x=>{if(typeof x.response==='string')out[x.response]=(out[x.response]||0)+1});return {rows,out}}
function bars(key,choices){const {rows,out}=aggregate(key),total=rows.length;return `<div class="panel"><div class="count">${total}</div><div class="muted">class responses</div>${choices.map(c=>{const n=out[c]||0,p=total?Math.round(n/total*100):0;return `<div class="barRow"><div class="barLabel"><span>${esc(c)}</span><span>${n} · ${p}%</span></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`}
function responses(key){const rows=Object.values(snapshot.answers?.[key]||{});return `<div class="panel"><h3>${rows.length} responses</h3>${rows.length?rows.slice().reverse().map(x=>`<div class="response"><b>${esc(x.name)}</b><br>${esc(typeof x.response==='string'?x.response:JSON.stringify(x.response))}</div>`).join(''):'<p class="muted">No responses yet.</p>'}</div>`}
function vote(s){return `<div class="grid">${s.choices.map(c=>`<button class="choice ${localAnswers[s.key]===c?'sel':''}" onclick='answer(${JSON.stringify(s.key)},${JSON.stringify(c)})'>${esc(c)}</button>`).join('')}</div>${instructor?(snapshot.state.resultsVisible?bars(s.key,s.choices):'<div class="panel"><b>Results hidden.</b> Reveal them after students commit.</div>'):''}`}
function prompt(s){return `<div class="panel hero"><textarea id="prompt" placeholder="${esc(s.placeholder)}">${esc(localAnswers[s.key]||'')}</textarea><button class="primary" style="margin-top:12px" onclick="answer(${JSON.stringify(s.key)},document.getElementById('prompt').value.trim())">Submit</button></div>${instructor?responses(s.key):''}`}
function build(s){const val=localAnswers[s.key]||{};return `<div class="grid">${s.fields.map(([k,l])=>`<div class="card"><div class="eyebrow">${esc(l)}</div><textarea id="f-${k}">${esc(val[k]||'')}</textarea></div>`).join('')}</div><button class="primary" onclick="saveBuild()">Save my model</button>`}
function saveBuild(){const s=steps[snapshot.state.step],o={};s.fields.forEach(([k])=>o[k]=document.getElementById('f-'+k).value.trim());answer(s.key,o)}
function content(){const s=steps[Math.max(0,Math.min(steps.length-1,snapshot.state.step))];let h=`<div class="eyebrow">${esc(s.label)}</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead||'')}</p>`;
if(s.type==='welcome')h+=`<div class="panel hero"><h2 class="gold">Your screen is part of the classroom.</h2><p class="lead">When the instructor advances, this page advances with the room.</p></div>`;
if(s.type==='prompt')h+=prompt(s);
if(s.type==='teach')h+=`<div class="flow">${s.flow.map(x=>`<div class="card">${esc(x)}</div>`).join('')}</div>`;
if(s.type==='build')h+=build(s);
if(s.type==='vote')h+=vote(s);
if(s.type==='reveal')h+=bars(s.key,s.choices)+`<div class="panel hero"><h2>What assumptions are hiding behind these recommendations?</h2></div>`;
if(s.type==='compare')h+=`<div class="grid"><div>${bars('drop1',['Recommend DROP','Recommend STAY','Not enough information'])}</div><div>${bars('drop2',['Recommend DROP','Recommend STAY','Still not enough information'])}</div></div>`;
if(s.type==='finish')h+=`<div class="flow">${['DATA','MODEL / TOOL','OUTPUT','HUMAN INTERPRETATION','DECISION / ACTION'].map(x=>`<div class="card">${x}</div>`).join('')}</div>`;
return h}
function consoleBar(){return `<div class="console"><div class="consoleIn"><div class="group"><span class="pill"><b>${snapshot.participantCount}</b> active</span><span class="pill">Step ${snapshot.state.step+1}/${steps.length}</span><span class="pill">${snapshot.state.resultsVisible?'Results visible':'Results hidden'}</span></div><div class="group"><button class="secondary" onclick="prev()">← Back</button><button class="secondary" onclick="toggle()">${snapshot.state.resultsVisible?'Hide':'Reveal'} results</button><button class="primary" onclick="next()">Next →</button><button class="danger" onclick="resetClass()">Reset</button></div></div></div>`}
function render(){if(!instructor&&!name){document.getElementById('app').innerHTML=`<main class="wrap join"><div class="eyebrow">INF 125 · LIVE</div><h1>How AI Works</h1><p class="lead">30 people. One experiment.</p><div class="panel hero"><label><b>First name or nickname</b></label><input id="name" maxlength="40" autocomplete="off"><button class="primary" onclick="join()">Join class →</button></div></main>`;return}document.getElementById('app').innerHTML=`<main class="wrap"><div class="eyebrow">INF 125 · HOW AI WORKS · ${instructor?'INSTRUCTOR':'STUDENT'}</div><div class="status"><span class="pill"><span class="dot"></span>LIVE</span><span class="pill">${snapshot.participantCount} active</span>${name&&!instructor?`<span class="pill">${esc(name)}</span>`:''}</div>${snapshot.state.status==='waiting'&&!instructor?`<div class="panel hero"><h2>You're connected.</h2><p class="lead">Class will begin from this screen.</p></div>`:content()}</main>${instructor?consoleBar():''}`}
refresh();setInterval(refresh,1500);setInterval(heartbeat,30000);
</script></body></html>
