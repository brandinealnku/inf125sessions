<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room · V0.10.3</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{margin:0;background:#070706;color:#f7f3ea;overflow:hidden}.room{height:100svh;display:grid;place-items:center}.stage{width:100%;height:100%;padding:6vh 6vw;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(.58)}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#070706e8 0%,#0707069d 48%,#07070622 82%)}.content{position:relative;z-index:2;max-width:1450px}.kicker{font-size:var(--room-label);letter-spacing:.12em;text-transform:uppercase;color:#d8aa3d;font-weight:900}.headline{font:500 var(--room-hero)/.9 Georgia,serif;letter-spacing:-.055em;margin:12px 0;max-width:1300px}.sub{font-size:var(--room-support);line-height:1.28;color:#ddd6ca;max-width:1100px}.accent{font:500 clamp(88px,15vw,240px)/.82 Georgia,serif;color:#d8aa3d;letter-spacing:-.06em}.compare{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}.panel{border:1px solid #3a372f;background:#11110e;border-radius:24px;padding:34px;min-height:260px;display:flex;align-items:flex-end}.panel strong{font:500 clamp(36px,4vw,70px)/1 Georgia,serif}.quote{font:500 clamp(58px,7vw,120px)/.98 Georgia,serif;max-width:1300px}.quote:before{content:'“';color:#d8aa3d}.sequence{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}.seq{border:1px solid #3a372f;border-radius:20px;background:#11110e;padding:30px;font:500 clamp(30px,3vw,52px)/1 Georgia,serif;min-height:220px;display:flex;align-items:flex-end;animation:rise .5s ease both}.results{display:grid;gap:18px;margin-top:30px}.row{display:grid;grid-template-columns:minmax(250px,1.4fr) 3fr auto;gap:18px;align-items:center;font-size:var(--room-label)}.track{height:18px;background:#282720;border-radius:99px;overflow:hidden}.fill{height:100%;background:#d8aa3d;border-radius:99px;animation:grow .7s ease}.pct{font:500 var(--room-result) Georgia,serif}.shift{display:flex;align-items:flex-end;gap:38px}.shift strong{font:500 clamp(150px,24vw,350px)/.65 Georgia,serif;color:#d8aa3d}.shift span{font:500 clamp(45px,5vw,80px)/.95 Georgia,serif}.takeaway{text-align:center;max-width:1200px;margin:auto}.takeaway .headline{margin-inline:auto}.status{margin-top:24px;font-size:var(--room-label);color:#aaa49a}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes grow{from{width:0!important}}@media(max-width:800px){.compare,.sequence{grid-template-columns:1fr}.shift{display:block}}</style></head><body><main id="room" class="room"></main><script src="/shared-v08.js"></script><script>const C=Classroom,R=document.getElementById('room'),e=C.esc;let last='';function m(){return C.current()}function rb(){return m().runbook||{}}function scene(){let x=m();return x.visualScene||(x.visualType==='shift'?'shift':x.visualType==='live-results'?'data':x.mediaUrl?'evidence':'hook')}function wrap(inner,img=''){return`<section class="stage">${img?`<img class="bg" src="${e(img)}" style="object-position:${m().focalX??50}% ${m().focalY??50}%"><div class="veil"></div>`:''}<div class="content">${inner}</div></section>`}function core(){let x=m(),sc=scene(),head=e(x.mediaOverlay||x.title),sub=e(x.visualCaption||x.roomInstruction||x.lead||''),a=e(x.visualAccent||'');if(C.snapshot.state.resultsVisible&&x.choices)return results();if(sc==='shift')return shift();if(sc==='compare'){let c=x.choices||[];return wrap(`<div class="kicker">COMPARE</div><h1 class="headline">${head}</h1><div class="compare"><div class="panel"><strong>${e(c[0]||x.visualAccent||'Option A')}</strong></div><div class="panel"><strong>${e(c[1]||x.visualCaption||'Option B')}</strong></div></div>`)}if(sc==='sequence'){let items=(x.choices||[]).slice(0,3);return wrap(`<div class="kicker">SEQUENCE</div><h1 class="headline">${head}</h1><div class="sequence">${items.map((v,i)=>`<div class="seq" style="animation-delay:${i*.16}s">${e(v)}</div>`).join('')}</div>`)}if(sc==='quote')return wrap(`<div class="kicker">QUOTE</div><div class="quote">${e(x.visualAccent||x.title)}</div><div class="sub">${sub}</div>`,x.mediaUrl);if(sc==='data')return wrap(`<div class="kicker">DATA</div><div class="accent">${a||'—'}</div><h1 class="headline">${head}</h1><div class="sub">${sub}</div>`,x.mediaUrl);if(sc==='takeaway')return`<section class="stage"><div class="takeaway"><div class="kicker">TAKEAWAY</div><h1 class="headline">${head}</h1><div class="sub">${sub}</div></div></section>`;let label=sc==='reveal'?'REVEAL':sc==='evidence'?'EVIDENCE':sc==='profile'?'PROFILE':'HOOK';return wrap(`<div class="kicker">${label}</div><h1 class="headline">${head}</h1>${a?`<div class="accent">${a}</div>`:''}<div class="sub">${sub}</div>${x.key&&!C.snapshot.state.resultsVisible?`<div class="status">${C.participation().count} committed · results stay hidden.</div>`:''}`,x.mediaUrl)}function results(){let x=m(),out=C.aggregate(x.key),meta=C.aggregateMeta(x.key),total=Math.max(1,meta.respondents);return wrap(`<div class="kicker">THE ROOM ANSWERED</div><h1 class="headline">${e(x.title)}</h1><div class="results">${(x.choices||[]).map(c=>{let n=out[c]||0,p=Math.round(n/total*100);return`<div class="row"><b>${e(c)}</b><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="pct">${p}%</div></div>`}).join('')}</div>`)}function shift(){let v=C.changedMinds();return wrap(`<div class="kicker">THE ROOM MOVED</div><div class="shift"><strong>${v.changed}</strong><span>people changed<br>their minds.</span></div><div class="sub">${e(m().visualCaption||'New context changed the decision.')}</div>`)}function render(){R.innerHTML=core()}function key(){let s=C.snapshot.state;return[s.step,s.resultsVisible,s.roomMoment?.type||'',C.participation().count,C.snapshot.sessionEdits?.[s.step]?.updatedAt||0].join('|')}async function poll(force=false){await C.refresh();let k=key();if(force||k!==last){last=k;render()}}(async()=>{await C.loadSession();await poll(true);setInterval(()=>poll(),850)})();</script></body></html>
