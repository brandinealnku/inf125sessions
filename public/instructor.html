<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060605">
<title>INF 125 · Showrunner</title>
<style>
:root{--gold:#f3c84b;--gold2:#ffe59a;--bg:#060605;--panel:#11110f;--panel2:#171713;--line:rgba(243,200,75,.18);--text:#faf9f4;--muted:#aaa79d;--green:#b9f2c7;--red:#ffabab;--blue:#abd9ff;--shadow:0 24px 70px rgba(0,0,0,.34)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 12% -10%,rgba(243,200,75,.11),transparent 32rem),var(--bg)}button,a{font:inherit}button{touch-action:manipulation}.wrap{max-width:1500px;margin:auto;padding:28px 30px 110px}.eyebrow{color:var(--gold);font-size:10px;font-weight:850;letter-spacing:.2em;text-transform:uppercase}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:14px;font-weight:800}.status{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.025);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(185,242,199,.7);margin-right:7px}.shell{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,.55fr);gap:20px;margin-top:18px}.panel{background:linear-gradient(145deg,rgba(25,25,22,.9),rgba(12,12,11,.94));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.hero{border-color:rgba(243,200,75,.5)}h1{font-size:clamp(38px,5vw,68px);line-height:.95;letter-spacing:-.05em;margin:10px 0 14px}h2{font-size:26px;line-height:1.08;letter-spacing:-.03em;margin:8px 0 14px}h3{font-size:16px;margin:4px 0 8px}.muted{color:var(--muted)}.gold{color:var(--gold2)}.nowGrid{display:grid;grid-template-columns:1fr 220px;gap:18px}.timer{font-size:64px;font-weight:750;letter-spacing:-.06em;color:var(--gold2);font-variant-numeric:tabular-nums}.timerBox{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);padding-left:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border-radius:999px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));border:0;color:#111}.secondary{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:#fff}.danger{background:rgba(125,34,34,.2);border:1px solid rgba(255,120,120,.3);color:#ffd7d7}.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.guideCard{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;min-height:128px}.guideCard.say{border-color:rgba(243,200,75,.34);background:rgba(243,200,75,.045)}.guideCard.watch{border-color:rgba(171,217,255,.25)}.guideCard.advance{border-color:rgba(185,242,199,.24)}.guideText{font-size:15px;line-height:1.48;color:#e8e5dc}.quote{font-size:18px;line-height:1.45;font-weight:650}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.022)}.metricValue{font-size:30px;font-weight:780;color:var(--gold2);letter-spacing:-.04em}.metricLabel{font-size:11px;color:var(--muted);margin-top:3px}.pulse{margin-top:14px}.barRow{margin:10px 0}.barLabel{display:flex;justify-content:space-between;gap:10px;font-size:12px}.bar{height:7px;background:#292820;border-radius:999px;overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#a8780e,var(--gold2));border-radius:999px}.timeline{display:grid;gap:7px;max-height:calc(100vh - 165px);overflow:auto;padding-right:3px}.timelineBtn{width:100%;display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);color:#fff;border-radius:14px;padding:11px;cursor:pointer}.timelineBtn.active{border-color:rgba(243,200,75,.58);background:rgba(243,200,75,.07)}.timelineMin{font-weight:850;color:var(--gold2);font-size:12px}.timelineTitle{font-size:12px;color:var(--muted);margin-top:2px}.nextUp{margin-top:12px;padding:14px;border-radius:16px;background:rgba(243,200,75,.055);border:1px solid rgba(243,200,75,.2)}.console{position:fixed;bottom:0;left:0;right:0;background:rgba(6,6,5,.9);backdrop-filter:blur(24px);border-top:1px solid rgba(243,200,75,.14);z-index:20}.consoleIn{max-width:1500px;margin:auto;padding:11px 30px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.group{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;line-height:1.4;color:var(--muted)}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.timeline{max-height:none}.nowGrid{grid-template-columns:1fr}.timerBox{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.guide{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.wrap{padding:20px 14px 145px}.consoleIn{padding:10px 14px}.metrics{grid-template-columns:1fr 1fr}.group{width:100%}.group .btn{flex:1}.panel{padding:17px}}
</style>
</head><body><main class="wrap"><div class="topline"><div><div class="eyebrow">INF 125 · CUSTOMER 0</div><div class="brand">Instructor Showrunner · V0.5</div></div><div class="status" id="status"></div></div><div id="shell" class="shell"></div></main><div id="console"></div>
<script>
let session={steps:[]},snapshot={state:{step:0,resultsVisible:false,locked:false,timerEndsAt:null},participantCount:0,answers:{}},lastStructural='';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opts={}){const r=await fetch('/api/session/'+session.id+path,{headers:{'content-type':'application/json'},...opts});if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){session=await fetch('/sessions/how-ai-works.json',{cache:'no-store'}).then(r=>r.json());await refresh(true);setInterval(()=>refresh(false),1500);setInterval(tick,250)}
function elapsedBefore(i){return session.steps.slice(0,i).reduce((a,s)=>a+s.minutes,0)}
function aggregate(key){const rows=Object.values(snapshot.answers?.[key]||{}),out={};rows.forEach(x=>{if(typeof x.response==='string')out[x.response]=(out[x.response]||0)+1});return{rows,out}}
function changedMinds(){const b=snapshot.answers?.maya_before||{},a=snapshot.answers?.maya_after||{};let comparable=0,changed=0;Object.keys(b).forEach(id=>{if(a[id]){comparable++;if(b[id].response!==a[id].response)changed++}});return{comparable,changed,pct:comparable?Math.round(changed/comparable*100):0}}
function timerText(){if(!snapshot.state.timerEndsAt)return'READY';const ms=Math.max(0,snapshot.state.timerEndsAt-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,'0')}`}
function currentResponseCount(){const s=session.steps[snapshot.state.step];return s.key?aggregate(s.key).rows.length:0}
function structuralKey(){const s=snapshot.state;return [s.step,s.locked,s.resultsVisible,!!s.spotlight].join('|')}
async function refresh(force){try{snapshot=await api('/snapshot');renderStatus();if(force||structuralKey()!==lastStructural){lastStructural=structuralKey();renderShell();renderConsole()}else{renderLiveBits()}}catch(e){console.error(e)}}
function renderStatus(){const elapsed=elapsedBefore(snapshot.state.step);document.getElementById('status').innerHTML=`<span class="pill"><span class="dot"></span>LIVE</span><span class="pill"><b>${snapshot.participantCount}</b> students</span><span class="pill">${snapshot.state.locked?'RESPONSES LOCKED':'RESPONSES OPEN'}</span><span class="pill">${elapsed}/${session.durationMinutes} min</span>`}
function guideCard(label,text,cls=''){return `<div class="guideCard ${cls}"><div class="eyebrow">${esc(label)}</div><div class="guideText ${label==='SAY THIS'?'quote':''}">${esc(text||'—')}</div></div>`}
function responsePulse(s){if(!s.key||!s.choices)return'';const {rows,out}=aggregate(s.key),total=rows.length;return `<div class="pulse"><div class="eyebrow">LIVE RESPONSE SHAPE</div>${s.choices.map(c=>{const n=out[c]||0,p=total?Math.round(n/total*100):0;return `<div class="barRow"><div class="barLabel"><span>${esc(c)}</span><b>${p}%</b></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`}
function runbook(s){const r=s.runbook||{};return `<div class="guide">${guideCard('TEACHING GOAL',r.goal||s.instructorCue)}${guideCard('SAY THIS',r.say||s.instructorCue,'say')}${guideCard('ASK THE ROOM',r.ask||'Use the prompt on the projector and invite reasoning, not just answers.')}${guideCard('WATCH FOR',r.watchFor||'Listen for assumptions, uncertainty, and places where students confuse data with meaning.','watch')}${guideCard('ADVANCE WHEN',r.advanceWhen||`Most students have engaged and you are near the ${s.minutes}-minute mark.`,'advance')}${guideCard('IF THE ROOM STALLS',r.ifStuck||'Ask one student to explain what evidence changed their mind, then invite a contrasting view.')}${guideCard('TRANSITION',r.transition||'Connect the current insight to the next step in the five-part AI system.')}${guideCard('DON’T FORGET',r.reminder||'Keep the room moving. You do not need to hear every response.')}</div>`}
function liveMetrics(s){const responses=currentResponseCount(),participation=snapshot.participantCount?Math.round(responses/snapshot.participantCount*100):0,m=changedMinds(),remaining=session.durationMinutes-elapsedBefore(snapshot.state.step);return `<div class="metrics"><div class="metric"><div class="metricValue" id="m-responses">${responses}</div><div class="metricLabel">current responses</div></div><div class="metric"><div class="metricValue" id="m-participation">${participation}%</div><div class="metricLabel">room participation</div></div><div class="metric"><div class="metricValue" id="m-changed">${m.changed}</div><div class="metricLabel">changed minds so far</div></div><div class="metric"><div class="metricValue">${remaining}</div><div class="metricLabel">planned minutes remaining</div></div></div>`}
function timeline(){return `<div class="timeline">${session.steps.map((s,i)=>{const a=elapsedBefore(i),b=a+s.minutes;return `<button class="timelineBtn ${i===snapshot.state.step?'active':''}" onclick="goStep(${i})"><span class="timelineMin">${a}–${b}</span><span><b>${esc(s.label)}</b><div class="timelineTitle">${esc(s.title)}</div></span><span class="muted">${s.minutes}m</span></button>`}).join('')}</div>`}
function renderShell(){const s=session.steps[snapshot.state.step],next=session.steps[snapshot.state.step+1],r=s.runbook||{};document.getElementById('shell').innerHTML=`<section><div class="panel hero"><div class="nowGrid"><div><div class="eyebrow">NOW · ${esc(s.label)} · ${s.minutes} MIN</div><h1>${esc(s.title)}</h1><div class="muted">${esc(r.goal||s.instructorCue||'')}</div>${liveMetrics(s)}</div><div class="timerBox"><div class="eyebrow">ACTIVITY TIMER</div><div id="timer" class="timer">${timerText()}</div><div class="actions"><button class="btn primary" onclick="startTimer(${s.minutes})">Start ${s.minutes}m</button><button class="btn secondary" onclick="startTimer(1)">1m</button><button class="btn secondary" onclick="stopTimer()">Stop</button></div></div></div></div>${runbook(s)}${responsePulse(s)}</section><aside><div class="panel"><div class="eyebrow">75-MINUTE RUN OF SHOW</div><h2>Stay oriented</h2>${next?`<div class="nextUp"><div class="eyebrow">NEXT UP</div><b>${esc(next.label)}</b><div class="hint">${esc(next.title)} · ${next.minutes} min</div></div>`:''}${timeline()}</div></aside>`}
function renderLiveBits(){const s=session.steps[snapshot.state.step],responses=currentResponseCount(),participation=snapshot.participantCount?Math.round(responses/snapshot.participantCount*100):0,m=changedMinds();const a=document.getElementById('m-responses'),b=document.getElementById('m-participation'),c=document.getElementById('m-changed');if(a)a.textContent=responses;if(b)b.textContent=participation+'%';if(c)c.textContent=m.changed;const pulse=document.querySelector('.pulse');if(pulse&&s.key&&s.choices)pulse.outerHTML=responsePulse(s)}
function renderConsole(){document.getElementById('console').innerHTML=`<div class="console"><div class="consoleIn"><div class="group"><button class="btn secondary" onclick="prev()">← Back</button><button class="btn ${snapshot.state.locked?'danger':'secondary'}" onclick="toggleLock()">${snapshot.state.locked?'Unlock responses':'Lock responses'}</button><button class="btn secondary" onclick="toggleResults()">${snapshot.state.resultsVisible?'Hide':'Reveal'} results</button></div><div class="group"><a class="btn secondary" href="/?display=1" target="_blank">Projector ↗</a><button class="btn primary" onclick="next()">Next moment →</button><button class="btn danger" onclick="resetClass()">Reset</button></div></div></div>`}
async function setState(patch){await api('/state',{method:'POST',body:JSON.stringify(patch)});await refresh(true)}
function goStep(i){return setState({step:Math.max(0,Math.min(session.steps.length-1,i)),resultsVisible:false,locked:false,timerEndsAt:null,spotlight:null,status:'live'})}function next(){return goStep(snapshot.state.step+1)}function prev(){return goStep(snapshot.state.step-1)}function toggleLock(){return setState({locked:!snapshot.state.locked})}function toggleResults(){return setState({resultsVisible:!snapshot.state.resultsVisible})}function startTimer(m){return setState({timerEndsAt:Date.now()+m*60000})}function stopTimer(){return setState({timerEndsAt:null})}
async function resetClass(){if(!confirm('Reset the class session and clear all responses?'))return;await api('/reset',{method:'POST',body:'{}'});await refresh(true)}
function tick(){const el=document.getElementById('timer');if(el)el.textContent=timerText()}
load();
</script></body></html>
