<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060605"><title>INF 125 · Teaching Intelligence</title><style>
:root{--g:#f3c84b;--g2:#ffe59a;--bg:#060605;--p:#11110f;--line:rgba(243,200,75,.18);--t:#faf9f4;--m:#aaa79d;--ok:#b9f2c7;--blue:#abd9ff;--red:#ffabab}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 10% -10%,rgba(243,200,75,.11),transparent 34rem),var(--bg)}button,a{font:inherit}.wrap{max-width:1600px;margin:auto;padding:24px 26px 118px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.ey{color:var(--g);font-size:10px;font-weight:850;letter-spacing:.2em;text-transform:uppercase}.brand{font-size:15px;font-weight:800}.status,.modes,.actions{display:flex;gap:8px;flex-wrap:wrap}.pill,.btn{border-radius:999px;padding:8px 12px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);color:#fff}.pill{font-size:12px;color:var(--m)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 11px rgba(185,242,199,.6);margin-right:7px}.btn{cursor:pointer;font-weight:800}.btn.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g));color:#111}.btn.danger{color:#ffd7d7;border-color:rgba(255,120,120,.3)}.btn.active{border-color:var(--g);color:var(--g2);background:rgba(243,200,75,.10)}.grid{display:grid;grid-template-columns:280px minmax(0,1fr) 360px;gap:16px;margin-top:18px}.panel{background:linear-gradient(145deg,rgba(25,25,22,.92),rgba(12,12,11,.96));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.3)}.hero{border-color:rgba(243,200,75,.48)}h1{font-size:clamp(34px,4.8vw,64px);line-height:.96;letter-spacing:-.05em;margin:8px 0 12px}h2{font-size:24px;margin:6px 0 12px;letter-spacing:-.03em}.muted{color:var(--m)}.timeline{display:grid;gap:7px;max-height:calc(100vh - 160px);overflow:auto}.tbtn{width:100%;text-align:left;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);color:#fff;border-radius:13px;padding:10px;cursor:pointer}.tbtn.active{border-color:rgba(243,200,75,.58);background:rgba(243,200,75,.07)}.time{color:var(--g2);font-size:11px;font-weight:850}.small{font-size:11px;color:var(--m)}.presenter{position:sticky;top:8px;z-index:4;background:linear-gradient(145deg,rgba(31,27,13,.97),rgba(14,14,12,.98));border:1px solid rgba(243,200,75,.5);border-radius:20px;padding:16px;margin-bottom:14px}.presenterText{font-size:22px;line-height:1.35;font-weight:700}.then{margin-top:8px;color:var(--m);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.metric{border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:12px;background:rgba(255,255,255,.022)}.mv{font-size:28px;font-weight:800;color:var(--g2)}.ml{font-size:10px;color:var(--m);margin-top:3px}.intel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.intelCard{border-radius:18px;padding:15px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025)}.intelCard.read{border-color:rgba(171,217,255,.28)}.intelCard.move{border-color:rgba(185,242,199,.25)}.intelText{font-size:15px;line-height:1.48}.guide{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.gcard{border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;background:rgba(255,255,255,.02)}.gtext{font-size:14px;line-height:1.45}.timer{font-size:50px;font-weight:800;color:var(--g2);letter-spacing:-.05em}.barRow{margin:9px 0}.barLabel{display:flex;justify-content:space-between;gap:8px;font-size:11px}.bar{height:6px;background:#292820;border-radius:999px;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#a8780e,var(--g2))}.memory{margin-top:12px;padding:13px;border:1px solid rgba(243,200,75,.22);border-radius:16px;background:rgba(243,200,75,.05)}.console{position:fixed;bottom:0;left:0;right:0;background:rgba(6,6,5,.92);backdrop-filter:blur(24px);border-top:1px solid rgba(243,200,75,.14)}.consoleIn{max-width:1600px;margin:auto;padding:10px 26px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:1150px){.grid{grid-template-columns:1fr}.timeline{max-height:none}.intel,.guide{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{padding:18px 12px 150px}.consoleIn{padding:10px 12px}.metrics{grid-template-columns:1fr 1fr}.presenterText{font-size:18px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="ey">INF 125 · CUSTOMER 0</div><div class="brand">Teaching Intelligence · V0.6</div></div><div class="status" id="status"></div></div><div class="grid"><aside class="panel"><div class="ey">RUN OF SHOW</div><h2>75 minutes</h2><div id="timeline" class="timeline"></div></aside><section><div id="presenter"></div><div id="main"></div></section><aside><div class="panel"><div class="ey">PRODUCER</div><h2>Teaching modes</h2><div id="modes" class="modes"></div><div id="side"></div></div></aside></div></main><div id="console"></div><script>
let session={steps:[]},snapshot={state:{step:0,resultsVisible:false,locked:false,timerEndsAt:null,teachingMode:'think'},participantCount:0,answers:{}},struct='';const modes=['THINK','COMMIT','REVEAL','DISCUSS','CHALLENGE','REFLECT','CLOSE'];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(p,o={}){const r=await fetch('/api/session/'+session.id+p,{headers:{'content-type':'application/json'},...o});if(!r.ok)throw new Error(await r.text());return r.json()}function elapsed(i){return session.steps.slice(0,i).reduce((a,s)=>a+s.minutes,0)}function agg(k){const rows=Object.values(snapshot.answers?.[k]||{}),out={};rows.forEach(x=>typeof x.response==='string'&&(out[x.response]=(out[x.response]||0)+1));return{rows,out}}function changed(){const b=snapshot.answers?.maya_before||{},a=snapshot.answers?.maya_after||{};let n=0,c=0;Object.keys(b).forEach(id=>{if(a[id]){n++;if(b[id].response!==a[id].response)c++}});return{n,c,p:n?Math.round(c/n*100):0}}function current(){return session.steps[snapshot.state.step]}function responseCount(){const s=current();return s.key?agg(s.key).rows.length:0}function timer(){if(!snapshot.state.timerEndsAt)return'READY';const ms=Math.max(0,snapshot.state.timerEndsAt-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')}function liveRead(s){const total=responseCount(),part=snapshot.participantCount?Math.round(total/snapshot.participantCount*100):0;if(!s.key)return{label:'ROOM STATUS',text:'This is an instructor-led moment. Watch faces, questions, and hesitation more than response counts.',move:'Use the runbook, then advance when the core idea is clear.'};if(s.choices){const {out}=agg(s.key);let arr=s.choices.map(c=>[c,out[c]||0]).sort((a,b)=>b[1]-a[1]),top=arr[0]||['',0],second=arr[1]||['',0],gap=total?Math.round((top[1]-second[1])/total*100):0;if(part<55)return{label:'LOW PARTICIPATION',text:`Only ${part}% of the room has responded. The data is not stable yet.`,move:'Keep results hidden and give the room more time.'};if(gap<15)return{label:'ROOM SPLIT',text:`The room is divided. ${esc(top[0])} and ${esc(second[0])} are close.`,move:'Ask each side to explain the evidence behind its choice before revealing your interpretation.'};if(top[1]/Math.max(1,total)>.75)return{label:'STRONG CONSENSUS',text:`${Math.round(top[1]/total*100)}% are clustering around ${esc(top[0])}.`,move:'Challenge the majority: ask what assumption could make the dominant answer wrong.'};return{label:'EMERGING PATTERN',text:`${esc(top[0])} is leading, but the room is not fully aligned.`,move:'Ask for one defense of the leading answer and one contrasting rationale.'}}const rows=agg(s.key).rows;if(rows.length<3)return{label:'WAITING FOR SIGNAL',text:'Not enough written thinking yet to read the room.',move:'Give students another minute, then spotlight contrasting responses.'};return{label:'ROOM THINKING',text:`${rows.length} written responses are available. Look for repeated assumptions and contrasting rationales.`,move:'Spotlight two responses that reach different conclusions or use different evidence.'}}function metrics(){const s=current(),r=responseCount(),p=snapshot.participantCount?Math.round(r/snapshot.participantCount*100):0,m=changed(),rem=session.durationMinutes-elapsed(snapshot.state.step);return `<div class="metrics"><div class="metric"><div class="mv" id="mr">${r}</div><div class="ml">CURRENT RESPONSES</div></div><div class="metric"><div class="mv" id="mp">${p}%</div><div class="ml">PARTICIPATION</div></div><div class="metric"><div class="mv" id="mc">${m.c}</div><div class="ml">CHANGED MINDS</div></div><div class="metric"><div class="mv">${rem}</div><div class="ml">PLANNED MIN LEFT</div></div></div>`}function presenter(){const s=current(),r=s.runbook||{};document.getElementById('presenter').innerHTML=`<div class="presenter"><div class="ey">PRESENTER STRIP · ${esc(snapshot.state.teachingMode||'THINK')}</div><div class="presenterText">${esc(r.say||s.instructorCue||'Guide the room through the current moment.')}</div><div class="then"><b>THEN:</b> ${esc(r.ask||'Ask students to explain their reasoning.')}</div></div>`}function pulse(s){if(!s.key||!s.choices)return'';const {rows,out}=agg(s.key),t=rows.length;return `<div class="panel"><div class="ey">LIVE RESPONSE SHAPE</div>${s.choices.map(c=>{const n=out[c]||0,p=t?Math.round(n/t*100):0;return `<div class="barRow"><div class="barLabel"><span>${esc(c)}</span><b>${p}%</b></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`}function main(){const s=current(),r=s.runbook||{},lr=liveRead(s);document.getElementById('main').innerHTML=`<div class="panel hero"><div class="ey">NOW · ${esc(s.label)} · ${s.minutes} MIN</div><h1>${esc(s.title)}</h1><div class="muted">${esc(r.goal||s.instructorCue||'')}</div>${metrics()}<div class="actions"><button class="btn primary" onclick="startTimer(${s.minutes})">Start ${s.minutes}m</button><button class="btn" onclick="startTimer(1)">1m</button><button class="btn" onclick="stopTimer()">Stop</button><span class="timer" id="timer">${timer()}</span></div></div><div class="intel"><div class="intelCard read"><div class="ey">LIVE READ · ${lr.label}</div><div class="intelText">${lr.text}</div></div><div class="intelCard move"><div class="ey">NEXT BEST MOVE</div><div class="intelText">${lr.move}</div></div></div><div class="guide"><div class="gcard"><div class="ey">WATCH FOR</div><div class="gtext">${esc(r.watchFor||'Assumptions, uncertainty, and confusion between evidence and meaning.')}</div></div><div class="gcard"><div class="ey">ADVANCE WHEN</div><div class="gtext">${esc(r.advanceWhen||'Most students have engaged and the core idea is clear.')}</div></div><div class="gcard"><div class="ey">IF THE ROOM STALLS</div><div class="gtext">${esc(r.ifStuck||'Ask one student what evidence changed their mind, then invite a contrasting view.')}</div></div><div class="gcard"><div class="ey">TRANSITION</div><div class="gtext">${esc(r.transition||'Connect this insight to the next part of the AI system.')}</div></div></div>${pulse(s)}`}function side(){const s=current(),next=session.steps[snapshot.state.step+1],open=agg('predict_me_open');let memory='Opening vote not yet populated.';if(open.rows.length){const prove=open.out['PROVE IT — an app could predict me pretty well']||0,no=open.out['NO CHANCE — it would get important things about me wrong']||0,t=open.rows.length;memory=`Opening prediction: ${Math.round(prove/t*100)}% PROVE IT · ${Math.round(no/t*100)}% NO CHANCE.`}document.getElementById('side').innerHTML=`<div class="memory"><div class="ey">ROOM MEMORY</div><div class="small">${memory}</div>${snapshot.state.step>=8?'<div class="actions"><button class="btn" onclick="goStep(0)">Bring back opening</button></div>':''}</div>${next?`<div class="memory"><div class="ey">NEXT UP</div><b>${esc(next.label)}</b><div class="small">${esc(next.title)} · ${next.minutes} min</div></div>`:''}<div class="memory"><div class="ey">CURRENT TIMER</div><div class="timer" id="sideTimer">${timer()}</div></div>`}function timeline(){document.getElementById('timeline').innerHTML=session.steps.map((s,i)=>`<button class="tbtn ${i===snapshot.state.step?'active':''}" onclick="goStep(${i})"><div class="time">${elapsed(i)}–${elapsed(i)+s.minutes}</div><b>${esc(s.label)}</b><div class="small">${esc(s.title)}</div></button>`).join('')}function modesRender(){document.getElementById('modes').innerHTML=modes.map(m=>`<button class="btn ${String(snapshot.state.teachingMode||'THINK').toUpperCase()===m?'active':''}" onclick="setMode('${m.toLowerCase()}')">${m}</button>`).join('')}function status(){document.getElementById('status').innerHTML=`<span class="pill"><span class="dot"></span>LIVE</span><span class="pill"><b>${snapshot.participantCount}</b> students</span><span class="pill">${snapshot.state.locked?'LOCKED':'OPEN'}</span><span class="pill">${elapsed(snapshot.state.step)}/${session.durationMinutes} min</span>`}function structural(){return [snapshot.state.step,snapshot.state.locked,snapshot.state.resultsVisible,snapshot.state.teachingMode].join('|')}function renderAll(){status();presenter();main();side();timeline();modesRender();renderConsole()}function liveBits(){status();const s=current(),r=responseCount(),p=snapshot.participantCount?Math.round(r/snapshot.participantCount*100):0,m=changed();[['mr',r],['mp',p+'%'],['mc',m.c]].forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.textContent=v});main();side()}async function refresh(force=false){snapshot=await api('/snapshot');const k=structural();if(force||k!==struct){struct=k;renderAll()}else liveBits()}async function setState(p){await api('/state',{method:'POST',body:JSON.stringify(p)});await refresh(true)}function goStep(i){setState({step:Math.max(0,Math.min(session.steps.length-1,i)),resultsVisible:false,locked:false,timerEndsAt:null})}function next(){goStep(snapshot.state.step+1)}function prev(){goStep(snapshot.state.step-1)}function toggleLock(){setState({locked:!snapshot.state.locked})}function toggleResults(){setState({resultsVisible:!snapshot.state.resultsVisible})}function setMode(m){setState({teachingMode:m})}function startTimer(m){setState({timerEndsAt:Date.now()+m*60000})}function stopTimer(){setState({timerEndsAt:null})}async function resetClass(){if(!confirm('Reset class and clear all responses?'))return;await api('/reset',{method:'POST',body:'{}'});await refresh(true)}function renderConsole(){document.getElementById('console').innerHTML=`<div class="console"><div class="consoleIn"><div class="actions"><button class="btn" onclick="prev()">← Back</button><button class="btn ${snapshot.state.locked?'danger':''}" onclick="toggleLock()">${snapshot.state.locked?'Unlock':'Lock'}</button><button class="btn" onclick="toggleResults()">${snapshot.state.resultsVisible?'Hide':'Reveal'} results</button></div><div class="actions"><a class="btn" href="/?display=1" target="_blank">Projector ↗</a><button class="btn primary" onclick="next()">Next moment →</button><button class="btn danger" onclick="resetClass()">Reset</button></div></div></div>`}function tick(){const t=timer(),a=document.getElementById('timer'),b=document.getElementById('sideTimer');if(a)a.textContent=t;if(b)b.textContent=t}async function boot(){session=await fetch('/sessions/how-ai-works.json',{cache:'no-store'}).then(r=>r.json());await refresh(true);setInterval(()=>refresh(false),1500);setInterval(tick,250)}boot();
</script></body></html>
