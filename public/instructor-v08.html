<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0a"><title>Showrunner</title><link rel="stylesheet" href="/shared-v08.css"><style>:root{--bg:#0b0b0a;--panel:#121210;--text:#f4f1e8;--muted:#9e9a90;--line:#2c2b27;--gold:#d8aa3d}html,body{background:var(--bg);color:var(--text)}.shell{max-width:1700px;margin:auto;padding:20px 22px 126px}.header,.controlsIn{display:flex;justify-content:space-between;gap:12px;align-items:center}.header{padding-bottom:17px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);font-weight:900}.brand{font-weight:850}.live{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#77b183;display:inline-block}.grid{display:grid;grid-template-columns:225px minmax(0,1fr) 360px;gap:24px;margin-top:20px}.rail{border-right:1px solid var(--line);padding-right:15px;max-height:calc(100svh - 145px);overflow:auto;position:sticky;top:18px}.rail button{width:100%;border:0;border-bottom:1px solid #1e1e1b;background:transparent;color:#77746d;text-align:left;padding:10px 2px}.rail button.active{color:var(--text)}.time{display:block;font-size:10px;color:var(--gold);font-weight:800}.momentLabel{display:block;font-size:11px;font-weight:850}.momentTitle{display:block;font-family:Georgia,serif;font-size:14px;margin-top:2px}.nowTitle{font-family:Georgia,serif;font-size:clamp(42px,4.5vw,70px);line-height:.94;letter-spacing:-.05em;font-weight:500;margin:9px 0 18px}.cards{display:grid;gap:11px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:15px 17px}.card.hot{border-left:3px solid var(--gold)}.card b{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}.card p{font-size:17px;line-height:1.45;margin:0}.card.say p{font-family:Georgia,serif;font-size:22px}.side{border-left:1px solid var(--line);padding-left:20px}.sideBlock{padding:14px 0;border-bottom:1px solid var(--line)}.sideBlock p{line-height:1.45;color:#cbc6bb}.mediaPreview{margin-top:9px;border:1px solid #38362f;border-radius:12px;overflow:hidden;background:#090908;min-height:120px;display:grid;place-items:center}.mediaPreview img,.mediaPreview video{max-width:100%;max-height:210px;display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{border:1px solid var(--line);border-radius:10px;padding:11px}.stat strong{display:block;font-size:25px}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase}.controls{position:fixed;z-index:30;left:0;right:0;bottom:0;background:#0b0b0af2;border-top:1px solid var(--line);backdrop-filter:blur(15px)}.controlsIn{max-width:1700px;margin:auto;padding:10px 22px}.group{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #45433c;background:transparent;color:var(--text);padding:11px 14px;border-radius:8px;font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:var(--text);color:var(--bg)}.btn.accent{background:var(--gold);color:#111}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:80;padding:4vh 20px;overflow:auto}.modal.open{display:block}.sheet{width:min(920px,100%);margin:auto;background:#121210;border:1px solid #39372f;border-radius:18px;padding:22px}.sheetHead{display:flex;justify-content:space-between;align-items:center}.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.editField label{display:block;color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}.editField input,.editField textarea,.editField select{width:100%;background:#090908;color:#f4f1e8;border:1px solid #3c3a34;border-radius:9px;padding:12px;font:inherit}.editField textarea{min-height:90px;resize:vertical}.wide{grid-column:1/-1}.sectionTitle{grid-column:1/-1;padding-top:10px;border-top:1px solid #2f2d28;color:#f4f1e8;font-family:Georgia,serif;font-size:22px}.savebar{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}@media(max-width:1000px){.grid{grid-template-columns:1fr 320px}.rail{display:none}}@media(max-width:720px){.grid{grid-template-columns:1fr}.side{border:0;border-top:1px solid var(--line);padding:0}.editGrid{grid-template-columns:1fr}.wide,.sectionTitle{grid-column:auto}.controlsIn{flex-wrap:wrap}.group{width:100%}.group .btn{flex:1}.shell{padding:14px 14px 180px}}</style></head><body><main class="shell"><header class="header"><div><div class="eyebrow">Showrunner · V0.9.1</div><div class="brand" id="brand">Loading…</div></div><div class="live"><span class="dot"></span><span>Live</span><span id="people">0 in room</span><span id="clock">0/75 min</span></div></header><div class="grid"><nav class="rail"><div class="eyebrow">Run of show</div><div id="rail"></div></nav><section id="main"></section><aside class="side" id="side"></aside></div><div id="error"></div></main><footer class="controls"><div class="controlsIn" id="controls"></div></footer><div class="modal" id="editor"><div class="sheet"><div class="sheetHead"><div><div class="eyebrow">Edit this moment</div><div class="brand">Text + media go live to the Room</div></div><button class="btn" id="cancelEdit">Close</button></div><div class="editGrid" id="editGrid"></div><div class="savebar"><button class="btn primary" id="saveEdit">Save live changes</button></div></div></div><script src="/shared-v08.js"></script><script src="/learning-aids-v084.js"></script><script src="/visual-canvas-v091.js"></script><script>const C=Classroom,E=id=>document.getElementById(id),brand=E('brand'),people=E('people'),clock=E('clock'),rail=E('rail'),main=E('main'),side=E('side'),controls=E('controls'),errorBox=E('error'),editor=E('editor'),editGrid=E('editGrid');let struct='';function s(){return C.current()}function rb(){return s().runbook||{}}function preset(){return(window.VisualCanvas||{})[C.snapshot.state.step]||{}}function timeline(){rail.innerHTML=C.session.steps.map((m,i)=>`<button class="${i===C.snapshot.state.step?'active':''}" data-step="${i}"><span class="time">${C.elapsed(i)}–${C.elapsed(i)+(m.minutes||0)} min</span><span class="momentLabel">${C.esc(m.label)}</span><span class="momentTitle">${C.esc(m.title)}</span></button>`).join('');rail.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step))}function card(label,text,cls=''){return text?`<div class="card ${cls}"><b>${label}</b><p>${C.esc(text)}</p></div>`:''}function visualInfo(){let x=s(),p=preset(),type=x.visualType||p.type||'auto';return{type,url:x.mediaUrl||'',fit:x.mediaFit||'cover',overlay:x.mediaOverlay||p.overlay||'',reveal:x.mediaReveal||'immediate'}}function preview(v){if(!v.url)return`<div class="mediaPreview"><span>${C.esc(v.type.toUpperCase())}</span></div>`;if(v.type==='video')return`<div class="mediaPreview"><video src="${C.esc(v.url)}" muted playsinline controls></video></div>`;return`<div class="mediaPreview"><img src="${C.esc(v.url)}" alt="Visual preview"></div>`}function render(){let x=s(),r=rb(),p=C.participation(),v=visualInfo(),n=C.session.steps[C.snapshot.state.step+1];brand.textContent=C.session.title;timeline();main.innerHTML=`<div class="eyebrow">Now · ${C.esc(x.label)}</div><h1 class="nowTitle">${C.esc(x.title)}</h1><div class="cards">${card('Say this',r.say||x.lead,'say hot')}${card('Students do',x.studentTask||r.studentDoes)}${card('Ask next',r.askNext)}${card('Land here',r.landHere||x.teachReveal?.headline,'hot')}</div><div class="stats"><div class="stat"><strong id="responses">${p.count}</strong><span>responses</span></div><div class="stat"><strong id="participation">${p.percent}%</strong><span>participation</span></div><div class="stat"><strong>${C.elapsed(C.snapshot.state.step)}</strong><span>planned min</span></div></div>`;side.innerHTML=`<div class="sideBlock"><div class="eyebrow">Visual canvas</div><p><strong>${C.esc(v.type)}</strong>${v.reveal==='on-reveal'?' · held until Reveal':''}</p>${preview(v)}</div><div class="sideBlock"><div class="eyebrow">Transition</div><p>${C.esc(r.transition||'Bridge explicitly to what changes next.')}</p></div>${n?`<div class="sideBlock"><div class="eyebrow">Next</div><p><strong>${C.esc(n.label)}</strong><br>${C.esc(n.title)}</p></div>`:''}`;renderControls();people.textContent=C.snapshot.participantCount+' in room';clock.textContent=C.elapsed(C.snapshot.state.step)+'/'+C.session.durationMinutes+' min'}function renderControls(){let st=C.snapshot.state,v=visualInfo();controls.innerHTML=`<div class="group"><button class="btn" id="editBtn">Edit moment</button><button class="btn" id="backBtn">Back</button><button class="btn ${st.locked?'accent':''}" id="lockBtn">${st.locked?'Open':'Commit'}</button><button class="btn ${st.resultsVisible?'accent':''}" id="revealBtn">${st.resultsVisible?'Hide':'Reveal'}</button><button class="btn ${st.roomMoment?.type==='media'?'accent':''}" id="mediaBtn">${st.roomMoment?.type==='media'?'Hide visual':'Show visual'}</button></div><div class="group"><a class="btn" target="_blank" href="/room">Room</a><button class="btn primary" id="nextBtn">Next</button></div>`;E('editBtn').onclick=openEditor;E('backBtn').onclick=()=>go(st.step-1);E('lockBtn').onclick=()=>setState({locked:!st.locked,roomMoment:{type:'commit'}});E('revealBtn').onclick=()=>setState({resultsVisible:!st.resultsVisible,locked:true,roomMoment:{type:'reveal'}});E('mediaBtn').onclick=()=>setState({roomMoment:st.roomMoment?.type==='media'?null:{type:'media'}});E('nextBtn').onclick=()=>go(st.step+1)}function field(k,label,value,wide=true){return`<div class="editField ${wide?'wide':''}"><label>${label}</label>${String(value||'').length>70?`<textarea data-field="${k}">${C.esc(value||'')}</textarea>`:`<input data-field="${k}" value="${C.esc(value||'')}">`}</div>`}function selectField(k,label,value,opts){return`<div class="editField"><label>${label}</label><select data-field="${k}">${opts.map(o=>`<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('')}</select></div>`}function openEditor(){let x=s(),r=rb(),p=preset(),v=visualInfo();editGrid.innerHTML=field('label','Moment label',x.label,false)+field('title','Student / Room headline',x.title)+field('lead','Lead',x.lead)+field('studentTask','Student direction',x.studentTask)+field('roomInstruction','Room direction',x.roomInstruction)+field('say','Say this',r.say)+field('askNext','Ask next',r.askNext)+field('landHere','Land here',r.landHere)+field('transition','Transition',r.transition)+`<div class="sectionTitle">Visual Canvas + Media</div>`+selectField('visualType','Visual type',x.visualType||p.type||'auto',['auto','gif','image','video','statement','split','flow','profile','sequence','live-results','none'])+selectField('mediaFit','Media fit',x.mediaFit||'cover',['cover','contain','split'])+field('mediaUrl','GIF / image / video URL',x.mediaUrl||'')+field('mediaOverlay','Overlay headline',x.mediaOverlay||p.overlay||'')+selectField('mediaReveal','Show media',x.mediaReveal||'immediate',['immediate','on-reveal']);editor.classList.add('open')}E('cancelEdit').onclick=()=>editor.classList.remove('open');E('saveEdit').onclick=async()=>{let fields={};editGrid.querySelectorAll('[data-field]').forEach(i=>fields[i.dataset.field]=i.value.trim());E('saveEdit').textContent='Saving…';await C.edit(C.snapshot.state.step,fields);E('saveEdit').textContent='Save live changes';editor.classList.remove('open');struct='';render()};async function setState(p){await C.state(p);struct='';await poll(true)}function go(i){i=Math.max(0,Math.min(C.session.steps.length-1,i));setState({step:i,locked:false,resultsVisible:false,roomMoment:null})}function key(){let st=C.snapshot.state,ed=C.snapshot.sessionEdits?.[st.step]?.updatedAt||0;return[st.step,st.locked,st.resultsVisible,st.roomMoment?.type||'',ed].join('|')}async function poll(force=false){try{await C.refresh();let k=key();if(force||k!==struct){struct=k;render()}else{let p=C.participation();if(E('responses'))E('responses').textContent=p.count;if(E('participation'))E('participation').textContent=p.percent+'%';people.textContent=C.snapshot.participantCount+' in room'}}catch(e){errorBox.textContent='Connection interrupted. Retrying…'}}(async()=>{try{await C.loadSession();await poll(true);setInterval(()=>poll(),900)}catch(e){errorBox.textContent='Showrunner could not load.'}})();</script></body></html>
