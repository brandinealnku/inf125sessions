<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0a"><title>Showrunner</title><link rel="stylesheet" href="/shared-v08.css"><style>
:root{--bg:#0b0b0a;--panel:#11110f;--panel2:#151512;--text:#f4f1e8;--muted2:#99958b;--line2:#2c2b27;--accent2:#d8aa3d}html,body{background:var(--bg);color:var(--text)}body{overflow-x:hidden}.top{height:3px;background:var(--accent2)}.shell{max-width:1600px;margin:auto;padding:20px 22px 96px}.header{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:10px 0 18px;border-bottom:1px solid var(--line2)}.brand{font-weight:850;letter-spacing:-.02em}.live{display:flex;gap:18px;align-items:center;color:var(--muted2);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#77b183;margin-right:6px}.grid{display:grid;grid-template-columns:245px minmax(0,1fr) 330px;gap:26px;margin-top:22px}.rail{border-right:1px solid var(--line2);padding-right:18px;max-height:calc(100svh - 145px);overflow:auto;position:sticky;top:18px}.railTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.rail button,.drawerList button{width:100%;border:0;border-bottom:1px solid #1e1e1b;background:transparent;color:#77746d;text-align:left;padding:12px 3px;cursor:pointer}.rail button.active,.drawerList button.active{color:var(--text)}.time{display:block;font-size:10px;color:var(--accent2);font-weight:800;letter-spacing:.04em;margin-bottom:3px}.momentLabel{display:block;font-size:12px;font-weight:800}.momentTitle{display:block;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.2;margin-top:3px}.main{min-width:0}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);font-weight:800}.nowTitle{font-family:Georgia,"Times New Roman",serif;font-size:clamp(46px,5vw,78px);line-height:.94;letter-spacing:-.045em;font-weight:500;margin:12px 0 22px}.say{font-family:Georgia,"Times New Roman",serif;font-size:clamp(21px,2vw,29px);line-height:1.4;color:#e7e2d7;max-width:900px;padding:20px 0 26px;border-bottom:1px solid var(--line2)}.room{padding:22px 0}.roomStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.stat{border:1px solid var(--line2);background:var(--panel);padding:16px;border-radius:12px}.stat strong{display:block;font-size:32px;letter-spacing:-.04em}.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}.signal{margin-top:18px;border-left:2px solid var(--accent2);padding:4px 0 4px 14px;font-size:18px;line-height:1.45}.next{border-left:1px solid var(--line2);padding-left:22px}.nextMove{font-family:Georgia,"Times New Roman",serif;font-size:31px;line-height:1.08;margin:10px 0 26px}.upNext{padding:18px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);line-height:1.45;color:#d2cec4}.guidance{margin-top:18px}.guidance summary{cursor:pointer;font-weight:800}.guideItem{margin-top:16px;color:#b7b2a8;line-height:1.45}.guideItem b{display:block;color:var(--text);font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}.controls{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(11,11,10,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line2)}.controlsIn{max-width:1600px;margin:auto;padding:11px 22px;display:flex;justify-content:space-between;gap:10px}.group{display:flex;gap:8px}.btn{border:1px solid #45433c;background:transparent;color:var(--text);padding:11px 14px;border-radius:8px;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.accent{background:var(--accent2);color:#14130e;border-color:var(--accent2)}.btn.danger{border-color:#784747;color:#e0a7a7}.showrunnerBtn{display:none}.drawer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:60}.drawer.open{display:block}.drawerSheet{height:100%;width:min(88vw,420px);overflow:auto;background:#10100f;padding:22px 18px 100px;border-right:1px solid var(--line2)}.drawerHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line2);padding-bottom:14px}.close{border:1px solid #45433c;background:transparent;color:var(--text);width:42px;height:42px;border-radius:8px;font-size:20px}.error{color:#e3a3a3;padding:20px}@media(max-width:1050px){.grid{grid-template-columns:minmax(0,1fr) 300px}.rail{display:none}.showrunnerBtn{display:inline-flex}.header{align-items:flex-start}.live{flex-wrap:wrap;justify-content:flex-end}}@media(max-width:760px){.shell{padding:14px 14px 132px}.grid{grid-template-columns:1fr}.next{border-left:0;border-top:1px solid var(--line2);padding:20px 0 0}.roomStats{grid-template-columns:repeat(3,1fr)}.controlsIn{padding:9px 14px;flex-wrap:wrap}.group{width:100%}.group .btn{flex:1;text-align:center}.header{gap:10px}.live{gap:9px}.nowTitle{font-size:48px}}@media(max-width:480px){.roomStats{grid-template-columns:1fr}.stat strong{font-size:28px}}
</style></head><body><div class="top"></div><main class="shell"><header class="header"><div><div class="eyebrow">Showrunner</div><div class="brand" id="brand">Loading session…</div></div><div class="live"><button class="btn showrunnerBtn" id="showrunnerBtn">Showrunner</button><span><span class="dot"></span>Live</span><span id="people">0 in room</span><span id="clock">0/75 min</span></div></header><div class="grid"><nav class="rail" aria-label="Showrunner"><div class="railTitle"><span class="eyebrow">Run of show</span></div><div id="rail"></div></nav><section class="main" id="main"></section><aside class="next" id="next"></aside></div><div id="error" class="error" role="alert"></div></main><footer class="controls"><div class="controlsIn" id="controls"></div></footer><div class="drawer" id="drawer"><aside class="drawerSheet"><div class="drawerHead"><div><div class="eyebrow">75-minute session</div><div class="brand">Showrunner</div></div><button class="close" id="close" aria-label="Close">×</button></div><div class="drawerList" id="drawerList"></div></aside></div><script src="/shared-v08.js"></script><script>
const C=Classroom;let struct='';function s(){return C.current()}function runbook(){return s().runbook||{}}function signal(){const step=s(),p=C.participation(),n=p.count;if(!step.key)return{label:'Room',text:'Watch the room, not the screen.',move:runbook().advanceWhen||'Advance when the idea lands.'};if(step.choices){const out=C.aggregate(step.key),ordered=step.choices.map(c=>[c,out[c]||0]).sort((a,b)=>b[1]-a[1]),top=ordered[0]||['',0],second=ordered[1]||['',0],gap=n?Math.round((top[1]-second[1])/n*100):0;if(p.percent<60)return{label:'Still forming',text:`${p.percent}% have committed.`,move:'Hold the reveal. Give the room another moment.'};if(gap<15)return{label:'Split room',text:'The room is genuinely divided.',move:'Ask each side what evidence it is using.'};if(top[1]/Math.max(1,n)>.75)return{label:'Strong consensus',text:'The room strongly agrees.',move:'Challenge the majority before validating it.'};return{label:'Emerging pattern',text:`${top[0]} is leading, but not decisively.`,move:'Ask for one defense and one counterpoint.'}}if(n<3)return{label:'Waiting',text:'Written thinking is still arriving.',move:'Give the room another moment.'};return{label:'Room thinking',text:`${n} written responses are in.`,move:'Surface two responses that reason differently.'}}
function timeline(target){target.innerHTML=C.session.steps.map((m,i)=>`<button class="${i===C.snapshot.state.step?'active':''}" data-step="${i}"><span class="time">${C.elapsed(i)}–${C.elapsed(i)+(m.minutes||0)}</span><span class="momentLabel">${C.esc(m.label)}</span><span class="momentTitle">${C.esc(m.title)}</span></button>`).join('');target.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)))}
function renderStructural(){const step=s(),r=runbook(),sig=signal(),p=C.participation(),next=C.session.steps[C.snapshot.state.step+1];document.getElementById('brand').textContent=C.session.title;timeline(document.getElementById('rail'));timeline(document.getElementById('drawerList'));document.getElementById('main').innerHTML=`<div class="eyebrow">Now · ${C.esc(step.label||'Moment')}</div><h1 class="nowTitle">${C.esc(step.title)}</h1><div class="say">${C.esc(r.say||step.instructorCue||'Guide the room through this moment.')}</div><section class="room"><div class="eyebrow">Room</div><div class="roomStats"><div class="stat"><strong id="responses">${p.count}</strong><span>responses</span></div><div class="stat"><strong id="participation">${p.percent}%</strong><span>participation</span></div><div class="stat"><strong id="timer">${C.timerText()}</strong><span>timer</span></div></div><div class="signal"><span class="eyebrow" id="signalLabel">${C.esc(sig.label)}</span><br><span id="signalText">${C.esc(sig.text)}</span></div></section>`;document.getElementById('next').innerHTML=`<div class="eyebrow">Next move</div><div class="nextMove" id="nextMove">${C.esc(sig.move)}</div>${next?`<div class="upNext"><span class="eyebrow">Up next</span><br><b>${C.esc(next.label)}</b><br>${C.esc(next.title)} · ${next.minutes} min</div>`:''}<details class="guidance"><summary>More guidance</summary><div class="guideItem"><b>Watch for</b>${C.esc(r.watchFor||'Assumptions, hesitation, and competing reasoning.')}</div><div class="guideItem"><b>If room stalls</b>${C.esc(r.ifStuck||'Ask what evidence changed someone’s mind.')}</div><div class="guideItem"><b>Transition</b>${C.esc(r.transition||'Connect this moment to what comes next.')}</div>${r.reminder?`<div class="guideItem"><b>Remember</b>${C.esc(r.reminder)}</div>`:''}</details>`;renderControls();updateHeader()}
function renderControls(){const st=C.snapshot.state;document.getElementById('controls').innerHTML=`<div class="group"><button class="btn" id="back">Back</button><button class="btn ${st.locked?'danger':''}" id="lock">${st.locked?'Open responses':'Commit'}</button><button class="btn ${st.resultsVisible?'accent':''}" id="reveal">${st.resultsVisible?'Hide reveal':'Reveal'}</button></div><div class="group"><a class="btn" target="_blank" href="/room">Room</a><button class="btn primary" id="forward">Next</button></div>`;back.onclick=()=>go(C.snapshot.state.step-1);lock.onclick=()=>setState({locked:!st.locked,resultsVisible:st.locked?false:st.resultsVisible,roomMoment:st.locked?null:{type:'commit'}});reveal.onclick=()=>setState({resultsVisible:!st.resultsVisible,locked:!st.resultsVisible?true:st.locked,roomMoment:!st.resultsVisible?{type:'reveal'}:null});forward.onclick=()=>go(C.snapshot.state.step+1)}
function updateHeader(){document.getElementById('people').textContent=C.snapshot.participantCount+' in room';document.getElementById('clock').textContent=C.elapsed(C.snapshot.state.step)+'/'+C.session.durationMinutes+' min'}
function live(){updateHeader();const p=C.participation(),sig=signal();[['responses',p.count],['participation',p.percent+'%'],['timer',C.timerText()],['signalLabel',sig.label],['signalText',sig.text],['nextMove',sig.move]].forEach(([id,v])=>{const e=document.getElementById(id);if(e&&e.textContent!==String(v))e.textContent=v})}
function key(){const st=C.snapshot.state;return[st.step,st.locked,st.resultsVisible,st.spotlight?1:0,st.roomMoment?.type||''].join('|')}
async function poll(force=false){try{await C.refresh();const k=key();if(force||k!==struct){struct=k;renderStructural()}else live()}catch(e){document.getElementById('error').textContent='Connection interrupted. Retrying…'}}
async function setState(p){await C.state(p);struct='';await poll(true)}function go(i){i=Math.max(0,Math.min(C.session.steps.length-1,i));setState({step:i,locked:false,resultsVisible:false,timerEndsAt:null,spotlight:null,roomMoment:null})}
showrunnerBtn.onclick=()=>drawer.classList.add('open');close.onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')drawer.classList.remove('open')});setInterval(()=>{const e=document.getElementById('timer');if(e)e.textContent=C.timerText()},250);
(async()=>{try{await C.loadSession();await poll(true);setInterval(()=>poll(false),1500)}catch(e){document.getElementById('error').textContent='Showrunner could not load.'}})();
</script></body></html>
