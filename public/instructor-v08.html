<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0a"><title>Showrunner</title><link rel="stylesheet" href="/shared-v08.css"><style>:root{--bg:#0b0b0a;--panel:#121210;--text:#f4f1e8;--muted2:#9e9a90;--line2:#2c2b27;--accent2:#d8aa3d}html,body{background:var(--bg);color:var(--text)}.top{height:3px;background:var(--accent2)}.shell{max-width:1700px;margin:auto;padding:18px 22px 112px}.header{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:10px 0 18px;border-bottom:1px solid var(--line2)}.brand{font-weight:850}.live{display:flex;gap:16px;align-items:center;color:var(--muted2);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#77b183;margin-right:5px}.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 390px;gap:24px;margin-top:20px}.rail{border-right:1px solid var(--line2);padding-right:16px;max-height:calc(100svh - 145px);overflow:auto;position:sticky;top:18px}.rail button,.drawerList button{width:100%;border:0;border-bottom:1px solid #1e1e1b;background:transparent;color:#77746d;text-align:left;padding:10px 2px}.rail button.active,.drawerList button.active{color:var(--text)}.time{display:block;font-size:10px;color:var(--accent2);font-weight:800}.momentLabel{display:block;font-size:11px;font-weight:850}.momentTitle{display:block;font-family:Georgia,serif;font-size:14px;margin-top:2px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);font-weight:850}.nowTitle{font-family:Georgia,serif;font-size:clamp(42px,4.5vw,70px);line-height:.95;letter-spacing:-.045em;font-weight:500;margin:10px 0 20px}.facilitate{display:grid;gap:12px}.card{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:16px 18px}.card.hot{border-left:3px solid var(--accent2)}.card b{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent2);margin-bottom:7px}.card p{font-size:17px;line-height:1.5;margin:0}.card.say p{font-family:Georgia,serif;font-size:22px;color:#e8e3d8}.land{font-family:Georgia,serif;font-size:25px!important}.roomStats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{border:1px solid var(--line2);padding:12px;border-radius:10px}.stat strong{display:block;font-size:26px}.stat span{font-size:9px;text-transform:uppercase;color:var(--muted2)}.side{border-left:1px solid var(--line2);padding-left:20px}.sideBlock{padding:15px 0;border-bottom:1px solid var(--line2)}.sideBlock p{line-height:1.45;color:#cbc6bb;margin:7px 0 0}.aidPreview{border:1px solid #3b382f;border-radius:12px;padding:14px;background:#12110e}.aidPreview strong{font-family:Georgia,serif;font-size:22px}.aidPreview small{display:block;color:#aaa59a;margin-top:6px;line-height:1.4}.nextMove{font-family:Georgia,serif;font-size:28px;line-height:1.08}.controls{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(11,11,10,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line2)}.controlsIn{max-width:1700px;margin:auto;padding:10px 22px;display:flex;justify-content:space-between;gap:8px}.group{display:flex;gap:8px}.btn{border:1px solid #45433c;background:transparent;color:var(--text);padding:11px 14px;border-radius:8px;font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:var(--text);color:var(--bg)}.btn.accent{background:var(--accent2);color:#14130e}.showrunnerBtn{display:none}.drawer{display:none;position:fixed;inset:0;background:#0009;z-index:60}.drawer.open{display:block}.drawerSheet{height:100%;width:min(88vw,420px);overflow:auto;background:#10100f;padding:20px 18px}.drawerHead{display:flex;justify-content:space-between}.close{background:transparent;color:white;border:1px solid #555;border-radius:8px;width:42px;height:42px}@media(max-width:1080px){.grid{grid-template-columns:minmax(0,1fr) 340px}.rail{display:none}.showrunnerBtn{display:inline-flex}}@media(max-width:760px){.shell{padding:14px 14px 150px}.grid{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line2);padding:10px 0}.controlsIn{flex-wrap:wrap}.group{width:100%}.group .btn{flex:1;text-align:center}.live{flex-wrap:wrap;justify-content:flex-end}.nowTitle{font-size:45px}}</style></head><body><div class="top"></div><main class="shell"><header class="header"><div><div class="eyebrow">Showrunner</div><div class="brand" id="brand">Loading…</div></div><div class="live"><button class="btn showrunnerBtn" id="showrunnerBtn">Run of show</button><span><span class="dot"></span>Live</span><span id="people">0 in room</span><span id="clock">0/75 min</span></div></header><div class="grid"><nav class="rail"><div class="eyebrow">Run of show</div><div id="rail"></div></nav><section id="main"></section><aside class="side" id="side"></aside></div><div id="error"></div></main><footer class="controls"><div class="controlsIn" id="controls"></div></footer><div class="drawer" id="drawer"><aside class="drawerSheet"><div class="drawerHead"><div><div class="eyebrow">75-minute session</div><div class="brand">Run of show</div></div><button class="close" id="close">×</button></div><div class="drawerList" id="drawerList"></div></aside></div><script src="/shared-v08.js"></script><script src="/learning-aids-v083.js"></script><script>const C=Classroom;const E=id=>document.getElementById(id);const brand=E('brand'),people=E('people'),clock=E('clock'),rail=E('rail'),drawerList=E('drawerList'),main=E('main'),side=E('side'),controls=E('controls'),errorBox=E('error'),showrunnerBtn=E('showrunnerBtn'),drawer=E('drawer'),closeBtn=E('close');let struct='';function s(){return C.current()}function r(){return s().runbook||{}}function aid(){return (window.LearningAids||{})[C.snapshot.state.step]||null}function val(k,f=''){return r()[k]||s()[k]||f}function signal(){let p=C.participation(),x=s();if(!x.key)return{label:'Facilitate',text:val('advanceWhen','Advance when the idea lands.')};if(p.percent<60)return{label:'Hold',text:`${p.percent}% participation. Give the room another moment.`};return{label:'Ready',text:val('advanceWhen','Move when the room is ready.')}}function timeline(el){el.innerHTML=C.session.steps.map((m,i)=>`<button class="${i===C.snapshot.state.step?'active':''}" data-step="${i}"><span class="time">${C.elapsed(i)}–${C.elapsed(i)+(m.minutes||0)} min</span><span class="momentLabel">${C.esc(m.label)}</span><span class="momentTitle">${C.esc(m.title)}</span></button>`).join('');el.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step))}function card(label,text,cls=''){return text?`<div class="card ${cls}"><b>${label}</b><p>${C.esc(text)}</p></div>`:''}function render(){let x=s(),rb=r(),p=C.participation(),n=C.session.steps[C.snapshot.state.step+1],sig=signal(),a=aid();brand.textContent=C.session.title;timeline(rail);timeline(drawerList);main.innerHTML=`<div class="eyebrow">Now · ${C.esc(x.label)}</div><h1 class="nowTitle">${C.esc(x.title)}</h1><div class="facilitate">${card('Set the room',val('setup',x.lead),'hot')}${card('Say this',val('say','Guide the room through this moment.'),'say')}${card('Students do',val('studentDoes',x.studentTask||x.lead))}${a?card('Use this learning aid',a.facilitator,'hot'):''}${card('Ask next',val('askNext',rb.ask))}${card('Land here',val('landHere',x.teachReveal?.headline||x.hero),'hot land')}</div><div class="roomStats"><div class="stat"><strong id="responses">${p.count}</strong><span>responses</span></div><div class="stat"><strong id="participation">${p.percent}%</strong><span>participation</span></div><div class="stat"><strong id="timer">${C.timerText()}</strong><span>timer</span></div></div>`;side.innerHTML=`${a?`<div class="sideBlock"><div class="eyebrow">Learning aid</div><div class="aidPreview"><strong>${C.esc(a.title)}</strong><small>${C.esc(a.prompt||'')}</small></div></div>`:''}<div class="sideBlock"><div class="eyebrow">Room signal · ${C.esc(sig.label)}</div><p id="signalText">${C.esc(sig.text)}</p></div>${rb.watchFor?`<div class="sideBlock"><div class="eyebrow">Watch for</div><p>${C.esc(rb.watchFor)}</p></div>`:''}${rb.teachableMoment?`<div class="sideBlock"><div class="eyebrow">Teachable moment</div><p>${C.esc(rb.teachableMoment)}</p></div>`:''}${x.teachableMoments?`<div class="sideBlock"><div class="eyebrow">Examples to surface</div><p>${x.teachableMoments.map(t=>'• '+C.esc(t)).join('<br><br>')}</p></div>`:''}<div class="sideBlock"><div class="eyebrow">If the room stalls</div><p>${C.esc(rb.ifStuck||'Ask students what evidence they used and what they assumed.')}</p></div><div class="sideBlock"><div class="eyebrow">Advance when</div><p>${C.esc(rb.advanceWhen||'The central idea has surfaced and the room is ready to move.')}</p></div>${n?`<div class="sideBlock"><div class="eyebrow">Next</div><div class="nextMove">${C.esc(n.label)}</div><p>${C.esc(rb.transition||n.title)}</p></div>`:''}`;renderControls();updateHeader()}function renderControls(){const st=C.snapshot.state,a=aid(),aidOn=st.roomMoment?.type==='aid';controls.innerHTML=`<div class="group"><button class="btn" id="backBtn">Back</button><button class="btn" id="lockBtn">${st.locked?'Open responses':'Commit'}</button><button class="btn ${st.resultsVisible?'accent':''}" id="revealBtn">${st.resultsVisible?'Hide reveal':'Reveal'}</button>${a?`<button class="btn ${aidOn?'accent':''}" id="aidBtn">${aidOn?'Hide aid':'Show aid'}</button>`:''}</div><div class="group"><a class="btn" target="_blank" href="/room">Room</a><button class="btn primary" id="nextBtn">Next</button></div>`;E('backBtn').onclick=()=>go(C.snapshot.state.step-1);E('lockBtn').onclick=()=>setState({locked:!C.snapshot.state.locked,roomMoment:{type:'commit'}});E('revealBtn').onclick=()=>setState({resultsVisible:!C.snapshot.state.resultsVisible,locked:true,roomMoment:{type:'reveal'}});if(a)E('aidBtn').onclick=()=>setState({roomMoment:aidOn?null:{type:'aid'}});E('nextBtn').onclick=()=>go(C.snapshot.state.step+1)}function updateHeader(){people.textContent=C.snapshot.participantCount+' in room';clock.textContent=C.elapsed(C.snapshot.state.step)+'/'+C.session.durationMinutes+' min'}function live(){updateHeader();let p=C.participation(),q=signal(),a=E('responses'),b=E('participation'),t=E('timer'),sg=E('signalText');if(a)a.textContent=p.count;if(b)b.textContent=p.percent+'%';if(t)t.textContent=C.timerText();if(sg)sg.textContent=q.text}function key(){let st=C.snapshot.state;return[st.step,st.locked,st.resultsVisible,st.roomMoment?.type||''].join('|')}async function poll(force=false){try{await C.refresh();let k=key();if(force||k!==struct){struct=k;render()}else live()}catch(e){errorBox.textContent='Connection interrupted. Retrying…'}}async function setState(p){await C.state(p);struct='';await poll(true)}function go(i){i=Math.max(0,Math.min(C.session.steps.length-1,i));setState({step:i,locked:false,resultsVisible:false,timerEndsAt:null,spotlight:null,roomMoment:null})}showrunnerBtn.onclick=()=>drawer.classList.add('open');closeBtn.onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};setInterval(()=>{let t=E('timer');if(t)t.textContent=C.timerText()},250);(async()=>{try{await C.loadSession();await poll(true);setInterval(()=>poll(),1500)}catch(e){errorBox.textContent='Showrunner could not load.'}})();</script></body></html>
