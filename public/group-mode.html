<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INF 125 Group Mode</title>
<style>
:root{--ink:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f5f7fb;--card:#fff;--blue:#2f80ed;--red:#dc4b5f;--purple:#7654d8;--gold:#d89b24;--green:#168a68}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:22px}.topbar{display:flex;gap:14px;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.06em}.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 12px;background:#edf2ff;color:#334155;font-size:13px;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.05);margin-bottom:16px}.hero{padding:28px;background:linear-gradient(135deg,#111827,#29364e);color:white}.hero h1{font-size:clamp(28px,5vw,50px);line-height:1.02;margin:7px 0}.hero p{max-width:760px;color:#dbe5f4;font-size:18px}.tiny{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.groupCard{border-top:7px solid var(--c);position:relative}.groupCard h2,.groupCard h3{margin:0 0 7px}.zone{font-size:13px;font-weight:900;letter-spacing:.08em}.members{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.member{background:#f3f4f6;border-radius:999px;padding:7px 10px;font-size:13px}.member.me{outline:2px solid var(--c);background:white}.bigGroup{font-size:72px;font-weight:950;line-height:.9;color:var(--c)}.role{display:inline-block;margin-top:7px;border-radius:999px;padding:8px 11px;background:#111827;color:#fff;font-weight:850;font-size:13px}.task{font-size:22px;font-weight:850;line-height:1.25}.callout{border-left:6px solid var(--c);background:#f8fafc;padding:16px;border-radius:12px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:850;cursor:pointer;background:#111827;color:white}.btn.soft{background:#eef2f7;color:#111827}.btn.phase{background:white;color:#111827;border:1px solid var(--line)}.btn.phase.active{background:#111827;color:white}.btn.danger{background:#fff0f1;color:#a11f32;border:1px solid #f6c3ca}.actions{display:flex;gap:10px;flex-wrap:wrap}.field{width:100%;padding:13px 14px;border:1px solid #cfd5df;border-radius:12px;background:white}.field:focus{outline:3px solid #bfdbfe;border-color:#60a5fa}.label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:12px 0 6px}.status{font-size:14px;color:var(--muted)}.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:12px 14px;border-radius:12px}.warn{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:12px 14px;border-radius:12px}.hide{display:none!important}.phaseTitle{font-size:12px;font-weight:900;letter-spacing:.1em;color:#64748b;text-transform:uppercase}.room .shell{max-width:1500px;padding:28px}.room .hero{text-align:center}.room .hero p{margin-left:auto;margin-right:auto}.room .groupCard{min-height:210px}.room .member{font-size:18px;padding:9px 12px}.room .task{font-size:32px}.instructor .groupCard textarea{min-height:92px}.response{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;font-size:14px}.meter{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e}.offline{background:#ef4444}.footer{padding:18px;text-align:center;color:#64748b;font-size:12px}
@media(max-width:640px){.shell{padding:12px}.card{border-radius:16px;padding:17px}.hero{padding:22px}.topbar{align-items:flex-start}.topbar .status{display:none}.bigGroup{font-size:58px}.task{font-size:19px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const qs=new URLSearchParams(location.search);
const VIEW=qs.get('view')||'student';
const SESSION=qs.get('session')||'inf125-2026-11-10';
const API='/api/session/'+encodeURIComponent(SESSION)+'/group-mode';
const STORE='inf125-group-mode-'+SESSION;
const local=JSON.parse(localStorage.getItem(STORE)||'null')||{device:(crypto.randomUUID?crypto.randomUUID():'d-'+Date.now()+'-'+Math.random().toString(36).slice(2)),name:''};
let snap=null,poller=null,lastError='';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const phaseNames={arrival:'Find Your Group',visit:'Design the 11/17 Visit',ethics:'Ethical Dilemma Challenge',critique:'Cross-Group Challenge',signature:'Signature Assignment Sprint',close:'Wrap-Up'};
const roleHelp={FACILITATOR:'Keep the group moving and invite every voice.',RECORDER:'Capture and submit the group’s final response.',SKEPTIC:'Challenge the first answer and test assumptions.',REPORTER:'Be ready to share the group’s thinking.',"EVIDENCE CHECKER":'Ask what evidence would be needed before trusting a claim.'};
function save(){localStorage.setItem(STORE,JSON.stringify(local))}
async function req(path,opts={}){const r=await fetch(API+path,{headers:{'content-type':'application/json'},...opts});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function me(){return snap?.people?.find(p=>p.device===local.device)}
function myGroup(){const p=me();return p?snap?.groups?.find(g=>g.id===p.groupId):null}
function header(title='GROUP MODE'){return '<div class="topbar"><div><div class="brand">INF 125 · AI LITERACY</div><div class="status">'+esc(title)+'</div></div><div class="pill"><span class="dot '+(lastError?'offline':'')+'"></span>'+(lastError?'RECONNECTING':'LIVE')+'</div></div>'}
function groupSummary(g,room=false){return '<div class="card groupCard" style="--c:'+g.color+'"><div class="zone" style="color:'+g.color+'">GROUP '+g.id+' · '+esc(g.zone)+'</div><h2>'+esc(g.caseTitle)+'</h2><div class="members">'+(g.members.length?g.members.map(m=>'<span class="member '+(m.device===local.device?'me':'')+'">'+esc(m.name)+(m.role?' · '+esc(m.role):'')+'</span>').join(''):'<span class="status">Waiting for students…</span>')+'</div></div>'}
function joinView(){
 app.className='student';
 app.innerHTML='<div class="shell">'+header('GROUP MODE · TOMORROW PILOT')+'<section class="card hero"><div class="tiny">BEFORE YOU LOG INTO A LAB COMPUTER</div><h1>Find your group first.</h1><p>Enter your first name or nickname on your phone. We’ll assign your room zone, ethics case, and group role. Then sit in that section and log into a computer there.</p></section><section class="card"><div class="label">YOUR NAME OR NICKNAME</div><input id="name" class="field" maxlength="50" autocomplete="name" placeholder="e.g. Brandi" value="'+esc(local.name)+'"><div class="actions" style="margin-top:14px"><button class="btn" id="joinBtn">ASSIGN MY GROUP →</button></div><p class="status">Your assignment stays with this device if you refresh.</p></section><div class="footer">classroom.itsbadlabs.com/groups</div></div>';
 document.getElementById('joinBtn').onclick=join;
}
async function join(){const name=document.getElementById('name').value.trim();if(!name)return;local.name=name;save();try{const j=await req('/join',{method:'POST',body:JSON.stringify({device:local.device,name})});snap=j.snapshot;render()}catch(e){lastError=e.message;render()}}
function studentView(){
 const p=me(),g=myGroup(),phase=snap.state.phase;
 if(!p||!g)return joinView();
 let body='';
 if(phase==='arrival')body='<section class="card hero" style="background:linear-gradient(135deg,#111827,'+g.color+')"><div class="tiny">YOUR HOME GROUP</div><div class="bigGroup" style="color:white">GROUP '+g.id+'</div><h1>'+esc(g.zone)+'</h1><p><strong>'+esc(p.role)+'</strong> · '+esc(roleHelp[p.role]||'Help your team make a strong decision.')+'</p></section><section class="card"><div class="phaseTitle">DO THIS NOW</div><div class="task">Go directly to the '+esc(g.zone)+', choose a computer there, and log in. Stay with this home group for today’s activities.</div><div class="members">'+g.members.map(m=>'<span class="member '+(m.device===p.device?'me':'')+'">'+esc(m.name)+(m.device===p.device?' · YOU':'')+'</span>').join('')+'</div></section>';
 if(phase==='visit')body=groupActivity(g,'11/17 HIGH SCHOOL VISIT',g.visitPrompt,'Agree on your strongest recommendation. The Recorder submits one response for the group.','visit');
 if(phase==='ethics')body=ethicsActivity(g);
 if(phase==='critique')body=critiqueActivity(g);
 if(phase==='signature')body=signatureActivity(g);
 if(phase==='close')body='<section class="card hero"><div class="tiny">WRAP-UP</div><h1>You did the thinking.</h1><p>Before you leave, make sure you know your Signature Assignment topic, the stakeholder you need to understand, and the evidence you still need before Sunday.</p></section>';
 app.className='student';app.innerHTML='<div class="shell">'+header('GROUP '+g.id+' · '+g.zone)+body+'<div class="footer">Your home group stays the same for the whole session.</div></div>';wireStudent(phase);
}
function groupActivity(g,kicker,prompt,helper,phase){
 const existing=snap.responses?.[phase]?.[g.id]?.text||'';
 return '<section class="card hero" style="background:linear-gradient(135deg,#111827,'+g.color+')"><div class="tiny">'+esc(kicker)+'</div><h1>'+esc(prompt)+'</h1><p>'+esc(helper)+'</p></section><section class="card"><div class="label">YOUR GROUP’S BEST IDEA</div><textarea id="groupText" class="field" rows="6" placeholder="Talk first. Then capture the idea you want the class to hear.">'+esc(existing)+'</textarea><div class="actions" style="margin-top:12px"><button class="btn" id="submitGroup">SAVE GROUP RESPONSE</button></div><p id="saveMsg" class="status">'+(existing?'A response has already been saved. You can improve it.':'')+'</p></section>';
}
function ethicsActivity(g){
 const e=snap.responses?.ethics?.[g.id]?.fields||{},text=snap.responses?.ethics?.[g.id]?.text||'';
 return '<section class="card hero" style="background:linear-gradient(135deg,#111827,'+g.color+')"><div class="tiny">ETHICAL DILEMMA CHALLENGE</div><h1>'+esc(g.caseTitle)+'</h1><p>Your job is not to find the “right” answer. Make a defensible decision using the five ethics lenses.</p></section><section class="card"><div class="grid"><div><div class="label">BENEFIT</div><input id="benefit" class="field" value="'+esc(e.benefit||'')+'" placeholder="What problem does the AI solve?"></div><div><div class="label">STAKEHOLDERS</div><input id="stakeholders" class="field" value="'+esc(e.stakeholders||'')+'" placeholder="Name at least three people/groups."></div><div><div class="label">ETHICS LENS</div><input id="lens" class="field" value="'+esc(e.lens||'')+'" placeholder="Fairness, privacy, transparency, ownership, accountability?"></div><div><div class="label">YOUR CALL</div><input id="decision" class="field" value="'+esc(e.decision||'')+'" placeholder="YES / NO / ONLY IF…"></div></div><div class="label">SAFEGUARD</div><textarea id="safeguard" class="field" rows="3" placeholder="Require one rule that would make this more responsible.">'+esc(e.safeguard||'')+'</textarea><div class="label">WHY IS YOUR DECISION DEFENSIBLE?</div><textarea id="groupText" class="field" rows="4" placeholder="Explain the tradeoff your team considered.">'+esc(text)+'</textarea><div class="actions" style="margin-top:12px"><button class="btn" id="submitEthics">SAVE TEAM DECISION</button></div><p id="saveMsg" class="status"></p></section>';
}
function critiqueActivity(g){
 const targetId=snap.critiqueMap?.[g.id],target=snap.groups.find(x=>x.id===targetId),source=snap.responses?.ethics?.[targetId],mine=snap.responses?.critique?.[g.id]?.text||'';
 const sourceText=source?(Object.entries(source.fields||{}).map(([k,v])=>k.toUpperCase()+': '+v).join('\n')+'\n\nREASONING: '+(source.text||'')):'That group has not saved a decision yet.';
 return '<section class="card hero" style="background:linear-gradient(135deg,#111827,'+g.color+')"><div class="tiny">CROSS-GROUP CHALLENGE</div><h1>Stress-test Group '+esc(targetId)+'’s reasoning.</h1><p>You are not grading their answer. You are helping them see what they may have missed.</p></section><section class="card"><div class="phaseTitle">'+esc(target?.caseTitle||'OTHER GROUP')+'</div><div class="response">'+esc(sourceText)+'</div><div class="label">LEAVE ONE CHALLENGE</div><textarea id="groupText" class="field" rows="5" placeholder="Challenge an assumption, missed stakeholder, underestimated risk, or safeguard.">'+esc(mine)+'</textarea><div class="actions" style="margin-top:12px"><button class="btn" id="submitGroup">SAVE CHALLENGE</button></div><p id="saveMsg" class="status"></p></section>';
}
function signatureActivity(g){
 return '<section class="card hero"><div class="tiny">GEN ED SIGNATURE ASSIGNMENT · DUE SUNDAY</div><h1>Turn today’s judgment into your own researchable question.</h1><p>You do not need the answer yet. You need a specific issue, stakeholder, and evidence question.</p></section><section class="card"><div class="label">MY LIKELY TOPIC</div><input id="topic" class="field" placeholder="e.g. AI hiring and recorded interviews"><div class="label">MY SPECIFIC QUESTION</div><textarea id="question" class="field" rows="3" placeholder="What exactly do I want to investigate?"></textarea><div class="grid"><div><div class="label">STAKEHOLDER I NEED TO UNDERSTAND</div><input id="stakeholder" class="field"></div><div><div class="label">I NEED CREDIBLE EVIDENCE ABOUT…</div><input id="evidenceNeed" class="field"></div></div><div class="actions" style="margin-top:12px"><button class="btn" id="saveSignature">SAVE MY START</button></div><p id="saveMsg" class="status">At least 2 credible, non-AI sources are required for the assignment.</p></section>';
}
function wireStudent(phase){
 const g=myGroup();
 const submit=document.getElementById('submitGroup');if(submit)submit.onclick=()=>saveGroup(phase,{});
 const eth=document.getElementById('submitEthics');if(eth)eth.onclick=()=>saveGroup('ethics',{benefit:val('benefit'),stakeholders:val('stakeholders'),lens:val('lens'),decision:val('decision'),safeguard:val('safeguard')});
 const sig=document.getElementById('saveSignature');if(sig)sig.onclick=saveSignature;
}
const val=id=>document.getElementById(id)?.value.trim()||'';
async function saveGroup(phase,fields){try{await req('/response',{method:'POST',body:JSON.stringify({device:local.device,phase,text:val('groupText'),fields})});document.getElementById('saveMsg').textContent='Saved for Group '+myGroup().id+' ✓';await refresh()}catch(e){document.getElementById('saveMsg').textContent=e.message}}
async function saveSignature(){try{await req('/individual',{method:'POST',body:JSON.stringify({device:local.device,kind:'signature',topic:val('topic'),question:val('question'),stakeholder:val('stakeholder'),evidenceNeed:val('evidenceNeed')})});document.getElementById('saveMsg').textContent='Saved ✓ You now have a starting point for Sunday.';await refresh()}catch(e){document.getElementById('saveMsg').textContent=e.message}}
function instructorView(){
 const phase=snap?.state?.phase||'arrival';
 const phases=['arrival','visit','ethics','critique','signature','close'];
 const controls='<section class="card"><div class="phaseTitle">RUN THE SESSION</div><div class="actions">'+phases.map(p=>'<button class="btn phase '+(phase===p?'active':'')+'" data-phase="'+p+'">'+esc(phaseNames[p])+'</button>').join('')+'</div><div class="actions" style="margin-top:14px"><a class="btn soft" href="/groups/room?session='+encodeURIComponent(SESSION)+'" target="_blank">OPEN ROOM VIEW ↗</a><a class="btn soft" href="/groups?session='+encodeURIComponent(SESSION)+'" target="_blank">OPEN STUDENT VIEW ↗</a><button class="btn danger" id="resetBtn">RESET GROUP MODE</button></div></section>';
 const stats='<section class="grid"><div class="card"><div class="phaseTitle">JOINED</div><div style="font-size:38px;font-weight:950">'+(snap?.people?.length||0)+'</div></div><div class="card"><div class="phaseTitle">SIGNATURE STARTS SAVED</div><div style="font-size:38px;font-weight:950">'+(snap?.signatureReady||0)+'</div></div><div class="card"><div class="phaseTitle">CURRENT PHASE</div><div style="font-size:23px;font-weight:900">'+esc(phaseNames[phase])+'</div></div></section>';
 const groups='<section class="grid">'+(snap?.groups||[]).map(g=>'<div class="card groupCard" style="--c:'+g.color+'"><div class="zone" style="color:'+g.color+'">GROUP '+g.id+' · '+esc(g.zone)+'</div><h3>'+esc(g.caseTitle)+'</h3><div class="members">'+g.members.map(m=>'<span class="member">'+esc(m.name)+' · '+esc(m.role)+'</span>').join('')+'</div>'+instructorResponse(g,phase)+'</div>').join('')+'</section>';
 app.className='instructor';app.innerHTML='<div class="shell">'+header('INSTRUCTOR CONTROL · '+SESSION)+'<section class="card hero"><div class="tiny">INF 125 GROUP MODE</div><h1>'+esc(phaseNames[phase])+'</h1><p>Four home groups. One room flow. Students keep the same group and role while you advance the activity.</p></section>'+controls+stats+groups+'<div class="footer">Pilot success = students find seats without instructor intervention + groups produce usable responses.</div></div>';
 document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>setPhase(b.dataset.phase));
 document.getElementById('resetBtn').onclick=reset;
}
function instructorResponse(g,phase){
 if(phase==='arrival')return '<p class="status">'+g.members.length+' students assigned.</p>';
 if(phase==='signature')return '<p class="status">Individual work · '+snap.signatureReady+' students have saved a starting point.</p>';
 const r=snap.responses?.[phase]?.[g.id]||(phase==='critique'?snap.responses?.critique?.[g.id]:null);
 if(!r)return '<p class="warn">No group response saved yet.</p>';
 let f=r.fields?Object.entries(r.fields).map(([k,v])=>'<b>'+esc(k)+':</b> '+esc(v)).join('<br>'):'';
 return '<div class="response">'+f+(f?'<br><br>':'')+esc(r.text||'')+'<div class="status" style="margin-top:7px">Saved by '+esc(r.submittedBy||'student')+'</div></div>';
}
async function setPhase(phase){await req('/phase',{method:'POST',body:JSON.stringify({phase})});await refresh()}
async function reset(){if(!confirm('Reset all Group Mode assignments and responses?'))return;await req('/reset',{method:'POST',body:'{}'});await refresh()}
function roomView(){
 const phase=snap?.state?.phase||'arrival';
 let content='';
 if(phase==='arrival'){
   content='<section class="card hero"><div class="tiny">BEFORE YOU LOG INTO A COMPUTER</div><h1>Go to classroom.itsbadlabs.com/groups</h1><p>Enter your name on your phone → find your Group + Zone → sit there → then log into a lab computer.</p></section><section class="grid">'+snap.groups.map(g=>groupSummary(g,true)).join('')+'</section>';
 }else{
   const task={visit:'Design the strongest recommendation for the 11/17 high school visit.',ethics:'Make a defensible decision: benefit → stakeholders → ethics lens → YES / NO / ONLY IF → safeguard.',critique:'Stress-test another group. Leave one challenge—not a grade.',signature:'Start your infographic: specific issue → researchable question → stakeholder → evidence needed.',close:'Make sure you know what you need to finish before Sunday.'}[phase]||'';
   content='<section class="card hero"><div class="tiny">'+esc(phaseNames[phase])+'</div><h1>'+esc(task)+'</h1></section><section class="grid">'+snap.groups.map(g=>groupSummary(g,true)).join('')+'</section>';
 }
 app.className='room';app.innerHTML='<div class="shell">'+header('ROOM VIEW · '+phaseNames[phase])+content+'<div class="footer">GROUP MODE · INF 125 · Dr. Brandi Neal</div></div>';
}
async function refresh(){try{snap=await req('/snapshot');lastError='';if(VIEW==='student'&&local.name&&!me()){try{const j=await req('/join',{method:'POST',body:JSON.stringify({device:local.device,name:local.name})});snap=j.snapshot}catch(_){}}render()}catch(e){lastError=e.message;render()}}
function render(){if(VIEW==='instructor')return instructorView();if(VIEW==='room')return roomView();if(!local.name||!snap||!me())return joinView();studentView()}
if(VIEW==='student'){setInterval(()=>{if(local.name)req('/heartbeat',{method:'POST',body:JSON.stringify({device:local.device})}).catch(()=>{})},30000)}
refresh();poller=setInterval(refresh,2500);
</script>
</body>
</html>
