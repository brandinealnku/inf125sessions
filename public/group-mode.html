@media(max-width:640px){.shell{padding:11px}.card{padding:16px;border-radius:16px}.hero{padding:20px}.hero p{font-size:16px}.topbar .status{display:none}.task{font-size:19px}}

<body><div id="app"></div>
<script>
const qs=new URLSearchParams(location.search),PATH=location.pathname.replace(/\/+$/,'')||'/',VIEW=qs.get('view')||(PATH.endsWith('/instructor')?'instructor':PATH.endsWith('/room')?'room':'student'),SESSION=qs.get('session')||'inf125-2026-11-10';
const API='/api/session/'+encodeURIComponent(SESSION)+'/group-mode',STORE='inf125-case-marketplace-'+SESSION;
const local=JSON.parse(localStorage.getItem(STORE)||'null')||{device:(crypto.randomUUID?crypto.randomUUID():'d-'+Date.now()+'-'+Math.random().toString(36).slice(2)),name:'',draftVotes:[]};
let snap=null,lastError='';const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const phaseNames={marketplace:'Case Marketplace',groups:'Find Your Interest Group',visit:'Design the 11/17 Visit',ethics:'Ethical Dilemma Challenge',critique:'Cross-Group Challenge',signature:'Signature Assignment Sprint',close:'Wrap-Up'};
const roleHelp={FACILITATOR:'Keep the group moving and make sure every voice gets heard.',"STAKEHOLDER ADVOCATE":'Push the group to consider people who could benefit or carry the cost.',SKEPTIC:'Challenge assumptions and ask what evidence the group actually has.',REPORTER:'Be ready to explain the group’s decision and biggest disagreement.',"EVIDENCE CHECKER":'Identify what the team would need to verify before trusting a claim.'};
function save(){localStorage.setItem(STORE,JSON.stringify(local))}
async function req(path,opts={}){const r=await fetch(API+path,{headers:{'content-type':'application/json'},...opts});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function me(){return snap?.people?.find(p=>p.device===local.device)||null}function myGroup(){const p=me();return p?.groupId?snap?.groups?.find(g=>g.id===p.groupId)||null:null}
function header(title){return '<div class="topbar"><div><div class="brand">INF 125 · AI LITERACY</div><div class="status">'+esc(title||'CASE MARKETPLACE')+'</div></div><div class="live"><span class="dot '+(lastError?'offline':'')+'"></span>'+(lastError?'RECONNECTING':'LIVE')+'</div></div>'}
function joinView(){app.className='student';app.innerHTML='<div class="shell">'+header('CASE MARKETPLACE')+'<section class="card hero"><div class="tiny">START ON YOUR PHONE</div><h1>What AI issue would you actually want to argue about?</h1><p>Join first. Then browse the case marketplace, pitch a wildcard if you have one, and vote for up to two cases you genuinely want to discuss.</p></section><section class="card"><div class="label">YOUR FIRST NAME OR NICKNAME</div><input id="name" class="field" maxlength="50" value="'+esc(local.name)+'" placeholder="e.g. Brandi"><div class="actions" style="margin-top:12px"><button class="btn" id="joinBtn">ENTER THE MARKETPLACE →</button></div></section><div class="footer">classroom.itsbadlabs.com/groups</div></div>';document.getElementById('joinBtn').onclick=join}
async function join(){const name=document.getElementById('name').value.trim();if(!name)return;local.name=name;save();try{const j=await req('/join',{method:'POST',body:JSON.stringify({device:local.device,name})});snap=j.snapshot;render()}catch(e){lastError=e.message;render()}}
function caseCard(c,selectable=true){const on=(local.draftVotes||[]).includes(c.id);return '<div class="card case '+(c.id.startsWith('custom-')?'custom ':'')+(on?'selected':'')+'"><span class="badge">'+esc(c.field||'AI issue')+'</span><h3>'+esc(c.title)+'</h3><p><strong>'+esc(c.question)+'</strong></p>'+(c.description?'<p>'+esc(c.description)+'</p>':'')+(c.proposedBy?'<p class="status">Proposed by '+esc(c.proposedBy)+'</p>':'')+(c.source?'<a class="source" href="'+esc(c.source)+'" target="_blank" rel="noopener">View source ↗</a>':'')+'<div style="margin-top:10px" class="voteCount">'+c.votes+' vote'+(c.votes===1?'':'s')+'</div>'+(selectable?'<button class="btn choice '+(on?'on':'')+'" data-case="'+esc(c.id)+'" style="margin-top:10px">'+(on?'✓ SELECTED':'VOTE FOR THIS CASE')+'</button>':'')+'</div>'}
function marketplaceView(){
 const mine=me(),saved=(mine&&snap?.voteCounts)?(snap.cases.filter(c=>(local.draftVotes||[]).includes(c.id)).length):0;
 app.className='student';app.innerHTML='<div class="shell">'+header('CASE MARKETPLACE')+'<section class="card hero"><div class="tiny">YOU GET TWO VOTES</div><h1>Choose the conversations you would actually want to have.</h1><p>The top four cases become today’s discussion groups. You can also pitch one wildcard connected to your major, career, hobby, or something you’ve seen in real life.</p></section><section class="card"><div class="phaseTitle">YOUR BALLOT</div><p>Pick up to <strong>two</strong>. Class Runner will use your preferences when forming balanced groups.</p><div class="actions"><button class="btn" id="saveVotes">SAVE MY VOTES ('+(local.draftVotes||[]).length+'/2)</button></div><p id="voteMsg" class="status"></p></section><section class="grid">'+(snap?.cases||[]).map(c=>caseCard(c,true)).join('')+'</section><section class="card"><div class="tiny">🔥 BRING YOUR OWN CASE</div><h2>Found something you care about more?</h2><p>Pitch one real AI issue. Give us enough to know what happened, why it matters, and where you found it.</p><div class="grid"><div><div class="label">CASE TITLE</div><input id="pTitle" class="field" placeholder="e.g. AI + Athlete Injury Predictions"></div><div><div class="label">FIELD / CONTEXT</div><input id="pField" class="field" placeholder="Sports, nursing, marketing, law…"></div></div><div class="label">DISCUSSION QUESTION</div><textarea id="pQuestion" class="field" rows="3" placeholder="What should we actually debate?"></textarea><div class="label">WHY IS IT WORTH DISCUSSING?</div><textarea id="pDescription" class="field" rows="2"></textarea><div class="label">SOURCE LINK</div><input id="pSource" class="field" placeholder="https://…"><div class="actions" style="margin-top:12px"><button class="btn soft" id="proposeBtn">ADD MY CASE TO THE MARKETPLACE</button></div><p id="proposalMsg" class="status"></p></section></div>';
 document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>toggleVote(b.dataset.case));
 document.getElementById('saveVotes').onclick=saveVotes;document.getElementById('proposeBtn').onclick=propose;
}
function toggleVote(id){local.draftVotes=local.draftVotes||[];if(local.draftVotes.includes(id))local.draftVotes=local.draftVotes.filter(x=>x!==id);else if(local.draftVotes.length<2)local.draftVotes.push(id);else{document.getElementById('voteMsg').textContent='You only get two votes. Remove one before choosing another.';return}save();marketplaceView()}
async function saveVotes(){try{const j=await req('/vote',{method:'POST',body:JSON.stringify({device:local.device,caseIds:local.draftVotes})});document.getElementById('voteMsg').textContent='Votes saved ✓';await refresh()}catch(e){document.getElementById('voteMsg').textContent=e.message}}
const val=id=>document.getElementById(id)?.value.trim()||'';
const DRAFT_KEY=STORE+'-draft';
function readDraft(){try{return JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'{}')}catch(_){return {}}}
function writeDraft(){
  if(VIEW!=='student')return;
  const ids=['groupText','benefit','stakeholders','lens','decision','safeguard','topic','question','stakeholder','evidenceNeed','interest','pTitle','pField','pQuestion','pDescription','pSource'];
  const draft=readDraft();
  for(const id of ids){const el=document.getElementById(id);if(el)draft[id]=el.value;}
  sessionStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
}
function restoreDraft(){
  if(VIEW!=='student')return;
  const draft=readDraft();
  for(const [id,value] of Object.entries(draft)){const el=document.getElementById(id);if(el && !el.value)el.value=value;}
}
function clearDraft(ids=[]){
  const draft=readDraft();
  if(!ids.length)sessionStorage.removeItem(DRAFT_KEY);
  else{for(const id of ids)delete draft[id];sessionStorage.setItem(DRAFT_KEY,JSON.stringify(draft));}
}
async function propose(){try{await req('/proposal',{method:'POST',body:JSON.stringify({device:local.device,title:val('pTitle'),field:val('pField'),question:val('pQuestion'),description:val('pDescription'),source:val('pSource')})});document.getElementById('proposalMsg').textContent='Added to the marketplace ✓ Now you can vote for it.';await refresh()}catch(e){document.getElementById('proposalMsg').textContent=e.message}}
function studentView(){
 const phase=snap?.state?.phase||'marketplace',p=me();if(!p)return joinView();if(phase==='marketplace')return marketplaceView();
 const g=myGroup();if(!g)return waitingView();
 let body='';
 if(phase==='groups')body='<section class="card hero" style="background:linear-gradient(135deg,#111827,'+g.color+')"><div class="tiny">YOUR INTEREST GROUP</div><div class="bigGroup">GROUP '+g.id+'</div><h1>'+esc(g.zone)+'</h1><p>'+esc(g.caseTitle)+' · '+esc(p.role)+'</p></section><section class="card"><div class="task">Go to the '+esc(g.zone)+', choose a computer there, and log in. This is your home group for the rest of class.</div><div class="response" style="margin-top:14px"><b>'+esc(g.caseQuestion)+'</b></div><p class="status">'+esc(roleHelp[p.role]||'Help your team think well.')+'</p><div class="members">'+g.members.map(m=>'<span class="member '+(m.device===p.device?'me':'')+'">'+esc(m.name)+(m.device===p.device?' · YOU':'')+'</span>').join('')+'</div></section>';
 if(phase==='visit')body=groupActivity(g,'11/17 HIGH SCHOOL VISIT',g.visitPrompt,'Agree on your strongest recommendation. One teammate saves the group response.','visit');
 if(phase==='ethics')body=ethicsActivity(g);if(phase==='critique')body=critiqueActivity(g);if(phase==='signature')body=signatureActivity(g);
 if(phase==='close')body='<section class="card hero"><div class="tiny">WRAP-UP</div><h1>You chose it. You argued it. Now use the thinking.</h1><p>Before you leave, make sure you know what you still need to finish for Sunday’s Signature Assignment.</p></section>';
 app.className='student';app.innerHTML='<div class="shell">'+header('GROUP '+g.id+' · '+g.zone)+body+'<div class="footer">Your group was formed from student interest + balanced room size.</div></div>';wireStudent(phase);restoreDraft()
}
function waitingView(){app.className='student';app.innerHTML='<div class="shell">'+header('GROUPS FORMING')+'<section class="card hero"><div class="tiny">BALLOTS ARE IN</div><h1>We’re forming the groups.</h1><p>Stay on this screen. Your case, room zone, and role will appear automatically.</p></section></div>'}
function groupActivity(g,kicker,prompt,helper,phase){const existing=snap.responses?.[phase]?.[g.id]?.text||'';return '<section class="card hero" style="background:linear-gradient(135deg,#111827,'+g.color+')"><div class="tiny">'+esc(kicker)+'</div><h1>'+esc(prompt)+'</h1><p>'+esc(helper)+'</p></section><section class="card"><div class="label">YOUR GROUP’S BEST IDEA</div><textarea id="groupText" class="field" rows="6">'+esc(existing)+'</textarea><div class="actions" style="margin-top:12px"><button class="btn" id="submitGroup">SAVE GROUP RESPONSE</button></div><p id="saveMsg" class="status"></p></section>'}
function ethicsActivity(g){const e=snap.responses?.ethics?.[g.id]?.fields||{},text=snap.responses?.ethics?.[g.id]?.text||'';return '<section class="card hero" style="background:linear-gradient(135deg,#111827,'+g.color+')"><div class="tiny">'+esc(g.caseField||'ETHICAL DILEMMA')+'</div><h1>'+esc(g.caseTitle)+'</h1><p><strong>'+esc(g.caseQuestion)+'</strong></p></section>'+(g.caseSource?'<section class="card"><a href="'+esc(g.caseSource)+'" target="_blank" rel="noopener">Open the source your classmate found ↗</a></section>':'')+'<section class="card"><p><strong>Your job is not to find the “right” answer.</strong> Make a defensible decision using fairness, privacy, transparency, ownership, and accountability.</p><div class="grid"><div><div class="label">BENEFIT</div><input id="benefit" class="field" value="'+esc(e.benefit||'')+'" placeholder="What problem does the AI solve?"></div><div><div class="label">STAKEHOLDERS</div><input id="stakeholders" class="field" value="'+esc(e.stakeholders||'')+'" placeholder="At least three people/groups"></div><div><div class="label">ETHICS LENS</div><input id="lens" class="field" value="'+esc(e.lens||'')+'" placeholder="Which lens matters most—and why?"></div><div><div class="label">YOUR CALL</div><input id="decision" class="field" value="'+esc(e.decision||'')+'" placeholder="YES / NO / ONLY IF…"></div></div><div class="label">SAFEGUARD</div><textarea id="safeguard" class="field" rows="3">'+esc(e.safeguard||'')+'</textarea><div class="label">WHY IS YOUR DECISION DEFENSIBLE?</div><textarea id="groupText" class="field" rows="4">'+esc(text)+'</textarea><div class="actions" style="margin-top:12px"><button class="btn" id="submitEthics">SAVE TEAM DECISION</button></div><p id="saveMsg" class="status"></p></section>'}
function critiqueActivity(g){const targetId=snap.critiqueMap?.[g.id],target=snap.groups.find(x=>x.id===targetId),source=snap.responses?.ethics?.[targetId],mine=snap.responses?.critique?.[g.id]?.text||'';const sourceText=source?(Object.entries(source.fields||{}).map(([k,v])=>k.toUpperCase()+': '+v).join('\n')+'\n\nREASONING: '+(source.text||'')):'That group has not saved a decision yet.';return '<section class="card hero"><div class="tiny">CROSS-GROUP CHALLENGE</div><h1>Stress-test Group '+esc(targetId)+'’s reasoning.</h1><p>'+esc(target?.caseTitle||'Another case')+'</p></section><section class="card"><div class="response">'+esc(sourceText)+'</div><div class="label">LEAVE ONE CHALLENGE</div><textarea id="groupText" class="field" rows="5" placeholder="Challenge an assumption, missed stakeholder, underestimated risk, or safeguard.">'+esc(mine)+'</textarea><div class="actions" style="margin-top:12px"><button class="btn" id="submitGroup">SAVE CHALLENGE</button></div><p id="saveMsg" class="status"></p></section>'}
function signatureActivity(g){return '<section class="card hero"><div class="tiny">GEN ED SIGNATURE ASSIGNMENT · DUE SUNDAY</div><h1>Did today’s case give you a topic—or sharpen one you already had?</h1><p>Your infographic needs a specific issue, credible evidence, multiple perspectives, benefits, risks, and responsible choices.</p></section><section class="card"><div class="label">DID THIS CASE HELP?</div><select id="interest" class="field"><option>YES — I may use this topic</option><option>MAYBE — it gave me another idea</option><option>NO — I have a different topic</option></select><div class="label">MY LIKELY TOPIC</div><input id="topic" class="field" placeholder="Specific issue, not just a category"><div class="label">MY RESEARCHABLE QUESTION</div><textarea id="question" class="field" rows="3"></textarea><div class="grid"><div><div class="label">STAKEHOLDER I NEED TO UNDERSTAND</div><input id="stakeholder" class="field"></div><div><div class="label">I NEED CREDIBLE EVIDENCE ABOUT…</div><input id="evidenceNeed" class="field"></div></div><div class="actions" style="margin-top:12px"><button class="btn" id="saveSignature">SAVE MY START</button></div><p id="saveMsg" class="status">Remember: at least 2 credible, non-AI sources.</p></section>'}
function wireStudent(phase){const submit=document.getElementById('submitGroup');if(submit)submit.onclick=()=>saveGroup(phase,{});const eth=document.getElementById('submitEthics');if(eth)eth.onclick=()=>saveGroup('ethics',{benefit:val('benefit'),stakeholders:val('stakeholders'),lens:val('lens'),decision:val('decision'),safeguard:val('safeguard')});const sig=document.getElementById('saveSignature');if(sig)sig.onclick=saveSignature}
async function saveGroup(phase,fields){writeDraft();try{await req('/response',{method:'POST',body:JSON.stringify({device:local.device,phase,text:val('groupText'),fields})});clearDraft(['groupText','benefit','stakeholders','lens','decision','safeguard']);document.getElementById('saveMsg').textContent='Saved ✓';await refresh()}catch(e){document.getElementById('saveMsg').textContent=e.message}}
async function saveSignature(){writeDraft();try{await req('/individual',{method:'POST',body:JSON.stringify({device:local.device,kind:'signature',topic:val('topic'),question:val('question'),stakeholder:val('stakeholder'),evidenceNeed:val('evidenceNeed'),interest:val('interest')})});clearDraft(['topic','question','stakeholder','evidenceNeed','interest']);document.getElementById('saveMsg').textContent='Saved ✓ You now have a starting point for Sunday.';await refresh()}catch(e){document.getElementById('saveMsg').textContent=e.message}}
function instructorView(){
 const phase=snap?.state?.phase||'marketplace',formed=!!snap?.state?.groupsFormed;
 const controls=formed?'<section class="card"><div class="phaseTitle">RUN THE SESSION</div><div class="actions">'+['groups','visit','ethics','critique','signature','close'].map(p=>'<button class="btn phase '+(phase===p?'active':'')+'" data-phase="'+p+'">'+esc(phaseNames[p])+'</button>').join('')+'</div></section>':'<section class="card"><div class="phaseTitle">CASE MARKETPLACE</div><div class="actions"><button class="btn" id="formGroups">FORM 4 INTEREST-BASED GROUPS</button></div><p class="status">Use this after most students have joined and voted. Top four cases win; preferences are honored while group sizes stay balanced.</p></section>';
 const stats='<section class="grid"><div class="card"><div class="phaseTitle">JOINED</div><div style="font-size:38px;font-weight:950">'+(snap?.people?.length||0)+'</div></div><div class="card"><div class="phaseTitle">BALLOTS SAVED</div><div style="font-size:38px;font-weight:950">'+(snap?.totalBallots||0)+'</div></div><div class="card"><div class="phaseTitle">SIGNATURE STARTS</div><div style="font-size:38px;font-weight:950">'+(snap?.signatureReady||0)+'</div></div></section>';
 let body='';
 if(!formed)body='<section class="grid">'+(snap?.cases||[]).map(c=>caseCard(c,false)).join('')+'</section>';
 else body='<section class="grid">'+snap.groups.map(g=>'<div class="card groupCard" style="--c:'+g.color+'"><div class="zone">GROUP '+g.id+' · '+esc(g.zone)+'</div><h3>'+esc(g.caseTitle)+'</h3><p><strong>'+esc(g.caseQuestion)+'</strong></p><div class="members">'+g.members.map(m=>'<span class="member">'+esc(m.name)+' · '+esc(m.role)+'</span>').join('')+'</div>'+instructorResponse(g,phase)+'</div>').join('')+'</section>';
 app.className='instructor';app.innerHTML='<div class="shell">'+header('INSTRUCTOR · '+phaseNames[phase])+'<section class="card hero"><div class="tiny">INF 125 · INTEREST-BASED GROUP MODE</div><h1>'+esc(phaseNames[phase])+'</h1><p>'+(formed?'Students chose the cases. Class Runner balanced the groups. You control the room flow from here.':'Students can choose two seeded cases or pitch a real case of their own. Let the marketplace breathe for a few minutes before forming groups.')+'</p></section>'+controls+stats+body+'<section class="card"><div class="actions"><a class="btn soft" href="/groups/room?session='+encodeURIComponent(SESSION)+'" target="_blank">OPEN ROOM VIEW ↗</a><a class="btn soft" href="/groups?session='+encodeURIComponent(SESSION)+'" target="_blank">OPEN STUDENT VIEW ↗</a><button class="btn danger" id="resetBtn">RESET</button></div></section></div>';
 document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>setPhase(b.dataset.phase));const fg=document.getElementById('formGroups');if(fg)fg.onclick=formGroups;document.getElementById('resetBtn').onclick=reset
}
function instructorResponse(g,phase){if(['groups'].includes(phase))return '<p class="status">'+g.members.length+' students · '+esc(g.caseField)+'</p>';if(phase==='signature')return '<p class="status">Individual work · '+snap.signatureReady+' saved so far.</p>';const r=snap.responses?.[phase]?.[g.id];if(!r)return '<p class="warn">No response saved yet.</p>';const f=r.fields?Object.entries(r.fields).map(([k,v])=>'<b>'+esc(k)+':</b> '+esc(v)).join('<br>'):'';return '<div class="response">'+f+(f?'<br><br>':'')+esc(r.text||'')+'<div class="status">Saved by '+esc(r.submittedBy||'student')+'</div></div>'}
async function formGroups(){try{await req('/form-groups',{method:'POST',body:'{}'});await refresh()}catch(e){alert(e.message)}}
async function setPhase(phase){try{await req('/phase',{method:'POST',body:JSON.stringify({phase})});await refresh()}catch(e){alert(e.message)}}
async function reset(){if(!confirm('Reset all marketplace votes, proposals, groups, and responses?'))return;await req('/reset',{method:'POST',body:'{}'});local.draftVotes=[];save();await refresh()}
function roomView(){
 const phase=snap?.state?.phase||'marketplace',formed=!!snap?.state?.groupsFormed;let body='';
 if(!formed){body='<section class="card hero"><div class="tiny">CASE MARKETPLACE</div><h1>What AI issue would you actually want to argue about?</h1><p>Go to <strong>classroom.itsbadlabs.com/groups</strong> on your phone. Join → browse → pitch a wildcard if you have one → vote for up to two.</p></section><section class="grid">'+(snap?.cases||[]).slice(0,8).map(c=>caseCard(c,false)).join('')+'</section>'}
 else{const task={groups:'Find your color zone, sit together, then log into a computer.',visit:'Help design the 11/17 high school visit.',ethics:'Make a defensible decision about the case your group chose.',critique:'Stress-test another group’s reasoning.',signature:'Turn today’s thinking into a strong infographic direction.',close:'Know what you still need before Sunday.'}[phase]||'';body='<section class="card hero"><div class="tiny">'+esc(phaseNames[phase])+'</div><h1>'+esc(task)+'</h1></section><section class="grid">'+snap.groups.map(g=>'<div class="card groupCard" style="--c:'+g.color+'"><div class="zone">GROUP '+g.id+' · '+esc(g.zone)+'</div><h2>'+esc(g.caseTitle)+'</h2><p><strong>'+esc(g.caseQuestion)+'</strong></p><div class="members">'+g.members.map(m=>'<span class="member">'+esc(m.name)+'</span>').join('')+'</div></div>').join('')+'</section>'}
 app.className='room';app.innerHTML='<div class="shell">'+header('ROOM VIEW · '+phaseNames[phase])+body+'<div class="footer">CHOOSE → GROUP → DEBATE → CHALLENGE → APPLY</div></div>'
}
async function refresh(){try{snap=await req('/snapshot');lastError='';if(VIEW==='student'&&local.name&&!me()){const j=await req('/join',{method:'POST',body:JSON.stringify({device:local.device,name:local.name})});snap=j.snapshot}render()}catch(e){lastError=e.message;render()}}
function render(){if(VIEW==='instructor')return instructorView();if(VIEW==='room')return roomView();if(!local.name||!snap||!me())return joinView();studentView()}
if(VIEW==='student')setInterval(()=>{if(local.name)req('/heartbeat',{method:'POST',body:JSON.stringify({device:local.device})}).catch(()=>{})},30000);
refresh();
setInterval(()=>{
  const active=document.activeElement;
  const editing=VIEW==='student' && active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
  if(VIEW==='student') writeDraft();
  if(!editing && (VIEW!=='student'||local.name)) refresh();
},2500);
</script></body></html>
