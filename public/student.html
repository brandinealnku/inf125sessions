<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f0e4"><title>Classroom</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:#f6f0e4;color:#171713}.shell{min-height:100svh;display:grid;place-items:center;padding:24px}.stage{width:min(720px,100%)}.kicker{font-size:11px;letter-spacing:.19em;text-transform:uppercase;font-weight:900;color:#8b6818}.prompt,.title{font-family:Georgia,serif;letter-spacing:-.05em;font-weight:500}.title{font-size:clamp(48px,11vw,78px);line-height:.9}.prompt{font-size:clamp(38px,9vw,68px);line-height:.94;margin:10px 0 14px}.lead{font-size:19px;line-height:1.45;color:#625e55;margin-bottom:24px}.mission{background:#171713;color:#f6f0e4;border-radius:18px;padding:18px 20px;margin:18px 0 22px}.mission b{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#d8aa3d}.mission p{font-size:18px;line-height:1.4;margin:7px 0 0}.field,.choice,.action{width:100%;border-radius:14px;font-size:18px;min-height:62px}.field{border:1px solid #aaa397;background:#fffaf0;padding:18px}.action{margin-top:12px;border:0;background:#171713;color:#f6f0e4;padding:18px;font-weight:900}.choice{display:flex;align-items:center;gap:13px;text-align:left;background:#fffaf0;color:#171713;border:1px solid #bbb3a5;padding:17px;margin:10px 0;font-weight:750;transition:.15s transform,.15s background}.choice:active{transform:scale(.985)}.choice:before{content:'';width:18px;height:18px;border:2px solid #aaa397;border-radius:50%;flex:0 0 auto}.choice.selected{background:#171713;color:#fff}.choice.selected:before{background:#d8aa3d;border-color:#d8aa3d;box-shadow:inset 0 0 0 4px #171713}.look{min-height:76svh;display:grid;place-content:center;text-align:center}.look .lock{font-size:12px;letter-spacing:.18em;font-weight:900;color:#8b6818}.look h1{font-family:Georgia,serif;font-size:clamp(58px,15vw,96px);line-height:.86;font-weight:500;margin:12px}.look p{font-size:21px;line-height:1.45;color:#625e55;max-width:560px}.lookUp{display:inline-block;margin-top:18px;border-top:1px solid #bdb5a8;padding-top:18px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.textarea{min-height:150px}.hint{font-size:14px;color:#6f6a60;margin:12px 0}.error{color:#8d3535;margin-top:12px}@media(max-width:520px){.shell{place-items:start center;padding:32px 18px}.choice{min-height:68px}}</style></head><body><main class="shell"><div class="stage" id="app" aria-live="polite"></div></main><script src="/shared-v08.js"></script><script>const C=Classroom,app=document.getElementById('app');let studentName=localStorage.classroomName||'',lastKey='',selected=[];function task(s,f=''){return s.studentTask||f||s.lead||''}function head(s){return`<div class="kicker">${C.esc(s.label||'Now')}</div><h1 class="prompt">${C.esc(s.title)}</h1><p class="lead">${C.esc(s.lead||'')}</p>`}function mission(t){return t?`<div class="mission"><b>Your move</b><p>${C.esc(t)}</p></div>`:''}function err(m){let e=document.getElementById('error');if(e)e.textContent=m||''}function joinView(){app.innerHTML=`<div class="kicker">Live classroom</div><h1 class="title">${C.esc(C.session.title)}</h1><p class="lead">Your phone is part of the experience. When you're done, it will tell you when to look back at the room.</p><input id="nameInput" class="field" placeholder="First name or nickname" value="${C.esc(studentName)}"><button class="action" id="joinBtn">Enter the room →</button><div id="error" class="error"></div>`;document.getElementById('joinBtn').onclick=doJoin;document.getElementById('nameInput').onkeydown=e=>{if(e.key==='Enter')doJoin()}}async function doJoin(){let i=document.getElementById('nameInput');studentName=i.value.trim();if(!studentName)return err('Enter a name or nickname.');localStorage.classroomName=studentName;await C.join(studentName);render(true);setInterval(C.heartbeat,30000);setInterval(poll,1000)}function answered(s){return s.key&&!!localStorage.getItem('answer:'+C.session.id+':'+s.key)}function look(s){app.innerHTML=`<section class="look"><div><div class="lock">LOCKED IN ✓</div><h1>Look up.</h1><p>${C.esc(s.afterSubmit||'Keep your answer. The room is about to change.')}</p><span class="lookUp">Phone down · eyes on the room</span></div></section>`}async function submit(s,v){if(C.snapshot.state.locked)return err('Responses are closed.');try{await C.answer(s.key,v,studentName);localStorage.setItem('answer:'+C.session.id+':'+s.key,JSON.stringify(v));await C.refresh();look(s)}catch(e){err('Response did not send. Try again.')}}function vote(s){app.innerHTML=head(s)+mission(task(s,'Make your call before you hear what anyone else thinks.'))+s.choices.map(c=>`<button class="choice" data-v="${C.esc(c)}">${C.esc(c)}</button>`).join('')+'<div id="error" class="error"></div>';app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>submit(s,b.dataset.v))}function select(s){selected=[];let max=Math.max(1,Math.min(s.choices.length,s.maxSelections||3));app.innerHTML=head(s)+mission(task(s,`You only get ${max}. Choose carefully.`))+`<div class="hint">Choose ${max}. No more.</div>`+s.choices.map(c=>`<button class="choice" data-v="${C.esc(c)}">${C.esc(c)}</button>`).join('')+'<button class="action" id="commitBtn" disabled>Lock in our choices →</button><div id="error" class="error"></div>';app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=b.dataset.v,i=selected.indexOf(v);if(i>=0)selected.splice(i,1);else if(selected.length<max)selected.push(v);b.classList.toggle('selected',selected.includes(v));document.getElementById('commitBtn').disabled=selected.length!==max});document.getElementById('commitBtn').onclick=()=>submit(s,[...selected])}function promptView(s){app.innerHTML=head(s)+mission(task(s,'Write one thought worth putting into the room.'))+`<textarea id="responseInput" class="field textarea" placeholder="${C.esc(s.placeholder||'What are you thinking?')}"></textarea><button class="action" id="sendBtn">Put it in the room →</button><div id="error" class="error"></div>`;document.getElementById('sendBtn').onclick=()=>{let v=document.getElementById('responseInput').value.trim();if(v)submit(s,v);else err('Add a response first.')}}function passive(s){app.innerHTML=`<section class="look"><div><div class="kicker">${C.esc(s.label||'Now')}</div><h1>${C.esc(s.title)}</h1><p>${C.esc(task(s,'Your phone has nothing useful to add right now. Look up and stay with the room.'))}</p><span class="lookUp">Eyes on the room</span></div></section>`}function runtimeType(s){if(['vote','choice'].includes(s.type))return'vote';if(['select','multi-select'].includes(s.type))return'select';if(['prompt','reflection'].includes(s.type))return'prompt';return'passive'}function render(force=false){let s=C.current(),k=[C.snapshot.state.step,C.snapshot.state.locked,answered(s),C.snapshot.state.updatedAt].join('|');if(!force&&k===lastKey)return;lastKey=k;if(answered(s))return look(s);let t=runtimeType(s);if(t==='vote')vote(s);else if(t==='select')select(s);else if(t==='prompt')promptView(s);else passive(s)}async function poll(){try{await C.refresh();render()}catch(_){}}(async()=>{try{await C.loadSession();await C.refresh();if(studentName){await C.join(studentName);render(true);setInterval(C.heartbeat,30000);setInterval(poll,1000)}else joinView()}catch(e){app.innerHTML='<p class="error">This class could not load.</p>'}})();</script></body></html>
