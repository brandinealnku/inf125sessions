<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><title>Join class</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:var(--paper);color:var(--ink)}.shell{min-height:100svh;display:grid;place-items:center;padding:24px}.stage{width:min(760px,100%)}.title,.prompt{font-family:Georgia,serif;letter-spacing:-.045em;font-weight:500}.title{font-size:clamp(42px,10vw,72px);line-height:.96}.prompt{font-size:clamp(36px,8vw,66px);line-height:.98;margin:8px 0 18px}.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:#8a691d}.lead{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 18px}.task{border-top:1px solid #c9c4b8;border-bottom:1px solid #c9c4b8;padding:16px 0;margin:18px 0 22px}.task b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.task p{font-size:17px;line-height:1.5;margin:0}.field,.choice,.action{width:100%;border-radius:10px;font-size:18px;min-height:58px}.field{border:1px solid #aaa59a;background:#fffdf7;padding:18px 16px}.action{margin-top:12px;border:0;background:var(--ink);color:var(--paper);padding:18px;font-weight:800}.choice{display:block;text-align:left;background:transparent;color:var(--ink);border:1px solid #aaa59a;padding:18px;margin:9px 0;font-weight:750}.choice.selected{background:var(--ink);color:var(--paper)}.look{min-height:72svh;display:grid;place-content:center;text-align:center}.look h1{font-family:Georgia,serif;font-size:clamp(48px,12vw,84px);line-height:.95;font-weight:500;margin:10px}.look p{font-size:21px;line-height:1.45;color:var(--muted);max-width:560px}.textarea{min-height:150px}.hint{font-size:14px;color:var(--muted);margin:12px 0}.error{color:#8d3535;margin-top:12px}@media(max-width:520px){.shell{place-items:start center;padding:34px 20px}.choice{min-height:64px}}</style></head><body><main class="shell"><div class="stage" id="app" aria-live="polite"></div></main><script src="/shared-v08.js"></script><script>const C=Classroom,app=document.getElementById('app');let studentName=localStorage.classroomName||'',lastKey='',selected=[];function task(s,fallback){return s.studentTask||fallback||s.lead||''}function head(s){return `<div class="label">${C.esc(s.label||'Now')}</div><h1 class="prompt">${C.esc(s.title)}</h1><p class="lead">${C.esc(s.lead||'')}</p>`}function taskBox(t){return t?`<div class="task"><b>What to do</b><p>${C.esc(t)}</p></div>`:''}function err(m){let e=document.getElementById('error');if(e)e.textContent=m||''}function joinView(){app.innerHTML=`<div class="label">${C.esc(C.session.course)}</div><h1 class="title">${C.esc(C.session.title)}</h1><p class="lead">Join the live class experience. Your screen will change as the class moves.</p><input id="nameInput" class="field" placeholder="First name or nickname" value="${C.esc(studentName)}"><button class="action" id="joinBtn">Join →</button><div id="error" class="error"></div>`;document.getElementById('joinBtn').onclick=doJoin;document.getElementById('nameInput').onkeydown=e=>{if(e.key==='Enter')doJoin()}}async function doJoin(){let i=document.getElementById('nameInput');studentName=i.value.trim();if(!studentName)return err('Enter a name or nickname.');localStorage.classroomName=studentName;await C.join(studentName);render(true);setInterval(C.heartbeat,30000);setInterval(poll,1500)}function answered(s){return s.key&&!!localStorage.getItem('answer:'+s.key)}function look(s){app.innerHTML=`<section class="look"><div><div style="font-size:34px">✓</div><h1>You're in.</h1><p>${C.esc(s.afterSubmit||'Your response is locked in. Keep this screen open and look up at the Room.')}</p></div></section>`}async function submit(s,v){if(C.snapshot.state.locked)return err('Responses are closed.');try{await C.answer(s.key,v,studentName);localStorage.setItem('answer:'+s.key,JSON.stringify(v));await C.refresh();look(s)}catch(e){err('Response did not send. Try again.')}}function vote(s){app.innerHTML=head(s)+taskBox(task(s,'Choose one answer on your own. Commit before discussing it with anyone else.'))+s.choices.map(c=>`<button class="choice" data-v="${C.esc(c)}">${C.esc(c)}</button>`).join('')+'<div id="error" class="error"></div>';app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>submit(s,b.dataset.v))}function select(s){selected=[];app.innerHTML=head(s)+taskBox(task(s,`Talk with 2–3 people near you. Agree on ${s.maxSelections||3} choices. One person submits for the group.`))+`<div class="hint">Select exactly ${s.maxSelections||3}.</div>`+s.choices.map(c=>`<button class="choice" data-v="${C.esc(c)}">${C.esc(c)}</button>`).join('')+'<button class="action" id="commitBtn" disabled>Commit group choices</button><div id="error" class="error"></div>';app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=b.dataset.v,i=selected.indexOf(v);if(i>=0)selected.splice(i,1);else if(selected.length<(s.maxSelections||3))selected.push(v);b.classList.toggle('selected',selected.includes(v));document.getElementById('commitBtn').disabled=selected.length!==(s.maxSelections||3)});document.getElementById('commitBtn').onclick=()=>submit(s,selected)}function promptView(s){app.innerHTML=head(s)+taskBox(task(s,'Write one concise response, then submit it before you leave.'))+`<textarea id="responseInput" class="field textarea" placeholder="${C.esc(s.placeholder||'Type your response…')}"></textarea><button class="action" id="sendBtn">Commit response</button><div id="error" class="error"></div>`;document.getElementById('sendBtn').onclick=()=>{let v=document.getElementById('responseInput').value.trim();if(v)submit(s,v);else err('Add a response first.')}}function passive(s){let fallback=s.interaction==='observe'?'Put your phone down and look at the Room. Listen, think, and be ready to answer aloud.':s.interaction==='challenge'?'Put your phone down. Listen to the class reasoning and be ready to defend or challenge an idea.':s.interaction==='reveal'?'Do not submit anything yet. Watch the new information appear and notice when your thinking changes.':'Look at the Room and follow your instructor.';app.innerHTML=`<section class="look"><div><div class="label">${C.esc(s.label||'Now')}</div><h1>${C.esc(s.title)}</h1><p>${C.esc(task(s,fallback))}</p></div></section>`}function render(force=false){let s=C.current(),k=[C.snapshot.state.step,C.snapshot.state.locked,answered(s)].join('|');if(!force&&k===lastKey)return;lastKey=k;if(answered(s))return look(s);if(s.type==='vote')vote(s);else if(s.type==='select')select(s);else if(s.type==='prompt')promptView(s);else passive(s)}async function poll(){try{await C.refresh();render()}catch(_){}}(async()=>{try{await C.loadSession();await C.refresh();if(studentName){await C.join(studentName);render(true);setInterval(C.heartbeat,30000);setInterval(poll,1500)}else joinView()}catch(e){app.innerHTML='<p class="error">This class could not load.</p>'}})();</script></body></html>
