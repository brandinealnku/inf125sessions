<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>ShowRunner · Student View</title>
<link rel="stylesheet" href="/shared-v08.css">
<style>
:root{
  --canvas:#f5f3ee;--ink:#1a2230;--muted:#66707d;--line:#dedbd3;--white:#fff;
  --blue:#dfeaff;--blueInk:#2457a6;--gold:#fff0bf;--goldInk:#8c6410;
  --green:#def4e5;--greenInk:#2f7a4b;--coral:#ffe2dc;--coralInk:#a34838;
  --shadow:0 12px 32px rgba(38,48,62,.08)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
.shell{width:min(820px,100%);margin:0 auto;padding:18px 20px 48px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:900}
.subbrand{font-size:12px;color:var(--muted);margin-top:3px}
.meta{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:999px;padding:7px 10px;font-size:11px;color:#596471;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#4e9b68;display:inline-block}
.progressWrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:16px 0 20px}
.progressLabel,.progressCount{font-size:11px;color:var(--muted);font-weight:800}
.progressTrack{height:6px;background:#e1ddd4;border-radius:999px;overflow:hidden}
.progressTrack span{display:block;height:100%;background:#2457a6;border-radius:999px;transition:width .25s}
.card{border:1px solid rgba(0,0,0,.04);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow);margin:14px 0}
.now{background:var(--blue)}
.now .label{color:var(--blueInk)}
.move{background:var(--gold)}
.move .label{color:var(--goldInk)}
.after{background:var(--green)}
.after .label{color:var(--greenInk)}
.locked{background:var(--green);text-align:center;padding:34px 24px}
.label{font-size:10px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}
.title{font-size:clamp(38px,8vw,62px);line-height:.97;letter-spacing:-.045em;margin:8px 0 12px;font-weight:780}
.lead{font-size:18px;line-height:1.45;color:#43536a;margin:0}
.moveText{font-size:20px;line-height:1.4;font-weight:750;margin:8px 0 0;color:#4f4632}
.afterText{font-size:14px;line-height:1.45;color:#42614d;margin:7px 0 0}
.field,.choice,.action{width:100%;border-radius:14px;font-size:17px}
.field{border:1px solid #b8b2a8;background:#fff;padding:16px;color:var(--ink);min-height:58px}
.textarea{min-height:145px;resize:vertical;line-height:1.45}
.action{margin-top:12px;border:0;background:#1a2230;color:#fff;padding:16px 18px;font-weight:900;min-height:56px;cursor:pointer}
.action:disabled{opacity:.38;cursor:not-allowed}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;color:var(--ink);border:1px solid #c8c2b8;padding:17px;margin:10px 0;font-weight:800;min-height:64px;cursor:pointer;transition:.15s transform,.15s background,.15s border}
.choice:hover{border-color:#9fb6d8}
.choice:active{transform:scale(.99)}
.choice:before{content:"";width:18px;height:18px;border:2px solid #a8a39b;border-radius:50%;flex:0 0 auto}
.choice.selected{background:#1a2230;color:#fff;border-color:#1a2230}
.choice.selected:before{background:#f0c95a;border-color:#f0c95a;box-shadow:inset 0 0 0 4px #1a2230}
.hint{font-size:13px;color:var(--muted);margin:10px 0}
.support{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 2px 0;color:var(--muted);font-size:12px}
.lockIcon{width:58px;height:58px;border-radius:18px;background:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:26px;box-shadow:0 6px 18px rgba(38,48,62,.08)}
.locked h1{font-size:clamp(42px,10vw,68px);line-height:.95;letter-spacing:-.05em;margin:8px 0 12px}
.locked p{font-size:18px;line-height:1.45;color:#42614d;max-width:560px;margin:0 auto}
.lookUp{display:inline-block;margin-top:20px;border-top:1px solid rgba(47,122,75,.22);padding-top:16px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--greenInk)}
.join{padding-top:6vh}
.joinCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.joinTitle{font-size:clamp(42px,10vw,66px);line-height:.95;letter-spacing:-.05em;margin:8px 0 12px}
.joinLead{font-size:18px;line-height:1.45;color:var(--muted);margin-bottom:22px}
.welcomeStrip{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0 22px}
.welcomeItem{background:#f7f6f2;border:1px solid #ebe7de;border-radius:14px;padding:12px;font-size:12px;color:#596471}
.welcomeItem b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.error{color:#983f34;font-size:13px;margin-top:10px}
@media(max-width:620px){
  .shell{padding:14px 14px 34px}.header{display:block}.meta{justify-content:flex-start;margin-top:10px}
  .card{padding:19px 18px;border-radius:19px}.title{font-size:clamp(38px,12vw,58px)}
  .welcomeStrip{grid-template-columns:1fr}.progressWrap{margin-top:14px}
}
</style>
</head>
<body>
<main class="shell">
  <div id="app" aria-live="polite"></div>
</main>
<script src="/shared-v08.js"></script>
<script>
const C=Classroom;
const app=document.getElementById('app');
let studentName=localStorage.classroomName||'',lastKey='',lastStep=-1,lastUpdatedAt=0,selected=[];

function task(s,f=''){return s.studentTask||f||s.lead||''}
function elapsedPct(){const total=Math.max(1,C.session.durationMinutes||75),elapsed=C.elapsed(C.snapshot.state.step||0);return Math.max(0,Math.min(100,Math.round(elapsed/total*100)))}
function chrome(){
  const s=C.current(),state=C.snapshot.state,step=(state.step||0)+1,total=C.session.steps.length,pct=elapsedPct();
  return '<header class="header"><div><div class="brand">'+C.esc(C.session.course||'INF 125')+'</div><div class="subbrand">'+C.esc(C.session.title)+' · Student view</div></div>'+
    '<div class="meta"><span class="pill"><span class="dot"></span>Live</span><span class="pill">'+C.snapshot.participantCount+' in room</span></div></header>'+
    '<div class="progressWrap"><span class="progressLabel">SESSION</span><div class="progressTrack"><span style="width:'+pct+'%"></span></div><span class="progressCount">Moment '+step+' of '+total+'</span></div>';
}
function currentCard(s){
  return '<section class="card now"><div class="label">NOW · '+C.esc(s.label||'Moment')+'</div><h1 class="title">'+C.esc(s.title||'')+'</h1><p class="lead">'+C.esc(s.lead||'')+'</p></section>';
}
function moveCard(text){
  return text?'<section class="card move"><div class="label">YOUR MOVE</div><div class="moveText">'+C.esc(text)+'</div></section>':'';
}
function afterCard(){
  return '<section class="card after"><div class="label">WHAT HAPPENS NEXT</div><div class="afterText">Once you submit, keep your answer and look back at the room. Your instructor will move everyone forward together.</div></section>';
}
function err(m){let e=document.getElementById('error');if(e)e.textContent=m||''}

function joinView(){
  app.innerHTML='<section class="join"><div class="joinCard"><div class="label">LIVE CLASSROOM</div><h1 class="joinTitle">'+C.esc(C.session.title)+'</h1><p class="joinLead">Your phone is part of the class today. You will respond when there is something useful to do, then the screen will get out of your way.</p>'+
    '<div class="welcomeStrip"><div class="welcomeItem"><b>1 · Respond</b>Make your own call first.</div><div class="welcomeItem"><b>2 · Look up</b>Return to the room after you submit.</div><div class="welcomeItem"><b>3 · Stay with us</b>The class moves together.</div></div>'+
    '<label class="label" for="nameInput">WHAT SHOULD WE CALL YOU?</label><input id="nameInput" class="field" placeholder="First name or nickname" autocomplete="given-name" value="'+C.esc(studentName)+'"><button class="action" id="joinBtn">Enter the room →</button><div id="error" class="error"></div></div></section>';
  document.getElementById('joinBtn').onclick=doJoin;
  document.getElementById('nameInput').onkeydown=e=>{if(e.key==='Enter')doJoin()};
}
async function doJoin(){
  const i=document.getElementById('nameInput');studentName=i.value.trim();
  if(!studentName)return err('Enter a name or nickname.');
  localStorage.classroomName=studentName;
  await C.join(studentName);render(true);startLiveSync();
}
function answered(s){return s.key&&!!localStorage.getItem('answer:'+C.session.id+':'+s.key)}
function look(s){
  app.innerHTML=chrome()+'<section class="card locked"><div class="lockIcon">✓</div><div class="label">LOCKED IN</div><h1>You’re good.</h1><p>'+C.esc(s.afterSubmit||'Keep your answer. Your instructor is bringing the room back together.')+'</p><span class="lookUp">Phone down · eyes up</span></section>';
}
async function submit(s,v){
  if(C.snapshot.state.locked)return err('Responses are closed for this moment.');
  try{
    await C.answer(s.key,v,studentName);
    localStorage.setItem('answer:'+C.session.id+':'+s.key,JSON.stringify(v));
    await C.refresh();look(s);
  }catch(e){err('That did not send. Try once more.')}
}
function vote(s){
  app.innerHTML=chrome()+currentCard(s)+moveCard(task(s,'Make your call before you hear what anyone else thinks.'))+
    s.choices.map(c=>'<button class="choice" data-v="'+C.esc(c)+'">'+C.esc(c)+'</button>').join('')+
    afterCard()+'<div id="error" class="error"></div>';
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>submit(s,b.dataset.v));
}
function select(s){
  selected=[];const max=Math.max(1,Math.min(s.choices.length,s.maxSelections||3));
  app.innerHTML=chrome()+currentCard(s)+moveCard(task(s,'Choose the options that best match your thinking.'))+
    '<div class="hint">Choose exactly '+max+'.</div>'+
    s.choices.map(c=>'<button class="choice" data-v="'+C.esc(c)+'">'+C.esc(c)+'</button>').join('')+
    '<button class="action" id="commitBtn" disabled>Lock in my choices →</button>'+afterCard()+'<div id="error" class="error"></div>';
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v,i=selected.indexOf(v);
    if(i>=0)selected.splice(i,1);else if(selected.length<max)selected.push(v);
    b.classList.toggle('selected',selected.includes(v));
    document.getElementById('commitBtn').disabled=selected.length!==max;
  });
  document.getElementById('commitBtn').onclick=()=>submit(s,[...selected]);
}
function promptView(s){
  app.innerHTML=chrome()+currentCard(s)+moveCard(task(s,'Write one thought worth adding to the room.'))+
    '<textarea id="responseInput" class="field textarea" placeholder="'+C.esc(s.placeholder||'What are you thinking?')+'"></textarea>'+
    '<button class="action" id="sendBtn">Send my response →</button>'+afterCard()+'<div id="error" class="error"></div>';
  document.getElementById('sendBtn').onclick=()=>{
    const v=document.getElementById('responseInput').value.trim();
    if(v)submit(s,v);else err('Add a response first.');
  };
}
function passive(s){
  app.innerHTML=chrome()+currentCard(s)+
    '<section class="card move"><div class="label">YOUR MOVE</div><div class="moveText">'+C.esc(task(s,'Look up and stay with the room. There is nothing you need to type right now.'))+'</div></section>'+
    '<div class="support"><span>No response needed</span><strong>Eyes up ↑</strong></div>';
}
function runtimeType(s){
  if(['vote','choice'].includes(s.type))return'vote';
  if(['select','multi-select'].includes(s.type))return'select';
  if(['prompt','reflection'].includes(s.type))return'prompt';
  return'passive';
}
function render(force=false){
  const step=Number(C.snapshot.state.step||0),updatedAt=Number(C.snapshot.state.updatedAt||0),s=C.current();
  if(step!==lastStep||updatedAt!==lastUpdatedAt){force=true;lastStep=step;lastUpdatedAt=updatedAt;lastKey='';selected=[];}
  const k=[step,C.snapshot.state.locked,answered(s),updatedAt].join('|');
  if(!force&&k===lastKey)return;lastKey=k;
  if(answered(s))return look(s);
  const t=runtimeType(s);
  if(t==='vote')vote(s);else if(t==='select')select(s);else if(t==='prompt')promptView(s);else passive(s);
}
async function poll(force=false){try{await C.refresh();render(force)}catch(_){}}
function startLiveSync(){
  setInterval(C.heartbeat,30000);
  setInterval(()=>poll(false),700);
  window.addEventListener('focus',()=>poll(true));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll(true)});
  window.addEventListener('pageshow',()=>poll(true));
}
(async()=>{
  try{
    await C.loadSession();await C.refresh();
    if(studentName){await C.join(studentName);render(true);startLiveSync()}
    else joinView();
  }catch(e){app.innerHTML='<p class="error">This class could not load.</p>'}
})();
</script>
</body>
</html>
