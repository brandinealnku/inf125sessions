<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><title>Join class</title><link rel="stylesheet" href="/shared-v08.css"><style>
html,body{background:var(--paper);color:var(--ink)}.shell{min-height:100svh;display:grid;place-items:center;padding:24px}.stage{width:min(760px,100%)}.join{width:min(560px,100%)}.course{font-size:13px;color:var(--muted);margin-bottom:12px}.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,10vw,72px);line-height:.96;letter-spacing:-.045em;font-weight:500;margin:0 0 30px}.prompt{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,9vw,70px);line-height:.98;letter-spacing:-.04em;margin:0 0 20px;font-weight:500}.lead{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 30px;max-width:650px}.field{width:100%;border:1px solid #aaa59a;background:#fffdf7;color:var(--ink);border-radius:10px;padding:18px 16px;font-size:18px;min-height:58px}.action{width:100%;margin-top:12px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);padding:18px;font-weight:800;font-size:18px;cursor:pointer}.choice{width:100%;display:block;text-align:left;background:transparent;color:var(--ink);border:1px solid #aaa59a;border-radius:10px;padding:20px 18px;margin:10px 0;font-size:18px;font-weight:750;cursor:pointer}.choice:active,.choice.selected{background:var(--ink);color:var(--paper);border-color:var(--ink)}.choice:disabled,.action:disabled{opacity:.5}.look{min-height:72svh;display:grid;place-content:center;text-align:center}.check{font-size:34px}.look h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(50px,13vw,88px);line-height:.95;font-weight:500;letter-spacing:-.045em;margin:10px 0}.look p{font-size:24px;color:var(--muted);margin:0}.textarea{min-height:170px;resize:vertical}.step{font-size:12px;color:var(--muted);margin-bottom:12px}.error{margin-top:14px;color:#8d3535;line-height:1.4}.buildNav{display:flex;gap:10px;margin-top:12px}.buildNav button{flex:1}.waiting{font-family:Georgia,"Times New Roman",serif;font-size:36px;line-height:1.1;margin-top:24px}@media(max-width:520px){.shell{place-items:start center;padding:42px 20px 24px}.join{padding-top:3vh}.prompt{font-size:clamp(38px,11vw,56px)}.lead{font-size:17px}.choice{min-height:66px}}
</style></head><body><main class="shell"><div class="stage" id="app" aria-live="polite"></div></main><script src="/shared-v08.js"></script><script>
const C=Classroom;let name=localStorage.classroomName||'',joined=false,lastKey='',draft=JSON.parse(localStorage.classroomBuildDraft||'{}'),buildIndex=0;
function setError(msg){const e=document.getElementById('error');if(e)e.textContent=msg||''}
function joinView(){document.title='Join · '+(C.session.title||'Class');app.innerHTML=`<section class="join"><div class="course">${C.esc(C.session.course||'')}</div><h1 class="title">${C.esc(C.session.title)}</h1><label class="sr-only" for="name">First name or nickname</label><input id="name" class="field" autocomplete="given-name" inputmode="text" enterkeyhint="go" placeholder="First name or nickname" value="${C.esc(name)}"><button class="action" id="join">Join →</button><div class="error" id="error" role="alert"></div></section>`;const i=document.getElementById('name');document.getElementById('join').onclick=doJoin;i.addEventListener('keydown',e=>{if(e.key==='Enter')doJoin()});setTimeout(()=>i.focus(),30)}
async function doJoin(){const i=document.getElementById('name');name=i.value.trim();if(!name){setError('Enter a name or nickname to join.');i.focus();return}localStorage.classroomName=name;try{await C.join(name);joined=true;render(true);setInterval(C.heartbeat,30000);setInterval(poll,1500)}catch(e){setError('Could not join the room. Try again.')}}
function answered(s){return !!localStorage.getItem('answer:'+s.key)}
function remember(k,v){localStorage.setItem('answer:'+k,JSON.stringify(v))}
function look(){app.innerHTML=`<section class="look"><div><div class="check">✓</div><h1>Locked in.</h1><p>Look up.</p></div></section>`}
function vote(s){app.innerHTML=`<section><div class="kicker">Choose one</div><h1 class="prompt">${C.esc(s.title)}</h1>${s.lead?`<p class="lead">${C.esc(s.lead)}</p>`:''}<div>${s.choices.map(c=>`<button class="choice" ${C.snapshot.state.locked?'disabled':''} data-choice="${C.esc(c)}">${C.esc(c)}</button>`).join('')}</div><div id="error" class="error" role="alert"></div></section>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>submit(s,b.dataset.choice))}
function textPrompt(s){app.innerHTML=`<section><div class="kicker">Your response</div><h1 class="prompt">${C.esc(s.title)}</h1>${s.lead?`<p class="lead">${C.esc(s.lead)}</p>`:''}<label class="sr-only" for="response">Response</label><textarea id="response" class="field textarea" placeholder="${C.esc(s.placeholder||'Type your response…')}" ${C.snapshot.state.locked?'disabled':''}></textarea><button class="action" id="send" ${C.snapshot.state.locked?'disabled':''}>Commit response</button><div id="error" class="error" role="alert"></div></section>`;document.getElementById('send').onclick=()=>{const v=document.getElementById('response').value.trim();if(!v){setError('Add a response before committing.');return}submit(s,v)}}
function build(s){const fields=s.fields||[];if(!fields.length){look();return}buildIndex=Math.min(buildIndex,fields.length-1);const [key,label]=fields[buildIndex];app.innerHTML=`<section><div class="step">${buildIndex+1} of ${fields.length}</div><h1 class="prompt">${C.esc(label)}</h1><textarea id="buildValue" class="field textarea" placeholder="Write your thinking…">${C.esc(draft[key]||'')}</textarea><div class="buildNav"><button class="choice" id="back" ${buildIndex===0?'disabled':''}>Back</button><button class="action" id="forward">${buildIndex===fields.length-1?'Commit model':'Next'}</button></div><div id="error" class="error" role="alert"></div></section>`;document.getElementById('back').onclick=()=>{saveField(key);buildIndex--;build(s)};document.getElementById('forward').onclick=async()=>{saveField(key);if(buildIndex<fields.length-1){buildIndex++;build(s)}else await submit(s,draft)}}
function saveField(k){draft[k]=document.getElementById('buildValue').value.trim();localStorage.classroomBuildDraft=JSON.stringify(draft)}
async function submit(s,value){if(C.snapshot.state.locked){setError('Responses are closed for this moment.');return}try{await C.answer(s.key,value,name);remember(s.key,value);await C.refresh();look()}catch(e){setError('Your response did not send. Try once more.')}}
function passive(s){app.innerHTML=`<section class="look"><div><div class="kicker">${C.esc(s.label||'Now')}</div><h1 class="waiting">${C.esc(s.title)}</h1><p>Look up.</p></div></section>`}
function structure(){const s=C.current();return [C.snapshot.state.step,C.snapshot.state.locked,s.key?answered(s):false].join('|')}
function render(force=false){const s=C.current();const key=structure();if(!force&&key===lastKey)return;lastKey=key;if(s.key&&answered(s)){look();return}if(s.type==='vote')vote(s);else if(s.type==='prompt')textPrompt(s);else if(s.type==='build')build(s);else passive(s)}
async function poll(){try{await C.refresh();render(false)}catch(_){}}
async function boot(){try{await C.loadSession();await C.refresh();if(name){await C.join(name);joined=true;render(true);setInterval(C.heartbeat,30000);setInterval(poll,1500)}else joinView()}catch(e){app.innerHTML='<p class="error">This class could not load. Refresh to try again.</p>'}}boot();
</script></body></html>
