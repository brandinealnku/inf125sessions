<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><title>Join class</title><link rel="stylesheet" href="/shared-v08.css"><style>html,body{background:var(--paper);color:var(--ink)}.shell{min-height:100svh;display:grid;place-items:center;padding:24px}.stage{width:min(760px,100%)}.title,.prompt{font-family:Georgia,serif;letter-spacing:-.045em;font-weight:500}.title{font-size:clamp(42px,10vw,72px);line-height:.96}.prompt{font-size:clamp(38px,9vw,70px);line-height:.98;margin:0 0 20px}.lead{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 26px}.field,.choice,.action{width:100%;border-radius:10px;font-size:18px;min-height:58px}.field{border:1px solid #aaa59a;background:#fffdf7;padding:18px 16px}.action{margin-top:12px;border:0;background:var(--ink);color:var(--paper);padding:18px;font-weight:800}.choice{display:block;text-align:left;background:transparent;color:var(--ink);border:1px solid #aaa59a;padding:18px;margin:9px 0;font-weight:750}.choice.selected{background:var(--ink);color:var(--paper)}.look{min-height:72svh;display:grid;place-content:center;text-align:center}.look h1{font-family:Georgia,serif;font-size:clamp(50px,13vw,88px);line-height:.95;font-weight:500;margin:10px}.look p{font-size:24px;color:var(--muted)}.textarea{min-height:150px}.hint{font-size:14px;color:var(--muted);margin:12px 0}.passive{font-family:Georgia,serif;font-size:clamp(38px,9vw,64px);line-height:1.05}.error{color:#8d3535;margin-top:12px}@media(max-width:520px){.shell{place-items:start center;padding:42px 20px}.choice{min-height:64px}}</style></head><body><main class="shell"><div class="stage" id="app" aria-live="polite"></div></main><script src="/shared-v08.js"></script><script>const C=Classroom;let name=localStorage.classroomName||'',lastKey='',selected=[];function err(m){let e=document.getElementById('error');if(e)e.textContent=m||''}function joinView(){app.innerHTML=`<h1 class="title">${C.esc(C.session.title)}</h1><input id="name" class="field" placeholder="First name or nickname" value="${C.esc(name)}"><button class="action" id="join">Join →</button><div id="error" class="error"></div>`;join.onclick=doJoin;name=document.getElementById('name').value;document.getElementById('name').onkeydown=e=>{if(e.key==='Enter')doJoin()}}async function doJoin(){let i=document.getElementById('name');name=i.value.trim();if(!name)return err('Enter a name or nickname.');localStorage.classroomName=name;await C.join(name);render(true);setInterval(C.heartbeat,30000);setInterval(poll,1500)}function answered(s){return s.key&&!!localStorage.getItem('answer:'+s.key)}function look(){app.innerHTML='<section class="look"><div><div style="font-size:34px">✓</div><h1>Locked in.</h1><p>Look up.</p></div></section>'}async function submit(s,v){if(C.snapshot.state.locked)return err('Responses are closed.');try{await C.answer(s.key,v,name);localStorage.setItem('answer:'+s.key,JSON.stringify(v));await C.refresh();look()}catch(e){err('Response did not send. Try again.')}}function vote(s){app.innerHTML=`<h1 class="prompt">${C.esc(s.title)}</h1><p class="lead">${C.esc(s.lead||'')}</p>${s.choices.map(c=>`<button class="choice" data-v="${C.esc(c)}">${C.esc(c)}</button>`).join('')}<div id="error" class="error"></div>`;app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>submit(s,b.dataset.v))}function select(s){selected=[];app.innerHTML=`<h1 class="prompt">${C.esc(s.title)}</h1><p class="lead">${C.esc(s.lead||'')}</p><div class="hint">Choose ${s.maxSelections||3}. Talk first; one person can submit for your group.</div>${s.choices.map(c=>`<button class="choice" data-v="${C.esc(c)}">${C.esc(c)}</button>`).join('')}<button class="action" id="commit" disabled>Commit choices</button><div id="error" class="error"></div>`;app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=b.dataset.v,i=selected.indexOf(v);if(i>=0)selected.splice(i,1);else if(selected.length<(s.maxSelections||3))selected.push(v);b.classList.toggle('selected',selected.includes(v));commit.disabled=selected.length!==(s.maxSelections||3)});commit.onclick=()=>submit(s,selected)}function prompt(s){app.innerHTML=`<h1 class="prompt">${C.esc(s.title)}</h1><p class="lead">${C.esc(s.lead||'')}</p><textarea id="response" class="field textarea" placeholder="${C.esc(s.placeholder||'Type your response…')}"></textarea><button class="action" id="send">Commit response</button><div id="error" class="error"></div>`;send.onclick=()=>{let v=response.value.trim();if(v)submit(s,v);else err('Add a response first.')}}function passive(s){let instruction=s.interaction==='observe'?'Phones down. Look up.':s.interaction==='challenge'||s.interaction==='reveal'?'Talk with the room. No typing needed.':'Look up.';app.innerHTML=`<section class="look"><div><h1 class="passive">${C.esc(s.title)}</h1><p>${C.esc(instruction)}</p></div></section>`}function render(force=false){let s=C.current(),k=[C.snapshot.state.step,C.snapshot.state.locked,answered(s)].join('|');if(!force&&k===lastKey)return;lastKey=k;if(answered(s))return look();if(s.type==='vote')vote(s);else if(s.type==='select')select(s);else if(s.type==='prompt')prompt(s);else passive(s)}async function poll(){try{await C.refresh();render()}catch(_){}}(async()=>{try{await C.loadSession();await C.refresh();if(name){await C.join(name);render(true);setInterval(C.heartbeat,30000);setInterval(poll,1500)}else joinView()}catch(e){app.innerHTML='<p class="error">This class could not load.</p>'}})();</script></body></html>
