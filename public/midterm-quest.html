<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>INF 125 · Midterm Quest</title>
<style>
:root{
  --sky:#86c8ff;--sky2:#d8f0ff;--grass:#56a63a;--grass2:#72bd4d;--dirt:#8b5a32;--dirt2:#6f4528;
  --stone:#6f7780;--stone2:#4d545b;--wood:#9b6a3f;--ink:#172016;--paper:#f8f4df;--cream:#fffbe9;
  --gold:#f5c542;--green:#53a93f;--red:#c94a3c;--blue:#3b77c3;--purple:#7d5bb7;--shadow:#20351e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
body{
  background:
    linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 28%),
    linear-gradient(180deg,var(--sky) 0 52%,var(--grass2) 52% 56%,var(--grass) 56% 60%,var(--dirt) 60% 100%);
  background-attachment:fixed;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.11;
  background-image:
    linear-gradient(90deg,rgba(0,0,0,.18) 1px,transparent 1px),
    linear-gradient(rgba(0,0,0,.18) 1px,transparent 1px);
  background-size:24px 24px;
}
button,input{font:inherit}
.shell{width:min(980px,100%);margin:auto;padding:14px 16px 72px;position:relative}
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 13px;
  background:rgba(255,251,233,.94);border:4px solid #263c23;box-shadow:0 6px 0 #1d2b1a;
}
.brand{font-weight:1000;letter-spacing:-.04em;text-transform:uppercase}
.subtle{font-size:12px;color:#5d684f}
.gameBadge,.pill{
  display:inline-flex;align-items:center;gap:7px;border:3px solid #263c23;background:#fff8d6;
  padding:8px 11px;font-size:12px;font-weight:950;box-shadow:3px 3px 0 #263c23;
}
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fff7d0,#f2e5af);
  border:5px solid #263c23;padding:28px;margin:22px 0;box-shadow:9px 9px 0 rgba(32,53,30,.85);
}
.hero:before{
  content:"";position:absolute;right:20px;top:20px;width:86px;height:86px;
  background:
    linear-gradient(90deg,#7b5837 0 33%,#956842 33% 66%,#684829 66%),
    linear-gradient(#7b5837 0 33%,#956842 33% 66%,#684829 66%);
  background-blend-mode:multiply;opacity:.18;image-rendering:pixelated;
}
.kicker{font-size:11px;font-weight:1000;letter-spacing:.13em;text-transform:uppercase;color:#3f6e2c}
.hero h1{font-size:clamp(43px,9vw,78px);line-height:.88;letter-spacing:-.075em;margin:10px 0 15px;text-transform:uppercase;max-width:760px;text-shadow:3px 3px 0 #d2bd72}
.hero p{font-family:Inter,system-ui,sans-serif;font-size:18px;line-height:1.5;color:#3e4938;max-width:700px;position:relative;z-index:1}
.card,.mission{
  background:rgba(255,251,233,.97);border:5px solid #263c23;box-shadow:8px 8px 0 rgba(32,53,30,.78);
}
.card{padding:22px;margin:18px 0}.card h2{font-size:27px;letter-spacing:-.04em;margin:0 0 10px;text-transform:uppercase}
.field{
  width:100%;padding:15px;border:4px solid #42513b;background:#fffef5;color:var(--ink);font-size:17px;outline:none;
  box-shadow:inset 3px 3px 0 #d7d0b6;
}
.field:focus{border-color:#2e6cae;box-shadow:inset 3px 3px 0 #d7d0b6,0 0 0 3px #9bd1ff}
.action{
  border:4px solid #263c23;background:#4d9a38;color:#fff;font-weight:1000;padding:14px 18px;cursor:pointer;min-height:52px;
  text-transform:uppercase;box-shadow:0 6px 0 #2d6022;text-shadow:2px 2px 0 rgba(0,0,0,.22)
}
.action:hover{transform:translateY(-1px)}.action:active{transform:translateY(4px);box-shadow:0 2px 0 #2d6022}
.action.secondary{background:#77818a;box-shadow:0 6px 0 #4b535a}.action.gold{background:#e2a72a;color:#241a08;box-shadow:0 6px 0 #9e7019;text-shadow:none}.action:disabled{opacity:.45;cursor:not-allowed}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rule{
  background:#f7ecc0;border:4px solid #42513b;padding:15px;color:#4e5846;font-family:Inter,system-ui,sans-serif;font-size:13px;box-shadow:5px 5px 0 rgba(38,60,35,.65)
}.rule b{display:block;color:#1d2c1a;margin-bottom:4px;font-family:ui-monospace,monospace;text-transform:uppercase}
.hud{position:sticky;top:0;z-index:12;background:rgba(134,200,255,.94);backdrop-filter:blur(7px);padding:10px 0 12px}
.hudTop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.hudStats{display:flex;gap:7px;flex-wrap:wrap}
.stat{
  border:3px solid #263c23;background:#fff7d0;padding:7px 10px;font-size:12px;font-weight:1000;box-shadow:3px 3px 0 #263c23
}.stat b{color:#7e5c0d}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.node{
  position:relative;text-align:center;border:4px solid #42513b;background:#9ba4aa;padding:9px 6px;color:#273029;
  font-size:10px;font-weight:1000;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 #596167
}
.node.done{background:#68b04a;border-color:#284b22;box-shadow:0 4px 0 #34662a}.node.active{background:#f2c94c;border-color:#624b14;box-shadow:0 4px 0 #9f781b}
.progress{height:13px;background:#4b3827;border:3px solid #263c23;overflow:hidden;margin-top:9px}
.progress span{display:block;height:100%;background:repeating-linear-gradient(90deg,#68b04a 0 22px,#5aa03e 22px 44px);transition:width .28s}
.mission{overflow:hidden}.missionHead{
  padding:17px 20px;border-bottom:5px solid #263c23;display:flex;justify-content:space-between;gap:14px;
  background:linear-gradient(180deg,#d8cfac,#beb38f)
}
.missionLabel{font-size:11px;color:#305e27;font-weight:1000;letter-spacing:.11em;text-transform:uppercase}.qnum{font-size:12px;color:#55604d;font-weight:900}
.missionBody{padding:22px}.scenario{
  background:#e6dcad;border:4px solid #6e6244;border-left:9px solid #5c8f3a;padding:16px 17px;color:#343b31;
  line-height:1.5;white-space:pre-line;font-family:Inter,system-ui,sans-serif;box-shadow:inset 3px 3px 0 rgba(255,255,255,.35)
}
.question{font-size:clamp(25px,5vw,38px);line-height:1.1;letter-spacing:-.045em;margin:19px 0;text-transform:none}
.choice{
  width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff9df;color:#1e281d;border:4px solid #5b654f;
  padding:14px 15px;margin:10px 0;cursor:pointer;font-family:Inter,system-ui,sans-serif;font-weight:760;line-height:1.35;box-shadow:0 4px 0 #879078;transition:.1s
}
.choice:hover{transform:translateY(-1px);border-color:#3f7131}.choice.selected{border-color:#2e6cae;background:#dcecff;box-shadow:0 4px 0 #255681}
.choice.eliminated{opacity:.28;text-decoration:line-through;pointer-events:none}.choice.correct{border-color:#347326;background:#daf0c9;box-shadow:0 4px 0 #2d6322}.choice.wrong{border-color:#a73b30;background:#f5d5cf;box-shadow:0 4px 0 #7c2f28}
.letter{display:grid;place-items:center;flex:0 0 31px;width:31px;height:31px;border:3px solid #465044;background:#d4c89f;font-family:ui-monospace,monospace;font-size:12px;font-weight:1000}.selected .letter{background:#79b9ef}
.powerRow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.power{
  border:4px solid #3e4b39;background:#b9ac78;color:#1f291d;padding:9px 12px;font-size:12px;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 #756b48;text-transform:uppercase
}.power b{color:#6c4b00}.power:disabled{opacity:.35}
.feedback{padding:17px;margin:17px 0;border:5px solid}.feedback.good{background:#d9efc9;border-color:#347326}.feedback.miss{background:#f4d2cb;border-color:#a73b30}.feedback h3{margin:0 0 7px;font-size:21px;text-transform:uppercase}.feedback p{line-height:1.5;margin:6px 0;font-family:Inter,system-ui,sans-serif;color:#344033}.xpBurst{font-size:13px;font-weight:1000;color:#7e5c0d;letter-spacing:.06em}
.recovery{background:#d9e8f2;border:4px dashed #426b87;padding:15px;margin:15px 0;font-family:Inter,system-ui,sans-serif}.recovery b{color:#254f69;font-family:ui-monospace,monospace}
.levelComplete{text-align:center;padding:38px 24px}.levelIcon{font-size:58px;filter:drop-shadow(5px 5px 0 rgba(0,0,0,.17))}.levelComplete h2{font-size:41px;letter-spacing:-.055em;margin:8px 0;text-transform:uppercase}.scoreBig{font-size:70px;font-weight:1000;letter-spacing:-.075em}
.unlock{display:inline-block;margin:10px 0;border:4px solid #6c5014;background:#f4d46b;color:#4b3505;padding:9px 13px;font-size:12px;font-weight:1000;box-shadow:4px 4px 0 #8e6b1c;text-transform:uppercase}
.resultsHero{background:#2f5f29;color:#fff;border-color:#173a16}.resultsHero .scoreBig{font-size:84px}.rank{font-size:23px;font-weight:1000;color:#ffe16f;margin-top:6px;text-transform:uppercase}
.skill{margin:14px 0}.skillHead{display:flex;justify-content:space-between;gap:10px;font-weight:900}.skillTrack{height:14px;background:#6b5032;border:3px solid #3c2c1d;overflow:hidden;margin-top:7px}.skillTrack span{display:block;height:100%;background:repeating-linear-gradient(90deg,#69b54a 0 20px,#5ca341 20px 40px)}
.study{border-left:7px solid #d69b21;padding-left:14px;margin:15px 0;color:#3e4738;font-family:Inter,system-ui,sans-serif}.study b{display:block;color:#1c281a;font-family:ui-monospace,monospace}.hidden{display:none!important}.footer{text-align:center;color:#34412f;font-size:12px;margin-top:27px;font-weight:900;text-shadow:0 1px rgba(255,255,255,.4)}
.flash{animation:flash .38s steps(2,end)}@keyframes flash{0%{filter:brightness(1.25)}100%{filter:none}}@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}.pop{animation:pop .25s steps(3,end)}
@media(max-width:650px){.shell{padding:10px 11px 46px}.hero,.card{padding:18px}.hero h1{font-size:48px}.rules{grid-template-columns:1fr}.map{grid-template-columns:repeat(5,minmax(52px,1fr));overflow:auto}.node{font-size:8px}.question{font-size:27px}.missionBody{padding:17px}.top{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body><main class="shell"><div id="app"></div></main>
<script>
const SESSION='inf125-midterm-quest';
const LEVELS=[
 {name:'Signal Check',short:'Foundations',icon:'🤖',blurb:'Do you actually know AI?',unlock:'Pattern Reader'},
 {name:'Toolsmith',short:'Use It',icon:'🛠️',blurb:'Use AI without making a mess.',unlock:'Prompt Crafter'},
 {name:'Truth Hunter',short:'Verify',icon:'🕵️',blurb:"Don't get fooled.",unlock:'Evidence Tool'},
 {name:'Judgment Zone',short:'Judge',icon:'⚖️',blurb:"It's complicated.",unlock:'Human Override'},
 {name:'Final Boss',short:'Boss',icon:'🔥',blurb:'Put the pieces together.',unlock:'AI Literate'}
];
const Q=[
{level:1,skill:'Foundations',concept:'AI vs software',scenario:'A campus app shows the same dining-hall hours stored in a database to every student. Another feature predicts which dining location a student may prefer based on patterns in prior choices.',q:'Which feature is the stronger example of AI, and why?',choices:['The hours display, because any app on a computer is AI','The prediction feature, because it uses patterns in data to produce a recommendation','Both equally, because both use digital data','Neither, because AI must generate text or images'],a:1,why:'AI is not simply software running on a computer. Pattern-based prediction, classification, recommendation, or generation is the stronger AI signal here.',remember:'Ask what the system is doing with data—not whether it has a screen.'},
{level:1,skill:'Foundations',concept:'Machine learning',scenario:'A university email filter improves at detecting phishing after being trained on many examples labeled safe or suspicious.',q:'What best explains the role of machine learning in this example?',choices:['Developers manually wrote a rule for every possible phishing email','The system learned patterns from examples that help it classify new messages','The computer understands deception the way a person does','The system searches the internet for the answer each time'],a:1,why:'Machine learning uses examples to learn patterns that can generalize to new cases. It does not require a human to specify every possible response.',remember:'Examples → patterns → predictions or classifications.'},
{level:1,skill:'Foundations',concept:'NLP',scenario:'An AI tool reads 600 open-ended course comments and groups them into themes such as pacing, assignments, and classroom climate.',q:'Which AI capability is most central to this task?',choices:['Natural language processing','Computer vision','A traditional calculator','Image generation'],a:0,why:'The system is analyzing human language at scale, which is a core natural language processing task.',remember:'If the input or output centers on human language, NLP is likely involved.'},
{level:1,skill:'Work & Context',concept:'Workplace AI',scenario:'A marketing team begins using AI to draft first-pass campaign ideas. Employees now spend less time starting from a blank page and more time checking claims, adjusting tone, and choosing among alternatives.',q:'What is the strongest interpretation of this change?',choices:['AI eliminated the need for human skill','The work disappeared entirely','Some tasks shifted, increasing the value of judgment, communication, and verification','Because AI drafted the ideas, the final work no longer needs review'],a:2,why:'AI can automate or accelerate parts of work while shifting human effort toward judgment, communication, checking, and decision-making.',remember:'AI can redesign tasks without eliminating the whole job.'},
{level:1,skill:'Context',concept:'Context changes risk',scenario:'The same generative AI tool is used once to brainstorm fictional mascot names and once to draft a recommendation about whether a student should drop a required course.',q:'Why should the two uses be evaluated differently?',choices:['The tool becomes a different kind of AI in the second case','Consequences, evidence needs, and affected people change with the context','Creative tasks never involve risk','Academic decisions should always be automated'],a:1,why:'The technology may be the same, but the consequence of error and the evidence needed to act responsibly can be very different.',remember:'Evaluate the use case, not just the tool.'},

{level:2,skill:'Responsible Use',concept:'AI-generated drafts',scenario:'You ask AI for a first draft of a message requesting an internship interview. The draft includes a polished sentence claiming you led a project you only assisted with.',q:'What is the strongest next move?',choices:['Send it because the wording sounds professional','Delete the entire draft and never use AI for writing','Correct the claim, revise the message in your own voice, and take responsibility for the final version','Ask a second AI whether the claim sounds believable'],a:2,why:'Responsible use means treating generated content as material to evaluate and revise—not as something that becomes true because it is polished.',remember:'AI can draft. You still own the claim.'},
{level:2,skill:'Prompting',concept:'Prompt construction',scenario:'You need a 90-second explanation of neural networks for first-year students from many majors. It should avoid equations and use one everyday analogy.',q:'Which prompt is most likely to produce a useful first draft?',choices:['Explain neural networks.','You are the smartest AI. Give me everything about neural networks.','Explain neural networks in about 90 seconds for first-year college students from mixed majors. Avoid equations, use plain language, and include one everyday analogy.','Neural networks, but make it good and not confusing.'],a:2,why:'The strongest prompt defines the task, audience, constraints, and desired form. More words alone do not make a prompt better.',remember:'Useful context beats vague detail.'},
{level:2,skill:'Privacy',concept:'Sensitive data',scenario:'At an internship, your supervisor asks you to summarize a spreadsheet of customer complaints using a public AI chatbot. The file includes names, email addresses, account numbers, and complaint details.',q:'What should you do before using the tool?',choices:['Upload it because summarization is low risk','Remove the names but leave all other fields','Check whether the tool is approved for the data and avoid sending protected or unnecessary information','Upload it, then delete the chat afterward'],a:2,why:'Privacy decisions happen before data is sent. Approval, data sensitivity, necessity, and organizational rules matter; deleting later does not undo disclosure.',remember:'Ask what data the tool actually needs—and whether it is approved to receive it.'},
{level:2,skill:'Transparency',concept:'AI disclosure',scenario:'AI helped you brainstorm three possible structures for a class presentation. You chose one, rewrote it, checked the facts, and created the slides yourself.',q:'Which disclosure gives the clearest picture of your AI use?',choices:['“AI helped.”','“No AI wrote my final slides, so there is nothing to disclose.”','Name the tool, explain that it generated structure ideas, and briefly state what you kept, changed, and verified','Paste the entire chat transcript but do not explain what you used'],a:2,why:'Useful transparency explains the tool, purpose, contribution, and your human review—not merely that AI was present.',remember:'Document what AI did and what you did with it.'},
{level:2,skill:'Evaluation',concept:'Use + evaluate',scenario:'Two AI tools can turn lecture notes into a study guide. Tool A produces a beautiful guide quickly. Tool B is less polished but consistently preserves the instructor’s definitions and flags uncertain details.',q:'What would be the strongest way to choose between them?',choices:['Choose Tool A because presentation quality proves usefulness','Use one real study task, compare the outputs against the source material, and judge both usefulness and reliability','Choose whichever company is more famous','Use both and assume agreement means the information is correct'],a:1,why:'Applying an AI tool well includes evaluating the output against the actual task, evidence, and reliability—not just using the tool.',remember:'Usefulness and trustworthiness are separate questions.'},

{level:3,skill:'Evidence & Reliability',concept:'Reliability',scenario:'AI tells you a concert venue changed its bag policy this week. The answer is detailed, current-sounding, and confident.',q:'What evidence would most directly support acting on the claim?',choices:['The AI repeats the answer when asked again','A friend says the rule sounds normal','The venue’s current official policy or direct announcement','The answer contains specific dimensions and punctuation'],a:2,why:'For a current venue policy, the strongest evidence is the source with authority over that policy and current information.',remember:'Confidence is style. Verification is evidence.'},
{level:3,skill:'Evidence & Reliability',concept:'Citations',scenario:'An AI-generated report cites a real article from a respected publication. You open the article and it discusses the topic, but you cannot find the statistic the AI attributed to it.',q:'What can you responsibly conclude right now?',choices:['The statistic is definitely false','The citation does not currently support the statistic; the claim needs more verification','The statistic is true because the article is real','The publication must have removed the statistic'],a:1,why:'You have evidence that this source does not support the claim. That is not the same as proving the claim itself false.',remember:"Can't verify ≠ false. A real source can still be misrepresented."},
{level:3,skill:'Evidence',concept:'Evidence quality',scenario:'You are evaluating the claim: “Students are more likely to follow an AI recommendation when it includes an explanation.”',q:'Which evidence would be strongest for evaluating that claim about human behavior?',choices:['A company slogan saying its AI is trusted','A controlled study or well-designed survey measuring how people respond to explained versus unexplained recommendations','One viral comment saying “I always trust AI”','Your own guess about what students probably do'],a:1,why:'Claims about human behavior need evidence that actually observes or measures human behavior, ideally with a design suited to the question.',remember:'Match the evidence to the claim.'},
{level:3,skill:'Evaluation',concept:'Systematic testing',scenario:'You want to know whether an AI study assistant gives stable advice about citing sources. You test one prompt once and get a good answer.',q:'What would make your evaluation more systematic?',choices:['Stop after the first good answer','Test several relevant prompts or variations, record the outputs, and compare patterns and failures','Ask the AI to rate its own reliability','Use a longer prompt once'],a:1,why:'Systematic evaluation uses repeated, purposeful tests and compares evidence across outputs rather than generalizing from one result.',remember:'One output is an example. Repeated structured testing reveals behavior.'},
{level:3,skill:'Evidence & Reliability',concept:'Polish vs trust',scenario:'An AI produces a beautifully formatted market report with charts, confident recommendations, and no visible grammar mistakes. Several numbers have no source.',q:'What does the professional presentation actually tell you?',choices:['The underlying claims are probably accurate','The model understands the market','The output is polished; accuracy, evidence, fairness, and fit still need separate evaluation','The report is safe to use because charts are harder to hallucinate'],a:2,why:'Presentation quality can make weak information feel credible. Style is not evidence for the underlying claims.',remember:'Looks right and sounds right are not the same as being right.'},

{level:4,skill:'Bias & Fairness',concept:'Bias pathways',scenario:'A résumé-screening model was trained on past hiring decisions. The development team also chose which résumé features to emphasize and later set different thresholds for which applicants receive human review.',q:'Where could bias enter this system?',choices:['Only in the historical résumés','Only when a user types an offensive prompt','Through training data, design choices, evaluation choices, and how the system is deployed','Bias cannot enter because the final score is numerical'],a:2,why:'Bias is not a single-source problem. Data, design assumptions, evaluation, prompts, thresholds, and deployment context can all shape outcomes.',remember:'Ask where human choices and historical patterns enter the pipeline.'},
{level:4,skill:'Bias & Fairness',concept:'Feedback loops',scenario:'A city uses last year’s inspection violations to predict which restaurants should receive extra inspections. Restaurants receiving more inspections naturally have more opportunities for violations to be found. Those new violations become next year’s training data.',q:'What risk is most important here?',choices:['The system will eventually stop using data','The process can reinforce its own earlier targeting and make the pattern appear stronger over time','Restaurants with no violations will automatically close','Any use of historical data is unethical'],a:1,why:'When a system influences what gets observed next, its decisions can feed new data back into the system and reinforce earlier patterns.',remember:'Prediction can change the data that future predictions learn from.'},
{level:4,skill:'Bias & Fairness',concept:'Subgroup performance',scenario:'An AI captioning tool is 94% accurate overall. Testing shows 98% accuracy for one speaker group and 71% for another.',q:'What is the strongest conclusion?',choices:['94% overall proves the tool performs well for everyone','The lower-performing group should be excluded from evaluation','The average hides an important performance difference that requires investigation before broad use','The tool is automatically unusable in every context'],a:2,why:'Aggregate performance can hide unequal outcomes. The subgroup difference matters and should be investigated in relation to the intended use and consequences.',remember:'Always ask who is inside the average.'},
{level:4,skill:'Human Judgment',concept:'Human in the loop',scenario:'An AI system flags students who may benefit from academic outreach. It sometimes makes mistakes, and the reasons for a flag are not always clear.',q:'Which workflow best preserves meaningful human oversight?',choices:['Automatically place every flagged student on academic probation','Have an advisor review the flag and relevant context before deciding whether and how to contact the student','Hide the AI recommendation so no one can question it','Let the model send binding decisions because humans can be biased too'],a:1,why:'Human-in-the-loop oversight means a person with relevant responsibility reviews the AI output, context, and consequences before an important action.',remember:'A human click is not enough; oversight must be meaningful.'},
{level:4,skill:'Perspectives',concept:'Multiple perspectives',scenario:'A university considers using AI to monitor online course activity and identify students who may be disengaging.',q:'Which analysis best demonstrates multiple-perspective reasoning?',choices:['Ask only whether the software saves the university money','Compare how students, instructors, advisors, administrators, and privacy advocates may experience different benefits, risks, and responsibilities','Ask whether the dashboard looks easy to use','Choose the perspective of whoever purchased the system'],a:1,why:'Multiple-perspective reasoning examines how the same system can affect people differently and how their interests or responsibilities may conflict.',remember:'Stakeholders are not decoration; their different experiences can change the decision.'},

{level:5,skill:'Responsible AI',concept:'Integrated literacy',scenario:'FINAL BOSS · PART 1\nA college pilots an AI “Success Navigator.” Students can ask it questions about courses, financial aid, campus services, and career planning. It can also make personalized recommendations using university data.',q:'Which operating principle is the strongest starting point?',choices:['Use it for every question because personalization makes it accurate','Ban it because any AI use creates risk','Use it where it adds value, verify important outputs, protect data, consider affected people, and keep human accountability','Let students decide whether an answer is true based on how confident it sounds'],a:2,why:'Responsible AI literacy combines purposeful use with evidence, privacy, stakeholder awareness, limits, and human responsibility.',remember:'Responsible AI is neither “trust everything” nor “ban everything.”'},
{level:5,skill:'Human Impact',concept:'Personal choices affect others',scenario:'FINAL BOSS · PART 2\nA student wants better advice from Success Navigator, so they upload a group-project file containing teammates’ names, phone numbers, private peer feedback, and accommodation information.',q:'What is the central problem with that choice?',choices:['The file is too long for AI','The student is exposing other people’s private or sensitive information without a clear need or permission','AI cannot read documents','Group projects should never use technology'],a:1,why:'An individual AI-use decision can create consequences for other people. Privacy responsibility extends beyond your own information.',remember:'Your convenience does not give you permission to expose someone else’s data.'},
{level:5,skill:'Feedback & Learning',concept:'Self-assessment',scenario:'FINAL BOSS · PART 3\nDuring a practice activity, you discover that you repeatedly confuse “unsupported” with “false.” The midterm is two days away.',q:'What is the strongest response to that feedback?',choices:['Ignore it because practice does not count','Memorize the answer letter from the practice item','Revisit the distinction, practice it in a new scenario, and check whether you can explain why the two are different','Study only topics you already get right to build confidence'],a:2,why:'Low-stakes feedback is useful when it changes what you practice next. The goal is to identify and close a learning gap before a higher-stakes assessment.',remember:'Practice should change your study plan.'},
{level:5,skill:'Case Analysis',concept:'Complete case analysis',scenario:'FINAL BOSS · PART 4\nSuccess Navigator recommends that Maya drop a course. The recommendation could affect financial aid, graduation timing, and her major. The system gives no source for the policy assumptions behind its advice.',q:'Before acting, which analysis is most complete?',choices:['Ask whether Maya likes the recommendation','Identify what the system used, what it claims, who is affected, possible benefits and harms, what evidence is missing, and who should make the final decision','Decide whether AI is good or bad in education','Check whether the interface has a disclaimer'],a:1,why:'Strong AI case analysis connects the system, information, output, stakeholders, benefits, risks, evidence, and human accountability.',remember:'Analyze the whole decision pathway, not just the answer.'},
{level:5,skill:'Evidence of Learning',concept:'Preserving evidence',scenario:'FINAL BOSS · PART 5\nYou finish the review and want evidence you can use later to show how your AI literacy has improved.',q:'What would be most useful to preserve?',choices:['Only your final score','Only screenshots of correct answers','Examples of prompts or tasks, AI outputs, your checks and revisions, and short reflections explaining what changed in your judgment','Nothing; completed work has no value after grading'],a:2,why:'A strong learning record shows process and growth: what you tried, what the AI produced, how you evaluated or revised it, and what you learned.',remember:'Save evidence of thinking, not just evidence of completion.'}
];
let name='',idx=0,answers=[],selected=null,submitted=false,startedAt=null;
let xp=0,streak=0,bestStreak=0,lens=3,recovery=false,firstAttempt=null;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opts={}){const r=await fetch('/api/session/'+SESSION+path,{cache:'no-store',headers:{'content-type':'application/json'},...opts});if(!r.ok)throw new Error(await r.text());return r.json()}
function device(){return localStorage.classroomDevice||(localStorage.classroomDevice=(crypto.randomUUID?crypto.randomUUID():'dev-'+Math.random().toString(36).slice(2)))}
function rank(){if(xp>=2800)return'Legendary Verifier';if(xp>=2200)return'AI Strategist';if(xp>=1600)return'Evidence Hunter';if(xp>=1000)return'Prompt Pilot';return'Rookie Analyst'}
function shell(body){return '<div class="top"><div><div class="brand">INF 125 · AI Literacy</div><div class="subtle">Midterm Week · Mission-Based Review</div></div><span class="gameBadge">🎮 MIDTERM QUEST</span></div>'+body+'<div class="footer">Practice the concepts. Make the judgment. Show how you know.</div>'}
function start(){
 const saved=localStorage.getItem('midtermQuestName')||localStorage.getItem('classroomName')||'';
 app.innerHTML=shell('<section class="hero"><div class="kicker">WORLD SPAWN</div><h1>BEAT YOUR BLIND SPOTS.</h1><p>You have 25 missions before the Final Boss is defeated. Every mission practices a concept that matters for the midterm—but none of these are copied exam questions.</p><div class="pill">⚡ Earn XP</div> <div class="pill">🔥 Build streaks</div> <div class="pill">🔎 Use Evidence Tooles</div> <div class="pill">🛡 Recover from misses</div></section><section class="card"><h2>Create player</h2><p class="subtle">Your name records attendance and lets your instructor see progress. This review is diagnostic—not a grade.</p><label class="subtle" for="nm"><b>PLAYER NAME</b></label><input class="field" id="nm" autocomplete="name" value="'+esc(saved)+'" placeholder="First and last name"><button class="action" id="go" style="width:100%;margin-top:12px">ENTER WORLD →</button><div id="err" class="subtle" style="color:var(--red);margin-top:8px"></div></section><section class="rules"><div class="rule"><b>🎯 First attempt matters</b>Your readiness score uses your first answer.</div><div class="rule"><b>🛡 Recovery is learning</b>Miss one? Get a clue and fight back for XP.</div><div class="rule"><b>🔎 Evidence Tool ×3</b>Remove one distractor when you need it.</div></section>');
 document.getElementById('go').onclick=join;
}
async function join(){
 name=document.getElementById('nm').value.trim();if(!name){document.getElementById('err').textContent='Enter your name first.';return}
 const b=document.getElementById('go');b.disabled=true;b.textContent='Connecting…';
 try{await api('/join',{method:'POST',body:JSON.stringify({device:device(),name})});await api('/review/start',{method:'POST',body:JSON.stringify({device:device(),name})});localStorage.midtermQuestName=name;localStorage.classroomName=name;startedAt=Date.now();renderQ()}catch(e){b.disabled=false;b.textContent='ENTER WORLD →';document.getElementById('err').textContent='Could not start. Check your connection and try again.'}
}
function mapHtml(){
 const level=Math.floor(idx/5);
 return '<div class="map">'+LEVELS.map((l,i)=>'<div class="node '+(i<level?'done':i===level?'active':'')+'">'+(i<level?'✓ ':l.icon+' ')+esc(l.short)+'</div>').join('')+'</div>';
}
function hud(){
 return '<div class="hud"><div class="hudTop"><div class="hudStats"><span class="stat">XP <b>'+xp+'</b></span><span class="stat">🔥 STREAK <b>'+streak+'</b></span><span class="stat">🧰 TOOLS <b>'+lens+'</b></span><span class="stat">'+esc(rank())+'</span></div><span class="subtle">'+(idx+1)+' / '+Q.length+'</span></div>'+mapHtml()+'<div class="progress"><span style="width:'+(idx/Q.length*100)+'%"></span></div></div>';
}
function renderQ(){
 selected=null;submitted=false;recovery=false;firstAttempt=null;
 const q=Q[idx],lev=LEVELS[q.level-1],boss=q.level===5;
 app.innerHTML=shell(hud()+'<section class="mission '+(boss?'flash':'')+'"><div class="missionHead"><div><div class="missionLabel">'+(boss?'🔥 FINAL BOSS · ':'MISSION · ')+esc(q.concept)+'</div><div class="subtle">'+esc(lev.name)+' · '+esc(lev.blurb)+'</div></div><div class="qnum">'+(idx+1)+' / '+Q.length+'</div></div><div class="missionBody"><div class="scenario">'+esc(q.scenario)+'</div><h1 class="question">'+esc(q.q)+'</h1><div class="powerRow"><button class="power" id="lens" '+(lens<=0?'disabled':'')+'>🔎 Evidence Tool <b>×'+lens+'</b> · break one distractor block</button></div><div id="choices">'+q.choices.map((c,i)=>'<button class="choice" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(c)+'</span></button>').join('')+'</div><button class="action" id="check" style="width:100%;margin-top:13px" disabled>LOCK IN →</button><div id="fb"></div></div></section>');
 wireChoices();document.getElementById('lens').onclick=useLens;document.getElementById('check').onclick=check;
}
function wireChoices(){document.querySelectorAll('.choice:not(.eliminated)').forEach(b=>b.onclick=()=>{if(submitted)return;selected=Number(b.dataset.i);document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('check').disabled=false})}
function useLens(){
 if(lens<=0||submitted)return;const q=Q[idx],wrong=q.choices.map((_,i)=>i).filter(i=>i!==q.a && i!==selected);if(!wrong.length)return;
 const kill=wrong[Math.floor(Math.random()*wrong.length)],btn=document.querySelector('.choice[data-i="'+kill+'"]');btn.classList.add('eliminated');btn.disabled=true;lens--;xp=Math.max(0,xp-20);
 document.getElementById('lens').innerHTML='🔎 Evidence Tool <b>×'+lens+'</b> · break one distractor block';if(lens<=0)document.getElementById('lens').disabled=true;
}
async function check(){
 if(selected===null||submitted)return;submitted=true;const q=Q[idx],correct=selected===q.a;if(firstAttempt===null)firstAttempt=selected;
 document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('check').classList.add('hidden');document.getElementById('lens').disabled=true;
 if(correct){const bonus=Math.min(streak,4)*20,earned=recovery?45:100+bonus;xp+=earned;streak=recovery?0:streak+1;bestStreak=Math.max(bestStreak,streak);showResolved(true,earned)}
 else if(!recovery){streak=0;showRecovery()}
 else{showResolved(false,0)}
 try{await api('/review/answer',{method:'POST',body:JSON.stringify({device:device(),name,question:idx+1,level:q.level,skill:q.skill,concept:q.concept,selected,correct:firstAttempt===q.a,attempt:recovery?2:1,recovered:recovery&&correct,xp,streak})})}catch(_){}
}
function showRecovery(){
 const q=Q[idx],fb=document.getElementById('fb');fb.innerHTML='<div class="feedback miss pop"><h3>⚠ Signal disrupted.</h3><p>Your first answer is locked for the readiness score—but this mission is not over.</p><div class="recovery"><b>RECOVERY CLUE</b><br>'+esc(q.remember)+'</div><button class="action secondary" id="recover" style="width:100%">🛡 TRY A RECOVERY ATTEMPT · +45 XP</button></div>';
 document.getElementById('recover').onclick=()=>{recovery=true;submitted=false;selected=null;document.querySelectorAll('.choice').forEach(b=>{if(!b.classList.contains('eliminated'))b.disabled=false;b.classList.remove('selected')});document.getElementById('fb').innerHTML='<div class="recovery"><b>RECOVERY MODE</b><br>Use the clue. Make a new call.</div>';document.getElementById('check').classList.remove('hidden');document.getElementById('check').disabled=true;wireChoices()};
}
function showResolved(correct,earned){
 const q=Q[idx];document.querySelectorAll('.choice').forEach(b=>{const i=Number(b.dataset.i);if(i===q.a)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});
 const rawCorrect=firstAttempt===q.a;answers.push({idx,correct:rawCorrect,skill:q.skill,concept:q.concept,selected:firstAttempt,recovered:recovery&&correct});
 const fb=document.getElementById('fb');fb.innerHTML='<div class="feedback '+(correct?'good':'miss')+' pop"><div class="xpBurst">'+(earned?('+'+earned+' XP'):'MISSION DEBRIEF')+'</div><h3>'+(correct?(recovery?'🛡 Recovery successful.':'✓ Mission cleared.'):'✕ Mission unresolved.')+'</h3><p>'+esc(q.why)+'</p><p><b>Remember:</b> '+esc(q.remember)+'</p></div><button class="action '+(idx===Q.length-1?'gold':'')+'" id="next" style="width:100%">'+(idx===Q.length-1?'CLAIM FINAL READINESS REPORT →':'CONTINUE →')+'</button>';
 document.getElementById('next').onclick=next;
}
function next(){
 const justFinished=(idx+1)%5===0;if(idx===Q.length-1)return results();idx++;
 if(justFinished)return levelBreak(Math.ceil(idx/5));renderQ();
}
function levelBreak(done){
 const slice=answers.slice((done-1)*5,done*5),score=slice.filter(x=>x.correct).length,lev=LEVELS[done-1];
 app.innerHTML=shell(hud()+'<section class="card levelComplete"><div class="levelIcon">'+lev.icon+'</div><div class="kicker">WORLD '+done+' CLEARED</div><h2>'+esc(lev.name)+'</h2><div class="scoreBig">'+score+'/5</div><div class="unlock">CRAFTED · '+esc(lev.unlock)+'</div><p style="color:var(--muted)">'+esc(score>=4?'Strong signal. Your reasoning held up.':score>=3?'You cleared the world, but there are concepts worth revisiting.':'World cleared—but this should be on your study plan before the midterm.')+'</p><button class="action" id="cont">'+(done===4?'ENTER THE FINAL BOSS 🔥':'ENTER WORLD '+(done+1)+' →')+'</button></section>');
 document.getElementById('cont').onclick=renderQ;
}
function results(){
 const total=answers.filter(x=>x.correct).length,pct=Math.round(total/Q.length*100),groups={};answers.forEach(x=>{groups[x.skill]??={n:0,c:0};groups[x.skill].n++;if(x.correct)groups[x.skill].c++});
 const skills=Object.entries(groups).map(([k,v])=>({k,p:Math.round(v.c/v.n*100),...v})).sort((a,b)=>a.p-b.p),focus=skills.filter(x=>x.p<80).slice(0,3),mins=Math.max(1,Math.round((Date.now()-(startedAt||Date.now()))/60000)),recovered=answers.filter(x=>x.recovered).length;
 app.innerHTML=shell('<section class="card resultsHero"><div class="kicker">QUEST COMPLETE</div><h2 style="font-size:40px;margin:8px 0">MIDTERM WORLD COMPLETE</h2><div class="scoreBig">'+pct+'%</div><div class="rank">'+esc(rank())+'</div><p style="color:#d6ddf4">'+total+' / '+Q.length+' first-attempt missions · '+xp+' XP · best streak '+bestStreak+' · '+recovered+' recoveries</p></section><section class="card"><h2>World stats</h2>'+skills.map(x=>'<div class="skill"><div class="skillHead"><span>'+esc(x.k)+'</span><span>'+x.p+'%</span></div><div class="skillTrack"><span style="width:'+x.p+'%"></span></div></div>').join('')+'</section><section class="card"><h2>Next build: study smart</h2>'+(focus.length?focus.map((x,i)=>'<div class="study"><b>'+(i+1)+'. '+esc(x.k)+' · '+x.p+'%</b><span>Revisit the explanations you missed, then practice the concept in a new scenario.</span></div>').join(''):'<p style="color:var(--muted)">Strong across every measured area. Use remaining review time on any answer you guessed on rather than adding new material.</p>')+'<p class="subtle"><b>Important:</b> This is a diagnostic review, not a prediction of your exam grade.</p></section><section class="card"><h2>Mission accomplished.</h2><p style="color:var(--muted)">The win is not the XP. The win is knowing what deserves your attention before the midterm.</p><button class="action secondary" id="restart">REPLAY QUEST</button></section>');
 document.getElementById('restart').onclick=()=>{idx=0;answers=[];selected=null;submitted=false;startedAt=Date.now();xp=0;streak=0;bestStreak=0;lens=3;renderQ()};
 try{api('/review/complete',{method:'POST',body:JSON.stringify({device:device(),name,score:total,total:Q.length,percent:pct,minutes:mins,skills,xp,rank:rank(),bestStreak,recovered})})}catch(_){}
}
start();
</script>
</body>
</html>
