<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>INF 125 · Midterm Quest</title>
<style>
:root{--ink:#111827;--muted:#667085;--paper:#f6f4ef;--card:#fff;--line:#dedbd3;--blue:#315efb;--blue2:#e9efff;--gold:#f3c84b;--green:#207a4b;--green2:#e4f6eb;--red:#a63d31;--red2:#fff0ed;--purple:#6941c6;--shadow:0 18px 50px rgba(17,24,39,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}
.shell{width:min(900px,100%);margin:auto;padding:18px 18px 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:8px 0 16px;border-bottom:1px solid var(--line)}.brand{font-weight:950;letter-spacing:-.02em}.small{font-size:12px;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}
.hero{background:linear-gradient(135deg,#111827,#273449);color:#fff;border-radius:26px;padding:30px;margin:20px 0;box-shadow:var(--shadow)}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#b9c7ff}.hero h1{font-size:clamp(44px,9vw,78px);line-height:.9;letter-spacing:-.055em;margin:9px 0 15px}.hero p{font-size:18px;line-height:1.5;color:#e5e7eb;max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 8px 24px rgba(17,24,39,.05)}.card h2{font-size:28px;letter-spacing:-.035em;margin:0 0 10px}.field{width:100%;padding:16px;border:1px solid #b9b5ad;border-radius:14px;background:#fff;font-size:17px}.action{border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:900;padding:15px 18px;cursor:pointer;min-height:54px}.action.primary{background:var(--blue)}.action.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.action:disabled{opacity:.4;cursor:not-allowed}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rule{background:#f8f7f3;border:1px solid #ebe8e0;border-radius:15px;padding:14px;font-size:13px;color:#505967}.rule b{display:block;color:var(--ink);margin-bottom:4px}
.progressBox{position:sticky;top:0;z-index:10;background:rgba(246,244,239,.94);backdrop-filter:blur(10px);padding:10px 0 12px}.progressRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.track{height:8px;background:#ddd9d0;border-radius:999px;overflow:hidden;margin-top:9px}.track span{display:block;height:100%;background:var(--blue);transition:width .25s}.levelTag{font-size:11px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:var(--purple)}
.qnum{font-size:12px;font-weight:900;color:var(--muted)}.question{font-size:clamp(25px,5vw,38px);line-height:1.12;letter-spacing:-.035em;margin:9px 0 14px}.scenario{background:#f4f6fa;border-left:4px solid var(--blue);padding:15px 17px;border-radius:0 14px 14px 0;color:#344054;line-height:1.5;margin:12px 0 20px;white-space:pre-line}
.choice{width:100%;text-align:left;background:#fff;border:1px solid #cfcac0;border-radius:15px;padding:16px 17px;margin:9px 0;cursor:pointer;font-weight:750;line-height:1.35;display:flex;gap:12px;align-items:flex-start}.choice:hover{border-color:#8da4ed}.choice.selected{border:2px solid var(--blue);background:var(--blue2)}.letter{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border-radius:9px;background:#f0eee8;font-size:12px;font-weight:950}.selected .letter{background:var(--blue);color:#fff}
.feedback{border-radius:18px;padding:19px;margin:18px 0}.feedback.good{background:var(--green2);border:1px solid #b7dfc7}.feedback.miss{background:var(--red2);border:1px solid #f0c2ba}.feedback h3{margin:0 0 8px;font-size:22px}.feedback p{line-height:1.5;margin:6px 0}.remember{font-weight:850}
.levelComplete{text-align:center;padding:38px 24px}.levelComplete .icon{font-size:50px}.levelComplete h2{font-size:40px;letter-spacing:-.045em;margin:8px 0}.scoreBig{font-size:64px;font-weight:950;letter-spacing:-.06em}
.resultsHero{background:linear-gradient(135deg,#172554,#312e81);color:#fff}.resultsHero .scoreBig{font-size:80px}.resultsHero p{color:#dbe4ff}.skill{margin:15px 0}.skillHead{display:flex;justify-content:space-between;gap:10px;font-weight:850}.skillTrack{height:10px;background:#e8e5df;border-radius:999px;overflow:hidden;margin-top:7px}.skillTrack span{display:block;height:100%;background:var(--blue)}.study{border-left:4px solid var(--gold);padding-left:14px;margin:15px 0}.study b{display:block}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}
@media(max-width:640px){.shell{padding:12px 12px 40px}.hero,.card{border-radius:19px;padding:19px}.rules{grid-template-columns:1fr}.top{align-items:flex-start}.hero h1{font-size:52px}.question{font-size:28px}}
</style>
</head>
<body><main class="shell"><div id="app"></div></main>
<script>
const SESSION='inf125-midterm-quest';
const LEVELS=[
 {name:'Level 1 · Do You Actually Know AI?',icon:'🤖',blurb:'Foundations, but in real situations.'},
 {name:'Level 2 · Use It Without Making a Mess',icon:'🛠️',blurb:'Prompting, privacy, transparency, and responsible use.'},
 {name:"Level 3 · Don't Get Fooled",icon:'🕵️',blurb:'Evidence, reliability, citations, and testing.'},
 {name:"Level 4 · It's Complicated",icon:'⚖️',blurb:'Bias, people, consequences, and human oversight.'},
 {name:'Level 5 · Final Boss',icon:'🔥',blurb:'Put the pieces together.'}
];
const Q=[
{level:1,skill:'Foundations',concept:'AI vs software',scenario:'A campus app shows the same dining-hall hours stored in a database to every student. Another feature predicts which dining location a student may prefer based on patterns in prior choices.',q:'Which feature is the stronger example of AI, and why?',choices:['The hours display, because any app on a computer is AI','The prediction feature, because it uses patterns in data to produce a recommendation','Both equally, because both use digital data','Neither, because AI must generate text or images'],a:1,why:'AI is not simply software running on a computer. Pattern-based prediction, classification, recommendation, or generation is the stronger AI signal here.',remember:'Ask what the system is doing with data—not whether it has a screen.'},
{level:1,skill:'Foundations',concept:'Machine learning',scenario:'A university email filter improves at detecting phishing after being trained on many examples labeled safe or suspicious.',q:'What best explains the role of machine learning in this example?',choices:['Developers manually wrote a rule for every possible phishing email','The system learned patterns from examples that help it classify new messages','The computer understands deception the way a person does','The system searches the internet for the answer each time'],a:1,why:'Machine learning uses examples to learn patterns that can generalize to new cases. It does not require a human to specify every possible response.',remember:'Examples → patterns → predictions or classifications.'},
{level:1,skill:'Foundations',concept:'NLP',scenario:'An AI tool reads 600 open-ended course comments and groups them into themes such as pacing, assignments, and classroom climate.',q:'Which AI capability is most central to this task?',choices:['Natural language processing','Computer vision','A traditional calculator','Image generation'],a:0,why:'The system is analyzing human language at scale, which is a core natural language processing task.',remember:'If the input or output centers on human language, NLP is likely involved.'},
{level:1,skill:'Work & Context',concept:'Workplace AI',scenario:'A marketing team begins using AI to draft first-pass campaign ideas. Employees now spend less time starting from a blank page and more time checking claims, adjusting tone, and choosing among alternatives.',q:'What is the strongest interpretation of this change?',choices:['AI eliminated the need for human skill','The work disappeared entirely','Some tasks shifted, increasing the value of judgment, communication, and verification','Because AI drafted the ideas, the final work no longer needs review'],a:2,why:'AI can automate or accelerate parts of work while shifting human effort toward judgment, communication, checking, and decision-making.',remember:'AI can redesign tasks without eliminating the whole job.'},
{level:1,skill:'Context',concept:'Context changes risk',scenario:'The same generative AI tool is used once to brainstorm fictional mascot names and once to draft a recommendation about whether a student should drop a required course.',q:'Why should the two uses be evaluated differently?',choices:['The tool becomes a different kind of AI in the second case','Consequences, evidence needs, and affected people change with the context','Creative tasks never involve risk','Academic decisions should always be automated'],a:1,why:'The technology may be the same, but the consequence of error and the evidence needed to act responsibly can be very different.',remember:'Evaluate the use case, not just the tool.'},

{level:2,skill:'Responsible Use',concept:'AI-generated drafts',scenario:'You ask AI for a first draft of a message requesting an internship interview. The draft includes a polished sentence claiming you led a project you only assisted with.',q:'What is the strongest next move?',choices:['Send it because the wording sounds professional','Delete the entire draft and never use AI for writing','Correct the claim, revise the message in your own voice, and take responsibility for the final version','Ask a second AI whether the claim sounds believable'],a:2,why:'Responsible use means treating generated content as material to evaluate and revise—not as something that becomes true because it is polished.',remember:'AI can draft. You still own the claim.'},
{level:2,skill:'Prompting',concept:'Prompt construction',scenario:'You need a 90-second explanation of neural networks for first-year students from many majors. It should avoid equations and use one everyday analogy.',q:'Which prompt is most likely to produce a useful first draft?',choices:['Explain neural networks.','You are the smartest AI. Give me everything about neural networks.','Explain neural networks in about 90 seconds for first-year college students from mixed majors. Avoid equations, use plain language, and include one everyday analogy.','Neural networks, but make it good and not confusing.'],a:2,why:'The strongest prompt defines the task, audience, constraints, and desired form. More words alone do not make a prompt better.',remember:'Useful context beats vague detail.'},
{level:2,skill:'Privacy',concept:'Sensitive data',scenario:'At an internship, your supervisor asks you to summarize a spreadsheet of customer complaints using a public AI chatbot. The file includes names, email addresses, account numbers, and complaint details.',q:'What should you do before using the tool?',choices:['Upload it because summarization is low risk','Remove the names but leave all other fields','Check whether the tool is approved for the data and avoid sending protected or unnecessary information','Upload it, then delete the chat afterward'],a:2,why:'Privacy decisions happen before data is sent. Approval, data sensitivity, necessity, and organizational rules matter; deleting later does not undo disclosure.',remember:'Ask what data the tool actually needs—and whether it is approved to receive it.'},
{level:2,skill:'Transparency',concept:'AI disclosure',scenario:'AI helped you brainstorm three possible structures for a class presentation. You chose one, rewrote it, checked the facts, and created the slides yourself.',q:'Which disclosure gives the clearest picture of your AI use?',choices:['“AI helped.”','“No AI wrote my final slides, so there is nothing to disclose.”','Name the tool, explain that it generated structure ideas, and briefly state what you kept, changed, and verified','Paste the entire chat transcript but do not explain what you used'],a:2,why:'Useful transparency explains the tool, purpose, contribution, and your human review—not merely that AI was present.',remember:'Document what AI did and what you did with it.'},
{level:2,skill:'Evaluation',concept:'Use + evaluate',scenario:'Two AI tools can turn lecture notes into a study guide. Tool A produces a beautiful guide quickly. Tool B is less polished but consistently preserves the instructor’s definitions and flags uncertain details.',q:'What would be the strongest way to choose between them?',choices:['Choose Tool A because presentation quality proves usefulness','Use one real study task, compare the outputs against the source material, and judge both usefulness and reliability','Choose whichever company is more famous','Use both and assume agreement means the information is correct'],a:1,why:'Applying an AI tool well includes evaluating the output against the actual task, evidence, and reliability—not just using the tool.',remember:'Usefulness and trustworthiness are separate questions.'},

{level:3,skill:'Evidence & Reliability',concept:'Reliability',scenario:'AI tells you a concert venue changed its bag policy this week. The answer is detailed, current-sounding, and confident.',q:'What evidence would most directly support acting on the claim?',choices:['The AI repeats the answer when asked again','A friend says the rule sounds normal','The venue’s current official policy or direct announcement','The answer contains specific dimensions and punctuation'],a:2,why:'For a current venue policy, the strongest evidence is the source with authority over that policy and current information.',remember:'Confidence is style. Verification is evidence.'},
{level:3,skill:'Evidence & Reliability',concept:'Citations',scenario:'An AI-generated report cites a real article from a respected publication. You open the article and it discusses the topic, but you cannot find the statistic the AI attributed to it.',q:'What can you responsibly conclude right now?',choices:['The statistic is definitely false','The citation does not currently support the statistic; the claim needs more verification','The statistic is true because the article is real','The publication must have removed the statistic'],a:1,why:'You have evidence that this source does not support the claim. That is not the same as proving the claim itself false.',remember:"Can't verify ≠ false. A real source can still be misrepresented."},
{level:3,skill:'Evidence',concept:'Evidence quality',scenario:'You are evaluating the claim: “Students are more likely to follow an AI recommendation when it includes an explanation.”',q:'Which evidence would be strongest for evaluating that claim about human behavior?',choices:['A company slogan saying its AI is trusted','A controlled study or well-designed survey measuring how people respond to explained versus unexplained recommendations','One viral comment saying “I always trust AI”','Your own guess about what students probably do'],a:1,why:'Claims about human behavior need evidence that actually observes or measures human behavior, ideally with a design suited to the question.',remember:'Match the evidence to the claim.'},
{level:3,skill:'Evaluation',concept:'Systematic testing',scenario:'You want to know whether an AI study assistant gives stable advice about citing sources. You test one prompt once and get a good answer.',q:'What would make your evaluation more systematic?',choices:['Stop after the first good answer','Test several relevant prompts or variations, record the outputs, and compare patterns and failures','Ask the AI to rate its own reliability','Use a longer prompt once'],a:1,why:'Systematic evaluation uses repeated, purposeful tests and compares evidence across outputs rather than generalizing from one result.',remember:'One output is an example. Repeated structured testing reveals behavior.'},
{level:3,skill:'Evidence & Reliability',concept:'Polish vs trust',scenario:'An AI produces a beautifully formatted market report with charts, confident recommendations, and no visible grammar mistakes. Several numbers have no source.',q:'What does the professional presentation actually tell you?',choices:['The underlying claims are probably accurate','The model understands the market','The output is polished; accuracy, evidence, fairness, and fit still need separate evaluation','The report is safe to use because charts are harder to hallucinate'],a:2,why:'Presentation quality can make weak information feel credible. Style is not evidence for the underlying claims.',remember:'Looks right and sounds right are not the same as being right.'},

{level:4,skill:'Bias & Fairness',concept:'Bias pathways',scenario:'A résumé-screening model was trained on past hiring decisions. The development team also chose which résumé features to emphasize and later set different thresholds for which applicants receive human review.',q:'Where could bias enter this system?',choices:['Only in the historical résumés','Only when a user types an offensive prompt','Through training data, design choices, evaluation choices, and how the system is deployed','Bias cannot enter because the final score is numerical'],a:2,why:'Bias is not a single-source problem. Data, design assumptions, evaluation, prompts, thresholds, and deployment context can all shape outcomes.',remember:'Ask where human choices and historical patterns enter the pipeline.'},
{level:4,skill:'Bias & Fairness',concept:'Feedback loops',scenario:'A city uses last year’s inspection violations to predict which restaurants should receive extra inspections. Restaurants receiving more inspections naturally have more opportunities for violations to be found. Those new violations become next year’s training data.',q:'What risk is most important here?',choices:['The system will eventually stop using data','The process can reinforce its own earlier targeting and make the pattern appear stronger over time','Restaurants with no violations will automatically close','Any use of historical data is unethical'],a:1,why:'When a system influences what gets observed next, its decisions can feed new data back into the system and reinforce earlier patterns.',remember:'Prediction can change the data that future predictions learn from.'},
{level:4,skill:'Bias & Fairness',concept:'Subgroup performance',scenario:'An AI captioning tool is 94% accurate overall. Testing shows 98% accuracy for one speaker group and 71% for another.',q:'What is the strongest conclusion?',choices:['94% overall proves the tool performs well for everyone','The lower-performing group should be excluded from evaluation','The average hides an important performance difference that requires investigation before broad use','The tool is automatically unusable in every context'],a:2,why:'Aggregate performance can hide unequal outcomes. The subgroup difference matters and should be investigated in relation to the intended use and consequences.',remember:'Always ask who is inside the average.'},
{level:4,skill:'Human Judgment',concept:'Human in the loop',scenario:'An AI system flags students who may benefit from academic outreach. It sometimes makes mistakes, and the reasons for a flag are not always clear.',q:'Which workflow best preserves meaningful human oversight?',choices:['Automatically place every flagged student on academic probation','Have an advisor review the flag and relevant context before deciding whether and how to contact the student','Hide the AI recommendation so no one can question it','Let the model send binding decisions because humans can be biased too'],a:1,why:'Human-in-the-loop oversight means a person with relevant responsibility reviews the AI output, context, and consequences before an important action.',remember:'A human click is not enough; oversight must be meaningful.'},
{level:4,skill:'Perspectives',concept:'Multiple perspectives',scenario:'A university considers using AI to monitor online course activity and identify students who may be disengaging.',q:'Which analysis best demonstrates multiple-perspective reasoning?',choices:['Ask only whether the software saves the university money','Compare how students, instructors, advisors, administrators, and privacy advocates may experience different benefits, risks, and responsibilities','Ask whether the dashboard looks easy to use','Choose the perspective of whoever purchased the system'],a:1,why:'Multiple-perspective reasoning examines how the same system can affect people differently and how their interests or responsibilities may conflict.',remember:'Stakeholders are not decoration; their different experiences can change the decision.'},

{level:5,skill:'Responsible AI',concept:'Integrated literacy',scenario:'FINAL BOSS · PART 1\nA college pilots an AI “Success Navigator.” Students can ask it questions about courses, financial aid, campus services, and career planning. It can also make personalized recommendations using university data.',q:'Which operating principle is the strongest starting point?',choices:['Use it for every question because personalization makes it accurate','Ban it because any AI use creates risk','Use it where it adds value, verify important outputs, protect data, consider affected people, and keep human accountability','Let students decide whether an answer is true based on how confident it sounds'],a:2,why:'Responsible AI literacy combines purposeful use with evidence, privacy, stakeholder awareness, limits, and human responsibility.',remember:'Responsible AI is neither “trust everything” nor “ban everything.”'},
{level:5,skill:'Human Impact',concept:'Personal choices affect others',scenario:'FINAL BOSS · PART 2\nA student wants better advice from Success Navigator, so they upload a group-project file containing teammates’ names, phone numbers, private peer feedback, and accommodation information.',q:'What is the central problem with that choice?',choices:['The file is too long for AI','The student is exposing other people’s private or sensitive information without a clear need or permission','AI cannot read documents','Group projects should never use technology'],a:1,why:'An individual AI-use decision can create consequences for other people. Privacy responsibility extends beyond your own information.',remember:'Your convenience does not give you permission to expose someone else’s data.'},
{level:5,skill:'Feedback & Learning',concept:'Self-assessment',scenario:'FINAL BOSS · PART 3\nDuring a practice activity, you discover that you repeatedly confuse “unsupported” with “false.” The midterm is two days away.',q:'What is the strongest response to that feedback?',choices:['Ignore it because practice does not count','Memorize the answer letter from the practice item','Revisit the distinction, practice it in a new scenario, and check whether you can explain why the two are different','Study only topics you already get right to build confidence'],a:2,why:'Low-stakes feedback is useful when it changes what you practice next. The goal is to identify and close a learning gap before a higher-stakes assessment.',remember:'Practice should change your study plan.'},
{level:5,skill:'Case Analysis',concept:'Complete case analysis',scenario:'FINAL BOSS · PART 4\nSuccess Navigator recommends that Maya drop a course. The recommendation could affect financial aid, graduation timing, and her major. The system gives no source for the policy assumptions behind its advice.',q:'Before acting, which analysis is most complete?',choices:['Ask whether Maya likes the recommendation','Identify what the system used, what it claims, who is affected, possible benefits and harms, what evidence is missing, and who should make the final decision','Decide whether AI is good or bad in education','Check whether the interface has a disclaimer'],a:1,why:'Strong AI case analysis connects the system, information, output, stakeholders, benefits, risks, evidence, and human accountability.',remember:'Analyze the whole decision pathway, not just the answer.'},
{level:5,skill:'Evidence of Learning',concept:'Preserving evidence',scenario:'FINAL BOSS · PART 5\nYou finish the review and want evidence you can use later to show how your AI literacy has improved.',q:'What would be most useful to preserve?',choices:['Only your final score','Only screenshots of correct answers','Examples of prompts or tasks, AI outputs, your checks and revisions, and short reflections explaining what changed in your judgment','Nothing; completed work has no value after grading'],a:2,why:'A strong learning record shows process and growth: what you tried, what the AI produced, how you evaluated or revised it, and what you learned.',remember:'Save evidence of thinking, not just evidence of completion.'}
];
let name='',idx=0,answers=[],selected=null,submitted=false,startedAt=null;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opts={}){const r=await fetch('/api/session/'+SESSION+path,{cache:'no-store',headers:{'content-type':'application/json'},...opts});if(!r.ok)throw new Error(await r.text());return r.json()}
function shell(body){return '<div class="top"><div><div class="brand">INF 125 · AI Literacy</div><div class="small">Midterm Week · Self-Guided Review</div></div><span class="badge">🎮 MIDTERM QUEST</span></div>'+body+'<div class="footer">Practice the concepts. Make the judgment. Show how you know.</div>'}
function start(){
 const saved=localStorage.getItem('midtermQuestName')||localStorage.getItem('classroomName')||'';
 app.innerHTML=shell('<section class="hero"><div class="eyebrow">Tomorrow’s mission</div><h1>BEAT YOUR BLIND SPOTS.</h1><p>25 original challenges. Same concepts you need for the midterm. Different situations. Immediate feedback. Your goal is not to memorize answers—it is to find what you still need to study.</p></section><section class="card"><h2>Enter the quest</h2><p class="small">Your name records attendance and lets your instructor see your progress. Your results are for review—not a grade.</p><label class="small" for="nm"><b>YOUR NAME</b></label><input class="field" id="nm" autocomplete="name" value="'+esc(saved)+'" placeholder="First and last name"><button class="action primary" id="go" style="width:100%;margin-top:12px">Start Midterm Quest →</button><div id="err" class="small" style="color:#a63d31;margin-top:8px"></div></section><section class="rules"><div class="rule"><b>🧠 Think first</b>Choose before reading the explanation.</div><div class="rule"><b>🔎 Learn from misses</b>Feedback tells you what to review.</div><div class="rule"><b>📈 Finish with a plan</b>Your results identify your weak areas.</div></section>');
 document.getElementById('go').onclick=join;
}
async function join(){
 name=document.getElementById('nm').value.trim();if(!name){document.getElementById('err').textContent='Enter your name first.';return}
 const b=document.getElementById('go');b.disabled=true;b.textContent='Starting…';
 try{const device=localStorage.classroomDevice||(localStorage.classroomDevice=(crypto.randomUUID?crypto.randomUUID():'dev-'+Math.random().toString(36).slice(2)));await api('/join',{method:'POST',body:JSON.stringify({device,name})});localStorage.midtermQuestName=name;localStorage.classroomName=name;startedAt=Date.now();renderQ()}catch(e){b.disabled=false;b.textContent='Start Midterm Quest →';document.getElementById('err').textContent='Could not start. Check your connection and try again.'}
}
function progress(){return Math.round(idx/Q.length*100)}
function renderQ(){
 const q=Q[idx],lev=LEVELS[q.level-1];
 app.innerHTML=shell('<div class="progressBox"><div class="progressRow"><span class="levelTag">'+esc(lev.icon+' '+lev.name)+'</span><span class="qnum">'+(idx+1)+' / '+Q.length+'</span></div><div class="track"><span style="width:'+progress()+'%"></span></div></div><section class="card"><div class="levelTag">'+esc(q.concept)+'</div><div class="scenario">'+esc(q.scenario)+'</div><h1 class="question">'+esc(q.q)+'</h1><div id="choices">'+q.choices.map((c,i)=>'<button class="choice" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(c)+'</span></button>').join('')+'</div><button class="action primary" id="check" style="width:100%;margin-top:12px" disabled>Check my thinking →</button><div id="fb"></div></section>');
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(submitted)return;selected=Number(b.dataset.i);document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('check').disabled=false});
 document.getElementById('check').onclick=check;
}
async function check(){
 if(selected===null||submitted)return;submitted=true;const q=Q[idx],correct=selected===q.a;
 answers.push({idx,correct,skill:q.skill,concept:q.concept,selected});
 document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('check').classList.add('hidden');
 const fb=document.getElementById('fb');fb.innerHTML='<div class="feedback '+(correct?'good':'miss')+'"><h3>'+(correct?'✓ Strong call.':'↻ This is one to review.')+'</h3><p>'+esc(q.why)+'</p><p class="remember">Remember: '+esc(q.remember)+'</p></div><button class="action" id="next" style="width:100%">'+(idx===Q.length-1?'See my readiness report →':'Continue →')+'</button>';
 try{const device=localStorage.classroomDevice;await api('/review/answer',{method:'POST',body:JSON.stringify({device,name,question:idx+1,level:q.level,skill:q.skill,concept:q.concept,selected,correct})})}catch(_){}
 document.getElementById('next').onclick=next;
}
function next(){
 const justFinished=(idx+1)%5===0;if(idx===Q.length-1)return results();
 idx++;selected=null;submitted=false;
 if(justFinished)return levelBreak(Math.ceil(idx/5));
 renderQ();
}
function levelBreak(done){
 const score=answers.slice((done-1)*5,done*5).filter(x=>x.correct).length,lev=LEVELS[done-1];
 app.innerHTML=shell('<section class="card levelComplete"><div class="icon">'+lev.icon+'</div><div class="levelTag">LEVEL '+done+' COMPLETE</div><h2>'+esc(lev.name.replace(/^Level \d+ · /,''))+'</h2><div class="scoreBig">'+score+'/5</div><p>'+esc(score>=4?'Strong. Keep moving.':score>=3?'You have the shape of it. Watch the explanations you missed.':'This level belongs on your study list before the midterm.')+'</p><button class="action primary" id="cont">'+(done===4?'Enter the Final Boss 🔥':'Unlock Level '+(done+1)+' →')+'</button></section>');
 document.getElementById('cont').onclick=renderQ;
}
function results(){
 const total=answers.filter(x=>x.correct).length,pct=Math.round(total/Q.length*100);
 const groups={};answers.forEach(x=>{groups[x.skill]??={n:0,c:0};groups[x.skill].n++;if(x.correct)groups[x.skill].c++});
 const skills=Object.entries(groups).map(([k,v])=>({k,p:Math.round(v.c/v.n*100),...v})).sort((a,b)=>a.p-b.p);
 const focus=skills.filter(x=>x.p<80).slice(0,3);
 const mins=Math.max(1,Math.round((Date.now()-(startedAt||Date.now()))/60000));
 app.innerHTML=shell('<section class="card resultsHero"><div class="eyebrow">QUEST COMPLETE</div><h2 style="font-size:38px;margin:8px 0">Your Midterm Readiness</h2><div class="scoreBig">'+pct+'%</div><p>'+total+' of '+Q.length+' challenges · about '+mins+' minutes</p></section><section class="card"><h2>Your concept map</h2>'+skills.map(x=>'<div class="skill"><div class="skillHead"><span>'+esc(x.k)+'</span><span>'+x.p+'%</span></div><div class="skillTrack"><span style="width:'+x.p+'%"></span></div></div>').join('')+'</section><section class="card"><h2>Study prescription</h2>'+(focus.length?focus.map((x,i)=>'<div class="study"><b>'+(i+1)+'. '+esc(x.k)+'</b><span>'+x.p+'% in this review. Revisit the explanations you missed and practice the idea in a new situation.</span></div>').join(''):'<p>You were strong across every measured area. Use your remaining review time to revisit any answer you guessed on rather than adding new material.</p>')+'<p class="small"><b>Important:</b> This is a review diagnostic, not a prediction of your exam grade.</p></section><section class="card"><h2>Before you leave</h2><p>Write down the <b>one concept</b> you are most likely to review before the midterm. That is the value of today: finding the blind spot before the exam does.</p><button class="action secondary" id="restart">Restart the quest</button></section>');
 document.getElementById('restart').onclick=()=>{idx=0;answers=[];selected=null;submitted=false;startedAt=Date.now();renderQ()};
 try{const device=localStorage.classroomDevice;api('/review/complete',{method:'POST',body:JSON.stringify({device,name,score:total,total:Q.length,percent:pct,minutes:mins,skills})})}catch(_){}
}
start();
</script></body></html>
