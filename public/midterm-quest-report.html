<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>INF 125 · Midterm Quest Report</title>
<style>:root{--ink:#111827;--muted:#667085;--paper:#f6f4ef;--line:#dedbd3;--blue:#315efb;--green:#207a4b;--gold:#9a6b00}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{width:min(1180px,100%);margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#6941c6}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.05em;line-height:.95;margin:7px 0}.sub{color:var(--muted)}button{font:inherit;border:0;border-radius:12px;padding:12px 15px;font-weight:850;cursor:pointer;background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.metric b{font-size:38px;display:block;letter-spacing:-.04em}.metric span{font-size:12px;color:var(--muted);font-weight:750}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:15px 0}.card h2{margin:0 0 12px;font-size:24px}.skill{display:grid;grid-template-columns:190px 1fr 55px;gap:10px;align-items:center;margin:10px 0}.track{height:10px;background:#ece9e2;border-radius:999px;overflow:hidden}.track span{display:block;height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;background:#111827;color:#fff;padding:11px}td{padding:11px;border-top:1px solid #ece9e2}.status{font-weight:850}.done{color:var(--green)}.work{color:var(--gold)}.empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.head{display:block}.head button{margin-top:14px}.skill{grid-template-columns:120px 1fr 45px}.tableWrap{overflow:auto}}</style></head>
<body><main class="shell"><header class="head"><div><div class="eyebrow">Instructor Dashboard</div><h1>MIDTERM QUEST</h1><div class="sub">Live self-guided review progress · INF 125</div></div><div><button id="refresh">Refresh</button> <button id="csv">Download CSV</button></div></header><div id="app"><div class="empty">Loading review progress…</div></div></main>
<script>
const SESSION='inf125-midterm-quest',app=document.getElementById('app');let report=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){try{const r=await fetch('/api/session/'+SESSION+'/review/report?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;report=await r.json();render()}catch(_){app.innerHTML='<div class="empty">Could not load the report. Try Refresh.</div>'}}
function render(){const rows=report.rows||[],done=rows.filter(x=>x.completedAt).length,started=rows.length,avg=done?Math.round(rows.filter(x=>x.completedAt).reduce((n,x)=>n+(x.percent||0),0)/done):0,progress=rows.reduce((n,x)=>n+(x.answered||0),0);const skills=report.skills||[];
app.innerHTML='<section class="grid"><div class="metric"><b>'+started+'</b><span>STUDENTS STARTED</span></div><div class="metric"><b>'+done+'</b><span>FINISHED</span></div><div class="metric"><b>'+avg+'%</b><span>AVG FINISHED SCORE</span></div><div class="metric"><b>'+progress+'</b><span>TOTAL CHALLENGES ANSWERED</span></div></section>'+
'<section class="card"><h2>Class concept signals</h2>'+(skills.length?skills.map(x=>'<div class="skill"><b>'+esc(x.skill)+'</b><div class="track"><span style="width:'+x.percent+'%"></span></div><span>'+x.percent+'%</span></div>').join(''):'<div class="empty">Concept results will appear as students answer.</div>')+'</section>'+
'<section class="card"><h2>Student progress</h2><div class="tableWrap"><table><thead><tr><th>Student</th><th>Progress</th><th>Correct</th><th>Readiness</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+x.answered+'/25</td><td>'+x.correct+'</td><td>'+(x.completedAt?(x.percent+'%'):'—')+'</td><td class="status '+(x.completedAt?'done':'work')+'">'+(x.completedAt?'Complete':'Working')+'</td></tr>').join('')+'</tbody></table></div></section>';
}
function csv(){if(!report)return;const rows=[['Student','Answered','Correct','Percent','Status'],...(report.rows||[]).map(x=>[x.name,x.answered,x.correct,x.percent??'',x.completedAt?'Complete':'Working'])];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='INF125_Midterm_Quest_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('refresh').onclick=load;document.getElementById('csv').onclick=csv;load();setInterval(load,10000);
</script></body></html>
