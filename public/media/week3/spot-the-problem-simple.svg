<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111827"/><text x="80" y="95" font-family="Arial" font-size="54" font-weight="700" fill="#FBBF24">USEFUL · PROBLEM · HUMAN ACTION</text><text x="80" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">Diagnose the use—not the whole tool.</text><g font-family="Arial"><rect x="70" y="220" width="440" height="165" rx="20" fill="#1F2937" stroke="#FBBF24" stroke-width="3"/><text x="100" y="280" font-size="31" font-weight="700" fill="#FBBF24">EMAIL</text><text x="100" y="330" font-size="25" fill="#fff">AI invented an excuse.</text><rect x="580" y="220" width="440" height="165" rx="20" fill="#1F2937" stroke="#FBBF24" stroke-width="3"/><text x="610" y="280" font-size="31" font-weight="700" fill="#FBBF24">SUMMARY</text><text x="610" y="330" font-size="25" fill="#fff">AI invented a statistic.</text><rect x="1090" y="220" width="440" height="165" rx="20" fill="#1F2937" stroke="#FBBF24" stroke-width="3"/><text x="1120" y="280" font-size="31" font-weight="700" fill="#FBBF24">PRIVACY</text><text x="1120" y="330" font-size="25" fill="#fff">Customer names were pasted in.</text><rect x="325" y="450" width="440" height="165" rx="20" fill="#1F2937" stroke="#FBBF24" stroke-width="3"/><text x="355" y="510" font-size="31" font-weight="700" fill="#FBBF24">HOMEWORK</text><text x="355" y="560" font-size="25" fill="#fff">AI work was submitted unchanged.</text><rect x="835" y="450" width="440" height="165" rx="20" fill="#1F2937" stroke="#FBBF24" stroke-width="3"/><text x="865" y="510" font-size="31" font-weight="700" fill="#FBBF24">MEDICAL</text><text x="865" y="560" font-size="25" fill="#fff">Chatbot told someone to stop medication.</text></g><text x="800" y="790" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#fff">What could help? What is the problem? What should the human do next?</text></svg>