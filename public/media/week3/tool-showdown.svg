<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI Tool Showdown</title><desc id="d">Green, yellow, and red responsible-use judgment categories.</desc><rect width="1600" height="900" fill="#111827"/><text x="90" y="95" font-family="Arial" font-size="58" font-weight="700" fill="#FBBF24">AI TOOL SHOWDOWN</text><text x="90" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">Use it · Use with caution · Wrong tool / wrong situation</text><g font-family="Arial"><rect x="120" y="235" width="420" height="440" rx="30" fill="#1F2937" stroke="#22C55E" stroke-width="3"/><rect x="610" y="235" width="420" height="440" rx="30" fill="#1F2937" stroke="#F59E0B" stroke-width="3"/><rect x="1100" y="235" width="420" height="440" rx="30" fill="#1F2937" stroke="#EF4444" stroke-width="3"/><circle cx="330" cy="355" r="78" fill="#22C55E"/><circle cx="820" cy="355" r="78" fill="#F59E0B"/><circle cx="1310" cy="355" r="78" fill="#EF4444"/><text x="330" y="480" font-size="34" font-weight="800" fill="#22C55E" text-anchor="middle">GREEN</text><text x="820" y="480" font-size="34" font-weight="800" fill="#F59E0B" text-anchor="middle">YELLOW</text><text x="1310" y="480" font-size="34" font-weight="800" fill="#EF4444" text-anchor="middle">RED</text><text x="330" y="530" font-size="27" font-weight="800" fill="#fff" text-anchor="middle">USE IT</text><text x="820" y="530" font-size="27" font-weight="800" fill="#fff" text-anchor="middle">USE WITH CAUTION</text><text x="1310" y="530" font-size="27" font-weight="800" fill="#fff" text-anchor="middle">WRONG FIT</text><text x="330" y="590" font-size="23" fill="#D1D5DB" text-anchor="middle">Low-risk + useful +</text><text x="330" y="624" font-size="23" fill="#D1D5DB" text-anchor="middle">human review is manageable</text><text x="820" y="590" font-size="23" fill="#D1D5DB" text-anchor="middle">Useful, but verification</text><text x="820" y="624" font-size="23" fill="#D1D5DB" text-anchor="middle">or context matters</text><text x="1310" y="590" font-size="23" fill="#D1D5DB" text-anchor="middle">High stakes, unsafe data,</text><text x="1310" y="624" font-size="23" fill="#D1D5DB" text-anchor="middle">or wrong situation</text></g><text x="800" y="790" font-family="Arial" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">The same AI tool can land in different colors depending on the context.</text></svg>