<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Context Verify Privacy Decide framework</title><desc id="d">Four-question framework for responsible everyday AI use.</desc><rect width="1600" height="900" fill="#111827"/><text x="90" y="105" font-family="Arial" font-size="58" font-weight="700" fill="#FBBF24">THE AI SURVIVAL CODE</text><text x="90" y="165" font-family="Arial" font-size="30" fill="#D1D5DB">Four questions before you trust, share, or act on an AI result</text><g font-family="Arial"><g fill="#1F2937" stroke="#374151" stroke-width="2"><rect x="90" y="245" width="330" height="440" rx="30"/><rect x="455" y="245" width="330" height="440" rx="30"/><rect x="820" y="245" width="330" height="440" rx="30"/><rect x="1185" y="245" width="330" height="440" rx="30"/></g><g><circle cx="255" cy="350" r="58" fill="#FBBF24"/><circle cx="620" cy="350" r="58" fill="#22C55E"/><circle cx="985" cy="350" r="58" fill="#F97316"/><circle cx="1350" cy="350" r="58" fill="#8B5CF6"/></g><g text-anchor="middle" font-weight="800"><text x="255" y="368" font-size="54" fill="#111827">C</text><text x="620" y="368" font-size="54" fill="#111827">V</text><text x="985" y="368" font-size="54" fill="#111827">P</text><text x="1350" y="368" font-size="54" fill="#111827">D</text><text x="255" y="465" font-size="31" fill="#fff">CONTEXT</text><text x="620" y="465" font-size="31" fill="#fff">VERIFY</text><text x="985" y="465" font-size="31" fill="#fff">PRIVACY</text><text x="1350" y="465" font-size="31" fill="#fff">DECIDE</text></g><g text-anchor="middle" font-size="26" fill="#D1D5DB"><text x="255" y="545">What does the AI</text><text x="255" y="585">actually know?</text><text x="620" y="545">What should I</text><text x="620" y="585">check?</text><text x="985" y="545">What should I</text><text x="985" y="585">not share?</text><text x="1350" y="545">What still belongs</text><text x="1350" y="585">to the human?</text></g></g><rect x="250" y="755" width="1100" height="76" rx="20" fill="#0B1220"/><text x="800" y="804" font-family="Arial" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">AI can help with the work. You remain responsible for the result.</text></svg>