<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111827"/><text x="80" y="100" font-family="Arial" font-size="54" font-weight="700" fill="#FBBF24">WOULD YOU USE AI FOR THIS?</text><text x="80" y="155" font-family="Arial" font-size="30" fill="#D1D5DB">Scenario 1 · Low stakes</text><rect x="220" y="245" width="1160" height="360" rx="28" fill="#1F2937" stroke="#16A34A" stroke-width="5"/><text x="800" y="355" text-anchor="middle" font-family="Arial" font-size="40" font-weight="700" fill="#fff">“Give me five ideas for my friend’s birthday.”</text><text x="800" y="470" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#86EFAC">YES · MAYBE · NO</text><text x="800" y="770" text-anchor="middle" font-family="Arial" font-size="30" fill="#fff">What could realistically go wrong if the suggestion is bad?</text></svg>