<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111827"/><text x="80" y="95" font-family="Arial" font-size="54" font-weight="700" fill="#FBBF24">WHAT GOOD FIELD NOTES LOOK LIKE</text><text x="80" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">Completed example before your own sprint.</text><g font-family="Arial"><rect x="60" y="230" width="275" height="360" rx="20" fill="#1F2937" stroke="#2563EB" stroke-width="3"/><text x="85" y="290" font-size="30" font-weight="700" fill="#60A5FA">I ASKED</text><text x="85" y="355" font-size="24" fill="#fff">Help me organize</text><text x="85" y="395" font-size="24" fill="#fff">study time this weekend.</text><rect x="365" y="230" width="275" height="360" rx="20" fill="#1F2937" stroke="#2563EB" stroke-width="3"/><text x="390" y="290" font-size="30" font-weight="700" fill="#60A5FA">AI GAVE ME</text><text x="390" y="355" font-size="24" fill="#fff">A two-day study schedule.</text><rect x="670" y="230" width="275" height="360" rx="20" fill="#1F2937" stroke="#16A34A" stroke-width="3"/><text x="695" y="290" font-size="30" font-weight="700" fill="#86EFAC">USEFUL</text><text x="695" y="355" font-size="24" fill="#fff">It organized my</text><text x="695" y="395" font-size="24" fill="#fff">available time quickly.</text><rect x="975" y="230" width="275" height="360" rx="20" fill="#1F2937" stroke="#EAB308" stroke-width="3"/><text x="1000" y="290" font-size="30" font-weight="700" fill="#FDE047">CHECK</text><text x="1000" y="355" font-size="24" fill="#fff">It doesn’t know how long</text><text x="1000" y="395" font-size="24" fill="#fff">my assignments take me.</text><rect x="1280" y="230" width="260" height="360" rx="20" fill="#1F2937" stroke="#7C3AED" stroke-width="3"/><text x="1305" y="290" font-size="30" font-weight="700" fill="#C4B5FD">I DECIDED</text><text x="1305" y="355" font-size="24" fill="#fff">I changed the schedule</text><text x="1305" y="395" font-size="24" fill="#fff">before using it.</text></g><text x="800" y="790" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Field notes show what happened and what YOU did with the output.</text></svg>