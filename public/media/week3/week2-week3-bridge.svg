<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#111827"/><text x="80" y="95" font-family="Arial" font-size="52" font-weight="700" fill="#FBBF24">FROM HOW AI WORKS → HOW YOU USE IT</text><text x="80" y="150" font-family="Arial" font-size="28" fill="#D1D5DB">Week 3 adds questions after an AI system produces an output.</text><rect x="80" y="230" width="680" height="430" rx="24" fill="#1F2937" stroke="#2563EB" stroke-width="4"/><text x="120" y="300" font-family="Arial" font-size="34" font-weight="700" fill="#60A5FA">LAST WEEK</text><text x="120" y="380" font-family="Arial" font-size="30" fill="#fff">DATA → MODEL / TOOL → OUTPUT</text><text x="120" y="440" font-family="Arial" font-size="25" fill="#D1D5DB">Example: listening history → recommender → playlist</text><rect x="840" y="230" width="680" height="430" rx="24" fill="#1F2937" stroke="#FBBF24" stroke-width="4"/><text x="880" y="300" font-family="Arial" font-size="34" font-weight="700" fill="#FBBF24">TODAY</text><text x="880" y="380" font-family="Arial" font-size="30" fill="#fff">CONTEXT → VERIFY → PRIVACY → DECIDE</text><text x="880" y="440" font-family="Arial" font-size="25" fill="#D1D5DB">Should I trust, check, share, or act?</text><rect x="80" y="790" width="1440" height="64" rx="18" fill="#0B1220"/><text x="800" y="832" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fff">The AI can produce an output. The human still decides what happens next.</text></svg>