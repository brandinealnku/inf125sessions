<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111827"/><text x="80" y="95" font-family="Arial" font-size="54" font-weight="700" fill="#FBBF24">AI EXPLORATION SPRINT</text><text x="80" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">Choose one low-risk mission and keep five simple field notes.</text><rect x="80" y="220" width="440" height="200" rx="22" fill="#1F2937" stroke="#2563EB" stroke-width="4"/><text x="110" y="285" font-family="Arial" font-size="34" font-weight="700" fill="#60A5FA">STUDENT LIFE</text><text x="110" y="345" font-family="Arial" font-size="25" fill="#fff">Study guide · explain a concept · practice questions</text><rect x="580" y="220" width="440" height="200" rx="22" fill="#1F2937" stroke="#16A34A" stroke-width="4"/><text x="610" y="285" font-family="Arial" font-size="34" font-weight="700" fill="#86EFAC">WORKPLACE</text><text x="610" y="345" font-family="Arial" font-size="25" fill="#fff">Fictional email · action items · meeting questions</text><rect x="1080" y="220" width="440" height="200" rx="22" fill="#1F2937" stroke="#EA580C" stroke-width="4"/><text x="1110" y="285" font-family="Arial" font-size="34" font-weight="700" fill="#FDBA74">PERSONAL</text><text x="1110" y="345" font-family="Arial" font-size="25" fill="#fff">Meal ideas · weekend plan · low-cost activities</text><rect x="240" y="500" width="1120" height="160" rx="22" fill="#0B1220" stroke="#FBBF24" stroke-width="4"/><text x="800" y="565" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#FBBF24">I ASKED → AI GAVE ME → USEFUL → CHECK → I DECIDED</text><text x="800" y="785" text-anchor="middle" font-family="Arial" font-size="27" fill="#fff">Low-risk only. Do not share private, confidential, medical, financial, or identifying information.</text></svg>