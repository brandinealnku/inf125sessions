<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111827"/><text x="80" y="95" font-family="Arial" font-size="54" font-weight="700" fill="#FBBF24">C · V · P · D</text><text x="80" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">Worked example: AI rewrites an email to your professor.</text><g font-family="Arial"><rect x="55" y="220" width="350" height="430" rx="22" fill="#1F2937" stroke="#2563EB" stroke-width="4"/><text x="85" y="285" font-size="34" font-weight="700" fill="#60A5FA">C · CONTEXT</text><text x="85" y="355" font-size="27" fill="#fff">What does it know?</text><text x="85" y="405" font-size="25" fill="#D1D5DB">Only what I typed.</text><rect x="425" y="220" width="350" height="430" rx="22" fill="#1F2937" stroke="#16A34A" stroke-width="4"/><text x="455" y="285" font-size="34" font-weight="700" fill="#86EFAC">V · VERIFY</text><text x="455" y="355" font-size="27" fill="#fff">How can I tell if it is right?</text><text x="455" y="405" font-size="25" fill="#D1D5DB">Check meaning, tone,</text><text x="455" y="445" font-size="25" fill="#D1D5DB">and invented claims.</text><rect x="795" y="220" width="350" height="430" rx="22" fill="#1F2937" stroke="#EA580C" stroke-width="4"/><text x="825" y="285" font-size="34" font-weight="700" fill="#FDBA74">P · PRIVACY</text><text x="825" y="355" font-size="27" fill="#fff">What should I keep out?</text><text x="825" y="405" font-size="25" fill="#D1D5DB">Grades, IDs, private or</text><text x="825" y="445" font-size="25" fill="#D1D5DB">sensitive details.</text><rect x="1165" y="220" width="380" height="430" rx="22" fill="#1F2937" stroke="#7C3AED" stroke-width="4"/><text x="1195" y="285" font-size="34" font-weight="700" fill="#C4B5FD">D · DECIDE</text><text x="1195" y="355" font-size="27" fill="#fff">What choice is still mine?</text><text x="1195" y="405" font-size="25" fill="#D1D5DB">I decide what actually</text><text x="1195" y="445" font-size="25" fill="#D1D5DB">gets sent.</text></g><text x="800" y="810" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Plain-language questions first. Letters second.</text></svg>