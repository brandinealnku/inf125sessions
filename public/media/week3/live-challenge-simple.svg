<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111827"/><text x="80" y="95" font-family="Arial" font-size="54" font-weight="700" fill="#FBBF24">BETTER PROMPT ≠ VERIFIED OUTPUT</text><text x="80" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">A stronger prompt can improve relevance without guaranteeing accuracy.</text><rect x="100" y="240" width="650" height="390" rx="24" fill="#1F2937" stroke="#DC2626" stroke-width="4"/><text x="140" y="310" font-family="Arial" font-size="34" font-weight="700" fill="#FCA5A5">BAD</text><text x="140" y="385" font-family="Arial" font-size="34" fill="#fff">“Help me study.”</text><text x="140" y="470" font-family="Arial" font-size="26" fill="#D1D5DB">Missing: audience · topic · goal · format</text><rect x="850" y="240" width="650" height="390" rx="24" fill="#1F2937" stroke="#16A34A" stroke-width="4"/><text x="890" y="310" font-family="Arial" font-size="34" font-weight="700" fill="#86EFAC">BETTER</text><text x="890" y="375" font-family="Arial" font-size="27" fill="#fff">“I’m a first-year AI Literacy student...</text><text x="890" y="420" font-family="Arial" font-size="27" fill="#fff">Explain C·V·P·D with a professor-email example.</text><text x="890" y="465" font-family="Arial" font-size="27" fill="#fff">Then give me 3 practice situations.”</text><text x="800" y="790" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Better prompt → potentially more useful output. Human checking still matters.</text></svg>