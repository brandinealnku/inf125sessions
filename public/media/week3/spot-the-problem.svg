<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Spot the problem scenarios</title><desc id="d">Five classroom scenarios for identifying usefulness, risk, missing context, and human responsibility.</desc><rect width="1600" height="900" fill="#111827"/><text x="90" y="95" font-family="Arial" font-size="58" font-weight="700" fill="#FBBF24">SPOT THE PROBLEM</text><text x="90" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">What is useful? What is risky? What is missing? What should the human do?</text><g font-family="Arial"><g fill="#1F2937" stroke="#374151" stroke-width="2"><rect x="90" y="220" width="420" height="230" rx="26"/><rect x="560" y="220" width="420" height="230" rx="26"/><rect x="1030" y="220" width="420" height="230" rx="26"/><rect x="325" y="505" width="420" height="230" rx="26"/><rect x="795" y="505" width="420" height="230" rx="26"/></g><g fill="#FBBF24" font-size="26" font-weight="800"><text x="125" y="280">A · PERFECT EMAIL</text><text x="595" y="280">B · CONFIDENT SUMMARY</text><text x="1065" y="280">C · PRIVATE PROMPT</text><text x="360" y="565">D · HOMEWORK HERO</text><text x="830" y="565">E · WRONG TOOL</text></g><g fill="#D1D5DB" font-size="24"><text x="125" y="345">AI invents a family emergency</text><text x="125" y="380">in an extension email.</text><text x="595" y="345">AI adds a statistic that is not</text><text x="595" y="380">in the source.</text><text x="1065" y="345">Customer names and phone</text><text x="1065" y="380">numbers are pasted into AI.</text><text x="360" y="630">AI answer is submitted unchanged.</text><text x="830" y="630">A general chatbot is used for a</text><text x="830" y="665">high-stakes decision.</text></g></g><text x="800" y="815" font-family="Arial" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">Diagnose the situation — not just the tool.</text></svg>