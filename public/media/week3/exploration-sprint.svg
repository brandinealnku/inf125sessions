<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI Exploration Sprint missions</title><desc id="d">Three mission categories for low-risk AI exploration: Student Life, Workplace, and Personal.</desc><rect width="1600" height="900" fill="#111827"/><text x="90" y="95" font-family="Arial" font-size="58" font-weight="700" fill="#FBBF24">AI EXPLORATION SPRINT</text><text x="90" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">Choose one mission. Test the tool. Keep field notes.</text><g font-family="Arial"><rect x="90" y="230" width="445" height="450" rx="30" fill="#1F2937" stroke="#2563EB" stroke-width="3"/><rect x="578" y="230" width="445" height="450" rx="30" fill="#1F2937" stroke="#22C55E" stroke-width="3"/><rect x="1065" y="230" width="445" height="450" rx="30" fill="#1F2937" stroke="#F97316" stroke-width="3"/><text x="312" y="315" font-size="34" font-weight="800" fill="#60A5FA" text-anchor="middle">STUDENT LIFE</text><text x="800" y="315" font-size="34" font-weight="800" fill="#4ADE80" text-anchor="middle">WORKPLACE</text><text x="1288" y="315" font-size="34" font-weight="800" fill="#FB923C" text-anchor="middle">PERSONAL</text><g font-size="27" fill="#fff"><text x="135" y="390">• Turn notes into a study guide</text><text x="135" y="445">• Explain a confusing concept</text><text x="135" y="500">• Brainstorm exam questions</text><text x="625" y="390">• Rewrite a fictional email</text><text x="625" y="445">• Turn notes into action items</text><text x="625" y="500">• Brainstorm meeting questions</text><text x="1110" y="390">• Plan cheap meals</text><text x="1110" y="445">• Organize a weekend schedule</text><text x="1110" y="500">• Compare low-cost activities</text></g></g><rect x="120" y="735" width="1360" height="90" rx="20" fill="#0B1220" stroke="#374151"/><text x="800" y="772" font-family="Arial" font-size="25" fill="#D1D5DB" text-anchor="middle">FIELD NOTES: TASK → INPUT → OUTPUT → USEFUL → RISK / LIMITATION → MISSING → HUMAN ACTION</text><text x="800" y="808" font-family="Arial" font-size="24" font-weight="700" fill="#FBBF24" text-anchor="middle">LOW-RISK ONLY · Protect private and sensitive information</text></svg>