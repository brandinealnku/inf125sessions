<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Bad prompt versus better prompt</title><desc id="d">A comparison showing that a better prompt can improve usefulness without verifying the output.</desc><rect width="1600" height="900" fill="#111827"/><text x="90" y="95" font-family="Arial" font-size="58" font-weight="700" fill="#FBBF24">I’M GOING TO USE AI BADLY ON PURPOSE</text><text x="90" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">First diagnose the prompt. Then improve it. Then ask what still needs checking.</text><rect x="90" y="220" width="650" height="470" rx="30" fill="#2B1717" stroke="#EF4444" stroke-width="2"/><text x="140" y="290" font-family="Arial" font-size="34" font-weight="800" fill="#EF4444">BAD PROMPT</text><rect x="140" y="335" width="550" height="105" rx="20" fill="#1F2937"/><text x="180" y="405" font-family="Arial" font-size="38" font-weight="700" fill="#fff">“Help me study.”</text><g font-family="Arial" font-size="28" fill="#D1D5DB"><text x="145" y="520">• No course</text><text x="145" y="560">• No topic</text><text x="145" y="600">• No goal</text><text x="145" y="640">• No format</text></g><rect x="860" y="220" width="650" height="470" rx="30" fill="#13231B" stroke="#22C55E" stroke-width="2"/><text x="910" y="290" font-family="Arial" font-size="34" font-weight="800" fill="#22C55E">BETTER PROMPT</text><g font-family="Arial" font-size="28" font-weight="600" fill="#fff"><text x="930" y="365">✓ Undergraduate student</text><text x="930" y="425">✓ AI quiz</text><text x="930" y="485">✓ Training data vs model vs output</text><text x="930" y="545">✓ University parking example</text><text x="930" y="605">✓ Ask 3 check questions</text></g><text x="800" y="785" font-family="Arial" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">BETTER PROMPT → potentially better output</text><text x="800" y="835" font-family="Arial" font-size="34" font-weight="800" fill="#FBBF24" text-anchor="middle">BETTER PROMPT ≠ verified output</text></svg>