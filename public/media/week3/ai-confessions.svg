<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI Confessions scenarios</title><desc id="d">Six familiar student scenarios for deciding whether AI use is appropriate.</desc><rect width="1600" height="900" fill="#111827"/><text x="90" y="95" font-family="Arial" font-size="56" font-weight="700" fill="#FBBF24">WOULD YOU USE AI FOR THIS?</text><text x="90" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">YES · MAYBE · NO — What changes from one scenario to the next?</text><g font-family="Arial"><g fill="#1F2937" stroke="#374151" stroke-width="2"><rect x="90" y="220" width="450" height="220" rx="28"/><rect x="575" y="220" width="450" height="220" rx="28"/><rect x="1060" y="220" width="450" height="220" rx="28"/><rect x="90" y="485" width="450" height="220" rx="28"/><rect x="575" y="485" width="450" height="220" rx="28"/><rect x="1060" y="485" width="450" height="220" rx="28"/></g><g fill="#FBBF24" font-size="28" font-weight="700"><text x="130" y="275">READINGS</text><text x="615" y="275">PROFESSOR EMAIL</text><text x="1100" y="275">HIGH-STAKES QUESTION</text><text x="130" y="540">BIRTHDAY IDEAS</text><text x="615" y="540">WORK DATA</text><text x="1100" y="540">HOMEWORK HELP</text></g><g fill="#fff" font-size="28" font-weight="600"><text x="130" y="335">Summarize 40 pages</text><text x="130" y="375">of class readings</text><text x="615" y="335">Make this sound</text><text x="615" y="375">less annoyed</text><text x="1100" y="335">Ask AI to guide a</text><text x="1100" y="375">high-stakes choice</text><text x="130" y="600">Give me five ideas</text><text x="615" y="600">Analyze a confidential</text><text x="615" y="640">spreadsheet</text><text x="1100" y="600">Explain a problem</text><text x="1100" y="640">I do not understand</text></g></g><text x="800" y="810" font-family="Arial" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">CAN the AI do it?  ≠  SHOULD I use it here?</text></svg>