<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Week 03 exit reflection</title><desc id="d">Two reflection prompts and the Context Verify Privacy Decide framework.</desc><rect width="1600" height="900" fill="#111827"/><text x="90" y="95" font-family="Arial" font-size="58" font-weight="700" fill="#FBBF24">THE ONE RULE YOU ARE TAKING WITH YOU</text><text x="90" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">Turn today’s experience into Journal #1 evidence.</text><rect x="130" y="235" width="1340" height="210" rx="30" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="190" y="315" font-family="Arial" font-size="34" font-weight="700" fill="#fff">One thing AI did better than I expected today was…</text><line x1="190" y1="370" x2="1370" y2="370" stroke="#6B7280" stroke-width="3"/><rect x="130" y="490" width="1340" height="210" rx="30" fill="#1F2937" stroke="#374151" stroke-width="2"/><text x="190" y="570" font-family="Arial" font-size="34" font-weight="700" fill="#fff">One thing a human still needs to be responsible for is…</text><line x1="190" y1="625" x2="1370" y2="625" stroke="#6B7280" stroke-width="3"/><text x="800" y="775" font-family="Arial" font-size="38" font-weight="800" fill="#FBBF24" text-anchor="middle">CONTEXT → VERIFY → PRIVACY → DECIDE</text><text x="800" y="830" font-family="Arial" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">AI can help with the work. You remain responsible for the result.</text></svg>