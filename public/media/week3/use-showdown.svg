<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111827"/><text x="80" y="95" font-family="Arial" font-size="54" font-weight="700" fill="#FBBF24">RATE THE USE — NOT THE TOOL</text><text x="80" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">The same AI tool can be reasonable in one situation and a bad choice in another.</text><rect x="110" y="250" width="420" height="350" rx="24" fill="#123B2A" stroke="#16A34A" stroke-width="5"/><text x="320" y="335" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#86EFAC">GREEN</text><text x="320" y="405" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#fff">REASONABLE USE</text><text x="320" y="470" text-anchor="middle" font-family="Arial" font-size="25" fill="#D1D5DB">Low stakes · appropriate context</text><rect x="590" y="250" width="420" height="350" rx="24" fill="#3F3510" stroke="#EAB308" stroke-width="5"/><text x="800" y="335" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#FDE047">YELLOW</text><text x="800" y="405" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#fff">USE CAREFULLY</text><text x="800" y="470" text-anchor="middle" font-family="Arial" font-size="25" fill="#D1D5DB">Important checking or limits remain</text><rect x="1070" y="250" width="420" height="350" rx="24" fill="#43191B" stroke="#DC2626" stroke-width="5"/><text x="1280" y="335" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#FCA5A5">RED</text><text x="1280" y="405" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#fff">DO NOT USE AI FOR THIS</text><text x="1280" y="470" text-anchor="middle" font-family="Arial" font-size="25" fill="#D1D5DB">Too risky or inappropriate here</text><text x="800" y="785" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">A tool does not have one permanent color. Context changes the judgment.</text></svg>