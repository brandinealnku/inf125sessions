<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111827"/><text x="80" y="95" font-family="Arial" font-size="54" font-weight="700" fill="#FBBF24">WHAT WILL YOU CARRY WITH YOU?</text><text x="80" y="150" font-family="Arial" font-size="30" fill="#D1D5DB">Turn today into one rule you can actually use.</text><rect x="100" y="230" width="650" height="180" rx="22" fill="#1F2937" stroke="#2563EB" stroke-width="4"/><text x="140" y="295" font-family="Arial" font-size="30" font-weight="700" fill="#60A5FA">1</text><text x="190" y="295" font-family="Arial" font-size="28" fill="#fff">One thing AI did better than I expected...</text><rect x="850" y="230" width="650" height="180" rx="22" fill="#1F2937" stroke="#16A34A" stroke-width="4"/><text x="890" y="295" font-family="Arial" font-size="30" font-weight="700" fill="#86EFAC">2</text><text x="940" y="295" font-family="Arial" font-size="28" fill="#fff">One thing a human still needs to be responsible for...</text><rect x="260" y="490" width="1080" height="180" rx="22" fill="#1F2937" stroke="#FBBF24" stroke-width="4"/><text x="300" y="555" font-family="Arial" font-size="30" font-weight="700" fill="#FBBF24">3</text><text x="350" y="555" font-family="Arial" font-size="28" fill="#fff">The C·V·P·D question I will probably use most is ___ because ___.</text><text x="800" y="800" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">AI can assist with the work. You are responsible for how you use its output.</text></svg>