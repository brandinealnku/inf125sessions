<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowRunner · Pilot Report</title><style>:root{font-family:Arial,sans-serif;color:#171713}body{margin:0;background:#eceae5}.page{max-width:980px;margin:24px auto;background:#fff;padding:42px 50px}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #171713;padding-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:900}.top h1{font:500 38px/1.05 Georgia,serif;margin:7px 0}.muted{color:#666}.print{align-self:flex-start;background:#171713;color:#fff;border:0;border-radius:8px;padding:12px 15px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card,.section{border:1px solid #bbb;border-radius:10px;padding:15px}.big{font:600 30px/1 Georgia,serif;margin-top:5px}.section{margin:16px 0}.section h2{font:500 25px/1.15 Georgia,serif;margin:0 0 12px}.barrow{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:8px 0}.bar{height:14px;background:#eee;border-radius:99px;overflow:hidden}.fill{height:100%;background:#171713}.moment{display:grid;grid-template-columns:65px 1fr 110px 110px;gap:10px;padding:9px 0;border-top:1px solid #ddd;font-size:14px}.comment{padding:10px 0;border-top:1px solid #ddd;line-height:1.45}.empty{color:#777;font-style:italic}.note{font-size:12px;color:#666;line-height:1.45}.error{color:#8d3535}@media(max-width:700px){.page{margin:0;padding:24px 18px}.cards{grid-template-columns:1fr 1fr}.moment{grid-template-columns:55px 1fr}.moment span:nth-child(n+3){grid-column:2}.barrow{grid-template-columns:120px 1fr 38px}.top{flex-direction:column}}@media print{body{background:#fff}.page{margin:0;max-width:none;padding:0}.print{display:none}.section{break-inside:avoid}@page{margin:.55in}}</style></head><body><main class="page"><header class="top"><div><div class="eyebrow">ShowRunner · Research pilot</div><h1 id="title">Pilot Report</h1><div id="meta" class="muted">Loading…</div></div><button class="print" onclick="window.print()">Print / Save PDF</button></header><div id="app"></div></main><script>const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sid=new URLSearchParams(location.search).get('session')||'session-2';function pulse(p,label){if(!p)return`<div class="section"><h2>${E(label)}</h2><div class="empty">No responses yet.</div></div>`;const max=Math.max(1,...Object.values(p.counts||{}));return`<div class="section"><h2>${E(label)} <span class="muted">· ${p.n||0} responses</span></h2>${Object.entries(p.counts||{}).map(([k,v])=>`<div class="barrow"><span>${E(k)}</span><div class="bar"><div class="fill" style="width:${Math.round(v/max*100)}%"></div></div><b>${v}</b></div>`).join('')}</div>`}(async()=>{try{const [r,s]=await Promise.all([fetch(`/api/session/${encodeURIComponent(sid)}/research/report`,{cache:'no-store'}),fetch(`/api/builder/session/${encodeURIComponent(sid)}`,{cache:'no-store'})]);if(!r.ok)throw Error('Report unavailable');const d=await r.json(),session=s.ok?await s.json():null;title.textContent=(session?.title||'Session')+' · Pilot Report';meta.textContent=`Generated ${new Date().toLocaleString()} · session ${sid}`;const moments=d.moments||[],steps=session?.steps||[];app.innerHTML=`<div class="cards"><div class="card"><div class="eyebrow">Joined</div><div class="big">${d.joined||0}</div></div><div class="card"><div class="eyebrow">Answered</div><div class="big">${d.answering||0}</div></div><div class="card"><div class="eyebrow">Moments visited</div><div class="big">${moments.length}</div></div><div class="card"><div class="eyebrow">Pulse responses</div><div class="big">${Object.values(d.pulses||{}).reduce((n,p)=>n+(p.n||0),0)}</div></div></div><div class="section"><h2>Participation + pacing</h2><div class="moment"><b>#</b><b>Moment</b><b>Planned</b><b>Observed</b></div>${moments.length?moments.map(m=>{const x=steps[m.step]||{};return`<div class="moment"><span>${m.step+1}</span><span>${E(x.label?x.label+' · '+x.title:(x.title||'Moment'))}</span><span>${x.minutes?x.minutes+' min':'—'}</span><span>${m.observedSeconds!=null?Math.round(m.observedSeconds/60*10)/10+' min':'—'}</span></div>`}).join(''):'<div class="empty">Timing data will appear as the instructor advances through the session.</div>'}<p class="note">Observed time is based on instructor state transitions. It is descriptive pilot evidence, not a measure of teaching quality.</p></div>${pulse(d.pulses?.early_clarity,'Pulse 1 · Early clarity')}${pulse(d.pulses?.explain_confidence,'Pulse 2 · Explain confidence')}${pulse(d.pulses?.experience,'Pulse 3 · Learning experience')}<div class="section"><h2>Optional student comments</h2>${d.comments?.length?d.comments.map(c=>`<div class="comment">${E(c.comment)}</div>`).join(''):'<div class="empty">No optional comments yet.</div>'}<p class="note">Comments are displayed without student names in this report.</p></div>`}catch(e){app.innerHTML='<p class="error">The pilot report could not load.</p>'}})();</script></body></html>
