<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>ShowRunner · Live Cue View</title>
<link rel="stylesheet" href="/shared-v08.css">
<style>
:root{
  --canvas:#f5f3ee;--ink:#1a2230;--muted:#6c7480;--line:#dedbd3;--white:#ffffff;
  --blue:#dfeaff;--blueInk:#2457a6;
  --gold:#fff0bf;--goldInk:#8c6410;
  --violet:#eee6ff;--violetInk:#6945a6;
  --green:#def4e5;--greenInk:#2f7a4b;
  --coral:#ffe2dc;--coralInk:#a34838;
  --shadow:0 10px 30px rgba(38,48,62,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
button,a{font:inherit}
.shell{max-width:1320px;margin:auto;padding:18px 22px 118px}
.header{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:4px 0 16px;border-bottom:1px solid var(--line)}
.brand{font-size:18px;font-weight:900}
.meta{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:8px;height:8px;border-radius:50%;background:#4e9b68;display:inline-block;margin-right:5px}
.stage{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:22px;margin-top:22px;align-items:start}
.momentRail{position:sticky;top:18px;display:grid;gap:10px;align-content:start}
.momentRailHeader{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 2px 4px}
.momentRailTitle{font-size:15px;font-weight:900}
.momentRailCount{font-size:11px;color:var(--muted)}
.momentList{display:grid;gap:8px;max-height:calc(100vh - 190px);overflow-y:auto;padding:1px 3px 8px 1px;scrollbar-width:thin;scrollbar-color:#c9c4b9 transparent}
.momentBtn{display:grid;grid-template-columns:36px 1fr;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.74);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer;box-shadow:0 3px 10px rgba(38,48,62,.04)}
.momentBtn:hover{border-color:#b8c5d9;background:#fff}
.momentBtn.active{background:var(--blue);border-color:#a9c4f3;box-shadow:0 0 0 2px rgba(36,87,166,.08)}
.momentBtn.done{opacity:.55}
.momentBtn.done:hover{opacity:.82}
.momentNum{width:30px;height:30px;border-radius:9px;background:#eef0f3;color:#596575;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.momentBtn.active .momentNum{background:#2457a6;color:#fff}
.momentLabel{font-size:9px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--blueInk);margin-bottom:2px}
.momentTitle{font-size:12px;line-height:1.22;font-weight:800}
.momentMeta{font-size:10px;color:var(--muted);margin-top:4px}
.main{display:grid;gap:14px;min-width:0}
.band{border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04)}
.label{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}
.now{background:var(--blue)}
.now .label{color:var(--blueInk)}
.nowTitle{font-size:clamp(42px,5vw,72px);line-height:.95;letter-spacing:-.05em;margin:8px 0 12px;font-weight:760}
.studentTask{font-size:18px;line-height:1.45;color:#33445f;max-width:920px}
.metrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.metric{background:rgba(255,255,255,.72);border:1px solid rgba(36,87,166,.12);border-radius:999px;padding:8px 11px;font-size:12px;color:#516070}
.metric strong{color:var(--ink);font-size:14px;margin-right:3px}
.you{background:var(--gold)}
.you .label{color:var(--goldInk)}
.cue{font-size:clamp(24px,3vw,38px);line-height:1.18;font-weight:760;margin:8px 0 0}
.watch{background:var(--violet)}
.watch .label{color:var(--violetInk)}
.watchText{font-size:18px;line-height:1.45;margin-top:8px;color:#4f3f6c}
.next{background:var(--green)}
.next .label{color:var(--greenInk)}
.nextText{font-size:18px;line-height:1.35;margin-top:8px}
.nextText strong{font-size:20px}
.side{display:grid;align-content:start;gap:12px}
.sideCard{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.sideCard .label{color:#727b87}
.sideCard p{margin:7px 0 0;color:#525c68;line-height:1.42;font-size:14px}
.more summary{cursor:pointer;font-weight:800;color:var(--muted);font-size:12px}
.more div{padding-top:10px;font-size:13px;color:#606975;line-height:1.45}
.controls{position:fixed;left:0;right:0;bottom:0;background:rgba(245,243,238,.94);border-top:1px solid var(--line);backdrop-filter:blur(14px);z-index:30}
.controlsIn{max-width:1320px;margin:auto;padding:10px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.group{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #cfcac0;background:#fff;color:var(--ink);padding:12px 16px;border-radius:12px;font-weight:850;cursor:pointer;text-decoration:none;min-width:92px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.btn.primary{background:#1a2230;color:#fff;border-color:#1a2230}
.btn.reveal{background:var(--coral);border-color:#efc2b8;color:var(--coralInk)}
.btn.reveal.active{background:#f5a996;color:#6c2c21;border-color:#e88f7b}
.btn:disabled{opacity:.34;cursor:not-allowed}
.hidden{display:none!important}
#error{color:#9f3f35;margin-top:12px}
@media(max-width:1100px){.stage{grid-template-columns:220px minmax(0,1fr)}.side{grid-column:1/-1;grid-template-columns:1fr 1fr 1fr}.momentList{max-height:calc(100vh - 190px)}}
@media(max-width:900px){.stage{grid-template-columns:1fr}.momentRail{position:relative;top:auto}.momentList{display:flex;max-height:none;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}.momentBtn{min-width:210px;max-width:235px;scroll-snap-align:start}.side{grid-column:auto;grid-template-columns:1fr 1fr}.sideCard.more{grid-column:1/-1}}
@media(max-width:640px){
  .shell{padding:14px 14px 150px}.header{align-items:flex-start}.meta{justify-content:flex-start}
  .band{padding:18px}.side{grid-template-columns:1fr}
  .controlsIn{padding:10px 14px;flex-wrap:wrap}.group{width:100%}.group .btn,.group a{flex:1}
  .nowTitle{font-size:clamp(38px,12vw,58px)}
}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div>
      <div class="brand" id="brand">Loading…</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">ShowRunner · Live Cue View · V0.6</div>
    </div>
    <div class="meta">
      <span><span class="dot"></span>Live</span>
      <span id="people">0 in room</span>
      <span id="clock">0/75 min</span>
    </div>
  </header>

  <div class="stage">
    <aside class="momentRail" aria-label="Session moments">
      <div class="momentRailHeader">
        <div>
          <div class="label">RUN OF SHOW</div>
          <div class="momentRailTitle">Moments</div>
        </div>
        <div class="momentRailCount" id="momentRailCount">1/1</div>
      </div>
      <div class="momentList" id="momentList"></div>
    </aside>

    <section class="main">
      <section class="band now">
        <div class="label" id="label">NOW</div>
        <h1 class="nowTitle" id="title">Loading…</h1>
        <div class="studentTask" id="studentTask"></div>
        <div class="metrics">
          <span class="metric"><strong id="responses">0</strong> responses</span>
          <span class="metric"><strong id="participation">0%</strong> participation</span>
          <span class="metric"><strong id="step">1/1</strong> moment</span>
        </div>
      </section>

      <section class="band you">
        <div class="label">YOUR MOVE</div>
        <div class="cue" id="cue">Loading…</div>
      </section>

      <section class="band watch">
        <div class="label">WATCH FOR</div>
        <div class="watchText" id="watchFor">—</div>
      </section>

      <section class="band next">
        <div class="label">NEXT</div>
        <div class="nextText" id="nextBox"></div>
      </section>
    </section>

    <aside class="side">
      <section class="sideCard">
        <div class="label">ADVANCE WHEN</div>
        <p id="advanceWhen">—</p>
      </section>
      <section class="sideCard">
        <div class="label">LAND HERE</div>
        <p id="landHere">—</p>
      </section>
      <section class="sideCard more">
        <details>
          <summary>More context</summary>
          <div>
            <p><strong>Transition:</strong> <span id="transition">—</span></p>
            <p><strong>Planned minute:</strong> <span id="planned">0</span></p>
            <p><strong>Status:</strong> <span id="statusText">Responses open</span></p>
          </div>
        </details>
      </section>
    </aside>
  </div>

  <div id="error"></div>
</main>

<footer class="controls">
  <div class="controlsIn">
    <div class="group">
      <button class="btn" id="backBtn">← Back</button>
      <button class="btn reveal" id="revealBtn">Reveal</button>
    </div>
    <div class="group">
      <a class="btn" target="_blank" id="roomBtn" href="/room">Room</a>
      <button class="btn primary" id="nextBtn">Next →</button>
    </div>
  </div>
</footer>

<script src="/shared-v08.js"></script>
<script>
const C=Classroom;
const E=id=>document.getElementById(id);
let structural='';

function step(){return C.current()}
function rb(){return step().runbook||{}}
function safe(v,f='—'){return String(v||'').trim()||f}
function nextMoment(){return C.session.steps[C.snapshot.state.step+1]||null}
function renderMomentRail(){
  const current=C.snapshot.state.step;
  E('momentRailCount').textContent=(current+1)+'/'+C.session.steps.length;
  E('momentList').innerHTML=C.session.steps.map((m,i)=>{
    const start=C.elapsed(i),end=start+Number(m.minutes||0);
    const cls=i===current?'active':i<current?'done':'';
    return '<button class="momentBtn '+cls+'" data-index="'+i+'" onclick="jumpToMoment('+i+')">'+
      '<span class="momentNum">'+String(i+1).padStart(2,'0')+'</span>'+
      '<span><span class="momentLabel">'+C.esc(m.label||'Moment')+'</span>'+
      '<span class="momentTitle">'+C.esc(m.title||'Untitled moment')+'</span>'+
      '<span class="momentMeta">'+start+'–'+end+' min</span></span></button>';
  }).join('');
  requestAnimationFrame(()=>{
    const active=document.querySelector('.momentBtn.active');
    if(active)active.scrollIntoView({block:'nearest',inline:'nearest'});
  });
}
function needsReveal(x){
  return ['vote','choice','select','multi-select','prompt','reflection'].includes(x.type)
    || !!x.teachReveal
    || !!x.choices?.length;
}
function cueText(){
  const x=step(),r=rb();
  return safe(r.say||r.askNext||x.lead,'Guide the room through this moment.');
}
function render(){
  const x=step(),r=rb(),p=C.participation(),n=nextMoment(),state=C.snapshot.state;
  E('brand').textContent=C.session.title;
  E('people').textContent=C.snapshot.participantCount+' in room';
  E('clock').textContent=C.elapsed(state.step)+'/'+C.session.durationMinutes+' min';
  E('label').textContent='NOW · '+safe(x.label,'Moment');
  E('title').textContent=safe(x.title,'Untitled moment');
  E('studentTask').textContent=safe(x.studentTask||r.studentDoes||x.lead,'Students are with you. Keep the room focused.');
  E('responses').textContent=p.count;
  E('participation').textContent=p.percent+'%';
  E('step').textContent=(state.step+1)+'/'+C.session.steps.length;
  renderMomentRail();
  E('cue').textContent=cueText();
  E('watchFor').textContent=safe(r.watchFor,'Notice what students are doing, saying, or hesitating on.');
  E('advanceWhen').textContent=safe(r.advanceWhen,'Advance when the room has given you enough evidence to move on.');
  E('landHere').textContent=safe(r.landHere||x.teachReveal?.headline,'Keep the learning point simple and explicit.');
  E('transition').textContent=safe(r.transition);
  E('planned').textContent=C.elapsed(state.step);
  E('statusText').textContent=state.locked?'Responses committed / closed':'Responses open';
  E('nextBox').innerHTML=n
    ? '<strong>'+C.esc(n.label||'Next')+'</strong><br>'+C.esc(n.title||'')
    : '<strong>End of experience</strong>';

  E('backBtn').disabled=state.step<=0;
  E('nextBtn').disabled=state.step>=C.session.steps.length-1;

  const showReveal=needsReveal(x);
  E('revealBtn').classList.toggle('hidden',!showReveal);
  E('revealBtn').textContent=state.resultsVisible?'Hide results':'Reveal';
  E('revealBtn').classList.toggle('active',!!state.resultsVisible);
}

async function setState(patch){
  await C.state(patch);
  structural='';
  await poll(true);
}
function go(delta){
  const next=Math.max(0,Math.min(C.session.steps.length-1,C.snapshot.state.step+delta));
  return jumpToMoment(next);
}
function jumpToMoment(index){
  const next=Math.max(0,Math.min(C.session.steps.length-1,Number(index)||0));
  return setState({step:next,locked:false,resultsVisible:false,roomMoment:null});
}
E('backBtn').onclick=()=>go(-1);
E('nextBtn').onclick=()=>go(1);
E('revealBtn').onclick=()=>{
  const visible=!C.snapshot.state.resultsVisible;
  return setState({resultsVisible:visible,locked:visible,roomMoment:visible?{type:'reveal'}:null});
};
function key(){
  const s=C.snapshot.state;
  return [s.step,s.locked,s.resultsVisible,s.updatedAt].join('|');
}
async function poll(force=false){
  try{
    await C.refresh();
    const k=key();
    if(force||k!==structural){structural=k;render();}
    else{
      const p=C.participation();
      E('responses').textContent=p.count;
      E('participation').textContent=p.percent+'%';
      E('people').textContent=C.snapshot.participantCount+' in room';
    }
  }catch(e){
    E('error').textContent='Connection interrupted. Retrying…';
  }
}
(async()=>{
  try{
    await C.loadSession();
    await poll(true);
    setInterval(()=>poll(),900);
  }catch(e){
    E('error').textContent='ShowRunner could not load this session.';
  }
})();
</script>
</body>
</html>
