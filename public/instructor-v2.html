<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<title>ShowRunner · Simplified Run</title>
<link rel="stylesheet" href="/shared-v08.css">
<style>
:root{
  --bg:#0b0b0a;--panel:#141411;--text:#f5f1e8;--muted:#9d988f;
  --line:#2b2a26;--gold:#d8aa3d;--soft:#1d1c18;--green:#77b183
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
button,a{font:inherit}
.shell{max-width:1360px;margin:auto;padding:20px 22px 112px}
.header{display:flex;justify-content:space-between;gap:18px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);font-weight:900}
.brand{font-size:18px;font-weight:900}
.live{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;margin-top:24px}
.main{min-width:0}
.now{padding:2px 0 16px}
.nowTitle{font-family:Georgia,serif;font-size:clamp(48px,6vw,86px);line-height:.92;letter-spacing:-.055em;font-weight:500;margin:8px 0 14px}
.sub{color:#d7d1c5;font-size:18px;line-height:1.45;max-width:880px}
.metricRow{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.metric{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 12px;color:var(--muted);font-size:12px}
.metric strong{color:var(--text);font-size:15px;margin-right:4px}
.cue{border:1px solid #6a5520;background:linear-gradient(145deg,#18160f,#10100d);border-radius:18px;padding:22px;margin-top:16px}
.cueLabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:900}
.cueText{font-family:Georgia,serif;font-size:clamp(24px,3vw,38px);line-height:1.18;margin:8px 0 0}
.nextBox{margin-top:16px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted)}
.nextBox strong{color:var(--text)}
.side{border-left:1px solid var(--line);padding-left:22px}
.sideBlock{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.sideBlock p{margin:7px 0 0;line-height:1.45;color:#c9c4ba}
.side .tiny{font-size:12px;color:var(--muted)}
.drawer{margin-top:10px}
.drawer summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:800}
.drawerBody{padding-top:10px}
.drawerBody p{font-size:13px;line-height:1.45;color:#c8c2b7}
.controls{position:fixed;left:0;right:0;bottom:0;background:#0b0b0af2;border-top:1px solid var(--line);backdrop-filter:blur(16px);z-index:40}
.controlsIn{max-width:1360px;margin:auto;padding:10px 22px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.group{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #444139;background:transparent;color:var(--text);padding:12px 15px;border-radius:10px;font-weight:850;cursor:pointer;text-decoration:none;min-width:94px}
.btn.primary{background:var(--text);color:#111;border-color:var(--text)}
.btn.accent{background:var(--gold);border-color:var(--gold);color:#111}
.btn:disabled{opacity:.35;cursor:not-allowed}
.toast{position:fixed;right:20px;top:20px;background:#171612;border:1px solid var(--line);padding:12px 15px;border-radius:12px;z-index:70}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}
}
@media(max-width:640px){
  .shell{padding:14px 14px 150px}.header{align-items:flex-start}.live{justify-content:flex-start}
  .controlsIn{padding:10px 14px;flex-wrap:wrap}.group{width:100%}.group .btn,.group a{flex:1}
  .nowTitle{font-size:clamp(42px,13vw,64px)}
}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div>
      <div class="eyebrow">ShowRunner · Simplified Run</div>
      <div class="brand" id="brand">Loading…</div>
    </div>
    <div class="live">
      <span><span class="dot"></span> Live</span>
      <span id="people">0 in room</span>
      <span id="clock">0/75 min</span>
    </div>
  </header>

  <div class="layout">
    <section class="main">
      <div class="now">
        <div class="eyebrow" id="label">NOW</div>
        <h1 class="nowTitle" id="title">Loading…</h1>
        <div class="sub" id="studentTask"></div>
      </div>

      <div class="metricRow">
        <div class="metric"><strong id="responses">0</strong> responses</div>
        <div class="metric"><strong id="participation">0%</strong> participation</div>
        <div class="metric"><strong id="step">1/1</strong> moment</div>
      </div>

      <section class="cue">
        <div class="cueLabel">Instructor cue</div>
        <div class="cueText" id="cue">Loading…</div>
      </section>

      <div class="nextBox" id="nextBox"></div>
    </section>

    <aside class="side">
      <div class="sideBlock">
        <div class="eyebrow">What to watch for</div>
        <p id="watchFor">—</p>
      </div>
      <div class="sideBlock">
        <div class="eyebrow">Advance when</div>
        <p id="advanceWhen">—</p>
      </div>
      <div class="sideBlock">
        <div class="eyebrow">Land here</div>
        <p id="landHere">—</p>
      </div>
      <details class="drawer">
        <summary>More context</summary>
        <div class="drawerBody">
          <p><strong>Transition:</strong> <span id="transition">—</span></p>
          <p><strong>Planned minute:</strong> <span id="planned">0</span></p>
          <p><strong>Status:</strong> <span id="statusText">Responses open</span></p>
        </div>
      </details>
    </aside>
  </div>

  <div id="error"></div>
</main>

<footer class="controls">
  <div class="controlsIn">
    <div class="group">
      <button class="btn" id="backBtn">← Back</button>
      <button class="btn" id="revealBtn">Reveal</button>
    </div>
    <div class="group">
      <a class="btn" target="_blank" id="roomBtn" href="/room">Room</a>
      <button class="btn primary" id="nextBtn">Next →</button>
    </div>
  </div>
</footer>

<script src="/shared-v08.js"></script>
<script>
const C=Classroom;
const E=id=>document.getElementById(id);
let structural='';

function step(){return C.current()}
function rb(){return step().runbook||{}}
function safe(v,f='—'){return String(v||'').trim()||f}
function nextMoment(){return C.session.steps[C.snapshot.state.step+1]||null}

function cueText(){
  const x=step(),r=rb();
  return safe(r.say||r.askNext||x.lead,'Guide the room through this moment.');
}

function render(){
  const x=step(),r=rb(),p=C.participation(),n=nextMoment(),state=C.snapshot.state;
  E('brand').textContent=C.session.title;
  E('people').textContent=C.snapshot.participantCount+' in room';
  E('clock').textContent=C.elapsed(state.step)+'/'+C.session.durationMinutes+' min';
  E('label').textContent='NOW · '+safe(x.label,'Moment');
  E('title').textContent=safe(x.title,'Untitled moment');
  E('studentTask').textContent=safe(x.studentTask||r.studentDoes||x.lead,'Students are with you. Keep the room focused.');
  E('responses').textContent=p.count;
  E('participation').textContent=p.percent+'%';
  E('step').textContent=(state.step+1)+'/'+C.session.steps.length;
  E('cue').textContent=cueText();
  E('watchFor').textContent=safe(r.watchFor);
  E('advanceWhen').textContent=safe(r.advanceWhen,'Advance when the room has given you enough evidence to move on.');
  E('landHere').textContent=safe(r.landHere||x.teachReveal?.headline);
  E('transition').textContent=safe(r.transition);
  E('planned').textContent=C.elapsed(state.step);
  E('statusText').textContent=state.locked?'Responses committed / closed':'Responses open';
  E('nextBox').innerHTML=n
    ? '<span class="eyebrow">NEXT</span><div><strong>'+C.esc(n.label||'Next')+'</strong> · '+C.esc(n.title||'')+'</div>'
    : '<span class="eyebrow">NEXT</span><div><strong>End of experience</strong></div>';

  E('backBtn').disabled=state.step<=0;
  E('nextBtn').disabled=state.step>=C.session.steps.length-1;
  E('revealBtn').textContent=state.resultsVisible?'Hide results':'Reveal results';
  E('revealBtn').classList.toggle('accent',!!state.resultsVisible);
}

async function setState(patch){
  await C.state(patch);
  structural='';
  await poll(true);
}

function go(delta){
  const next=Math.max(0,Math.min(C.session.steps.length-1,C.snapshot.state.step+delta));
  return setState({step:next,locked:false,resultsVisible:false,roomMoment:null});
}

E('backBtn').onclick=()=>go(-1);
E('nextBtn').onclick=()=>go(1);
E('revealBtn').onclick=()=>{
  const visible=!C.snapshot.state.resultsVisible;
  return setState({resultsVisible:visible,locked:visible,roomMoment:visible?{type:'reveal'}:null});
};

function key(){
  const s=C.snapshot.state;
  return [s.step,s.locked,s.resultsVisible,s.updatedAt].join('|');
}

async function poll(force=false){
  try{
    await C.refresh();
    const k=key();
    if(force||k!==structural){structural=k;render();}
    else{
      const p=C.participation();
      E('responses').textContent=p.count;
      E('participation').textContent=p.percent+'%';
      E('people').textContent=C.snapshot.participantCount+' in room';
    }
  }catch(e){
    E('error').textContent='Connection interrupted. Retrying…';
  }
}

(async()=>{
  try{
    await C.loadSession();
    await poll(true);
    setInterval(()=>poll(),900);
  }catch(e){
    E('error').textContent='ShowRunner could not load this session.';
  }
})();
</script>
</body>
</html>
