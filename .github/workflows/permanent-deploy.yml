name: Permanent Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/permanent-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Context Quest runtime syntax
        run: |
          node --check public/context-quest.js
          node --check public/context-quest-instructor.js
          node --check public/context-quest-board.js
          node --check public/context-quest-data.js
      - name: Deploy Worker to Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy
      - name: Verify permanent classroom surfaces
        run: |
          set -e
          for path in student instructor room; do
            echo "Checking https://classroom.itsbadlabs.com/$path"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/$path" > /dev/null
          done
          for path in context-quest context-quest/instructor context-quest/board; do
            echo "Checking https://classroom.itsbadlabs.com/$path"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/$path" > /dev/null
          done
          echo "Checking Context Quest shared API"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/api/session/context-quest-live/cq/snapshot" | grep -q '"stage"'
          echo "Checking team runtime"
          CQ_JS="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/context-quest.js")"
          echo "$CQ_JS" | grep -q 'LIVE CLASSROOM PARTY GAME'
          echo "$CQ_JS" | grep -q 'FORM BALANCED VIRTUAL TEAMS' || true
          echo "$CQ_JS" | grep -q 'YOUR DEVICE = YOUR CONTROLLER'
          echo "$CQ_JS" | grep -q 'function isEditing'
          echo "$CQ_JS" | grep -q 'REMOVE MY VOTE'
          echo "$CQ_JS" | grep -q 'MAD LIBS PROMPT'
          echo "$CQ_JS" | grep -q 'PICK THE BEST PROMPT'
          echo "$CQ_JS" | grep -q 'ONLY YOU SEE THIS'
          echo "$CQ_JS" | grep -q 'SPOT THE PROBLEMS'
          echo "Context Quest multiplayer routes, API, and runtimes are reachable."
      - name: Verify Context Quest individual-player game flow
        run: |
          set -e
          BASE="https://classroom.itsbadlabs.com/api/session/context-quest-smoke/cq"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$BASE/reset" > /dev/null
          echo "Checking instructor test-player generator"
          TEST_CREATE="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"count":10,"watchers":2}' "$BASE/test-players")"
          echo "$TEST_CREATE"
          echo "$TEST_CREATE" | grep -q '"created":10'
          TEST_SNAPSHOT="$(curl --fail --silent --show-error "$BASE/snapshot")"
          echo "$TEST_SNAPSHOT"
          echo "$TEST_SNAPSHOT" | grep -q '"playing":10'
          TEST_CLEAR="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$BASE/clear-test-players")"
          echo "$TEST_CLEAR"
          echo "$TEST_CLEAR" | grep -q '"removed":12'
          for n in 1 2 3 4; do
            curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"p$n\",\"name\":\"Player $n\",\"mode\":\"play\"}" "$BASE/join" | grep -q '"ok":true'
          done
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"watcher","name":"Guest","mode":"watch"}' "$BASE/join" | grep -q '"mode":"watch"'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"teamSize":5}' "$BASE/form-teams" | grep -q '"teamsFormed":true'
          curl --fail --silent --show-error "$BASE/snapshot" | grep -q '"playing":4'
          curl --fail --silent --show-error "$BASE/snapshot" | grep -q '"watching":1'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"build","round":0}' "$BASE/control" | grep -q '"stage":"build"'
          P1_BUILD="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p1","action":"proposeBuild","text":"Explain AI clearly to a first-year student."}' "$BASE/player-action")"
          P1_ID="$(printf '%s' "$P1_BUILD" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],x=Object.values(r.buildProposals).find(p=>p.playerId==="p1");process.stdout.write(x.id)})')"
          P2_BUILD="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p2","action":"proposeBuild","text":"Explain AI simply with one school example."}' "$BASE/player-action")"
          P2_ID="$(printf '%s' "$P2_BUILD" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],x=Object.values(r.buildProposals).find(p=>p.playerId==="p2");process.stdout.write(x.id)})')"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"p1\",\"action\":\"voteBuild\",\"proposalId\":\"$P1_ID\"}" "$BASE/player-action" > /dev/null
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"p3\",\"action\":\"voteBuild\",\"proposalId\":\"$P1_ID\"}" "$BASE/player-action" | grep -q '"buildAllVoted":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"p3\",\"action\":\"voteBuild\",\"proposalId\":\"$P1_ID\"}" "$BASE/player-action" | grep -q '"buildAllVoted":false'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"p3\",\"action\":\"voteBuild\",\"proposalId\":\"$P1_ID\"}" "$BASE/player-action" | grep -q '"buildAllVoted":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"p2\",\"action\":\"voteBuild\",\"proposalId\":\"$P2_ID\"}" "$BASE/player-action" > /dev/null
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"p4\",\"action\":\"voteBuild\",\"proposalId\":\"$P2_ID\"}" "$BASE/player-action" | grep -q '"buildAllVoted":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"teamId":"team-1","field":"build"}' "$BASE/review-team" | grep -q '"ok":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"teamId":"team-2","field":"build"}' "$BASE/review-team" | grep -q '"ok":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"test","round":0}' "$BASE/control" | grep -q '"stage":"test"'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"twist","round":0}' "$BASE/control" > /dev/null
          P1_REPAIR="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p1","action":"proposeRepair","text":"Explain AI simply to a first-year student who has never used AI."}' "$BASE/player-action")"
          R1_ID="$(printf '%s' "$P1_REPAIR" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],x=Object.values(r.repairProposals).find(p=>p.playerId==="p1");process.stdout.write(x.id)})')"
          P2_REPAIR="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p2","action":"proposeRepair","text":"Explain AI simply and state assumptions for a new AI user."}' "$BASE/player-action")"
          R2_ID="$(printf '%s' "$P2_REPAIR" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],x=Object.values(r.repairProposals).find(p=>p.playerId==="p2");process.stdout.write(x.id)})')"
          for p in p1 p3; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"voteRepair\",\"proposalId\":\"$R1_ID\"}" "$BASE/player-action" > /dev/null; done
          for p in p2 p4; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"voteRepair\",\"proposalId\":\"$R2_ID\"}" "$BASE/player-action" > /dev/null; done
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"teamId":"team-1","field":"repair"}' "$BASE/review-team" | grep -q '"ok":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"teamId":"team-2","field":"repair"}' "$BASE/review-team" | grep -q '"ok":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"check","round":0}' "$BASE/control" > /dev/null
          for p in p1 p2 p3 p4; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"checks\",\"checks\":[true,true,true,true]}" "$BASE/player-action" > /dev/null; done
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"reveal","round":0}' "$BASE/control" > /dev/null
          curl --fail --silent --show-error "$BASE/snapshot" | grep -q '"position":3'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$BASE/reset" > /dev/null
          echo "Context Quest individual join → virtual teams → proposal → repair → ballots → movement flow passed."
      - name: Verify Context Quest renders in a browser
        run: |
          set -e
          dump_dom() {
            URL="$1"
            for attempt in 1 2 3; do
              if timeout 30s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom "$URL" 2>/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          TEAM_DOM="$(dump_dom https://classroom.itsbadlabs.com/context-quest)"
          echo "$TEAM_DOM" | grep -q "EVERYONE"
          echo "$TEAM_DOM" | grep -q "PLAY"
          INST_DOM="$(dump_dom https://classroom.itsbadlabs.com/context-quest/instructor)"
          echo "$INST_DOM" | grep -q "GAME MASTER"
          echo "$INST_DOM" | grep -q "VIRTUAL TEAMS"
          echo "$INST_DOM" | grep -q "INSTRUCTOR TEST LAB"
          echo "$INST_DOM" | grep -q "SIMULATE CURRENT PHASE"
          BOARD_DOM="$(dump_dom https://classroom.itsbadlabs.com/context-quest/board)"
          echo "$BOARD_DOM" | grep -q "LIVE CLASSROOM BOARD"
          echo "$BOARD_DOM" | grep -q "EVERYONE JOIN"
          echo "Context Quest team, instructor, and projected board surfaces all executed successfully."
