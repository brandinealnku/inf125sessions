name: Permanent Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/permanent-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Context Quest runtime syntax
        run: node --check public/context-quest.js
      - name: Deploy Worker to Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy
      - name: Verify permanent classroom surfaces
        run: |
          set -e
          for path in student instructor room; do
            echo "Checking https://classroom.itsbadlabs.com/$path"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
              --max-time 20 "https://classroom.itsbadlabs.com/$path" > /dev/null
          done
          echo "Checking Context Quest HTML references its runtime"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            --max-time 20 "https://classroom.itsbadlabs.com/context-quest" | grep -q "context-quest.js"
          echo "Checking Context Quest runtime content and release marker"
          CQ_JS="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            --max-time 20 "https://classroom.itsbadlabs.com/context-quest.js")"
          echo "$CQ_JS" | grep -q 'cq-simplified-2026-10-05'
          echo "$CQ_JS" | grep -q 'BAD PROMPT'
          echo "$CQ_JS" | grep -q 'PLOT TWIST'
          echo "$CQ_JS" | grep -q '3–4 checks = success'
          echo "Permanent Classroom surfaces and the current simplified Context Quest runtime are reachable over HTTPS."
      - name: Verify Context Quest renders in a browser
        run: |
          set -e
          DOM="$(timeout 30s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom https://classroom.itsbadlabs.com/context-quest)"
          echo "$DOM" | grep -q "PLAY THE TUTORIAL"
          echo "$DOM" | grep -q "You’re given a bad AI prompt"
          echo "Context Quest executed successfully and rendered the simplified start experience."
