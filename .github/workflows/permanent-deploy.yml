name: Permanent Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/permanent-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Deploy Worker to Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy
      - name: Verify permanent classroom surfaces
        run: |
          set -e
          for path in student instructor room; do
            echo "Checking https://classroom.itsbadlabs.com/$path"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
              --max-time 20 "https://classroom.itsbadlabs.com/$path" > /dev/null
          done
          echo "Checking Context Quest HTML references its runtime"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            --max-time 20 "https://classroom.itsbadlabs.com/context-quest" | grep -q "context-quest.js"
          echo "Checking Context Quest runtime content"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            --max-time 20 "https://classroom.itsbadlabs.com/context-quest.js" | grep -q "function start"
          echo "Permanent Classroom surfaces and Context Quest runtime are reachable over HTTPS."
