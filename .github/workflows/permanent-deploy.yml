name: Permanent Cloudflare Deploy

concurrency:
  group: permanent-cloudflare-production
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/permanent-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Context Quest runtime syntax
        run: |
          node --check public/context-quest.js
          node --check public/context-quest-instructor.js
          node --check public/context-quest-board.js
          node --check public/context-quest-test.js
          node --check public/context-quest-data.js
      - name: Deploy Worker to Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy
      - name: Verify permanent classroom surfaces
        run: |
          set -e
          for path in student instructor room; do
            echo "Checking https://classroom.itsbadlabs.com/$path"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/$path" > /dev/null
          done
          for path in context-quest context-quest/instructor context-quest/board context-quest/test google-slides-live google-slides-room human-in-the-loop session-report builder; do
            echo "Checking https://classroom.itsbadlabs.com/$path"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/$path" > /dev/null
          done
          echo "Checking Context Quest shared API"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/api/session/context-quest-live/cq/snapshot" | grep -q '"stage"'
          echo "Checking team runtime"
          CQ_JS="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/context-quest.js?verify=$GITHUB_SHA")"
          printf '%s' "$CQ_JS" > /tmp/context-quest.js
          grep -q 'THE PROMPTS' /tmp/context-quest.js
          grep -q 'FORM BALANCED VIRTUAL TEAMS' /tmp/context-quest.js || true
          grep -q 'YOUR DEVICE = YOUR CONTROLLER' /tmp/context-quest.js
          grep -q 'function isEditing' /tmp/context-quest.js
          grep -q 'REMOVE MY VOTE' /tmp/context-quest.js
          grep -q 'INVESTIGATOR TRAINING' /tmp/context-quest.js
          grep -q 'PICK THE BEST PROMPT' /tmp/context-quest.js
          grep -q 'ONLY YOU SEE THIS' /tmp/context-quest.js
          grep -q 'SPOT THE PROBLEMS' /tmp/context-quest.js
          grep -q 'CHOOSE YOUR HALLOWEEN CHARM' /tmp/context-quest.js
          grep -q 'LOCK TEAM IDENTITY' /tmp/context-quest.js
          grep -q 'selectedCharmStatus' /tmp/context-quest.js
          grep -q 'MYSTERY PROMPT' /tmp/context-quest.js
          grep -q 'HAUNTED LAB' /tmp/context-quest.js
          grep -q 'CURSE OF THE CONFIDENT AI' /tmp/context-quest.js
          grep -q 'EVIDENCE CHECK' /tmp/context-quest.js
          ! grep -q 'GHOST HUNT · TEAM REPAIR SELECTED' /tmp/context-quest.js
          grep -q 'HOW TO PLAY' /tmp/context-quest.js
          grep -q 'one active answer' /tmp/context-quest.js
          grep -q 'Generative AI' /tmp/context-quest.js
          grep -q 'YOUR NEXT' /tmp/context-quest.js
          grep -q "CAN'T ACCESS CHATGPT" /tmp/context-quest.js
          grep -q 'I REVIEWED A TEAMMATE / SAMPLE RESPONSE' /tmp/context-quest.js
          grep -q 'Judge the RESPONSE, not the prompt' /tmp/context-quest.js
          grep -q '1 case point' /tmp/context-quest.js
          grep -q '2 · CONTRIBUTE' /tmp/context-quest.js
          grep -q 'PROPOSE AN ANSWER' /tmp/context-quest.js
          grep -q 'EVERY ACTIVE PLAYER votes' /tmp/context-quest.js
          grep -q 'boardPosition' /tmp/context-quest.js || true
          INST_JS="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/context-quest-instructor.js?verify=$GITHUB_SHA")"
          printf '%s' "$INST_JS" > /tmp/context-quest-instructor.js
          grep -q 'TEST MODE IS ON' /tmp/context-quest-instructor.js
          grep -q 'TURN TEST MODE ON' /tmp/context-quest-instructor.js
          echo "Checking instructor facilitation runtime"
          grep -q 'FACILITATION GUIDE' /tmp/context-quest-instructor.js
          grep -q 'TEST SANDBOX' /tmp/context-quest-instructor.js
          grep -q 'ADVANCE WHEN' /tmp/context-quest-instructor.js
          grep -q 'FACULTY QUICK START' /tmp/context-quest-instructor.js
          grep -q 'ROOM PROGRESS' /tmp/context-quest-instructor.js
          grep -q 'Winning answers are selected automatically' /tmp/context-quest-instructor.js
          grep -q 'LIVE TEAM SUBMISSIONS' /tmp/context-quest-instructor.js
          grep -q 'D.progressLabels' /tmp/context-quest-instructor.js
          grep -q 'EXCUSE THIS CASE' /tmp/context-quest-instructor.js
          grep -q 'excusePlayer' /tmp/context-quest-instructor.js
          grep -q 'RESET LIVE ROOM' /tmp/context-quest-instructor.js
          grep -q 'YOUR NEXT SHARED ACTION' /tmp/context-quest-instructor.js
          grep -q 'active students complete' /tmp/context-quest-instructor.js
          grep -q 'HAVING A PROBLEM' /tmp/context-quest-instructor.js
          grep -q 'FORCE ROOM FORWARD' /tmp/context-quest-instructor.js
          grep -q 'OPTIONAL DEBRIEF BONUS' /tmp/context-quest-instructor.js
          grep -q 'function stageStats' /tmp/context-quest-instructor.js
          grep -q 'function gameMasterConsole' /tmp/context-quest-instructor.js
          grep -q 'function rememberGmUi' /tmp/context-quest-instructor.js
          grep -q 'Answers proposed' /tmp/context-quest-instructor.js
          grep -q 'Responses reviewed' /tmp/context-quest-instructor.js
          grep -q 'VIEW TEAM ↓' /tmp/context-quest-instructor.js
          grep -q 'Waiting for any teammate to submit the first answer' /tmp/context-quest-instructor.js
          grep -q 'REVEAL FINAL EVIDENCE + SCORE' /tmp/context-quest-instructor.js
          ! grep -q 'REVEAL EVIDENCE + MOVEMENT' /tmp/context-quest-instructor.js
          echo "Checking isolated test sandbox runtime"
          TEST_JS="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/context-quest-test.js?verify=$GITHUB_SHA")"
          printf '%s' "$TEST_JS" > /tmp/context-quest-test.js
          grep -q 'context-quest-sandbox' /tmp/context-quest-test.js
          grep -q 'SAFE REHEARSAL ENVIRONMENT' /tmp/context-quest-test.js
          grep -q 'SIMULATE CURRENT PHASE' /tmp/context-quest-test.js
          grep -q 'REVEAL PLOT TWIST' /tmp/context-quest-test.js || grep -q 'REVEAL THE HAUNTING' /tmp/context-quest-test.js
          grep -q 'LIVE TEAM SUBMISSIONS' /tmp/context-quest-test.js
          echo "Checking session-driven Google Slides ShowRunner"
          GS_LIVE="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/google-slides-live?session=inf125-week05-session1-multimodal-communication&verify=$GITHUB_SHA")"
          GS_ROOM="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/google-slides-room?session=inf125-week05-session1-multimodal-communication&verify=$GITHUB_SHA")"
          BUILDER="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/builder?verify=$GITHUB_SHA")"
          printf '%s' "$GS_LIVE" > /tmp/google-slides-live.html
          printf '%s' "$GS_ROOM" > /tmp/google-slides-room.html
          printf '%s' "$BUILDER" > /tmp/showrunner-builder.html
          grep -q 'function deckConfig' /tmp/google-slides-live.html
          grep -q 'C.session.googleSlides' /tmp/google-slides-live.html
          grep -q 'function phaseRange' /tmp/google-slides-live.html
          grep -q 'C.session.googleSlides' /tmp/google-slides-room.html
          grep -q 'TEACH WITH GOOGLE SLIDES' /tmp/showrunner-builder.html
          grep -q 'Google Slides deck URL' /tmp/showrunner-builder.html
          grep -q "gs.start" /tmp/showrunner-builder.html
          grep -q "gs.end" /tmp/showrunner-builder.html

          BUILDER_ID="showrunner-gslides-smoke-$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' \
            -d "{\"id\":\"$BUILDER_ID\",\"title\":\"Google Slides Smoke\",\"durationMinutes\":20,\"googleSlides\":{\"deckUrl\":\"https://docs.google.com/presentation/d/testDeck123/edit\",\"slideIds\":[\"p1\",\"abc123\",\"abc456\"]},\"steps\":[{\"label\":\"HOOK\",\"title\":\"Hook\",\"minutes\":5,\"googleSlides\":{\"start\":1,\"end\":2}},{\"label\":\"ASK\",\"title\":\"Ask\",\"minutes\":5,\"googleSlides\":{\"start\":3,\"end\":3}}]}" \
            "https://classroom.itsbadlabs.com/api/builder/session" > /tmp/gslides-save.json
          GS_DEF="$(curl --fail --silent --show-error "https://classroom.itsbadlabs.com/api/builder/session/$BUILDER_ID")"
          printf '%s' "$GS_DEF" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.googleSlides?.deckUrl!=="https://docs.google.com/presentation/d/testDeck123/edit")process.exit(1);if(j.googleSlides?.slideIds?.[1]!=="abc123")process.exit(1);if(j.steps?.[0]?.googleSlides?.start!==1||j.steps?.[0]?.googleSlides?.end!==2)process.exit(1);if(j.steps?.[1]?.googleSlides?.start!==3)process.exit(1)})'
          curl --fail --silent --show-error -X DELETE "https://classroom.itsbadlabs.com/api/builder/session/$BUILDER_ID" > /dev/null
          echo "Session-driven Google Slides schema and runtimes passed."

          echo "Checking optimized INF 128 AI literacy experience"
          GUEST_DEF="$(curl --fail --silent --show-error "https://classroom.itsbadlabs.com/sessions/inf128-ai-literacy-guest-2026.json?verify=$GITHUB_SHA")"
          printf '%s' "$GUEST_DEF" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.durationMinutes!==75)process.exit(1);if(j.steps?.length!==17)process.exit(1);if(!j.googleSlides?.deckUrl?.includes("1-dzLok85ZnkT7WIdQ_y4DCQ0PEzIg0akVJqv4twq6zs"))process.exit(1);if(j.googleSlides?.slideIds?.length!==22)process.exit(1);if(j.steps?.[7]?.maxSelections!==2)process.exit(1);if(j.steps?.[15]?.actionUrl!=="/human-in-the-loop")process.exit(1)})'
          HUMAN_LOOP="$(curl --fail --silent --show-error "https://classroom.itsbadlabs.com/human-in-the-loop?verify=$GITHUB_SHA")"
          echo "$HUMAN_LOOP" | grep -q "HUMAN IN THE LOOP"
          echo "$HUMAN_LOOP" | grep -q "not uploaded or stored"
          echo "Optimized INF 128 experience and Human in the Loop finale passed."

          REPORT_HTML="$(curl --fail --silent --show-error "https://classroom.itsbadlabs.com/session-report?session=inf128-ai-literacy-guest-2026&verify=$GITHUB_SHA")"
          echo "$REPORT_HTML" | grep -q "Session Impact Report"
          echo "$REPORT_HTML" | grep -q "Pedagogical map for faculty"
          echo "$REPORT_HTML" | grep -q "Private instructor appendix"

          IMPACT="https://classroom.itsbadlabs.com/api/session/impact-smoke-$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$IMPACT/reset" > /dev/null
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"device":"faculty-test-student","name":"Test Student"}' "$IMPACT/join" | grep -q '"ok":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"device":"faculty-test-student","name":"Test Student","question":"ai_confident_trust","response":"MAYBE — I’D VERIFY"}' "$IMPACT/answer" | grep -q '"ok":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"kind":"best_moment","note":"Students reacted strongly to the reveal.","moment":"ai_confident_trust","step":6}' "$IMPACT/research/note" | grep -q '"ok":true'
          IMPACT_REPORT="$(curl --fail --silent --show-error "$IMPACT/research/report")"
          printf '%s' "$IMPACT_REPORT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.joined!==1||j.answering!==1)process.exit(1);if(j.answerSummary?.ai_confident_trust?.n!==1)process.exit(1);if(j.answerSummary?.ai_confident_trust?.counts?.["MAYBE — I’D VERIFY"]!==1)process.exit(1);if(j.instructorNotes?.[0]?.kind!=="best_moment")process.exit(1);if(JSON.stringify(j).includes("Test Student"))process.exit(1)})'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$IMPACT/reset" > /dev/null
          echo "Session Impact Report aggregation, anonymization, and private notes passed."



          echo "Context Quest multiplayer routes, API, runtimes, facilitator guide, and sandbox are reachable."
      - name: Verify Context Quest hybrid team automation
        run: |
          set -e
          BASE="https://classroom.itsbadlabs.com/api/session/context-quest-smoke-$GITHUB_RUN_ID/cq"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$BASE/reset" > /dev/null

          for n in 1 2 3 4; do
            curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"p$n\",\"name\":\"Player $n\",\"mode\":\"play\"}" "$BASE/join" | grep -q '"ok":true'
          done
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"teamSize":5}' "$BASE/form-teams" | grep -q '"teamsFormed":true'
          PRE="$(curl --fail --silent --show-error "$BASE/snapshot")"
          T1_ID="$(printf '%s' "$PRE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),t=j.teams.find(t=>t.members.some(m=>m.id==="p1"));process.stdout.write(t.id)})')"
          T1_OTHER="$(printf '%s' "$PRE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),t=j.teams.find(t=>t.members.some(m=>m.id==="p1")),m=t.members.find(m=>m.id!=="p1");process.stdout.write(m?.id||"")})')"
          if [ -n "$T1_OTHER" ]; then
            curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"teamId\":\"$T1_ID\",\"playerId\":\"$T1_OTHER\",\"excused\":true}" "$BASE/excuse-player" | grep -q '"excused":true'
            curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"teamId\":\"$T1_ID\",\"playerId\":\"$T1_OTHER\",\"excused\":false}" "$BASE/excuse-player" | grep -q '"excused":false'
          fi
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p1","name":"Ghost Hunters","charm":"🎃"}' "$BASE/team-customize" | grep -q '"customized":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p2","name":"Prompt Phantoms","charm":"👻"}' "$BASE/team-customize" | grep -q '"customized":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"tutorial","round":0}' "$BASE/control" | grep -q '"stage":"tutorial"'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"build","round":0}' "$BASE/control" | grep -q '"stage":"build"'

          # One active answer per player: second submission replaces first.
          P1="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p1","action":"proposeBuild","text":"First draft"}' "$BASE/player-action")"
          P1U="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p1","action":"proposeBuild","text":"UPDATED: first-year student context answer"}' "$BASE/player-action")"
          printf '%s' "$P1U" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],rows=Object.values(r.buildProposals).filter(p=>p.playerId==="p1");if(rows.length!==1||!rows[0].text.startsWith("UPDATED:"))process.exit(1)})'
          P1_ID="$(printf '%s' "$P1U" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],x=Object.values(r.buildProposals).find(p=>p.playerId==="p1");process.stdout.write(x.id)})')"

          P2="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p2","action":"proposeBuild","text":"Team two answer"}' "$BASE/player-action")"
          P2_ID="$(printf '%s' "$P2" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],x=Object.values(r.buildProposals).find(p=>p.playerId==="p2");process.stdout.write(x.id)})')"

          for p in p1 p3; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"voteBuild\",\"proposalId\":\"$P1_ID\"}" "$BASE/player-action" > /dev/null; done
          for p in p2 p4; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"voteBuild\",\"proposalId\":\"$P2_ID\"}" "$BASE/player-action" > /dev/null; done

          # Team winner auto-selects and each team moves itself into Test.
          SNAP="$(curl --fail --silent --show-error "$BASE/snapshot")"
          echo "=== AFTER TEAM VOTING ==="
          echo "$SNAP"
          echo "$SNAP" | grep -q '"progressPhase":"test"'
          echo "$SNAP" | grep -q '"build":"UPDATED: first-year student context answer"'
          [ "$(printf '%s' "$SNAP" | grep -o '"boardPosition":3' | wc -l)" -ge 2 ]

          for p in p1 p2 p3 p4; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"tested\"}" "$BASE/player-action" > /dev/null; done
          SNAP="$(curl --fail --silent --show-error "$BASE/snapshot")"
          echo "=== AFTER TESTING ==="
          echo "$SNAP"
          [ "$(printf '%s' "$SNAP" | grep -o '"progressPhase":"ready-twist"' | wc -l)" -ge 2 ]
          [ "$(printf '%s' "$SNAP" | grep -o '"boardPosition":3' | wc -l)" -ge 2 ]

          # Instructor controls the shared Plot Twist.
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"twist","round":0}' "$BASE/control" | grep -q '"stage":"twist"'

          R1="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p1","action":"proposeRepair","text":"Team one repair with new context"}' "$BASE/player-action")"
          R1_ID="$(printf '%s' "$R1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],x=Object.values(r.repairProposals).find(p=>p.playerId==="p1");process.stdout.write(x.id)})')"
          R2="$(curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"playerId":"p2","action":"proposeRepair","text":"Team two repair with verification"}' "$BASE/player-action")"
          R2_ID="$(printf '%s' "$R2" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),r=j.team.rounds["0"],x=Object.values(r.repairProposals).find(p=>p.playerId==="p2");process.stdout.write(x.id)})')"
          for p in p1 p3; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"voteRepair\",\"proposalId\":\"$R1_ID\"}" "$BASE/player-action" > /dev/null; done
          for p in p2 p4; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"voteRepair\",\"proposalId\":\"$R2_ID\"}" "$BASE/player-action" > /dev/null; done

          SNAP="$(curl --fail --silent --show-error "$BASE/snapshot")"
          echo "=== AFTER REPAIR VOTING ==="
          echo "$SNAP"
          echo "$SNAP" | grep -q '"progressPhase":"check"'
          [ "$(printf '%s' "$SNAP" | grep -o '"boardPosition":5' | wc -l)" -ge 2 ]

          for p in p1 p2 p3 p4; do curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d "{\"playerId\":\"$p\",\"action\":\"checks\",\"checks\":[true,true,true,true]}" "$BASE/player-action" > /dev/null; done
          SNAP="$(curl --fail --silent --show-error "$BASE/snapshot")"
          echo "=== AFTER JUDGMENT ==="
          echo "$SNAP"
          [ "$(printf '%s' "$SNAP" | grep -o '"progressPhase":"ready-reveal"' | wc -l)" -ge 2 ]

          # Instructor controls shared score/movement reveal.
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"stage":"reveal","round":0}' "$BASE/control" | grep -q '"stage":"reveal"'
          SNAP="$(curl --fail --silent --show-error "$BASE/snapshot")"
          echo "=== AFTER SCORE REVEAL ==="
          echo "$SNAP"
          [ "$(printf '%s' "$SNAP" | grep -o '"position":1' | wc -l)" -ge 2 ]
          [ "$(printf '%s' "$SNAP" | grep -o '"boardPosition":5' | wc -l)" -ge 2 ]

          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$BASE/reset" > /dev/null
          echo "Hybrid flow passed: teams auto-progress internally; Game Master controls shared reveals."
      - name: Verify Context Quest isolated test sandbox
        run: |
          set -e
          SANDBOX="https://classroom.itsbadlabs.com/api/session/context-quest-sandbox-$GITHUB_RUN_ID/cq"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$SANDBOX/reset" > /dev/null
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"enabled":true}' "$SANDBOX/test-mode" | grep -q '"testMode":true'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"count":10,"watchers":2}' "$SANDBOX/test-players" | grep -q '"created":10'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"teamSize":5}' "$SANDBOX/form-teams" | grep -q '"teamsFormed":true'
          curl --fail --silent --show-error "$SANDBOX/snapshot" | grep -q '"playing":10'
          curl --fail --silent --show-error "$SANDBOX/snapshot" | grep -q '"testMode":true'
          echo "Context Quest sandbox uses its own session and can create a rehearsal room."
      - name: Rehearse Context Quest with 30 concurrent students
        run: |
          set -e
          LOAD="https://classroom.itsbadlabs.com/api/session/context-quest-load-smoke-$GITHUB_RUN_ID/cq"
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$LOAD/reset" > /dev/null
          seq 1 30 | xargs -I{} -P 15 sh -c 'curl --fail --silent --show-error -X POST -H "content-type: application/json" -d "{\"playerId\":\"load-{}\",\"name\":\"Student {}\",\"mode\":\"play\"}" "$0/join" > /dev/null' "$LOAD"
          # Retry the same idempotent joins once so a transient burst miss does not create a false failure.
          seq 1 30 | xargs -I{} -P 10 sh -c 'curl --fail --silent --show-error -X POST -H "content-type: application/json" -d "{\"playerId\":\"load-{}\",\"name\":\"Student {}\",\"mode\":\"play\"}" "$0/join" > /dev/null' "$LOAD"
          SNAP30="$(curl --fail --silent --show-error "$LOAD/snapshot")"
          echo "$SNAP30" | grep -q '"playing":30'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{"teamSize":5}' "$LOAD/form-teams" | grep -q '"teamsFormed":true'
          seq 1 120 | xargs -I{} -P 30 sh -c 'curl --fail --silent --show-error "$0/snapshot" > /dev/null' "$LOAD"
          curl --fail --silent --show-error "$LOAD/snapshot" | grep -q '"playing":30'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' -d '{}' "$LOAD/reset" > /dev/null
          echo "30-student concurrency rehearsal passed."
      - name: Verify Context Quest renders in a browser
        run: |
          set -e
          dump_dom() {
            URL="$1"
            for attempt in 1 2 3; do
              if timeout 30s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom "$URL" 2>/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          TEAM_DOM="$(dump_dom https://classroom.itsbadlabs.com/context-quest)"
          echo "TEAM DOM bytes: ${#TEAM_DOM}"
          echo "$TEAM_DOM" | grep -q "CONTEXT" || { echo "Team surface missing Context Quest render"; exit 1; }
          echo "$TEAM_DOM" | grep -Eq "PROMPTS|INVESTIGATION TEAM SETUP|INVESTIGATOR TRAINING|CASE|TEAM READY|CASE PAUSED" || { echo "Team surface did not render a playable state"; exit 1; }
          INST_DOM="$(dump_dom https://classroom.itsbadlabs.com/context-quest/instructor)"
          echo "INSTRUCTOR DOM bytes: ${#INST_DOM}"
          echo "$INST_DOM" | grep -q "GAME MASTER" || { echo "Instructor surface missing Game Master render"; exit 1; }
          echo "$INST_DOM" | grep -q "FACILITATION GUIDE" || { echo "Instructor facilitation guide did not render"; exit 1; }
          echo "$INST_DOM" | grep -q "GAME CONTROLS" || { echo "Instructor game controls did not render"; exit 1; }
          echo "$INST_DOM" | grep -q "YOUR NEXT SHARED ACTION" || { echo "Instructor next action did not render"; exit 1; }
          echo "$INST_DOM" | grep -q "ROOM READINESS" || { echo "Instructor room readiness did not render"; exit 1; }
          GUEST_LIVE_DOM="$(dump_dom 'https://classroom.itsbadlabs.com/google-slides-live?session=inf128-ai-literacy-guest-2026')"
          echo "INF128 GUEST GOOGLE SLIDES DOM bytes: ${#GUEST_LIVE_DOM}"
          echo "$GUEST_LIVE_DOM" | grep -q "CAN YOU OUTSMART AI" || { echo "INF128 guest ShowRunner did not load"; exit 1; }
          GUEST_REPORT_DOM="$(dump_dom 'https://classroom.itsbadlabs.com/session-report?session=inf128-ai-literacy-guest-2026')"
          echo "INF128 IMPACT REPORT DOM bytes: ${#GUEST_REPORT_DOM}"
          echo "$GUEST_REPORT_DOM" | grep -q "Executive impact summary" || { echo "INF128 impact report did not render"; exit 1; }
          echo "$GUEST_REPORT_DOM" | grep -q "Human-AI decision boundaries" || { echo "INF128 decision evidence missing from report"; exit 1; }
          GUEST_STUDENT_DOM="$(dump_dom 'https://classroom.itsbadlabs.com/student?session=inf128-ai-literacy-guest-2026')"
          echo "$GUEST_STUDENT_DOM" | grep -q "Can You Outsmart AI" || { echo "INF128 guest student surface did not load"; exit 1; }
          GS_LIVE_DOM="$(dump_dom 'https://classroom.itsbadlabs.com/google-slides-live?session=inf125-week05-session1-multimodal-communication')"
          echo "GOOGLE SLIDES LIVE DOM bytes: ${#GS_LIVE_DOM}"
          echo "$GS_LIVE_DOM" | grep -q "SHOWRUNNER" || { echo "Google Slides instructor surface did not render"; exit 1; }
          echo "$GS_LIVE_DOM" | grep -q "AI REMIX" || { echo "Google Slides instructor did not load session content"; exit 1; }
          GS_ROOM_DOM="$(dump_dom 'https://classroom.itsbadlabs.com/google-slides-room?session=inf125-week05-session1-multimodal-communication')"
          echo "GOOGLE SLIDES ROOM DOM bytes: ${#GS_ROOM_DOM}"
          echo "$GS_ROOM_DOM" | grep -q "iframe" || { echo "Google Slides projection did not render deck frame"; exit 1; }
          BOARD_DOM="$(dump_dom https://classroom.itsbadlabs.com/context-quest/board)"
          echo "BOARD DOM bytes: ${#BOARD_DOM}"
          echo "$BOARD_DOM" | grep -q "HAUNTED PROMPT LAB" || { echo "Haunted Prompt Lab board header did not render"; exit 1; }
          BOARD_JS="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "https://classroom.itsbadlabs.com/context-quest-board.js?verify=$GITHUB_SHA")"
          printf '%s' "$BOARD_JS" > /tmp/context-quest-board.js
          grep -q 'animateBoardPositions' /tmp/context-quest-board.js
          grep -q 'shownPositions' /tmp/context-quest-board.js
          grep -q 'SUBMIT ONE ANSWER' /tmp/context-quest-board.js
          grep -q 'TEAM VOTE' /tmp/context-quest-board.js
          grep -q 'TEST CHAMBER' /tmp/context-quest-board.js
          grep -q 'THE HAUNTING' /tmp/context-quest-board.js
          grep -q 'EVIDENCE CHECK' /tmp/context-quest-board.js
          ! grep -q 'AI SÉANCE' /tmp/context-quest-board.js
          ! grep -q 'GHOST HUNT' /tmp/context-quest-board.js
          echo "$BOARD_DOM" | grep -Eq "HAUNTED PROMPT LAB|ENTER THE HAUNTED PROMPT LAB|INVESTIGATION TEAM|CONTEXT QUEST|CASE|FINAL" || { echo "Board state did not render"; exit 1; }
          ! echo "$BOARD_DOM" | grep -Eq ">PROFESSOR<|>UNIVERSITY<|>STUDENT<|>ACADEMIC ADVISOR<" || { echo "Obsolete stakeholder label rendered"; exit 1; }
          TEST_DOM="$(dump_dom https://classroom.itsbadlabs.com/context-quest/test)"
          echo "TEST DOM bytes: ${#TEST_DOM}"
          echo "$TEST_DOM" | grep -q "TEST SANDBOX" || { echo "Test sandbox header did not render"; exit 1; }
          echo "$TEST_DOM" | grep -q "SAFE REHEARSAL ENVIRONMENT" || { echo "Test sandbox controls did not render"; exit 1; }
          echo "Context Quest team, instructor, projected board, and isolated test sandbox all executed successfully."
