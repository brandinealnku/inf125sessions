name: Group Mode Live Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/group-mode.html'
      - '.github/workflows/group-mode-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Case Marketplace, preference grouping, and live responses
        env:
          BASE: https://classroom.itsbadlabs.com
          SESSION: group-mode-smoke-${{ github.run_id }}
        run: |
          set -euo pipefail

          echo "Waiting for the merged Worker to reach the live classroom domain"
          for attempt in {1..30}; do
            PHASE="$(curl --silent --show-error --location "$BASE/api/session/$SESSION/group-mode/snapshot" | jq -r '.state.phase // empty' || true)"
            if [ "$PHASE" = "marketplace" ]; then break; fi
            echo "Attempt $attempt: live phase is '$PHASE' — retrying"
            sleep 3
          done
          [ "$PHASE" = "marketplace" ]

          for path in groups groups/instructor groups/room; do
            curl --fail --silent --show-error --location "$BASE/$path?session=$SESSION" | grep -q "INF 125"
          done

          API="$BASE/api/session/$SESSION/group-mode"
          curl --fail --silent --show-error "$API/snapshot" | jq -e '.state.phase == "marketplace" and (.cases|length) >= 6 and (.groups|length) == 4' >/dev/null

          echo "Joining eight students"
          for row in "d1|Alice" "d2|Bob" "d3|Casey" "d4|Devon" "d5|Eli" "d6|Fran" "d7|Gray" "d8|Harper"; do
            device="${row%%|*}"; name="${row#*|}"
            curl --fail --silent --show-error -X POST "$API/join" -H 'content-type: application/json' --data "{\"device\":\"$device\",\"name\":\"$name\"}" >/dev/null
          done

          echo "Adding a student-proposed case"
          curl --fail --silent --show-error -X POST "$API/proposal" -H 'content-type: application/json' \
            --data '{"device":"d1","title":"AI + Athlete Injury Predictions","field":"Sports","question":"Should teams use AI injury predictions when making contract decisions?","description":"Player health versus team business decisions.","source":"https://example.com/sports-ai"}' | jq -e '.ok == true' >/dev/null

          CUSTOM="$(curl --fail --silent --show-error "$API/snapshot" | jq -r '.cases[] | select(.title=="AI + Athlete Injury Predictions") | .id')"
          [ -n "$CUSTOM" ]

          echo "Saving preference ballots"
          curl --fail --silent --show-error -X POST "$API/vote" -H 'content-type: application/json' --data "{\"device\":\"d1\",\"caseIds\":[\"$CUSTOM\",\"seed-health\"]}" >/dev/null
          curl --fail --silent --show-error -X POST "$API/vote" -H 'content-type: application/json' --data "{\"device\":\"d2\",\"caseIds\":[\"$CUSTOM\",\"seed-hiring\"]}" >/dev/null
          curl --fail --silent --show-error -X POST "$API/vote" -H 'content-type: application/json' --data '{"device":"d3","caseIds":["seed-education","seed-creativity"]}' >/dev/null
          curl --fail --silent --show-error -X POST "$API/vote" -H 'content-type: application/json' --data '{"device":"d4","caseIds":["seed-privacy","seed-hiring"]}' >/dev/null
          curl --fail --silent --show-error -X POST "$API/vote" -H 'content-type: application/json' --data '{"device":"d5","caseIds":["seed-health","seed-education"]}' >/dev/null
          curl --fail --silent --show-error -X POST "$API/vote" -H 'content-type: application/json' --data '{"device":"d6","caseIds":["seed-creativity","seed-deepfakes"]}' >/dev/null
          curl --fail --silent --show-error -X POST "$API/vote" -H 'content-type: application/json' --data '{"device":"d7","caseIds":["seed-hiring","seed-privacy"]}' >/dev/null
          curl --fail --silent --show-error -X POST "$API/vote" -H 'content-type: application/json' --data '{"device":"d8","caseIds":["seed-deepfakes","seed-health"]}' >/dev/null

          curl --fail --silent --show-error "$API/snapshot" | jq -e '.totalBallots == 8 and (.cases[] | select(.title=="AI + Athlete Injury Predictions") | .votes) == 2' >/dev/null

          echo "Forming interest-based groups"
          curl --fail --silent --show-error -X POST "$API/form-groups" -H 'content-type: application/json' --data '{}' | jq -e '.ok == true and .state.groupsFormed == true and .state.phase == "groups"' >/dev/null

          SNAP="$(curl --fail --silent --show-error "$API/snapshot")"
          printf '%s' "$SNAP" | jq -e '
            (.people|length) == 8 and
            (.state.selectedCaseIds|length) == 4 and
            ([.groups[].members|length] | max) - ([.groups[].members|length] | min) <= 1 and
            ([.people[] | select(.groupId == null)] | length) == 0
          ' >/dev/null

          echo "Advancing and saving a discussion response"
          curl --fail --silent --show-error -X POST "$API/phase" -H 'content-type: application/json' --data '{"phase":"ethics"}' | jq -e '.phase == "ethics"' >/dev/null
          GROUP="$(printf '%s' "$SNAP" | jq -r '.people[] | select(.device=="d1") | .groupId')"
          curl --fail --silent --show-error -X POST "$API/response" -H 'content-type: application/json' --data '{"device":"d1","phase":"ethics","text":"Only if there is human review and an appeal process.","fields":{"decision":"ONLY IF","lens":"Accountability"}}' | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error "$API/snapshot" | jq -e --arg g "$GROUP" '.responses.ethics[$g].text | length > 0' >/dev/null

          curl --fail --silent --show-error -X POST "$API/reset" -H 'content-type: application/json' --data '{}' | jq -e '.ok == true' >/dev/null
          echo "Case Marketplace live smoke test passed."
